<style>
*{margin:0;padding:0;box-sizing:border-box}

body{font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button,textarea{font-family:inherit;outline:none}
.os{font-family:'Oswald',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fadeIn .4s ease}
.sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.ctn{max-width:720px;margin:0 auto;padding:16px 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:rgba(17,34,59,.95);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;transition:all .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover:not(:disabled){background:#a8182f}
.btn-green{background:var(--green);color:#fff}.btn-green:hover:not(:disabled){background:#1aa34a}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-outline:hover{border-color:var(--accent);color:var(--text)}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:'Oswald',sans-serif}
.field label .req{color:var(--accent)}
.input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input.ok{border-color:var(--green)}
.input.err{border-color:#ef4444;background:rgba(239,68,68,.04)}
select.input{cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(196,30,58,.05)}
.upload-zone.done{border-color:var(--green);border-style:solid;background:rgba(34,197,94,.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone .icon{font-size:28px;margin-bottom:6px}
.upload-zone .txt{font-size:12px;color:var(--muted)}
.upload-zone .fname{font-size:13px;color:var(--green);font-weight:600;margin-top:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.step-bar{display:flex;gap:4px;margin-bottom:24px}
.step-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.step-dot.active{background:var(--accent)}
.step-dot.done{background:var(--green)}
.alert{padding:14px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-info{background:rgba(30,91,168,.15);border:1px solid rgba(30,91,168,.3);color:var(--blue)}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
/* Admin table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 8px;text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--border);font-family:'Oswald',sans-serif}
.tbl td{padding:10px 8px;border-bottom:1px solid rgba(29,49,80,.3)}
.tbl tr:hover{background:rgba(196,30,58,.03)}
.status-pending{color:var(--gold)}.status-approved{color:var(--green)}.status-rejected{color:var(--red)}
</style>
<style id="embedHide">
html.embedded .btn-volver,html.embedded a[href="index.html"].btn-volver,html.embedded .hdr{display:none !important}
html.embedded body{background:transparent !important}
html.embedded::-webkit-scrollbar{width:0;background:transparent}
html.embedded{scrollbar-width:none;-ms-overflow-style:none}
</style>

<style id="inscVista">
/* Inscripción, tal cual la vista previa: blanco y azul marino, pasos numerados y resumen a la derecha. */
html[data-tema="dia"]{--in-navy:#0B2A55;--in-ink:#0B1630;--in-mut:#5A6478;--in-line:#E2E6ED;--in-soft:#F2F4F8;--in-campo:#C9D0DC;--in-ok:#1F9D55}
html[data-tema="dia"] body{font-family:'Figtree','DM Sans',system-ui,sans-serif;color:var(--in-ink)}
.yl-d{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:75%;font-weight:800;letter-spacing:-.005em}
html[data-tema="dia"] .btn-volver{background:#fff;border:1.5px solid var(--in-navy);color:var(--in-navy);font-family:'Figtree',sans-serif;letter-spacing:0;border-radius:999px;backdrop-filter:none}
html[data-tema="dia"] .btn-volver:hover{background:var(--in-navy);color:#fff;border-color:var(--in-navy)}
html[data-tema="dia"] .ctn.in-ancho{max-width:1240px;padding:56px 40px 56px}
.in{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:44px;align-items:start}
.in-main{min-width:0}
.in-cab{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.in-ey{flex-basis:100%;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--in-mut)}
.in-cab h1{font-size:clamp(56px,7vw,84px);line-height:.86;color:var(--in-navy);margin-right:auto}
.in-edit{border:1.5px solid var(--in-navy);background:#fff;color:var(--in-navy);border-radius:999px;padding:9px 16px;font:700 14px 'Figtree',sans-serif;cursor:pointer}
.in-edit:hover{background:var(--in-navy);color:#fff}
.ev-f{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;color:var(--in-navy)}
.ev-f b{font-size:46px;line-height:.85}
.ev-f span{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--in-mut)}
.in-ev{display:flex;gap:18px;align-items:center;border:2px solid var(--in-navy);border-radius:22px;padding:16px 20px;margin-top:26px}
.in-ev-t{min-width:0}
.in-ev h3{font-size:19px;font-weight:800;line-height:1.2;color:var(--in-ink)}
.in-ev p{color:var(--in-mut);font-size:14.5px;margin-top:2px}
.in-ev .tag,.in-evo .tag{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;background:var(--in-soft);color:var(--in-ink);margin-top:8px}
.in-ev .tag i{width:8px;height:8px;border-radius:50%;background:var(--in-navy)}
.in-ev>button{margin-left:auto;background:none;border:0;font:700 15px 'Figtree',sans-serif;text-decoration:underline;color:var(--in-navy);cursor:pointer}
/* Pasos */
html[data-tema="dia"] #app .card{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;margin:40px 0 0!important;border-radius:0!important}
.paso{margin-top:40px}
.paso-t{display:flex;align-items:center;gap:12px;font-size:32px;line-height:1;color:var(--in-navy);margin-bottom:6px}
.paso-t i{width:34px;height:34px;border-radius:50%;background:var(--in-navy);color:#fff;font-style:normal;display:grid;place-items:center;font:800 16px 'Figtree',sans-serif;flex:none}
.paso-t i.ok{background:var(--in-ok)}
.paso-t small{font-family:'Figtree',sans-serif;font-stretch:100%;font-size:15px;font-weight:700;color:var(--in-mut)}
.paso-p{color:var(--in-mut);font-size:15px;margin:10px 0 18px}
.paso.hecho{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;margin-top:28px;padding-bottom:18px;border-bottom:1px solid var(--in-line)}
.paso.hecho .paso-t{font-size:26px;margin:0}
.paso.hecho .paso-p{flex-basis:100%;margin:8px 0 0 46px}
.paso-ed{margin-left:auto;background:none;border:0;font:700 14px 'Figtree',sans-serif;text-decoration:underline;color:var(--in-navy);cursor:pointer}
.paso.prox .paso-t{color:#6B7487}
.paso.prox .paso-t i{background:#fff;border:1.5px solid var(--in-campo);color:#6B7487}
/* Campos */
html[data-tema="dia"] .field{margin-bottom:18px}
html[data-tema="dia"] .field label{font-family:'Figtree',sans-serif;font-size:14px;font-weight:800;text-transform:none;letter-spacing:0;color:var(--in-ink);margin-bottom:7px}
html[data-tema="dia"] .field label small{font-weight:600;color:var(--in-mut)}
html[data-tema="dia"] .field label .req{color:#C8102E}
html[data-tema="dia"] .input{border:1.5px solid var(--in-campo);border-radius:14px;padding:13px 16px;font-size:16px;background:#fff;color:var(--in-ink)}
html[data-tema="dia"] .input:focus{border-color:var(--in-navy);box-shadow:0 0 0 3px rgba(11,42,85,.12)}
html[data-tema="dia"] .input.ok{border-color:var(--in-campo)}
html[data-tema="dia"] .input[readonly]{background:var(--in-soft)!important;border-color:var(--in-soft)!important;font-weight:700}
html[data-tema="dia"] .row{gap:16px 18px}
.row.in-col{grid-template-columns:1fr}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1.5px solid var(--in-campo);background:#fff;border-radius:999px;padding:9px 16px;font:700 15px 'Figtree',sans-serif;color:var(--in-ink);cursor:pointer}
.op:hover{border-color:var(--in-navy)}
.op.on{background:var(--in-navy);color:#fff;border-color:var(--in-navy)}
.ayuda{font-size:14px;color:var(--in-mut);margin-top:9px}
/* Campeonatos del paso 1 */
.in-evo{display:flex;gap:18px;align-items:center;border:1.5px solid var(--in-line);border-radius:22px;padding:16px 20px;margin-bottom:12px;cursor:pointer;background:#fff}
.in-evo:hover{border-color:var(--in-navy)}
.in-evo.on{border:2px solid var(--in-navy)}
.in-evo.cerrado{opacity:.55;cursor:not-allowed}
.in-evo-t{flex:1;min-width:0}
.in-evo-n{font-size:19px;font-weight:800;line-height:1.2;color:var(--in-ink)}
.in-evo-m{color:var(--in-mut);font-size:14.5px;margin-top:2px}
.in-ok{width:30px;height:30px;border-radius:50%;background:var(--in-navy);color:#fff;display:grid;place-items:center;flex:none}
.in-tag-c{background:#FDECEC!important;color:#B42318!important}
/* Botones */
html[data-tema="dia"] .btn{border-radius:999px;font-family:'Figtree',sans-serif;letter-spacing:0;text-transform:none;font-weight:700;font-size:15px;padding:13px 24px}
html[data-tema="dia"] .btn-accent,html[data-tema="dia"] .btn-green{background:var(--in-navy);color:#fff}
html[data-tema="dia"] .btn-accent:hover:not(:disabled),html[data-tema="dia"] .btn-green:hover:not(:disabled){background:#123A73}
html[data-tema="dia"] .btn-outline{background:#fff;border:1.5px solid var(--in-navy);color:var(--in-navy)}
/* Documentos: una fila por documento, como la vista previa */
html[data-tema="dia"] .upload-zone{border:1.5px dashed var(--in-campo);border-radius:16px;padding:13px 16px;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;align-items:center;background:#fff}
html[data-tema="dia"] .upload-zone:hover{border-color:var(--in-navy);background:#fff}
html[data-tema="dia"] .upload-zone.done{border:1.5px solid var(--in-campo);background:#fff}
html[data-tema="dia"] .upload-zone .icon{grid-row:1/4;width:30px;height:30px;border-radius:50%;background:var(--in-soft);color:var(--in-mut);display:grid;place-items:center;font-size:14px;margin:0}
html[data-tema="dia"] .upload-zone.done .icon{background:var(--in-ok);color:#fff}
html[data-tema="dia"] .upload-zone .txt,html[data-tema="dia"] .upload-zone div[style]{grid-column:2;font-size:13px;color:var(--in-mut)!important;margin:0!important}
html[data-tema="dia"] .upload-zone .fname{grid-column:2;font-size:15px;font-weight:700;color:var(--in-ink);margin:0}
/* Resumen y consentimiento */
.in-res{background:var(--in-soft);border-radius:18px;padding:16px 18px;margin-top:18px}
.in-res-t{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--in-navy);margin-bottom:10px}
.in-res>div{font-size:13.5px!important}
.in-cons{display:flex;align-items:flex-start;gap:10px;margin-top:18px;cursor:pointer;font-size:13.5px;color:var(--in-mut);line-height:1.5}
.in-link{color:var(--in-navy);font-weight:700;text-decoration:underline;cursor:pointer}
.rsm{border:1px solid var(--in-line);border-radius:26px;padding:26px;position:sticky;top:20px;background:#fff}
.rsm h2{font-size:30px;line-height:1;color:var(--in-navy);margin-bottom:6px}
.lin{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--in-line);font-size:15px}
.lin span{color:var(--in-mut)}
.lin b{font-weight:700;text-align:right;color:var(--in-ink)}
.prog{margin-top:16px}
.prog div{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.prog i{display:block;height:8px;border-radius:99px;background:var(--in-soft);margin-top:8px;overflow:hidden}
.prog i u{display:block;height:100%;background:var(--in-navy);border-radius:99px}
.prog small{display:block;color:var(--in-mut);font-size:13px;margin-top:6px}
.aviso{background:var(--in-soft);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--in-mut);margin-top:16px;line-height:1.5}
.aviso b{color:var(--in-ink)}
html[data-tema="dia"] .alert{border-radius:14px}
@media(max-width:900px){
  html[data-tema="dia"] .ctn.in-ancho{padding:60px 16px 40px}
  .in{grid-template-columns:minmax(0,1fr);gap:24px}
  .rsm{position:static}
  .in-ev{flex-wrap:wrap;gap:12px}
  .in-ev>button{margin-left:0}
  .paso-t{font-size:27px}
  .paso.hecho .paso-p{margin-left:0}
}
</style>
</head>
