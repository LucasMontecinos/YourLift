<title>YourLift — Admin Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased} /* background controlado por bg-fechipo.css */
.os{font-family:'Oswald',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,button,textarea{font-family:inherit;outline:none}
.shell{min-height:100vh}
.side{background:rgba(8,16,30,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid rgba(212,168,67,.25);padding:18px 14px;display:flex;flex-direction:column;position:fixed;top:0;left:0;width:264px;height:100vh;overflow-y:auto;z-index:1000;transform:translateX(-100%);transition:transform .22s ease}
body.nav-open .side{transform:translateX(0);box-shadow:2px 0 24px rgba(0,0,0,.55)}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;opacity:0;pointer-events:none;transition:opacity .2s}
body.nav-open .nav-backdrop{opacity:1;pointer-events:auto}
/* ═══════════════════════════════════════════════════════════
   La misma cara que el sitio público
   ═══════════════════════════════════════════════════════════
   El panel ya usaba la paleta y las tipografías de index.html, pero no se
   parecía: le faltaban las señas que identifican al producto —el logo en la
   esquina, el menú de vidrio con borde dorado, los títulos en versalita ancha
   con la barra roja— y se veía como otra aplicación.
   Cambia cómo se ve, no dónde está cada cosa: los botones, el menú y las tablas
   siguen donde estaban, porque esto lo opera gente que lo usa en competencia y
   no corresponde hacerla reaprender el camino. */
.corner-stack{position:fixed;top:14px;right:18px;z-index:1001;display:flex;align-items:center;gap:6px}
.corner-stack .corner-logo{height:42px;width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));cursor:pointer;transition:opacity .2s}
.corner-stack .corner-logo:hover{opacity:.85}
/* Con el menú abierto el panel trae su propia cabecera, y el logo fijo se le
   montaba encima. Se aparta mientras dura. */
.corner-stack{transition:opacity .2s}
body.nav-open .corner-stack{opacity:0;pointer-events:none}
.adm-burger{transition:opacity .2s,all .2s}
body.nav-open .adm-burger{opacity:0;pointer-events:none}




/* El menú va arriba a la derecha, como en el sitio, y con el mismo vidrio. */
.adm-burger{position:fixed;top:18px;left:18px;z-index:1001;display:inline-flex;align-items:center;gap:8px;background:rgba(10,22,40,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(212,168,67,.3);color:#fff;border-radius:10px;padding:11px 16px;font-family:Oswald;font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase;cursor:pointer;margin:0;transition:all .2s}
.adm-burger:hover{border-color:var(--gold);background:rgba(212,168,67,.1)}
@media(max-width:520px){
  .corner-stack{top:10px;right:12px}
  .corner-stack .corner-logo{height:34px}
  .adm-burger{top:12px;left:12px;padding:9px 12px;font-size:11px}
  .main{padding-top:74px}
}
.logo{font-family:Oswald;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
.logo span{color:var(--accent)}
.user{font-size:11px;color:var(--green);margin-bottom:18px;padding:6px 10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:6px}
.side-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:16px 0 6px;font-family:Oswald}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(29,49,80,.4);background:transparent;color:rgba(220,230,245,.78);font-family:Oswald,sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-align:left;transition:all .2s;margin-bottom:4px;position:relative;overflow:hidden}
.side-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transition:transform .2s}
.side-btn:hover{background:rgba(196,30,58,.12);color:#fff;border-color:rgba(196,30,58,.4)}
.side-btn:hover::before{transform:scaleY(1)}
.side-btn.active{background:rgba(196,30,58,.18);color:#fff;border-color:var(--accent)}
.side-btn.active::before{transform:scaleY(1)}
.side-btn .icon{font-size:16px;width:22px;text-align:center}
.main{padding:84px 24px 24px;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--border);border-left:4px solid rgba(196,30,58,.5);border-radius:12px;padding:20px;margin-bottom:16px}
.h1{font-family:Oswald;font-size:22px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:11px}
.h1::before{content:"";width:5px;height:24px;background:var(--accent);transform:skewX(-20deg);border-radius:1px;box-shadow:0 0 8px rgba(196,30,58,.5);flex:none}
.h2{font-family:Oswald;font-size:15px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:20px}
.btn{padding:9px 17px;border-radius:8px;border:none;cursor:pointer;font-family:Oswald;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:all .15s}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#a01730}
.btn-b{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-d{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-r{background:var(--red);color:#fff}
.btn-w{background:var(--gold);color:#000}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.inp:focus{border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:10px 8px;color:var(--muted);font-family:Oswald;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--border)}
.tbl td{padding:8px;border-bottom:1px solid rgba(29,49,80,.3)}
.tbl tr:hover td{background:rgba(196,30,58,.04)}
.editable{cursor:pointer;color:var(--text);padding:3px 6px;border-radius:4px;display:inline-block}
.editable:hover{background:rgba(212,168,67,.15);color:var(--gold)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:Oswald;letter-spacing:.5px}
.b-g{background:rgba(34,197,94,.15);color:var(--green)}
.b-y{background:rgba(212,168,67,.15);color:var(--gold)}
.b-r{background:rgba(239,68,68,.15);color:var(--red)}
.b-b{background:rgba(30,91,168,.15);color:var(--blue)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--green);color:var(--text);padding:14px 22px;border-radius:10px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(0,0,0,.4);z-index:9999;animation:slideUp .3s ease}
.toast.err{border-color:var(--red)}
.toast button{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-family:Oswald;font-size:11px;cursor:pointer;font-weight:700;letter-spacing:.5px}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9998}
.modal-c{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:480px;width:90%;max-height:90vh;overflow-y:auto}
.modal-c h3{font-family:Oswald;font-size:18px;letter-spacing:1px;margin-bottom:16px;color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field select,.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.modal-btns{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-c{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;max-width:400px;width:90%}
.login-c h1{font-family:Oswald;font-size:26px;text-align:center;letter-spacing:2px;margin-bottom:6px}
.login-c h1 span{color:var(--accent)}
.login-c p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat .v{font-family:Oswald;font-size:26px;font-weight:700}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.tag{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;font-family:Oswald;letter-spacing:.5px;margin-right:4px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.search-box{display:flex;gap:8px;margin-bottom:14px}
.search-box input{flex:1}
@media(max-width:768px){.side{width:84vw}.stat-grid{grid-template-columns:repeat(2,1fr)}.tbl{font-size:10px}.tbl th,.tbl td{padding:5px 4px}}
</style>
</head>
<body>
<div id="bgGrid"></div>
<script src="compartido/dias.js?v=650043b9"></script>
<script src="compartido/campeonatos.js?v=20482df7"></script>
<script src="compartido/privacidad.js?v=cc91c2f1"></script>
<script src="compartido/gl.js?v=47a36058"></script>
<script src="compartido/clubs.js?v=deffa3c5"></script>
<script src="compartido/qr.js?v=d5a40029"></script>
<script src="compartido/ediciones.js?v=477f1b0a"></script>
<div id="app"><div class="login"><div class="login-c"><div class="spinner"></div><p style="text-align:center" id="loadingMsg">Cargando...</p><p id="loadingBtn" style="text-align:center;margin-top:12px;display:none"><button onclick="location.reload()" style="padding:8px 20px;border-radius:8px;border:1px solid #C41E3A;background:transparent;color:#C41E3A;cursor:pointer;font-size:13px">↻ Reintentar</button></p></div></div></div>

<script>
(function(){
  setTimeout(function(){
    var msg = document.getElementById('loadingMsg');
    var btn = document.getElementById('loadingBtn');
    if(msg && msg.textContent === 'Cargando...'){
      msg.textContent = 'Verificando sesión...';
    }
    if(btn) btn.style.display = 'block';
  }, 5000);

  setTimeout(function(){
    var app = document.getElementById('app');
    if(app && app.innerHTML.indexOf('Cargando') !== -1){
      app.innerHTML = '<div style="text-align:center;padding:60px;color:#C41E3A;font-family:Oswald">'
        + '<div style="font-size:32px;margin-bottom:12px"></div>'
        + '<div style="font-size:18px;letter-spacing:1px;margin-bottom:8px">Error al cargar</div>'
        + '<div style="font-size:13px;color:#8A9BB2;margin-bottom:20px">Prueba limpiar el caché del navegador (Ctrl+Shift+R).</div>'
        + '<button onclick="location.reload()" style="padding:10px 24px;border-radius:8px;border:none;background:#C41E3A;color:#fff;font-family:Oswald;font-size:14px;cursor:pointer">↻ Recargar</button>'
        + '</div>';
    }
  }, 12000);
})();
</script>
<script type="module" src="admin/panel.js?v=555e6b9e"></script>
</body>
</html>
