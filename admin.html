      <td style="padding:7px 8px">${it.done?'':`<button onclick="sfSkip(${i})" style="padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer">${it.skip?'incluir':'omitir'}</button>`}</td>
    </tr>`;
  });
  h+=`</table></div>`;
  return h;
}


// ══════════════════════════════════════════════════════════════════
// YOURLIFT PÚBLICO — qué competencias ve la gente en "Competencia en Vivo"
// (index.html → hamburguesa → Competencia en Vivo). Es INDEPENDIENTE de lo que
// ves vos en el livecast: acá puedes tener muchas competencias cargadas y
// mostrarle al público solo la que se está transmitiendo hoy.
// Marca el campo publicoVisible en eventos/{id}.
// ══════════════════════════════════════════════════════════════════
window.pubToggle=async function(id,on){
  const ev=_pubEvs().find(e=>e.id===id); if(!ev)return;
  const prev=ev.publicoVisible===true;
  ev.publicoVisible=!!on; render();                    // respuesta inmediata
  try{
    // Los días del Sudamericano no son eventos de Firestore (su nómina viene del
    // archivo), así que al mostrarlos se crea el doc con lo mínimo para que la
    // tarjeta del público tenga nombre, fecha y lugar.
    const extra=ev._deArchivo?{name:ev.name||id,fecha:ev.fecha||'',lugar:ev.location||'',desdeNomina:true}:{};
    await setDoc(doc(db,'eventos',id),{publicoVisible:!!on,...extra},{merge:true});
    if(ev._deArchivo){ const f=(ST.eventos||[]).find(e=>e.id===id); if(f)f.publicoVisible=!!on; else (ST.eventos=ST.eventos||[]).push({...ev,_deArchivo:undefined}); }
    showToast(on?('✓ "'+(ev.name||id)+'" ya se ve en Competencia en Vivo')
                :('Oculto del público: "'+(ev.name||id)+'"'));
  }catch(e){
    ev.publicoVisible=prev; render();                  // revertir si falló
    showToast('No se pudo guardar: '+e.message,null,true);
  }
};
window.pubHideAll=async function(){
  const on=_pubEvs().filter(e=>e.publicoVisible===true);
  if(!on.length){showToast('No hay competencias visibles para el público');return;}
  if(!confirm('¿Ocultar del público las '+on.length+' competencia(s) visibles?\n\nLa pestaña "Competencia en Vivo" va a quedar vacía.'))return;
  for(const e of on){ try{ await setDoc(doc(db,'eventos',e.id),{publicoVisible:false},{merge:true}); e.publicoVisible=false;
    const f=(ST.eventos||[]).find(x=>x.id===e.id); if(f)f.publicoVisible=false; }catch(_){} }
  render(); showToast('Listo: no se muestra ninguna competencia al público');
};
// Deja visibles SOLO los días del Sudamericano y apaga todo lo demás. Es lo que
// se pide durante el campeonato: que la gente entre y vea los nueve días, nada más.
window.pubSoloSuda=async function(){
  const evs=_pubEvs();
  const suda=evs.filter(e=>/^suda2026_d\d+$/.test(e.id));
  if(!suda.length){showToast('No encontré los días del Sudamericano',null,true);return;}
  const apagar=evs.filter(e=>e.publicoVisible===true&&!/^suda2026_d\d+$/.test(e.id));
  if(!confirm('Van a quedar visibles los '+suda.length+' días del Sudamericano'
    +(apagar.length?(' y se ocultan '+apagar.length+' competencia(s): '+apagar.map(e=>e.name||e.id).join(', ')):'')+'.\n\n¿Seguimos?'))return;
  for(const e of suda){ await window.pubToggle(e.id,true); }
  for(const e of apagar){ await window.pubToggle(e.id,false); }
  showToast('Listo: en Competencia en Vivo se ven solo los días del Sudamericano');
};
// Eventos que se le pueden mostrar al público: los de Firestore MÁS los que solo
// viven en nominas.json (los nueve días del Sudamericano y el ensayo).
function _pubEvs(){
  const out=(ST.eventos||[]).slice();
  (ST.nomFileEvents||[]).forEach(fe=>{
    if(!fe.id)return;
    if(out.some(e=>e.id===fe.id))return;
    out.push({id:fe.id,name:fe.name,fecha:fe.date||'',location:fe.location||'',
              logoUrl:'',status:'',publicoVisible:false,_deArchivo:true,_n:fe.n});
  });
  return out;
}
async function _pubLoadFile(){
  if(ST.nomFileEvents)return;
  ST.nomFileEvents=[];

async function compressImg(file,maxPx=900,quality=0.80){
  return new Promise(res=>{
    if(!file||!file.type.startsWith('image/')){res(file);return;}
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}else{w=Math.round(w*maxPx/h);h=maxPx;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b||file),'image/webp',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}

window.migrarFotosWebP = async function(btn){
  const colecciones=[
    {col:'atleta_fotos', campo:'foto_url', maxPx:900, q:0.82, label:'fotos de atletas'},
    {col:'clubs',        campo:'logoUrl',  maxPx:400, q:0.85, label:'logos de clubes'},
    {col:'eventos',      campo:'logoUrl',  maxPx:500, q:0.85, label:'logos de campeonatos'},
  ];
  if(!confirm('¿Convertir a WebP las fotos/logos ya subidos a Firebase Storage?\n\nSe procesarán:\n• Fotos de atletas\n• Logos de clubes\n• Logos de campeonatos\n\nNo cierres la página. Puede tardar varios minutos.'))return;
  if(btn){btn.disabled=true;btn.textContent='Iniciando…';}
  const storage=getStorage(app);
  let totalConv=0,totalSkip=0,totalErr=0;
  for(const {col,campo,maxPx,q,label} of colecciones){
    const snap=await getDocs(collection(db,col));
    const docs=snap.docs.filter(d=>{const url=d.data()[campo];return url&&url.includes('firebasestorage')&&!url.toLowerCase().includes('.webp');});
    if(!docs.length)continue;
    if(btn)btn.textContent=`Convirtiendo ${label} (0/${docs.length})…`;
    let i=0;
    for(const d of docs){
      const url=d.data()[campo];
      try{
        // Extraer path del Storage desde la URL
        const m=url.match(/\/o\/(.+?)(\?|$)/);
        if(!m){totalSkip++;i++;continue;}
        const oldPath=decodeURIComponent(m[1]);
        // Fetch imagen
        const resp=await fetch(url);
        if(!resp.ok){totalSkip++;i++;continue;}
        const blob=await resp.blob();
        // Convertir a WebP
        const tmpFile=new File([blob],'tmp',{type:blob.type||'image/jpeg'});
        const webpBlob=await compressImg(tmpFile,maxPx,q);
        if(!webpBlob||webpBlob===tmpFile){totalSkip++;i++;continue;}
        // Nueva ruta: reemplaza extensión por .webp o agrega .webp
        const newPath=oldPath.replace(/\.(jpg|jpeg|png|gif|bmp|webp)$/i,'')+'.webp';
        // Subir
        const newRef=storageRef(storage,newPath);
        await uploadBytes(newRef,webpBlob,{contentType:'image/webp'});
        const newUrl=await getDownloadURL(newRef);
        // Actualizar Firestore
        await updateDoc(doc(db,col,d.id),{[campo]:newUrl});
        // Borrar archivo viejo (solo si el path cambió)
        if(oldPath!==newPath){try{await deleteObject(storageRef(storage,oldPath));}catch(_){}}
        totalConv++;
      }catch(e){console.error('[migrarWebP]',col,d.id,e.message);totalErr++;}
      i++;
      if(btn)btn.textContent=`Convirtiendo ${label} (${i}/${docs.length})…`;
    }
  }
  const msg=`Conversión completada: ${totalConv} convertidas, ${totalSkip} omitidas, ${totalErr} errores`;
  showToast(msg);
  if(btn){btn.disabled=false;btn.textContent='Convertir fotos de atletas a WebP (reduce peso hasta 70%)';}
  await logAction('migrar_fotos_webp',`${totalConv} convertidas`,null,`${totalErr} errores`);
};

window.migrarDocsInscripcionWebP = async function(btn){
  if(!confirm('¿Convertir a WebP las fotos de documentos de inscripciones (carnet, foto fondo blanco, etc.)?\n\nLos PDFs se omiten automáticamente. Puede tardar varios minutos.\nNo cierres la página.'))return;
  if(btn){btn.disabled=true;btn.textContent='Cargando inscripciones…';}
  const storage=getStorage(app);
  const snap=await getDocs(collection(db,'inscripciones_private'));
  let totalConv=0,totalSkip=0,totalErr=0,processed=0;
  // Intenta convertir un blob a WebP cargándolo como imagen en el navegador.
  // Retorna null si el archivo no es una imagen (ej: PDF).
  const tryConvert=(blob)=>new Promise(res=>{
    const u=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(u);
      let w=img.width,h=img.height;const MAX=1400;
      if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b||null),'image/webp',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(null);}; // PDF u otro no-imagen
    img.src=u;
  });
  for(const d of snap.docs){
    const data=d.data();
    const docsMap=data.docs||{};
    const updates={};
    for(const [key,url] of Object.entries(docsMap)){
      if(!url||typeof url!=='string'||!url.includes('firebasestorage'))continue;
      // Saltar los que ya son webp
      const m=url.match(/\/o\/(.+?)(\?|$)/);
      if(!m){totalSkip++;continue;}
      const oldPath=decodeURIComponent(m[1]);
      if(oldPath.endsWith('.webp')){totalSkip++;continue;}
      try{
        // Descargar el archivo
        const resp=await fetch(url);
        if(!resp.ok){totalErr++;continue;}
        const blob=await resp.blob();
        // Intentar convertir — retorna null si es PDF u otro formato no-imagen
        const webp=await tryConvert(blob);
        if(!webp){totalSkip++;continue;}
        // Re-subir como .webp
        const newPath=oldPath.replace(/(\.[a-z0-9]{1,6})?$/i,'.webp');
        const newRef=storageRef(storage,newPath);
        await uploadBytes(newRef,webp,{contentType:'image/webp'});
        const newUrl=await getDownloadURL(newRef);
        updates[`docs.${key}`]=newUrl;
        if(oldPath!==newPath){try{await deleteObject(storageRef(storage,oldPath));}catch(_){}}
        totalConv++;
      }catch(e){console.error('[migrarDocs]',d.id,key,e.message);totalErr++;}
    }
    if(Object.keys(updates).length){
      try{await updateDoc(doc(db,'inscripciones_private',d.id),updates);}catch(e){console.error(e);}
    }
    processed++;
    if(btn)btn.textContent=`Procesando… (${processed}/${snap.docs.length}) — ${totalConv} convertidas`;
  }
  const msg=`Documentos: ${totalConv} convertidos, ${totalSkip} omitidos (PDF/ya webp), ${totalErr} errores`;
  showToast(msg);
  await logAction('migrar_docs_webp',`${totalConv} convertidos`,null,`${totalErr} errores`);
  if(btn){btn.disabled=false;btn.textContent='Convertir documentos de inscripciones a WebP';}
};

window.uploadClubLogo=async function(club,slug,input){
  const file=input.files?.[0]; if(!file)return;
  const btn=input.closest('label'); if(btn)btn.textContent='Subiendo...';
  try{
    const compressed=await compressImg(file,400,0.85);

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeJsAttr(s){return (s||'').replace(/['"\\]/g,'\\$&')}

// Helper: busca foto pendiente de la inscripcion (carnetPhotoURL) matcheada por RUT
function _findInscriptionPhotoByRut(rut){
  if(!rut) return null;
  // Normalizar el RUT: solo digitos+K, lowercase
  const norm = (s)=>String(s||'').replace(/[^0-9kK]/g,'').toLowerCase();
  const target = norm(rut);
  if(!target) return null;
  // Iterar todas las inscripciones privadas y matchear
  // El docId es {evento}_{rutClean} y el doc tiene rut + carnetPhotoURL
  let bestMatch = null;
  let bestTs = 0;
  Object.entries(ST.inscripcionesPrivate||{}).forEach(([docId, priv])=>{
    if(!priv || !priv.carnetPhotoURL) return;
    // Matchear por RUT del docId (despues del primer "_")
    const docRut = docId.includes('_') ? docId.split('_').slice(1).join('_') : '';
    const docRutNorm = norm(docRut);
    const privRutNorm = norm(priv.rut);
    if(docRutNorm===target || privRutNorm===target){
      // Quedarnos con la mas reciente
      const ts = priv.ts?.seconds || priv.ts?.toMillis?.() || 0;
      if(ts >= bestTs){
        bestTs = ts;
        bestMatch = priv.carnetPhotoURL;
      }
    }
  });
  return bestMatch;
}

window.confirmarFotosBulk = async function(){
  const F = window._fotosState;
  const codigos = Object.keys(F.bulkSel||{}).filter(k=>F.bulkSel[k]);
  if(!codigos.length) return;
  if(!confirm('¿Confirmar '+codigos.length+' foto(s) tal cual las mandaron los atletas (sin quitar fondo)?\n\nSe publican al instante en sus perfiles.')) return;
  F.bulkProcessing = true;
  let done=0, errors=0;
  render();

    render();
    const a = (ST.data||[]).find(x=>x.codigo===codigo);
    if(!a){ errors++; continue; }
    const url = _findInscriptionPhotoByRut(a.rut);
    if(!url){ errors++; continue; }
    try{
      const docRef = doc(db, 'atleta_fotos', codigo);
      await setDoc(docRef, {
        codigo, rut: a.rut||'', nombre: a.nombre||'',
        foto_url: url, status: 'approved',

// Importa la foto de inscripcion al flujo de procesamiento
window.importarFotoInscripcion = async function(){
  const F = window._fotosState;
  if(!F.pendingPhotoUrl){F.error='No hay foto de inscripción pendiente'; render(); return;}
  F.processing = true;
  F.status = 'Descargando foto de inscripción...';
  F.error = '';
  render();
  try{
    // Firebase Storage bloquea fetch() directo por CORS desde yourlift.cl.
    // Workaround: cargar como <img>, dibujar en canvas, exportar a Blob.
    // Los <img> tags NO tienen restricción de CORS para cargar la imagen,
    // pero canvas.toBlob() puede fallar si la imagen NO está crossorigin'd.
    // Por eso intentamos primero con crossOrigin='anonymous' (funciona con
    // Firebase Storage cuando el bucket tiene CORS público o el download
    // token está presente).
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.crossOrigin = 'anonymous';
      i.onload = () => resolve(i);
      i.onerror = (e) => reject(new Error('No se pudo cargar la imagen (revisar CORS o URL)'));
      i.src = F.pendingPhotoUrl;
    });
    // Dibujar en canvas para extraer Blob
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo convertir la imagen')), 'image/jpeg', 0.95);
    });
    const file = new File([blob], 'inscripcion_photo.jpg', {type: 'image/jpeg'});
    const fakeInput = {files:[file]};
    F.processing = false;
    await window.cargarFotoAtleta(fakeInput);
  } catch(e){
    console.error('[Fotos] importar inscripcion error:', e);
    F.error = 'Error importando: '+e.message+' — alternativa: descargá la foto manualmente del enlace Ver en Nóminas y subila con "Elegir otra foto".';
    F.processing = false;
    F.status = '';
    render();
  }
};

window.cargarFotoAtleta = async function(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const F = window._fotosState;
  F.file = file;
  F.status = 'Procesando foto (quitando fondo)... esto puede tomar 10-30s';
  F.error = '';
  F.preview = null;
  F.processing = true;
  render();
  try{
    // Lazy-load de imgly background-removal (solo cuando se necesita)
    if(!window.imglyRemoveBackground){
      F.status = 'Cargando módulo de procesamiento (~30 MB la primera vez)...';
      render();
      await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm').then(m=>{
        window.imglyRemoveBackground = m.removeBackground;
      });
    }
    F.status = 'Quitando fondo...';
    render();
    const blob = await window.imglyRemoveBackground(file, {
      output:{format:'image/png', quality:0.95}
    });
    // Cargar imagen sin fondo y guardarla para el editor
    const url = URL.createObjectURL(blob);
    const img = await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
    F.bgRemovedImg = img;
    F.transform = {zoom:1.0, offsetX:0, offsetY:0, rotation:0};
    _redrawFotoPreview();  // genera el preview inicial centrado
    URL.revokeObjectURL(url);
    F.status = '✓ Lista. Ajustá la posición/zoom si hace falta y guardá.';
    F.processing = false;
    render();
  } catch(e){
    console.error('[Fotos] error:', e);
    F.error = 'Error procesando: ' + e.message + '. Prueba con otra foto o más chica (<5MB).';
    F.processing = false;
    F.status = '';
    render();
  }
};

    const ts = Date.now();
    const path = 'athlete_photos/'+rutKey+'_'+ts+'.jpg';
    const storage = getStorage(app);

    await uploadBytes(ref, blob, {contentType:'image/jpeg'});

    const docRef = doc(db, 'atleta_fotos', F.selected.codigo);

      codigo: F.selected.codigo,
      rut: F.selected.rut||'',

      foto_url: url,
      storage_path: path,
      status: 'approved',
      approved_by: ST.user?.email || 'admin',

    if(!ST.fotosByCodigo) ST.fotosByCodigo = {};

// ── Timeline trimmer estilo reels ────────────────────────────────
let _gifTimelineCleanup = null;
function _setupGifTimeline(){
  if(_gifTimelineCleanup){ _gifTimelineCleanup(); _gifTimelineCleanup=null; }
  const tl   = document.getElementById('gifTimeline');
  const lh   = document.getElementById('gifTrimLeft');
  const rh   = document.getElementById('gifTrimRight');
  const vid  = document.getElementById('gifPreviewVid');
  if(!tl || !lh || !rh || !vid) return;

  function E(){ return window._fotosState?.gifEditor; }
  function dur(){ return E()?.duration || vid.duration || 1; }

  function pctFromClientX(cx){
    const r = tl.getBoundingClientRect();
    return Math.max(0, Math.min(1, (cx - r.left) / r.width));
  }

  function refreshUI(){
    const e=E(); if(!e) return;
    const d=dur();
    const s=e.startTime||0;
    const en=e.endTime!=null?e.endTime:d;
    const lp=(s/d*100).toFixed(3)+'%';
    const rp=(en/d*100).toFixed(3)+'%';
    lh.style.left=lp; rh.style.left=rp;
    const reg=document.getElementById('gifTrimRegion');
    if(reg){ reg.style.left=lp; reg.style.width=((en-s)/d*100).toFixed(3)+'%'; }
    const lbl=document.getElementById('gifTrimLabels');
    if(lbl){
      const len=(en-s).toFixed(2);
      lbl.innerHTML='<span style="color:#D4A843">'+s.toFixed(2)+'s</span>'
        +' <span style="color:var(--muted)">→</span> '
        +'<span style="color:#D4A843">'+en.toFixed(2)+'s</span>'
        +' <span style="color:var(--muted);font-size:9px">('+len+'s seleccionados)</span>';
    }
  }

  // Playhead mientras reproduce
  vid.ontimeupdate=function(){
    const d=dur();
    const ph=document.getElementById('gifPlayhead');
    if(ph) ph.style.left=(vid.currentTime/d*100).toFixed(3)+'%';
    const e=E();
    if(e){ const end=e.endTime!=null?e.endTime:Infinity; if(vid.currentTime>=end) vid.currentTime=e.startTime||0; }
  };

  // Click en la barra para saltar
  tl.addEventListener('click', function(ev){
    if(window._gifTlDrag) return;
    vid.currentTime = pctFromClientX(ev.clientX) * dur();
  });

  // Drag con Pointer Events (mouse + touch)
  function startDrag(which, ev){
    ev.preventDefault(); ev.stopPropagation();
    window._gifTlDrag = which;
    ev.currentTarget.setPointerCapture(ev.pointerId);
  }
  function onMove(ev){
    if(!window._gifTlDrag) return;
    const t = pctFromClientX(ev.clientX) * dur();
    const e = E(); if(!e) return;
    const d = dur();
    if(window._gifTlDrag==='left'){
      e.startTime = Math.max(0, Math.min(t, (e.endTime!=null?e.endTime:d)-0.05));
      vid.currentTime = e.startTime;
    } else {
      e.endTime = Math.min(d, Math.max(t, (e.startTime||0)+0.05));
    }
    refreshUI();
  }
  function endDrag(){ window._gifTlDrag=null; }

  lh.addEventListener('pointerdown', ev=>startDrag('left',ev));
  rh.addEventListener('pointerdown', ev=>startDrag('right',ev));
  lh.addEventListener('pointermove', onMove);
  rh.addEventListener('pointermove', onMove);
  lh.addEventListener('pointerup', endDrag);
  rh.addEventListener('pointerup', endDrag);

  refreshUI();
  _gifTimelineCleanup = ()=>{ window._gifTlDrag=null; };
}

    const bar=document.getElementById('gifAIProgressBar');
    const btn=document.getElementById('gifAIBtn');
    if(el){ el.style.display=msg?'block':'none'; el.textContent=msg||''; }
    if(pb){ pb.style.display=pct!=null?'block':'none'; }
    if(bar&&pct!=null){ bar.style.width=pct+'%'; }
    if(btn){ btn.disabled=!!msg; btn.style.opacity=msg?.5:1; }
  }

  setAIStatus('Cargando módulo IA (~30 MB la primera vez)...', 0);
  try{
    // 1. Cargar imgly si no está
    if(!window.imglyRemoveBackground){
      await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm')
        .then(m=>{ window.imglyRemoveBackground=m.removeBackground; });
    }

    // 2. Cargar el video original
    setAIStatus('Cargando video...', 2);
    const video=document.createElement('video');
    video.crossOrigin='anonymous'; video.muted=true; video.src=gifUrl;
    await new Promise((res,rej)=>{ video.onloadedmetadata=res; video.onerror=rej; video.load(); });
    const W=video.videoWidth, H=video.videoHeight;
    const dur=video.duration;
    const fps=Math.min(12, Math.max(8, Math.round(1/(dur/Math.round(dur*10)))||10));
    const totalFrames=Math.max(1,Math.round(dur*fps));
    const frameDurMs=1000/fps;

    // 3. Extraer y procesar cada frame
    const frameCanvas=document.createElement('canvas');
    frameCanvas.width=W; frameCanvas.height=H;
    const ctx=frameCanvas.getContext('2d');
    const processedBitmaps=[];

    for(let i=0;i<totalFrames;i++){
      const t=Math.min(i/fps, dur-0.05);
      video.currentTime=t;
      await new Promise(res=>{ video.onseeked=()=>res(); setTimeout(res,500); });
      ctx.drawImage(video,0,0,W,H);
      const frameBlob=await new Promise(res=>frameCanvas.toBlob(res,'image/png',0.92));
      const pct=Math.round((i/totalFrames)*80);
      setAIStatus(`Quitando fondo: frame ${i+1} / ${totalFrames}...`, pct);
      const processed=await window.imglyRemoveBackground(frameBlob,{
        output:{format:'image/png',quality:0.92}
      });
      processedBitmaps.push(await createImageBitmap(processed));
    }

    // 4. Re-ensamblar como WebM con alpha (VP9)
    setAIStatus('Ensamblando video transparente...', 82);
    const outCanvas=document.createElement('canvas');
    outCanvas.width=W; outCanvas.height=H;
    const outCtx=outCanvas.getContext('2d');
    const mimeType=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ?'video/webm;codecs=vp9':'video/webm';
    const stream=outCanvas.captureStream(fps);
    const recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:6000000});
    const chunks=[];
    recorder.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
    recorder.start();
    await new Promise(res=>{
      let fi=0;
      function next(){
        if(fi>=processedBitmaps.length){ setTimeout(()=>{ recorder.stop(); res(); },300); return; }
        outCtx.clearRect(0,0,W,H);
        outCtx.drawImage(processedBitmaps[fi],0,0);
        fi++;
        setTimeout(next,frameDurMs);
      }
      next();
    });
    await new Promise(res=>{ recorder.onstop=res; });

    // 5. Subir WebM procesado
    setAIStatus('Subiendo video procesado...', 90);
    const webmBlob=new Blob(chunks,{type:mimeType});
    const rutKey=(F.selected.rut||F.selected.codigo||'x').replace(/[^0-9a-zA-Z]/g,'_');
    const ts=Date.now();
    const path='athlete_gifs/'+rutKey+'_'+ts+'_nobg.webm';
    const storage=getStorage(app);
    const sRef=storageRef(storage,path);
    await uploadBytes(sRef,webmBlob,{contentType:'video/webm'});
    const url=await getDownloadURL(sRef);

    // 6. Guardar en Firestore
    setAIStatus('Guardando...', 97);
    const docRef=doc(db,'atleta_fotos',F.selected.codigo);
    const newData={gif_url:url,gif_blend:'normal',gif_storage_path:path,gif_updated:ts};
    await setDoc(docRef,newData,{merge:true});

    // 7. Actualizar cache local
    if(!ST.fotosByCodigo) ST.fotosByCodigo={};
    Object.assign(ST.fotosByCodigo[F.selected.codigo]||{}, newData);
    if(!ST.fotosByCodigo[F.selected.codigo]) ST.fotosByCodigo[F.selected.codigo]=newData;
    else Object.assign(ST.fotosByCodigo[F.selected.codigo], newData);
    F.gifBlend='normal';
    F.selected.gif_url=url;
    const la=(ST.data||[]).find(a=>a.codigo===F.selected.codigo);
    if(la){la.gif_url=url;la.gif_blend='normal';}

    setAIStatus(null);
    F.gifStatus='✓ Fondo eliminado y guardado. Blend cambiado a Normal (alpha).';
    render();
  }catch(e){
    console.error('[quitarFondoGif]',e);
    setAIStatus(null);
    F.gifError='Error: '+e.message;
    render();
  }
};

window.subirGifAtleta = async function(input){

let _entrenadoresData = null;
let _entrenadoresLoading = false;
let _entrenadoresError = null;
async function loadEntrenadoresData(){
  if(_entrenadoresData||_entrenadoresLoading) return _entrenadoresData;
  _entrenadoresLoading = true;
  _entrenadoresError = null;
  try {
    const url = 'entrenadores_centro_2026.json?v='+Date.now();
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status+' al pedir '+url+' (¿lo subiste a hosting?)');
    _entrenadoresData = await r.json();
  } catch(e){
    _entrenadoresError = e.message || String(e);
    console.error('[Entrenadores] error:', e);
  }
  _entrenadoresLoading = false;
  return _entrenadoresData;
}
function genTempPassword(nombre){
  // Slug + 4 dígitos. Ejemplo: "Andrea Garcés" → "andrea2026!4827"
  const slug = (nombre||'coach').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'').slice(0,12) || 'coach';
  const n = Math.floor(1000 + Math.random()*9000);
  return slug + '2026!' + n;
}
window.coachExists = async function(email){
  if(!email) return false;
  try {
    const q = window.FB.query(window.FB.collection(db,'coaches'), window.FB.where('email','==',email.toLowerCase()));
    const snap = await window.FB.getDocs(q);
    return !snap.empty;
  } catch(e){ return false; }
};
window.importCoach = async function(idx, btn){
  if(!_entrenadoresData) return;
  const c = _entrenadoresData.entrenadores[idx];
  if(!c) return;
  const email = (c.emails[0]||'').trim().toLowerCase();
  if(!email){ alert('Sin email — no se puede crear cuenta. Pedile el email primero.'); return; }
  if(await window.coachExists(email)){ alert('Ya existe un coach con este email: '+email); if(btn){btn.textContent='Ya existe'; btn.disabled=true;} return; }
  const pwd = genTempPassword(c.nombre);
  const grado = c.roles.includes('head_coach')?'Head Coach':(c.roles.includes('head_coach_suplente')?'Head Coach Suplente':'Handler');
  if(!confirm('Crear cuenta para "'+c.nombre+'"?\n\nEmail: '+email+'\nClave temporal: '+pwd+'\nGrado: '+grado+'\nClubs: '+c.clubs.join(', ')+'\n\nGuardá la clave antes de aceptar — solo se muestra una vez.')) return;
  if(btn){btn.disabled=true; btn.textContent='Creando...';}

    alert('✓ Cuenta creada.\n\nCredenciales para entregar al entrenador:\nEmail: '+email+'\nClave: '+pwd+'\n\n(Recordale que la cambie en su primer login.)');
  } catch(e){
    if(btn){btn.disabled=false; btn.textContent='Reintentar';}
    alert('Error: '+(e.message||e));
  }
};

window.procesarMerge = async function(compId){
  const comp=ST.competitionResults.find(c=>c.id===compId);
  if(!comp){showToast('Competencia no encontrada',null,true);return;}

  const btn=document.querySelector(`[onclick="procesarMerge('${compId}')"]`);
  if(btn){btn.disabled=true;btn.textContent='⏳ Procesando...';}

  const results=comp.results||[];
  const withTotal=results.filter(r=>r.resultado?.total>0);
  
  // Deep copy data to avoid mutating ST.data in place yet
  const newData=JSON.parse(JSON.stringify(ST.data));
  const newRecords=JSON.parse(JSON.stringify(RECORDS_DATA));
  let added=0,updated=0,recordsUpdated=0;

  withTotal.forEach(r=>{
    const res=r.resultado;
    // Recalculate GL with correct formula
    const glp=_calcGL(res.total,res.bw,r.modalidad,r.sexo);
    res.glp=glp;

    let athlete=findAthleteInDB(r.nombre,r.rut);

    if(!athlete){
      // Create new athlete
      const newCodigo='FCP-NEW-'+Date.now()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
      athlete={
        nombre:r.nombre,rut:r.rut||'',codigo:newCodigo,
        club:r.club||'',debut:comp.fecha?.slice(0,4)||'',
        competencias:[],bestLifts:{}
      };
      newData.push(athlete);
      added++;
    }else{
      // Ensure we modify the copy
      athlete=newData.find(a=>a.codigo===athlete.codigo);
      updated++;
    }

    // Remove duplicate entry for same event
    athlete.competencias=(athlete.competencias||[]).filter(c=>c.evento!==r.evento);

    // Add competition result
    const compEntry={
      evento:r.evento,fecha:comp.fecha||r.fecha,
      division:r.division||res.division||'',
      categoria:r.categoria||res.categoria||'',
      modalidad:r.modalidad||'',
      sexo:r.sexo||'',
      resultado:{
        bw:res.bw,sq:res.sq||0,bp:res.bp||0,dl:res.dl||0,
        total:res.total,glp,
        intentos:res.intentos||{},
        pesoCorporal:res.bw,
        categoria:res.categoria||r.categoria,
        division:res.division||r.division
      }
    };
    athlete.competencias.push(compEntry);

    // Update bestLifts (only if same modality or better)
    const bl=athlete.bestLifts||{};
    const mod=(r.modalidad||'').toLowerCase().includes('equip')?'eq':'cl';
    if(res.sq&&res.sq>(bl.sq||0))bl.sq=res.sq;
    if(res.bp&&res.bp>(bl.bp||0))bl.bp=res.bp;
    if(res.dl&&res.dl>(bl.dl||0))bl.dl=res.dl;
    if(res.total&&res.total>(bl.total||0)){bl.total=res.total;bl.glp=glp;}
    athlete.bestLifts=bl;

    // Check and update records
    ['sq','bp','dl','total'].forEach(lift=>{
      const val=lift==='total'?res.total:res[lift];
      if(!val)return;
      const rec=checkRecord(val,res.bw,res.categoria||r.categoria,res.division||r.division,r.modalidad,r.sexo,lift);
      if(rec){
        const idx=(newRecords.records||[]).findIndex(x=>x.categoria===rec.categoria&&x.division===rec.division&&x.sexo===rec.sexo&&x.levantamiento===lift);
        if(idx>=0){
          newRecords.records[idx]={...newRecords.records[idx],marca:val,atleta:r.nombre,fecha:comp.fecha,evento:comp.eventoName};
          recordsUpdated++;
        }
      }
    });
  });

  // Auto-upload to Firebase Storage (publish without GitHub)
  let _mergeUploaded=false;
  try{
    await _uploadToStorage(newData, recordsUpdated>0 ? newRecords : null);
    _mergeUploaded=true;
  }catch(e){
    console.warn('[merge] Storage upload failed:',e.message);
    // Fallback: download locally
    const dataBlob=new Blob([JSON.stringify(newData,null,2)],{type:'application/json'});
    const dataUrl=URL.createObjectURL(dataBlob);
    const a1=document.createElement('a');a1.href=dataUrl;a1.download='data.json';a1.click();
    if(recordsUpdated>0){
      setTimeout(()=>{
        const recBlob=new Blob([JSON.stringify(newRecords,null,2)],{type:'application/json'});
        const recUrl=URL.createObjectURL(recBlob);
        const a2=document.createElement('a');a2.href=recUrl;a2.download='records.json';a2.click();
      },500);
    }
  }

  // Mark as processed in Firestore
  try{
    await setDoc(doc(db,'competition_results',compId),
      {status:'processed',processedAt:new Date().toISOString(),processedBy:ST.user.email,
       summary:{added,updated,recordsUpdated}},
      {merge:true}
    );
    await logAction('merge_results',comp.eventoName,null,`${added} new, ${updated} updated, ${recordsUpdated} records`);
  }catch(e){console.warn('Mark processed error',e);}

  // Update local ST.data for immediate effect
  ST.data=newData;
  RECORDS_DATA=newRecords;

  showToast(_mergeUploaded?`Publicado automáticamente: ${added} nuevos, ${updated} actualizados${recordsUpdated>0?`, ${recordsUpdated} records`:''}.`:`Procesado: ${added} nuevos, ${updated} actualizados. Descarga y sube a GitHub.`);
  if(btn){btn.disabled=false;btn.textContent=_mergeUploaded?'Publicado ✓':'Descargado — sube a GitHub';}
};

// Genera una versión difuminada (en canvas, porque html2canvas no soporta filter:blur).
window.pubMakeBlur = function(src, cb){
  try{
    const img=new Image();
    img.onload=function(){
      const w=560, h=Math.max(1,Math.round(w*img.height/img.width));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      try{ ctx.filter='blur(22px)'; }catch(_){}
      // dibujar un poco más grande para evitar bordes claros del blur
      ctx.drawImage(img,-30,-30,w+60,h+60);
      try{ cb(c.toDataURL('image/jpeg',0.82)); }catch(_){ cb(src); }
    };
    img.onerror=function(){ cb(src); };
    img.src=src;

window.pubDownload = async function(){
  if(!window.html2canvas){ showToast('html2canvas no cargado', null, true); return; }
  const btn = document.getElementById('pubDownloadBtn');
  if(btn){btn.textContent='Generando...';btn.disabled=true;}
  // Renderizar una copia a TAMAÑO REAL fuera de pantalla (sin el escalado del preview),
  // si no html2canvas captura el lienzo escalado y el texto sale encimado.
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;top:0;left:-10000px;width:1080px;height:1350px;overflow:hidden;z-index:-1';
  let html = pubRenderTemplate(PUB_STATE.template, PUB_STATE.data);
  html = pubApplyStyle(html, PUB_STATE.data);
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try{
    const target = holder.firstElementChild || holder;
    const canvas = await window.html2canvas(target, {
      backgroundColor: null, scale: 2, useCORS: true, allowTaint: true, logging: false,
      width: 1080, height: 1350, windowWidth: 1080, windowHeight: 1350
    });
    await new Promise(res => canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const tplName = PUB_TEMPLATES[PUB_STATE.template]?.label.replace(/[^a-zA-Z0-9]+/g,'_') || 'post';
      a.href = url;
      a.download = `YL_${tplName}_${Date.now()}.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      res();
    }, 'image/png'));
    showToast('Imagen descargada');
  } catch(e){
    console.error(e);
    showToast('Error generando PNG: '+e.message, null, true);
  } finally {
    holder.remove();
    if(btn){btn.textContent='Descargar PNG';btn.disabled=false;}
  }
};

window.pubUpdatePreview = function(){
  const c = document.getElementById('pubCanvas');
  if(!c) return;
  const tpl = PUB_STATE.template;

};
// Aplica tipo de letra (títulos/texto) y escala de tamaño a todo el lienzo
window.pubApplyStyle = function(html, d){
  const HEAD = d.fontHead || 'Oswald';
  const BODY = d.fontBody || "'DM Sans'";
  html = html.replace(/font-family:'DM Sans',sans-serif/g, "font-family:"+BODY+",sans-serif")
             .replace(/font-family:Oswald/g, "font-family:"+HEAD)
             .replace(/font-family:'DM Sans'/g, "font-family:"+BODY);
  const fs = parseFloat(d.fontScale)||1;
  if(fs!==1) html = html.replace(/font-size:(\d+)px/g, (m,n)=>'font-size:'+Math.round(+n*fs)+'px');
  return html;
};

  </div></body></html>`;
  const w=window.open('','_blank');

};

window.pubHexToRgb = function(hex){
  hex=String(hex||'').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16)||0, parseInt(hex.slice(2,4),16)||0, parseInt(hex.slice(4,6),16)||0];
};

    <div class="field"><label>Tamaño de letra (${Math.round((d.fontScale||1)*100)}%)</label><input type="range" min="0.7" max="1.4" step="0.05" value="${d.fontScale||1}" oninput="pubSetField('fontScale',this.value);this.previousElementSibling.textContent='Tamaño de letra ('+Math.round(this.value*100)+'%)'"></div>
    <div class="field"><label>Fondo</label>
      <select class="inp" onchange="pubSetBgPreset(this.value)">${BGP.map(([v,l])=>`<option value="${v}" ${(!d.bgImageUrl&&!d.bgColor&&d.bgPreset===v)?'selected':''}>${l}</option>`).join('')}</select>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <input type="color" value="${d.bgColor||'#06101f'}" oninput="pubSetBgColor(this.value)" title="Color sólido" style="width:42px;height:32px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer">
        <label class="btn" style="font-size:11px;cursor:pointer;padding:6px 10px">Imagen<input type="file" accept="image/*" onchange="pubUploadBg(this)" style="display:none"></label>
        ${(d.bgImageUrl||d.bgColor)?`<button onclick="pubClearBg()" style="background:transparent;border:1px solid var(--red);color:var(--red);padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer">Quitar fondo</button>`:''}
      </div>
    </div>
    <div class="field"><label>Instagrams (línea de crédito)</label><input class="inp" value="${esc(d.igHandles||'')}" oninput="pubSetField('igHandles',this.value)"></div>
    <div class="field"><label>"En vivo por"</label><input class="inp" value="${esc(d.liveBy||'')}" oninput="pubSetField('liveBy',this.value)"></div>
  </div>`;

  // Campos específicos por template
  if(tpl==='cartaAtleta'){
    const athOpts=(ST.data||[]).slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).map(a=>`<option value="${esc(a.nombre||'')}">`).join('');
    fields += `<div class="field"><label>Cargar atleta desde la base (autocompleta marcas, GLP y categoría)</label>
      <input class="inp" list="pubAthCard" placeholder="Escribe el nombre y elígelo de la lista..." onchange="pubLoadAthleteCard(this.value)">
      <datalist id="pubAthCard">${athOpts}</datalist></div>`;
    fields += `<div class="field"><label>Foto del atleta (ideal: recortada / fondo transparente)</label>
      ${d.cardPhoto
        ? `<div style="display:flex;gap:10px;align-items:center;padding:10px;background:rgba(34,197,94,.08);border:1px solid var(--green);border-radius:8px"><img src="${d.cardPhoto}" style="height:64px;border-radius:6px;object-fit:cover"><div style="flex:1;font-size:11px;color:var(--green);font-family:Oswald">✓ Foto cargada</div><button onclick="pubClearCardPhoto()" style="background:transparent;border:1px solid var(--red);color:var(--red);padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer">✕ Quitar</button></div>`
        : `<input type="file" accept="image/*" onchange="pubUploadCardPhoto(this)" style="padding:8px;border:1px dashed var(--border);border-radius:6px;background:rgba(10,22,40,.4);color:var(--muted);width:100%">`}
    </div>`;
    fields += inp('cardName','Nombre (la última palabra va grande, ej: "María Paz Sáez")',d.cardName);
    fields += inp('cardNick','Sobrenombre / IG (ej: @paaaxi)',d.cardNick);
    fields += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${inp('cardSquat','Sentadilla (kg)',d.cardSquat)}
      ${inp('cardBench','Banca (kg)',d.cardBench)}
      ${inp('cardDeadlift','Peso muerto (kg)',d.cardDeadlift)}
      ${inp('cardTotal','Total (kg)',d.cardTotal)}
    </div>`;
    fields += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${inp('cardGLP','GLP',d.cardGLP)}
      ${inp('cardCategory','Categoría (ej: −57 KG)',d.cardCategory)}
    </div>`;
    fields += `<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" ${d.cardShowBadge!==false?'checked':''} onchange="pubSetField('cardShowBadge',this.checked)"> Mostrar insignia (estrella + texto)</label></div>`;
    fields += inp('cardBadge','Texto de la insignia (ej: WORLD CHAMPION). Vacío = solo la estrella',d.cardBadge);
    const FLAGS=[['CL','Chile'],['none','Sin bandera']];
    fields += `<div class="field"><label>Bandera</label><select class="inp" onchange="pubSetField('cardFlag',this.value)">${FLAGS.map(([v,l])=>`<option value="${v}" ${d.cardFlag===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
    // Sliders de ajuste fino (la foto también se arrastra con el mouse en el preview)
    const sl=(key,label,min,max,step,val,unit)=>`<div class="field"><label>${label} (${val}${unit||''})</label><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="pubSetField('${key}',this.value);this.previousElementSibling.textContent='${label} ('+this.value+'${unit||''}')'"></div>`;
    fields += `<div style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:rgba(10,22,40,.4)">
      <div style="font-family:Oswald;font-size:12px;letter-spacing:2px;color:var(--gold);margin-bottom:6px">POSICIÓN Y TAMAÑO</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Arrastra la <b style="color:var(--text)">foto</b> y el <b style="color:var(--text)">nombre</b> con el mouse directamente en el preview. Los sliders son para ajuste fino.</div>
      ${sl('cardPhotoOX','Foto · horizontal',-500,500,5,(d.cardPhotoOX||0),'px')}
      ${sl('cardPhotoOY','Foto · vertical',-500,500,5,(d.cardPhotoOY||0),'px')}
      ${sl('cardPhotoZoom','Foto · zoom',50,250,1,(d.cardPhotoZoom||100),'%')}
      ${sl('cardNameX','Nombre · horizontal',-400,400,5,(d.cardNameX||0),'px')}
      ${sl('cardNameY','Nombre · altura',560,1010,2,(d.cardNameY||720),'px')}
      ${sl('cardNameScale','Nombre · tamaño',60,140,1,(d.cardNameScale||100),'%')}
    </div>`;
  }
  if(tpl==='atletaFuerte'){
    const athOpts=(ST.data||[]).slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).map(a=>`<option value="${esc(a.nombre||'')}">`).join('');
    fields += `<div class="field"><label>Cargar atleta desde la base (trae foto del sistema, club, marcas y categoría)</label>
      <input class="inp" list="pubAthFuerte" placeholder="Escribe el nombre y elígelo de la lista..." onchange="pubLoadAthleteCard(this.value)">
      <datalist id="pubAthFuerte">${athOpts}</datalist></div>`;
    fields += `<div class="field"><label>Foto del atleta — se carga sola del sistema. Si quieres, súbela manual:</label>
      ${d.cardPhoto
        ? `<div style="display:flex;gap:10px;align-items:center;padding:10px;background:rgba(34,197,94,.08);border:1px solid var(--green);border-radius:8px"><img src="${d.cardPhoto}" crossorigin="anonymous" style="height:64px;border-radius:6px;object-fit:cover"><div style="flex:1;font-size:11px;color:var(--green);font-family:Oswald">✓ Foto cargada</div><button onclick="pubClearCardPhoto()" style="background:transparent;border:1px solid var(--red);color:var(--red);padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer">✕ Quitar</button></div>`
        : `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">Este atleta no tiene foto en el sistema → saldrá el placeholder de perfil.</div><input type="file" accept="image/*" onchange="pubUploadCardPhoto(this)" style="padding:8px;border:1px dashed var(--border);border-radius:6px;background:rgba(10,22,40,.4);color:var(--muted);width:100%">`}
    </div>`;
    fields += inp('cardOverall','Título (banda dorada, ej: CAMPEONA OVERALL JUNIOR)',d.cardOverall);
    fields += inp('cardName','Nombre completo',d.cardName);
    fields += inp('cardClub','Club',d.cardClub);
    fields += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${inp('cardSquat','Sentadilla (kg)',d.cardSquat)}
      ${inp('cardBench','Banca (kg)',d.cardBench)}
      ${inp('cardDeadlift','Peso muerto (kg)',d.cardDeadlift)}
      ${inp('cardTotal','Total (kg)',d.cardTotal)}
    </div>`;
    fields += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${inp('cardGLP','GL points',d.cardGLP)}
      ${inp('cardCategory','Categoría de peso (ej: −83 KG, opcional)',d.cardCategory)}
    </div>`;
  }
  if(/^(inicio|nomina|transmisiones|atletas|records|ranking|calculadora)$/.test(tpl)){
    fields += inp('secTitle','Título grande',d.secTitle);
    fields += inp('secText','Texto (multilínea)',d.secText,true);
    fields += inp('secUrl','URL / llamado (ej: yourlift.cl/ranking)',d.secUrl);
  }
  if(tpl==='estaremosPresentes' || tpl==='inscripcionesAbiertas' || tpl==='proximoTorneo'){
    fields += inp('eventName','Nombre evento (grande, si NO subís logo)',d.eventName);
    fields += inp('eventSubtitle','Subtítulo (ej. "1° Edición")',d.eventSubtitle);
    fields += inp('date','Fecha',d.date);
    fields += inp('location','Ubicación',d.location);
    fields += inp('organizer','Organizador',d.organizer);
    if(tpl==='inscripcionesAbiertas') fields += inp('docsList','Documentación (separar por · )',d.docsList);
  }
  if(tpl==='resultadosPodio'){
    fields += inp('eventName','Nombre evento',d.eventName);
    fields += inp('category','Categoría',d.category);
    fields += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">`;
    [1,2,3].forEach(i=>{
      fields += `<div>
        <div style="font-family:Oswald;font-size:11px;letter-spacing:2px;color:var(--gold);margin:8px 0 4px">${i}° PUESTO</div>
        ${inp('athlete'+i,'Nombre',d['athlete'+i])}
        ${inp('athlete'+i+'Total','Total kg',d['athlete'+i+'Total'])}
        ${inp('athlete'+i+'Club','Club',d['athlete'+i+'Club'])}
      </div>`;
    });
    fields += `</div>`;
  }
  if(tpl==='recordNuevo'){
    fields += inp('eventName','Nombre evento',d.eventName);
    fields += inp('date','Fecha',d.date);
    fields += inp('category','Categoría',d.category);
    fields += inp('recordType','Movimiento (SQUAT/BENCH/DEADLIFT)',d.recordType);
    fields += inp('recordMark','Marca (kg)',d.recordMark);
    fields += inp('recordAthlete','Atleta',d.recordAthlete);
  }
  if(tpl==='anuncioGenerico'){
    fields += inp('title','Título grande',d.title);
    fields += inp('subtitle','Subtítulo',d.subtitle);
    fields += inp('body','Texto del anuncio (multilínea)',d.body,true);
  }

  return `
  <div style="display:grid;grid-template-columns:280px 1fr 1fr;gap:18px;align-items:start;margin-top:18px">
    <!-- Selector templates -->
    <div style="display:flex;flex-direction:column;gap:8px;position:sticky;top:18px">
      <div style="font-family:Oswald;font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700;padding:0 4px 4px">TEMPLATES</div>
      ${tplCards}
    </div>
    <!-- Form -->
    <div class="card" style="padding:16px 18px;max-height:80vh;overflow-y:auto">
      <div style="font-family:Oswald;font-size:14px;letter-spacing:2px;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">
        ${t.icon} ${t.label.toUpperCase()}
      </div>
      ${fields}
      <button id="pubDownloadBtn" onclick="pubDownload()" class="btn btn-g" style="width:100%;padding:14px;margin-top:14px;font-size:14px;font-family:Oswald;letter-spacing:2px">Descargar PNG</button>
    </div>
    <!-- Preview -->
    <div style="position:sticky;top:18px">
      <div style="font-family:Oswald;font-size:11px;letter-spacing:3px;color:var(--gold);margin-bottom:8px">PREVIEW · 1080×1350</div>
      <div style="background:#000;border:1px solid var(--border);border-radius:12px;padding:8px;overflow:hidden">
        <div style="position:relative;width:100%;padding-top:125%;overflow:hidden;border-radius:6px">
          <div style="position:absolute;inset:0;transform:scale(calc(1/3.5));transform-origin:top left;width:1080px;height:1350px">
            <div id="pubCanvas"></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

</script>
</body>
</html>
