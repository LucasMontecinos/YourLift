// Guarda la ficha entera del campeonato. Se manda completa (no merge parcial) para
// que borrar un documento borre de verdad la entrada de la lista.
async function cpGuardar(id, ficha){
  const ev=(ST.eventos||[]).find(e=>e.id===id)||{};
  const dato={
    evento:id,
    name:ev.name||id,
    fecha:ev.date||'',
    lugar:ev.location||'',
    logoUrl:ev.logoUrl||'',
    publicado:!!ficha.publicado,
    docs:ficha.docs||[],
    updatedAt:serverTimestamp()
  };
  await setDoc(doc(db,'competencias_pasadas',id),dato);
  ST.pasadas=ST.pasadas||{};
  ST.pasadas[id]={...dato};
  render();
}

window.cpSubir=async function(id,input){
  const files=[...(input.files||[])];
  input.value='';
  if(!files.length)return;
  const btn=input.closest('label');
  const original=btn?btn.textContent:'';
  try{
    const storage=getStorage(app);
    const ficha=cpFicha(id)||{docs:[],publicado:false};
    const docs=(ficha.docs||[]).slice();
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(file.size>CP_MAX_MB*1024*1024){ showToast(file.name+' pesa más de '+CP_MAX_MB+' MB',null,true); continue; }
      if(btn)btn.textContent=`Subiendo ${i+1}/${files.length}…`;
      // El nombre del archivo se limpia, pero el que se ve en el sitio es editable.
      const limpio=file.name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-70);
      const ruta=`actas/${id}/${Date.now()}_${limpio}`;
      const sref=storageRef(storage,ruta);
      await uploadBytes(sref,file,{contentType:file.type||'application/octet-stream'});
      docs.push({
        nombre:file.name.replace(/\.[^.]+$/,''),
        archivo:file.name,
        url:await getDownloadURL(sref),
        ruta,
        tamano:file.size,
        subidoEn:new Date().toISOString()
      });
    }
    await cpGuardar(id,{...ficha,docs});
    showToast(files.length>1?files.length+' documentos subidos':'Acta subida');
  }catch(e){ showToast('Error: '+e.message,null,true); }
  finally{ if(btn)btn.textContent=original; render(); }
};

window.cpRenombrar=async function(id,i,valor){
  const ficha=cpFicha(id); if(!ficha||!ficha.docs||!ficha.docs[i])return;
  const docs=ficha.docs.slice();
  docs[i]={...docs[i],nombre:String(valor||'').trim()||docs[i].archivo};
  try{ await cpGuardar(id,{...ficha,docs}); showToast('Nombre actualizado'); }
  catch(e){ showToast('Error: '+e.message,null,true); }
};

window.cpBorrar=async function(id,i){
  const ficha=cpFicha(id); if(!ficha||!ficha.docs||!ficha.docs[i])return;
  const d=ficha.docs[i];
  if(!confirm('¿Borrar "'+(d.nombre||d.archivo)+'"?\n\nDeja de estar disponible para descargar en el sitio.'))return;
  try{
    // Primero la ficha: si el archivo de Storage ya no está, igual queremos que
    // deje de aparecer en el sitio en vez de quedar con un enlace roto.
    const docs=ficha.docs.filter((_,k)=>k!==i);
    await cpGuardar(id,{...ficha,docs});
    if(d.ruta){ try{ await deleteObject(storageRef(getStorage(app),d.ruta)); }catch(e){ console.warn('[actas] borrar archivo',e.message); } }
    showToast('Documento borrado');
  }catch(e){ showToast('Error: '+e.message,null,true); }
};

window.cpPublicar=async function(id,on){
  const ficha=cpFicha(id)||{docs:[]};
  if(on&&!(ficha.docs||[]).length){ showToast('Sube al menos un documento antes de publicarlo',null,true); render(); return; }
  try{ await cpGuardar(id,{...ficha,publicado:!!on}); showToast(on?'Publicado en yourlift.cl':'Sacado del sitio'); }
  catch(e){ showToast('Error: '+e.message,null,true); }
};

// ── Exportar Nómina del evento seleccionado como Excel filtrable y con estilo ──
// Columnas: Nombre, Modalidad, División, Categoría, Club. Disponible para
// CUALQUIER rol admin (la vista Nóminas no está restringida a owner).
// Estilo (pedido por el owner): negrita + tamaño 12, bordes finos en todas las
// celdas, header azul-gris (#D6DCE4), datos gris claro (#EDEDED), header
// congelado y AutoFilter. Usamos ExcelJS porque SheetJS community NO escribe
// estilos (colores/bordes/negrita).
window.exportNominaExcel = async function(){
  const btn=document.getElementById('btnExportNomina');
  const ev=ST.filterEv;
  if(!ev){ showToast('Selecciona un campeonato primero',null,true); return; }
  if(btn){ btn.textContent='Generando...'; btn.disabled=true; }
  try{
    if(!window.ExcelJS){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }
    const ExcelJS=window.ExcelJS;
    // Mismos datos que muestra la nómina del evento seleccionado.
    let list=(ST.inscripciones||[]).filter(i=>i.evento===ev&&i.status!=='rejected');
    // Columna "Pos. Nacional 2026" solo si el evento activó esa pregunta (Sudamericano).
    const posNacOn = !!(ST.eventos||[]).find(e=>e.id===ev)?.posNac2026;

    // ── GL lookup desde competition_results ──────────────────────────────────
    const _normRutXL=s=>String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();
    const _normNmXL=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
    // Identificar eventos Nacional y Universitario por nombre (para priorizar, no para filtrar)
    const _xlEvNat=new Set((ST.eventos||[]).filter(e=>/nacional/i.test(e.name||'')&&!/universitario/i.test(e.name||'')).map(e=>e.id));
    const _xlEvUni=new Set((ST.eventos||[]).filter(e=>/universitario/i.test(e.name||'')).map(e=>e.id));
    // Clasificar el tipo de cada resultado según modalidad/división/view
    const _xlTabType=r=>{const m=String(r.modalidad||'').toLowerCase();const isOE=/olimpiadas|\boe\b/.test(m);const isEq=/equipado|equipped/.test(m);const isBench=/only.?bench/.test(m)||r.view==='bench';const isUni=/universitario/.test(String(r.division||'').toLowerCase())||/universitario/.test(m);if(isUni&&!isBench&&!isOE)return'uni';if(isOE)return'oe';if(isBench)return isEq?'bench_eq':'bench_cl';return isEq?'eq':'cl';};
    const _xlTabFor={classic:['cl','bench_cl'],equipado:['eq','bench_eq'],oe:['oe'],universitario:['uni']};
    // Construir mapa RUT/nombre/codigo → [{gl, tab, evId, isNat, isUni}] — TODOS los eventos
    const _xlByRut={},_xlByNm={},_xlByCod={};
    (ST.allCompResults||[]).forEach(r=>{
      const gl=parseFloat(r.resultado?.glp||r.resultado?.gl||0);if(gl<=0)return;
      const evId=r.evento_id||r.evento||''; // evento_id es el ID; evento es el nombre
      const e={gl,tab:_xlTabType(r),evId,isNat:_xlEvNat.has(evId),isUni:_xlEvUni.has(evId)};
      const rut=_normRutXL(r.rut||'');const nm=_normNmXL(r.nombre||'');const cod=String(r.codigo||'').trim();
      if(rut){if(!_xlByRut[rut])_xlByRut[rut]=[];_xlByRut[rut].push(e);}
      if(nm){if(!_xlByNm[nm])_xlByNm[nm]=[];_xlByNm[nm].push(e);}
      if(cod){if(!_xlByCod[cod])_xlByCod[cod]=[];_xlByCod[cod].push(e);}
    });
    // Mapa RUT→codigo desde ST.data (perfiles de atletas)
    const _xlRutToCod={};
    (ST.data||[]).forEach(a=>{const rut=_normRutXL(a.rut||'');const cod=String(a.codigo||'').trim();if(rut&&cod)_xlRutToCod[rut]=cod;});
    // Fallback: GL desde data.json (competencias del Nacional FECHIPO 2026)
    const _xlTabFromModal=m=>{const ml=String(m||'').toLowerCase();const isUni=/universitario/.test(ml);const isEq=/equipado|equipped/.test(ml);const isBench=/only.?bench/.test(ml);const isOE=/olimp|special olympic|\boe\b/.test(ml);if(isUni)return'uni';if(isOE)return'oe';if(isBench)return isEq?'bench_eq':'bench_cl';if(isEq)return'eq';return'cl';};
    const _xlDataByCod={},_xlDataByRut={};
    (ST.data||[]).forEach(a=>{
      const cod=String(a.codigo||'').trim();const rut=_normRutXL(a.rut||'');
      (a.competencias||[]).forEach(c=>{
        const gl=parseFloat(c.resultado?.glp||0);if(gl<=0)return;
        const ev=String(c.evento||'');
        const isNat=/nacional.*fechipo.*2026|campeonato nacional fechipo 2026/i.test(ev)&&!/universitario/i.test(ev);
        const isUni=/universitario/i.test(ev)&&/2026/i.test(ev);
        if(!isNat&&!isUni)return;
        const e={gl,tab:_xlTabFromModal(c.modalidad),isNat,isUni};
        if(cod){if(!_xlDataByCod[cod])_xlDataByCod[cod]=[];_xlDataByCod[cod].push(e);}
        if(rut){if(!_xlDataByRut[rut])_xlDataByRut[rut]=[];_xlDataByRut[rut].push(e);}
      });
    });
    const _getGLXL=i=>{
      const isUniDiv=/universitario/i.test(String(i.division||''));
      const mKey=String(i.posNacMod||'').toLowerCase().trim();
      const tabs=_xlTabFor[mKey]||(isUniDiv?['uni']:['cl']);
      const rut=_normRutXL(i.rut||'');const nm=_normNmXL(i.nombre||'');
      const cod=String(i.codigo||'').trim()||_xlRutToCod[rut]||'';
      // 1° intento: competition_results (Firestore) — RUT → nombre → codigo
      const pool=(rut&&_xlByRut[rut])||(nm&&_xlByNm[nm])||(cod&&_xlByCod[cod])||[];
      const natF=r=>isUniDiv?r.isUni:r.isNat;
      if(pool.length){
        for(const tab of tabs){const h=pool.filter(r=>natF(r)&&r.tab===tab);if(h.length)return Math.max(...h.map(r=>r.gl)).toFixed(2);}
        const p2=pool.filter(r=>natF(r));if(p2.length)return Math.max(...p2.map(r=>r.gl)).toFixed(2);
        for(const tab of tabs){const h=pool.filter(r=>r.tab===tab);if(h.length)return Math.max(...h.map(r=>r.gl)).toFixed(2);}
        return Math.max(...pool.map(r=>r.gl)).toFixed(2);
      }
      // 2° intento: data.json competencias Nacional 2026 — codigo → RUT
      const pool2=(cod&&_xlDataByCod[cod])||(rut&&_xlDataByRut[rut])||[];
      if(!pool2.length)return'';
      for(const tab of tabs){const h=pool2.filter(r=>natF(r)&&r.tab===tab);if(h.length)return Math.max(...h.map(r=>r.gl)).toFixed(2);}
      const p3=pool2.filter(r=>natF(r));if(p3.length)return Math.max(...p3.map(r=>r.gl)).toFixed(2);
      return'';
    };

    // ── Ordenar: Mujer→Hombre, Sub Junior→Junior→Open→Master 1→Master 2→Universitario, cat asc ──
    const _xlDivOrd={'sub junior':0,'sub-junior':0,'junior':1,'open':2,'master i':3,'master 1':3,'master ii':4,'master 2':4,'master iii':5,'master 3':5,'universitario':6,'universitaria':6};
    const _xlGetDiv=s=>{const sl=String(s||'').toLowerCase().trim();for(const[k,v]of Object.entries(_xlDivOrd))if(sl===k||sl.startsWith(k))return v;return 7;};
    const _xlGetCat=s=>{const n=parseFloat(String(s||'').replace(/[^0-9.]/g,''));return isNaN(n)?999:(String(s||'').includes('+')?n+0.5:n);};
    const _xlGetSex=s=>/mujer|femeni/i.test(String(s||''))?0:1;
    list.sort((a,b)=>{const sx=_xlGetSex(a.sexo)-_xlGetSex(b.sexo);if(sx!==0)return sx;const dv=_xlGetDiv(a.division)-_xlGetDiv(b.division);if(dv!==0)return dv;return _xlGetCat(a.categoria)-_xlGetCat(b.categoria);});
    // Universidad cruzada por RUT/nombre desde cualquier inscripción que la tenga (ej. nómina del Nacional Universitario).
    const _xNN=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
    const _xNR=s=>String(s||'').replace(/[^0-9kK]/g,'').toLowerCase();
    const _xByRut={}, _xByName={};
    (ST.inscripciones||[]).forEach(x=>{ if(!x.universidad)return; if(x.rut)_xByRut[_xNR(x.rut)]=x.universidad; if(x.nombre)_xByName[_xNN(x.nombre)]=x.universidad; });
    const _xResolveUni=i=> i.universidad || _xByRut[_xNR(i.rut)] || _xByName[_xNN(i.nombre)] || '';
    // Columna "Universidad": si el evento la configuró, si algún inscrito la trae (directa o cruzada), o si hay división Universitario.
    const uniOn = (((ST.eventos||[]).find(e=>e.id===ev||e.name===ev)?.extraCols)||[]).includes('universidad') || list.some(i=>_xResolveUni(i)) || list.some(i=>/universitar/i.test(String(i.division||'')+' '+String(i.modalidad||'')));

    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Nómina',{views:[{state:'frozen',ySplit:1}]});
    ws.columns=[
      {header:'NOMBRE',    key:'nombre',    width:34.8},
      {header:'SEXO',      key:'sexo',      width:10},
      {header:'MODALIDAD', key:'modalidad', width:34.5},
      {header:'DIVISIÓN',  key:'division',  width:16.8},
      {header:'CATEGORÍA', key:'categoria', width:12.8},
      {header:'CLUB',      key:'club',      width:26.8},
      {header:'RUT',       key:'rut',       width:15},

window.exportNominaDocsZip = async function(){
  const btn=document.getElementById('btnExportDocs');
  const ev=ST.filterEv;
  if(!ev){ showToast('Selecciona un campeonato primero',null,true); return; }
  const list=(ST.inscripciones||[]).filter(i=>i.evento===ev && i.status!=='rejected');
  if(!list.length){ showToast('No hay inscripciones en este campeonato',null,true); return; }
  if(btn){ btn.textContent='Preparando...'; btn.disabled=true; }
  try{
    if(!window.JSZip){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }
    const LEGACY_MAP={carnetURL:'Carnet de Identidad',wadeURL:'ADEL-WADA',carnetPhotoURL:'Foto fondo blanco',consentimientoURL:'Consentimiento Menor',passportURL:'Pasaporte',ipfConsentURL:'Consentimiento IPF',notasURL:'Concentracion de Notas'};
    const NEW_MAP=window.DOC_TYPES_CATALOG||{};
    const MIME_EXT={'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','application/pdf':'pdf'};
    const safe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80)||'atleta';
    // Recolectar docs por atleta (mismo criterio que viewInsDocs: nuevos + legacy)
    const tasks=[];
    list.forEach(i=>{
      const priv=ST.inscripcionesPrivate?.[i.id]||{};
      const docs=[];
      if(priv.docs && typeof priv.docs==='object') Object.entries(priv.docs).forEach(([k,url])=>{ if(url) docs.push({label:(NEW_MAP[k]?.label||k), url}); });
      Object.entries(LEGACY_MAP).forEach(([field,label])=>{ const url=priv[field]; if(url && !docs.some(d=>d.url===url)) docs.push({label, url}); });
      if(docs.length) tasks.push({nombre:i.nombre||i.rut||i.id, docs});
    });
    const totDocs=tasks.reduce((n,t)=>n+t.docs.length,0);
    if(!totDocs){ showToast('No hay documentos subidos en este campeonato',null,true); if(btn){btn.textContent='Descargar Docs (ZIP)';btn.disabled=false;} return; }
    const zip=new JSZip();
    let ok=0, fail=0, done=0;
    for(const t of tasks){
      const folder=zip.folder(safe(t.nombre));
      const used={};
      for(const d of t.docs){
        try{
          const resp=await fetch(d.url); if(!resp.ok) throw new Error('HTTP '+resp.status);
          const blob=await resp.blob();
          const ext=MIME_EXT[blob.type] || (String(blob.type||'').split('/')[1]||'bin');
          let base=safe(d.label); used[base]=(used[base]||0)+1; if(used[base]>1) base+=' '+used[base];
          folder.file(base+'.'+ext, blob); ok++;
        }catch(e){ fail++; console.warn('[docs zip]',t.nombre,d.label,e.message); }
        done++; if(btn) btn.textContent='Descargando '+done+'/'+totDocs;
      }
    }
    if(!ok){ showToast('No se pudo descargar ningún documento (revisa permisos/CORS)',null,true); return; }
    if(btn) btn.textContent='Comprimiendo...';
    const content=await zip.generateAsync({type:'blob'});
    const safeEv=String(ev).replace(/[^a-zA-Z0-9 _-]/g,'').slice(0,60).trim()||'evento';
    const a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='Documentos_'+safeEv+'.zip';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    showToast('ZIP listo: '+ok+' documentos'+(fail?' · '+fail+' fallaron':''));
  }catch(e){ console.error(e); showToast('Error: '+e.message,null,true); }
  finally{ if(btn){ btn.textContent='Descargar Docs (ZIP)'; btn.disabled=false; } }
};

// Convierte cualquier imagen (WebP/PNG/GIF/JPEG) a JPG de alta calidad, con
// fondo blanco (JPEG no soporta transparencia). Mantiene la resolución original.
// Se usa en la descarga de fotos: las plataformas externas (IPF/goodlift) piden
// JPG y nuestras fotos se guardan en WebP para ahorrar espacio.
async function _blobToJpg(blob){
  return new Promise((res)=>{
    if(blob.type==='image/jpeg'||blob.type==='image/jpg'){res(blob);return;}
    const img=new Image(), u=URL.createObjectURL(blob);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      try{
        const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); // fondo blanco
        ctx.drawImage(img,0,0);
        c.toBlob(b=>res(b||blob),'image/jpeg',0.95);
      }catch(e){res(blob);}
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(blob);};
    img.src=u;
  });
}

window.exportNominaFotosZip = async function(){
  const btn=document.getElementById('btnExportFotos');
  const ev=ST.filterEv;
  if(!ev){ showToast('Selecciona un campeonato primero',null,true); return; }
  const list=(ST.inscripciones||[]).filter(i=>i.evento===ev&&i.status!=='rejected');
  if(!list.length){ showToast('No hay inscripciones en este campeonato',null,true); return; }
  if(btn){ btn.textContent='Preparando...'; btn.disabled=true; }
  try{
    if(!window.JSZip){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }
    const rutNorm=s=>String(s||'').replace(/[^0-9kK]/gi,'').toUpperCase();
    const safe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80)||'atleta';
    const MIME_EXT={'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};

    // Construir lista de atletas con foto_url: primero busca en fotosByCodigo,
    // luego en ST.data por RUT como fallback.
    const tasks=[];
    const seen=new Set();
    for(const i of list){
      if(seen.has(i.id)) continue; seen.add(i.id);
      // Buscar atleta en ST.data por RUT o por codigo
      const rutI=rutNorm(i.rut);
      const ath=(ST.data||[]).find(a=>(i.codigo&&a.codigo===i.codigo)||(rutI&&rutNorm(a.rut)===rutI));
      const codigo=ath?.codigo||i.codigo||null;
      const fotoDoc=codigo?(ST.fotosByCodigo||{})[codigo]:null;
      const fotoUrl=fotoDoc?.foto_url||(ath?.foto_url||null);
      tasks.push({nombre:i.nombre||i.rut||i.id, fotoUrl});
    }

    const conFoto=tasks.filter(t=>t.fotoUrl);
    const sinFoto=tasks.filter(t=>!t.fotoUrl);
    if(!conFoto.length){
      showToast('Ningún atleta de esta nómina tiene foto subida',null,true);
      if(btn){ btn.textContent='Descargar Fotos (ZIP)'; btn.disabled=false; }
      return;
    }

    const zip=new JSZip();
    let ok=0, fail=0, done=0;
    for(const t of conFoto){
      try{
        const resp=await fetch(t.fotoUrl); if(!resp.ok) throw new Error('HTTP '+resp.status);
        const blob=await resp.blob();
        // Entregar SIEMPRE en JPG (lo piden las plataformas externas); si la
        // conversión falla, cae al formato original para no perder la foto.
        const jpg=await _blobToJpg(blob);
        const isJpg=jpg&&(jpg.type==='image/jpeg'||jpg.type==='image/jpg');
        const ext=isJpg?'jpg':(MIME_EXT[blob.type]||'png');
        zip.file(safe(t.nombre)+'.'+ext, isJpg?jpg:blob); ok++;
      }catch(e){ fail++; console.warn('[fotos zip]',t.nombre,e.message); }
      done++; if(btn) btn.textContent='Descargando '+done+'/'+conFoto.length;
    }

    if(!ok){ showToast('No se pudo descargar ninguna foto (revisa permisos/CORS)',null,true); return; }
    if(btn) btn.textContent='Comprimiendo...';
    const content=await zip.generateAsync({type:'blob'});
    const safeEv=String(ev).replace(/[^a-zA-Z0-9 _-]/g,'').slice(0,60).trim()||'evento';
    const a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='Fotos_'+safeEv+'.zip';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    const msg='ZIP listo: '+ok+' fotos'+(fail?' · '+fail+' fallaron':'')+(sinFoto.length?' · '+sinFoto.length+' sin foto':'');
    showToast(msg);
  }catch(e){ console.error(e); showToast('Error: '+e.message,null,true); }
  finally{ if(btn){ btn.textContent='Descargar Fotos (ZIP)'; btn.disabled=false; } }
};

// ── Paquete Internacional (ZIP) ────────────────────────────────────────────────
// Para envíos a la federación internacional (ej. Sudamericano): una carpeta por
// atleta con EXACTAMENTE 3 archivos — foto fondo blanco (JPEG garantizado, se
// convierte si hace falta), Consentimiento IPF (PDF) y WADA (PDF). No incluye
// carnet/pasaporte/notas/etc. (para eso está "Descargar Docs (ZIP)").
//
// La foto SOLO se toma si pasó por el procesamiento real de fondo blanco (tarjeta
// "Fotos Atletas" → guardarFotoAtleta). Si se confirmó "tal cual" desde el bulk
// (source:'bulk_import_inscripcion'), NO se considera fondo blanco válido — se
// marca como faltante para que el admin la procese antes de enviar el paquete.
//
// Al terminar, si falta algo, se agrega un _INCOMPLETOS.txt dentro del ZIP
// listando exactamente qué le falta a cada atleta.
async function _toJpegBlob(blob){
  if(blob.type==='image/jpeg'||blob.type==='image/jpg')return blob;
  return new Promise(res=>{
    const img=new Image(), u=URL.createObjectURL(blob);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const maxPx=2000;
      let w=img.width,h=img.height;
      if(w>maxPx||h>maxPx){ if(w>h){h=Math.round(h*maxPx/w);w=maxPx;} else {w=Math.round(w*maxPx/h);h=maxPx;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); // por si el original tenía transparencia (PNG)
      ctx.drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b||blob),'image/jpeg',0.92);
    };
    img.onerror=()=>res(blob);
    img.src=u;
  });
}
window.exportPaqueteInternacionalZip = async function(){
  const btn=document.getElementById('btnExportPaquete');

  if(!ev){ showToast('Selecciona un campeonato primero',null,true); return; }
  const list=(ST.inscripciones||[]).filter(i=>i.evento===ev && i.status!=='rejected');
  if(!list.length){ showToast('No hay inscripciones en este campeonato',null,true); return; }
  if(btn){ btn.textContent='Preparando...'; btn.disabled=true; }
  try{
    if(!window.JSZip){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }
    const rutNorm=s=>String(s||'').replace(/[^0-9kK]/gi,'').toUpperCase();
    const safe=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80)||'atleta';
    const zip=new JSZip();
    const incompletos=[];
    let done=0;
    for(const i of list){
      done++;
      if(btn)btn.textContent='Armando '+done+'/'+list.length;
      const priv=ST.inscripcionesPrivate?.[i.id]||{};
      const rutI=rutNorm(i.rut);
      const ath=(ST.data||[]).find(a=>(i.codigo&&a.codigo===i.codigo)||(rutI&&rutNorm(a.rut)===rutI));
      const codigo=ath?.codigo||i.codigo||null;

      const nombre=i.nombre||i.rut||i.id;
      const folder=zip.folder(safe(nombre));
      const missing=[];

      // 1) Foto fondo blanco — solo si pasó por procesamiento real (no "tal cual")
      const fotoOk=fotoDoc && fotoDoc.foto_url && fotoDoc.source!=='bulk_import_inscripcion';
      if(fotoOk){
        try{
          const resp=await fetch(fotoDoc.foto_url); if(!resp.ok)throw new Error('HTTP '+resp.status);
          const blob=await _toJpegBlob(await resp.blob());
          folder.file('Foto_fondo_blanco.jpg', blob);

      } else if(fotoDoc && fotoDoc.foto_url){
        missing.push('foto fondo blanco (está subida "tal cual" — procesarla en Fotos Atletas)');
      } else {
        missing.push('foto fondo blanco (no subida/publicada)');
      }

      // 2) Consentimiento IPF (PDF)
      const ipfUrl=priv.docs?.ipfConsent || priv.ipfConsentURL || null;
      if(ipfUrl){
        try{

        }catch(e){ missing.push('Consentimiento IPF (error al descargar: '+e.message+')'); }
      } else {
        missing.push('Consentimiento IPF');
      }

      // 3) WADA (PDF)
      const wadaUrl=priv.docs?.wadaIntl || priv.wadeURL || null;
      if(wadaUrl){
        try{
          const resp=await fetch(wadaUrl); if(!resp.ok)throw new Error('HTTP '+resp.status);
          folder.file('WADA.pdf', await resp.blob());
        }catch(e){ missing.push('WADA (error al descargar: '+e.message+')'); }
      } else {
        missing.push('WADA');
      }

      if(missing.length) incompletos.push(nombre+': falta '+missing.join('; '));
    }

    if(incompletos.length){
      zip.file('_INCOMPLETOS.txt', 'Atletas con documentos faltantes para el paquete internacional:\n\n'+incompletos.join('\n'));

      ? (completos+'/'+list.length+' atletas completos — revisa _INCOMPLETOS.txt dentro del ZIP')
      : ('Paquete completo: '+list.length+' atletas con foto + IPF + WADA'));
  }catch(e){ console.error(e); showToast('Error: '+e.message,null,true); }
  finally{ if(btn){ btn.textContent='Paquete Internacional (ZIP)'; btn.disabled=false; } }
};

    Object.entries(evMap).sort((a,b)=>(a[1].año||0)-(b[1].año||0))
      .forEach(([ev,v])=>evRows.push([ev,v.año||'',v.count]));
    const wsEv=XLSX.utils.aoa_to_sheet(evRows);
    wsEv['!cols']=[{wch:55},{wch:6},{wch:18}];
    XLSX.utils.book_append_sheet(wb,wsEv,'Eventos');

    // ── Hoja 4: Records por Categoría ─────────────────────────────────────────
    const recMap={};
    data.forEach(a=>{
      (a.competencias||[]).forEach(c=>{
        const r=c.resultado||{};
        if(!r.total||r.total<=0)return;
        const key=`${c.sexo}||${c.categoria}||${c.modalidad}`;
        if(!recMap[key]||r.total>recMap[key].total)
          recMap[key]={sexo:c.sexo,cat:c.categoria,mod:c.modalidad,nombre:a.nombre,club:a.club,
            sq:r.sq||0,bp:r.bp||0,dl:r.dl||0,total:r.total,bw:r.bw||0,glp:r.glp||0,evento:c.evento,fecha:c.fecha};
      });
    });
    const recRows=[['SEXO','CATEGORÍA','MODALIDAD','ATLETA','CLUB','SQ','BP','DL','TOTAL','BW','GLP','EVENTO','FECHA']];
    Object.values(recMap).sort((a,b)=>(a.sexo||'').localeCompare(b.sexo||'')||(parseFloat(a.cat)||999)-(parseFloat(b.cat)||999))
      .forEach(r=>recRows.push([r.sexo,r.cat,r.mod,r.nombre,r.club,r.sq||'',r.bp||'',r.dl||'',r.total,r.bw||'',r.glp||'',r.evento,r.fecha||'']));
    const wsRec=XLSX.utils.aoa_to_sheet(recRows);
    wsRec['!cols']=[{wch:8},{wch:10},{wch:20},{wch:30},{wch:22},{wch:7},{wch:7},{wch:7},{wch:8},{wch:7},{wch:7},{wch:52},{wch:12}];
    XLSX.utils.book_append_sheet(wb,wsRec,'Records por Categoría');

    // ── Descargar ─────────────────────────────────────────────────────────────
    const today=new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb,`FECHIPO_base_datos_${today}.xlsx`);
  }catch(e){
    alert('Error generando Excel: '+e.message);
    console.error(e);
  }finally{
    if(btn){ btn.textContent=`Descargar data.json como Excel (${ST.data.length} atletas)`; btn.disabled=false; }
  }
};

window.render=render;
render();

// ── Campeonatos que impiden inscribirse a este ───────────────────────────────
// El compendio dice que no se puede correr más de un regional al año, pero cuáles
// bloquean a cuál no es algo fijo: depende del calendario de cada temporada. Así
// que se elige por campeonato, al crearlo o editarlo, y queda guardado en su ficha
// —no en una lista aparte que después nadie recuerda actualizar.
// El año del campeonato que se está creando o editando. Sale de su propia fecha
// —la del formulario si ya se escribió, si no la guardada—, después del nombre, y
// como último recurso el año en curso.
function _anioEvento(editing){
  const dom=(document.getElementById('ef_date')||{}).value||'';
  const cierre=(document.getElementById('ef_nominaCloseAt')||{}).value||'';
  const cand=[dom,editing.date,cierre,editing.nominaCloseAt,editing.closeDate]
    .map(x=>String(x||'').slice(0,4)).find(x=>/^20\d\d$/.test(x));
  if(cand)return cand;
  const n=(String(editing.name||'').match(/\b(20\d\d)\b/)||[])[1];
  return n||String(new Date().getFullYear());
}
window.refrescarBloqueo=function(){
  const caja=document.getElementById('ef_bloq_box');
  if(!caja||!ST.eventoForm)return;
  // Lo que ya estaba marcado se guarda antes de redibujar: si no, cambiar la fecha
  // le borraría al operador todo lo que acababa de marcar.
  ST.eventoForm.bloqueaClaves=Array.from(document.querySelectorAll('.ef-bloq:checked'))
    .map(cb=>cb.getAttribute('data-clave'));
  caja.outerHTML=_bloqueoFormHtml(ST.eventoForm);
};
function _bloqueoFormHtml(editing){
  const H=_histAnio();
  const sel=new Set(editing.bloqueaClaves||[]);
  // Solo los campeonatos de la MISMA temporada que este. Un regional de 2026 no
  // se bloquea con uno de 2025, y mostrarlos todos era pedirle a alguien que no
  // se equivocara entre "Regional Sur Austral 2025" y "Regional Sur Austral 2026",
  // que se llaman igual salvo por el año. El año siguiente esto se acomoda solo.
  const anioEv=_anioEvento(editing);
  let lista=H.todos.filter(x=>x.anio===anioEv);
  // Si de ese año todavía no hay nada cargado, se muestra todo antes que una
  // lista vacía que no se entiende.
  const filtrado=lista.length>0;
  if(!filtrado)lista=H.todos;
  let h='<div id="ef_bloq_box" style="margin-top:18px;padding:14px;border:1px solid rgba(239,68,68,.28);border-radius:10px;background:rgba(239,68,68,.05)">';
  h+='<div style="font-family:Oswald;font-size:12px;letter-spacing:1.5px;color:var(--red);margin-bottom:5px">QUIÉNES NO PUEDEN INSCRIBIRSE A ESTE CAMPEONATO</div>';
  h+='<div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.55">Marca los campeonatos que dejan a un atleta fuera de este. Al escribir su RUT en el formulario, el atleta ve el aviso en el momento — y la inscripción queda marcada para la comisión. Si no marcas ninguno, no se avisa nada.</div>';
  h+=`<div style="font-size:11px;margin-bottom:8px;color:${filtrado?'var(--gold)':'var(--orange)'}">`
    +(filtrado?`Mostrando los campeonatos de <b>${esc(anioEv)}</b>, la temporada de este campeonato.`
              :`Todavía no hay campeonatos de ${esc(anioEv)} con registros — se muestran todos. Fíjate en el año antes de marcar.`)
    +'</div>';
  if(!lista.length)h+='<div style="font-size:11px;color:var(--muted)">Todavía no hay campeonatos con registros para ofrecer.</div>';
  let anio='';
  lista.forEach(x=>{
    if(x.anio!==anio){anio=x.anio;h+=`<div style="font-family:Oswald;font-size:10px;letter-spacing:1.5px;color:var(--gold);margin:9px 0 4px">${esc(anio||'sin año')}</div>`;}
    // Un campeonato sin año en el NOMBRE es el único que puede confundirse con el
    // de otra temporada: la clave se arma con el nombre, así que "Regional Norte"
    // a secas de 2025 y de 2026 darían lo mismo. Hoy no pasa —todos lo traen— pero
    // si alguien crea uno así, tiene que verlo antes de marcarlo.
    const sinAnio=!/\b20\d\d\b/.test(x.nombre);
    h+=`<label style="display:flex;align-items:center;gap:8px;padding:2px 0;font-size:12px;cursor:pointer;color:${sel.has(x.clave)?'var(--text)':'var(--muted)'}">
      <input type="checkbox" class="ef-bloq" data-clave="${esc(x.clave)}" ${sel.has(x.clave)?'checked':''} style="cursor:pointer">
      <span>${esc(x.nombre)}</span><span style="font-size:10px;color:var(--muted)">· ${x.n}</span>
      ${sinAnio?'<span title="Sin año en el nombre: se puede confundir con el mismo campeonato de otra temporada" style="font-size:9px;font-family:Oswald;letter-spacing:1px;background:rgba(245,158,11,.18);color:var(--orange);padding:1px 6px;border-radius:8px">SIN AÑO</span>':''}</label>`;
  });
  h+='</div>';
  return h;
}
window.saveEvento = async function(){
  const isNew = ST.eventoFormMode === 'create';
  const id  = isNew ? (document.getElementById('ef_id').value||'').trim().replace(/\s+/g,'_') : ST.eventoForm.id;
  const name = (document.getElementById('ef_name').value||'').trim();
  const status = document.getElementById('ef_status').value;
  const date   = document.getElementById('ef_date').value;
  // Nuevos campos: cierre de pre-nómina (inscripciones) + cierre de nómina (cambios)
  const preNominaCloseAt = document.getElementById('ef_preNominaCloseAt')?.value || '';
  const nominaCloseAt = document.getElementById('ef_nominaCloseAt')?.value || '';
  // Compat: closeDate es la fecha (sin hora) del cierre de nómina, para mantener
  // funcionando el auto-close existente que solo lee fechas.
  const closeDate = nominaCloseAt ? nominaCloseAt.slice(0,10) : '';
  const location  = document.getElementById('ef_location').value.trim();
  // Organizadores: lista (cada uno con su IG). org = nombres unidos (compat).
  const organizers = Array.from(document.querySelectorAll('#ef_organizers .org-row')).map(r=>({
    name:(r.querySelector('.org-name')?.value||'').trim(),
    instagram:(r.querySelector('.org-ig')?.value||'').trim().replace(/^@/,'')
  })).filter(o=>o.name);
  const org       = organizers.map(o=>o.name).join(' · ');
  const days      = document.getElementById('ef_days').value.trim();
  const extra     = document.getElementById('ef_extra').value;
  const recordsEnabled = document.getElementById('ef_recordsEnabled').checked;
  const cronogramaPublic = document.getElementById('ef_cronogramaPublic')?.checked !== false;
  const requiereFoto = !!document.getElementById('ef_requiereFoto')?.checked;
  const livecastVisible = document.getElementById('ef_livecastVisible')?.checked !== false;
  const posNac2026 = !!document.getElementById('ef_posNac2026')?.checked;
  const youtubeUrl = (document.getElementById('ef_youtubeUrl')?.value||'').trim();
  const logoUrl = (document.getElementById('ef_logoUrl')?.value||'').trim();
  const instagram = organizers[0]?.instagram || '';   // compat: IG del primer organizador
  const streamLogoUrl = (document.getElementById('ef_streamLogoUrl')?.value||'').trim();
  const streamInstagram = (document.getElementById('ef_streamIg')?.value||'').trim().replace(/^@/,'');
  // NUEVO: leer los checkboxes de documentos requeridos
  const requiredDocs = Array.from(document.querySelectorAll('#ef_docs_container input[type="checkbox"]:checked'))
    .map(cb => cb.getAttribute('data-doc-key'));

  if(!id || !name){ showToast('ID y nombre son obligatorios', null, true); return; }
  if(isNew && ST.eventos.find(e=>e.id===id)){ showToast('Ya existe un campeonato con ese ID', null, true); return; }

  // Campeonatos que dejan a un atleta fuera de este.
  const bloqueaClaves = Array.from(document.querySelectorAll('.ef-bloq:checked'))
    .map(cb=>cb.getAttribute('data-clave'));
  const data = {id, name, date, closeDate, preNominaCloseAt, nominaCloseAt, location, org, days, status, bloqueaClaves,
    extraCols: [extra], recordsEnabled, cronogramaPublic, requiereFoto, livecastVisible, posNac2026, youtubeUrl,
    organizers, logoUrl, instagram,    // organizadores (con IG) + logo del campeonato (se muestran en el home)
    streamLogoUrl, streamInstagram,    // logo de productora + IG para la tarjeta de Transmisiones
    requiredDocs,    // nuevo: array de docKeys requeridos
    updatedAt: serverTimestamp()};
  if(isNew) data.createdAt = serverTimestamp();

  try{
    await setDoc(doc(db,'eventos',id), data, {merge:true});
    await logAction(isNew?'create_evento':'update_evento', id, null, name);
    showToast(isNew?'Campeonato creado — ya visible en inscripciones y nómina':'Cambios guardados');
    ST.eventoForm = null;
    render();
  }catch(e){ showToast('Error: '+e.message, null, true); console.error(e); }
};

window.closeNomina = async function(id){
  const ev = ST.eventos.find(e=>e.id===id);
  if(!ev) return;
  const insc = ST.inscripciones.filter(i=>i.evento===id);
  const pending = insc.filter(i=>i.status==='pending').length;
  const msg = pending > 0
    ? `Hay ${pending} inscripción${pending!==1?'es':''} pendiente${pending!==1?'s':''}. Al cerrar la nómina quedarán como rechazadas.\n\n¿Cerrar igualmente?`
    : `¿Cerrar la nómina de "${ev.name}"?\nNo se aceptarán nuevas inscripciones.`;
  if(!confirm(msg)) return;
  try{
    await setDoc(doc(db,'eventos',id),{status:'closed',closedAt:serverTimestamp()},{merge:true});
    if(pending > 0){
      await Promise.all(insc.filter(i=>i.status==='pending').map(i=>
        updateDoc(doc(db,'inscripciones',i.id),{status:'rejected'})
      ));
    }
    await logAction('close_nomina', id, 'open', 'closed');
    showToast('Nómina cerrada — '+ev.name);
    ST.eventoForm = null;
    render();
  }catch(e){ showToast('Error: '+e.message, null, true); }
};

window.purgarInscripcionesArchivadas = async function(){
  const archivedIds=new Set((ST.eventos||[]).filter(e=>e.status==='archived').map(e=>e.id));
  const toDelete=ST.inscripciones.filter(i=>archivedIds.has(i.evento));
  if(!toDelete.length){showToast('No hay inscripciones de campeonatos archivados');return;}
  const evNames=[...archivedIds].map(id=>{const ev=(ST.eventos||[]).find(e=>e.id===id);return ev?.name||id;}).filter(Boolean).join(', ');
  if(!confirm(`¿Purgar ${toDelete.length} inscripciones de campeonato(s) archivado(s)?\n\n${evNames}\n\nLos resultados ya están en el perfil de cada atleta (competition_results). Esta acción no se puede deshacer.`))return;
  showToast(`Purgando ${toDelete.length} inscripciones…`);
  try{
    const CHUNK=400;
    for(let i=0;i<toDelete.length;i+=CHUNK){
      const batch=writeBatch(db);
      toDelete.slice(i,i+CHUNK).forEach(ins=>{
        batch.delete(doc(db,'inscripciones',ins.id));
        try{batch.delete(doc(db,'inscripciones_private',ins.id));}catch(_){}
      });
      await batch.commit();
    }
    await logAction('purge_inscripciones_archivadas',`${toDelete.length} docs`,null,evNames);
    ST.inscripciones=ST.inscripciones.filter(i=>!archivedIds.has(i.evento));
    showToast(`${toDelete.length} inscripciones purgadas`);
    render();
  }catch(e){showToast('Error: '+e.message,null,true);}
};

window.purgarDocsNomina = async function(eventoId, eventoName, btn){
  const insc = ST.inscripciones.filter(i => i.evento === eventoId);
  if(!insc.length){ showToast('No hay inscripciones para este evento'); return; }
  const LEGACY = ['carnetURL','carnetBackURL','wadeURL','carnetPhotoURL','consentimientoURL','ipfConsentURL','passportURL','notasURL'];
  let docsCount = 0;
  insc.forEach(ins => {
    const priv = ST.inscripcionesPrivate[ins.id] || {};
    const map = priv.docs || {};
    if(Object.values(map).some(v=>v&&typeof v==='string') || LEGACY.some(f=>priv[f])) docsCount++;
  });
  if(!docsCount){ showToast('No hay documentos que purgar para este evento'); return; }
  if(!confirm(`¿Purgar documentos de ${insc.length} atletas inscriptos en "${eventoName}"?\n\n• Se eliminan de Storage: carnets, WADA, consentimientos y fotos de documentos.\n• Las fotos de perfil de atleta NO se tocan.\n\nEsta acción no se puede deshacer.`)) return;
  if(btn){ btn.disabled=true; btn.textContent='Purgando…'; }
  const stor=getStorage(app);
  let deleted=0, errors=0, processed=0;
  try{
    for(const ins of insc){
      const priv = ST.inscripcionesPrivate[ins.id] || {};
      const map = priv.docs || {};
      const urls=[];
      Object.values(map).forEach(u=>{ if(u&&typeof u==='string'&&u.includes('firebasestorage'))urls.push(u); });
      LEGACY.forEach(f=>{ if(priv[f]&&typeof priv[f]==='string'&&priv[f].includes('firebasestorage'))urls.push(priv[f]); });
      for(const url of urls){
        const m=url.match(/\/o\/(.+?)(\?|$)/);
        if(!m)continue;
        const path=decodeURIComponent(m[1]);
        try{ await deleteObject(storageRef(stor,path)); deleted++; }catch(e){ if(e.code!=='storage/object-not-found')errors++; }
      }
      const upd={};
      Object.keys(map).forEach(k=>{ upd[`docs.${k}`]=deleteField(); });
      LEGACY.forEach(f=>{ if(priv[f]!==undefined) upd[f]=deleteField(); });
      if(Object.keys(upd).length){
        try{
          await updateDoc(doc(db,'inscripciones_private',ins.id),upd);
          if(ST.inscripcionesPrivate[ins.id]){
            delete ST.inscripcionesPrivate[ins.id].docs;
            LEGACY.forEach(f=>delete ST.inscripcionesPrivate[ins.id][f]);
          }
        }catch(e){ errors++; }
      }
      processed++;
      if(btn) btn.textContent=`Purgando… (${processed}/${insc.length})`;
    }
    await logAction('purgar_docs_nomina',eventoId,null,`${deleted} archivos`,{evento:eventoName});
    showToast(`Documentos purgados: ${deleted} archivos eliminados${errors?`, ${errors} errores`:''}`);
    render();
  }catch(e){ showToast('Error: '+e.message,null,true); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Purgar documentos'; } }
};

window.archiveEvento = async function(id){

  try{

// Auto-close overdue nominations (runs on loadAll)
async function autoCloseOverdueEventos(){
  const today = new Date().toISOString().slice(0,10);
  const overdue = ST.eventos.filter(ev => ev.status==='open' && ev.closeDate && ev.closeDate < today);
  for(const ev of overdue){
    try{
      await setDoc(doc(db,'eventos',ev.id),{status:'closed',closedAt:serverTimestamp(),autoClosedAt:today},{merge:true});
      await logAction('auto_close_nomina', ev.id, 'open', 'closed', {reason:'closeDate passed'});
      console.log('[Admin] Auto-closed:', ev.name);
    }catch(e){ console.warn('Auto-close failed for', ev.id, e); }
  }
}

window.createAdmin = async function(){
  const nombre = document.getElementById('naNombre').value.trim();
  const email  = document.getElementById('naEmail').value.trim().toLowerCase();
  const pass   = document.getElementById('naPass').value;
  const role   = document.getElementById('naRole').value;
  const errEl  = document.getElementById('naError');
  errEl.style.display = 'none';

  if(!nombre||!email||!pass){ errEl.style.display='block'; errEl.textContent='Completa todos los campos'; return; }
  if(pass.length < 6){ errEl.style.display='block'; errEl.textContent='La contraseña debe tener al menos 6 caracteres'; return; }

  const btn = document.querySelector('#naError + button')||document.querySelector('[onclick="createAdmin()"]');
  if(btn){ btn.disabled=true; btn.textContent='Creando...'; }

  try{
    // Use secondary app instance so we don't log out the current superadmin
    const secondaryApp = initSecondaryApp(FB_CFG, 'admin_creator_'+Date.now());
    const {getAuth:getSecAuth, createUserWithEmailAndPassword:createSecUser} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    const secondaryAuth = getSecAuth(secondaryApp);

    const cred = await createSecUser(secondaryAuth, email, pass);
    const newUID = cred.user.uid;

    // Sign out from secondary immediately
    const {signOut:signOutSec,deleteUser} = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    await signOutSec(secondaryAuth);

    // Los jueces NO van a admins/. Estar en admins/ es, para las reglas de
    // Firestore, acceso total: el rol solo esconde botones. Una cuenta de juez en
    // el teléfono de otra persona, o una sesión que quedó abierta después del
    // campeonato, sería un admin suelto. En jueces/ solo puede marcar su luz y
    // arrancar el cronómetro, y el panel de administración la rechaza solo.
    const esJuez = role==='juez';
    await setDoc(doc(db, esJuez?'jueces':'admins', newUID),{
      uid: newUID,
      email,
      nombre,
      role,
      createdBy: ST.user.email,
      createdAt: new Date().toISOString()
    });

    await logAction(esJuez?'create_juez':'create_admin', email, null, role, {nombre, createdBy:ST.user.email});
    showToast(esJuez
      ? 'Juez creado: '+nombre+' — solo puede marcar luces, no entra al panel'
      : 'Admin creado: '+nombre+' ('+email+')');

    // Clear form
    ST.adminForm = {};
    await refreshAdmins();

  }catch(e){
    errEl.style.display='block';
    if(e.code==='auth/email-already-in-use'){
      errEl.textContent = 'Ese correo ya tiene una cuenta en Firebase. Puedes agregarlo manualmente a Firestore con su UID.';
    } else {
      errEl.textContent = 'Error: '+e.message;
    }
    console.error('createAdmin error', e);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Crear cuenta'; }
  }
};

// AGREGAR / ELIMINAR COMPETENCIAS A ATLETAS (owner) — guardado en vivo
// ═══════════════════════════════════════════
// Un solo cálculo de GL en todo el panel. Antes esta función solo miraba
// classic/equipado y NUNCA la banca sola: a un Only Bench —classic o equipado—
// le aplicaba los coeficientes de powerlifting completo, que son otra escala.
function _glPoints(total,bw,sex,modalidad){
  return _calcGL(total,bw,modalidad,sex);
}
function _dotsPoints(total,bw,sex){
  if(!total||!bw)return 0;
  const fem=/muj|fem/i.test(sex||'');
  const c=fem?[-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706]
             :[-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093];
  const den=c[0]+c[1]*bw+c[2]*bw*bw+c[3]*bw**3+c[4]*bw**4;
  if(!den)return 0;
  return +(total*500/den).toFixed(2);
}
function _bestLift(pfx){
  let best=0;
  for(let i=1;i<=3;i++){
    const el=document.getElementById('cm_'+pfx+i); const ev=document.getElementById('cm_'+pfx+i+'v');
    if(!el)continue; const w=parseFloat(el.value)||0; const v=ev?ev.checked:true;
    if(v&&w>best)best=w;
  }
  return best;
}
window.compRecalc=function(){
  const sq=_bestLift('sq'),bp=_bestLift('bp'),dl=_bestLift('dl'),total=sq+bp+dl;
  const bw=parseFloat(document.getElementById('cm_bw').value)||0;
  const sex=document.getElementById('cm_sex').value, mod=document.getElementById('cm_mod').value;
  const dq=document.getElementById('cm_dq')?.checked;
  const gl=dq?0:_glPoints(total,bw,sex,mod), dots=dq?0:_dotsPoints(total,bw,sex);
  const out=document.getElementById('cm_out');
  if(out)out.innerHTML='SQ <b>'+(sq||'-')+'</b> · BP <b>'+(bp||'-')+'</b> · DL <b>'+(dl||'-')+'</b> &nbsp;|&nbsp; '
    +(dq
      ? 'Total oficial <b style="color:var(--red)">DQ</b> <span style="color:var(--muted);font-size:11px">('+(total||0)+' kg levantados)</span>'
      : 'Total <b style="color:var(--gold)">'+(total||'-')+'</b> kg &nbsp;|&nbsp; GL <b style="color:var(--gold)">'+(gl||'-')+'</b> &nbsp;|&nbsp; DOTS <b>'+(dots||'-')+'</b>');
};

window.saveCompResult=async function(){
  const g=id=>document.getElementById(id);
  const nombre=(g('cm_ath').value||'').trim();
  if(!nombre){showToast('Falta el atleta',null,true);return;}
  const evento=(g('cm_evento').value||'').trim();
  if(!evento){showToast('Falta el campeonato',null,true);return;}
  const codigo=(g('cm_codigo').value||'').trim(), rut=(g('cm_rut').value||'').trim();
  const fecha=g('cm_fecha').value||'', division=(g('cm_div').value||'').trim(), categoria=(g('cm_cat').value||'').trim();
  const modalidad=g('cm_mod').value, sexo=g('cm_sex').value, bw=parseFloat(g('cm_bw').value)||0;
  const posicion=parseInt(g('cm_pos').value,10)||null; // posición fijada a mano (prioriza sobre la calculada)
  const dq=g('cm_dq')?.checked||false;
  const sq=_bestLift('sq'),bp=_bestLift('bp'),dl=_bestLift('dl'),liftedTotal=sq+bp+dl;
  const total=dq?0:liftedTotal; // igual que livecast: el total oficial queda en 0 si DQ
  const glp=dq?0:_glPoints(total,bw,sexo,modalidad), dots=dq?0:_dotsPoints(total,bw,sexo);
  const att=pfx=>{const arr=[];for(let i=1;i<=3;i++){const w=parseFloat(g('cm_'+pfx+i).value)||0;const v=g('cm_'+pfx+i+'v').checked;if(w)arr.push({w,r:v?'g':'n'});}return arr;};
  const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
  const docId=(codigo||('m_'+slug(nombre)))+'__'+slug(evento)+'__'+slug(modalidad||'cl');
  try{
    await setDoc(doc(db,'competition_results',docId),{
      codigo,rut,nombre,evento,fecha,sexo,division,categoria,modalidad,
      posicion: posicion!=null ? posicion : deleteField(),
      resultado:{sq,bp,dl,total,bw,pesoCorporal:bw,glp,dots,status:dq?'DQ':'OK',intentos:{sq:att('sq'),bp:att('bp'),dl:att('dl')}},
      source:'manual', addedBy:(ST.user?.email||'admin'), updatedAt:serverTimestamp()
    },{merge:true});
    await logAction('add_comp_result',docId,null,evento+' · '+(dq?'DQ ('+liftedTotal+'kg levantados)':total+'kg')+(dq?'':' · GL '+glp),{nombre});
    showToast(dq?('Competencia guardada: '+nombre+' · DQ'):('Competencia guardada: '+nombre+' · '+total+'kg'));
    closeCompModal();
  }catch(e){showToast('Error: '+e.message,null,true);}
};
window.deleteCompResult=async function(id){
  if(!confirm('¿Eliminar esta competencia del atleta?\n(Quita solo lo agregado en vivo, no afecta data.json)'))return;
  try{ await deleteDoc(doc(db,'competition_results',id)); await logAction('delete_comp_result',id,null,'deleted'); showToast('Competencia eliminada'); }
  catch(e){showToast('Error: '+e.message,null,true);}
};
// Fija/edita la posición de una competencia ya agregada. Vacío = se borra y vuelve a calcularse sola.
window.setCompPos=async function(id,val){
  const p=parseInt(val,10);
  try{
    await updateDoc(doc(db,'competition_results',id), {posicion: (p>0? p : deleteField()), updatedAt:serverTimestamp()});
    await logAction('set_comp_pos',id,null,'pos='+(p>0?p:'(auto)'));
    showToast(p>0?('Posición fijada: '+p+'°'):'Posición vuelta a automática');
  }catch(e){showToast('Error: '+e.message,null,true);}
};
const _histSlug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
window.setHistPos=async function(codigo,evento,modalidad,val){
  const p=parseInt(val,10);
  const docId=codigo+'__'+_histSlug(evento)+(modalidad?'__'+_histSlug(modalidad):'');
  try{
    await setDoc(doc(db,'comp_pos_overrides',docId),{codigo,evento,modalidad:modalidad||'',posicion:p>0?p:deleteField(),updatedAt:serverTimestamp()},{merge:true});
    showToast(p>0?('Posición fijada: '+p+'°'):'Posición eliminada');
  }catch(e){showToast('Error: '+e.message,null,true);}
};

        <div style="text-align:center;min-width:54px">
          <div class="os" style="font-size:28px;font-weight:700;color:${pctColor}">${peer.pct}°</div>
          <div style="font-size:9px;color:var(--muted)">PERCENTIL</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
        ${[['Promedio',pg.avg,'var(--muted)'],['Mediana',pg.p50,'var(--text)'],['Top 1',pg.top,'var(--gold)']].map(([lbl,val,col])=>`
          <div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:9px;color:var(--muted);margin-bottom:2px">${lbl}</div>
            <div class="os" style="font-size:17px;font-weight:700;color:${col}">${val}</div>
          </div>`).join('')}
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-family:Oswald;letter-spacing:1px">TOP DE LA CATEGORÍA</div>
      ${pg.members.map((m,i)=>{
        const isMe=m.codigo===a.codigo;
        const pct=Math.round(m.total/maxT*100);
        const col=isMe?'var(--accent)':i===0?'var(--gold)':'var(--blue)';
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
          <span style="font-size:10px;font-family:Oswald;color:${isMe?'var(--accent)':'var(--muted)'};min-width:14px">${i+1}</span>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">
              <span style="font-weight:${isMe?700:400};color:${isMe?'var(--accent)':'var(--text)'}">${m.nombre}${isMe?' ← este atleta':''}</span>
              <span class="os" style="font-size:12px">${m.total} kg</span>
            </div>
            <div style="background:rgba(30,58,95,.3);border-radius:3px;height:5px;overflow:hidden">
              <div style="background:${col};height:100%;width:${pct}%;border-radius:3px"></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // ── Active inscriptions ───────────────────────────────────
  if(activeInsc.length){
    h+=`<div class="card" style="margin-bottom:14px"><div class="h2">Inscripciones activas</div>`;
    activeInsc.forEach(i=>{
      const ev=ST.eventos.find(e=>e.id===i.evento);
      const evName=ev?.name||i.evento;
      const ok=i.status==='approved';
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(30,58,95,.3)">
        <div>
          <div style="font-weight:600;font-size:13px">${evName}</div>
          <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:2px"><span>${i.division||'—'} · ${i.categoria||'—'} · ${i.modalidad||'—'} · </span>${window.clubLogoImg?window.clubLogoImg(i.club,16,'background:var(--bg);padding:1px;'):''}<span>${i.club||'—'}</span></div>
        </div>
        <span class="badge ${ok?'b-g':'b-y'}" style="flex-shrink:0;margin-left:12px">${ok?'✓ Confirmado':'⏳ Pendiente'}</span>
      </div>`;
    });
    h+=`</div>`;
  }

  // ── Competition history ───────────────────────────────────
  if(sorted.length){
    h+=`<div class="card"><div class="h2">Historial de competencias (${sorted.length})</div>`;
    sorted.forEach((c,ci)=>{
      const r=c.resultado||{};
      const prevTotal=sorted[ci+1]?.resultado?.total||0;
      const delta=prevTotal?r.total-prevTotal:null;
      const glVal=r.glp||r.gl||null;
      h+=`<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(30,58,95,.3)">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.evento}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${c.division||'—'} · ${c.categoria||'—'}${c.modalidad?' · '+c.modalidad:''}</div>
          ${c.fecha?`<div style="font-size:10px;color:var(--muted)">${c.fecha}</div>`:''}
          <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">
            ${r.sq?`<span style="font-size:9px;background:rgba(59,130,246,.1);color:var(--blue);padding:1px 5px;border-radius:3px">SQ ${r.sq}</span>`:''}
            ${r.bp?`<span style="font-size:9px;background:rgba(245,158,11,.1);color:var(--orange);padding:1px 5px;border-radius:3px">BP ${r.bp}</span>`:''}
            ${r.dl?`<span style="font-size:9px;background:rgba(34,197,94,.1);color:var(--green);padding:1px 5px;border-radius:3px">DL ${r.dl}</span>`:''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div class="os" style="font-size:19px;font-weight:700;color:var(--gold)">${r.total} kg</div>
          ${delta!==null?`<div style="font-size:11px;font-weight:700;color:${delta>0?'var(--green)':delta<0?'var(--red)':'var(--muted)'}">${delta>0?'+':''}${delta} kg</div>`:''}
          ${glVal?`<div style="font-size:10px;color:var(--muted)">GL ${glVal}${r.pos?' · #'+r.pos:''}</div>`:''}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  return h;
}

// Coeficientes oficiales IPF GL. La tabla anterior estaba CORRIDA: lo que

const _GL_COEFS = {
  'cl_M':[1199.72839,1025.18162,0.00921],'cl_F':[610.32796,1045.59282,0.03048],
  'eq_M':[1236.25115,1449.21864,0.01644],'eq_F':[758.63878, 949.31382, 0.02435],
  'bench_cl_M':[320.98041,281.40258,0.01008],'bench_cl_F':[142.40398,442.52671,0.04724],
  'bench_eq_M':[381.22073,733.79378,0.02398],'bench_eq_F':[221.82209,357.00377,0.02937],
};
function _glKey(m,s){const eq=(m||'').toLowerCase().includes('equip');const bench=(m||'').toLowerCase().includes('bench')&&!(m||'').toLowerCase().includes('powerlifting');const sex=(s||'').match(/mujer|fem|f/i)?'F':'M';return(bench?(eq?'bench_eq_':'bench_cl_'):(eq?'eq_':'cl_'))+sex;}
function _calcGL(total,bw,m,s){if(!total||!bw)return 0;const c=_GL_COEFS[_glKey(m,s)];if(!c)return 0;const d=c[0]-c[1]*Math.exp(-c[2]*bw);return d>0?Math.round(total*100/d*100)/100:0;}

function nrmName(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}

function findAthleteInDB(nombre,rut){
  const nn=nrmName(nombre);
  const rutClean=(rut||'').replace(/[^0-9kK]/gi,'').toUpperCase();
  // Match by RUT first (most reliable)
  if(rutClean.length>3){
    const byRut=ST.data.find(a=>(a.rut||'').replace(/[^0-9kK]/gi,'').toUpperCase()===rutClean);
    if(byRut)return byRut;
  }
  // Match by normalized name
  return ST.data.find(a=>nrmName(a.nombre)===nn)
    ||ST.data.find(a=>{
      const parts=nn.split(' ').filter(p=>p.length>2);
      return parts.length>=2&&parts.every(p=>nrmName(a.nombre).includes(p));
    });
}

function checkRecord(total,bw,categoria,division,modalidad,sexo,lift){
  if(!total||!lift)return null;
  const mod=(modalidad||'').toLowerCase().includes('equip')?'equipped':'classic';
  const sex=(sexo||'').match(/mujer|fem|f/i)?'F':'M';
  // Find matching record entry
  const matches=(RECORDS_DATA.records||[]).filter(r=>{
    return r.categoria===categoria&&r.division===division&&
      (r.modalidad||'').toLowerCase().includes(mod==='equipped'?'equip':'classic')&&
      r.sexo===sexo&&r.levantamiento===lift;
  });
  if(!matches.length)return null;
  const rec=matches[0];
  if(total>rec.marca)return{...rec,newMarca:total};
  return null;
}

let _impState = {evento:'', csvText:'', parsed:null, status:'', preview:null};

// Parser de CSV con soporte para campos entre comillas y delimitador auto
function _impParseCsv(text){
  if(!text) return {headers:[], rows:[]};
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').trim();
  // Auto-detectar delimitador: , o ; o tab
  const firstLine = text.split('\n')[0];
  const delim = (firstLine.split('\t').length > firstLine.split(',').length && firstLine.split('\t').length > firstLine.split(';').length) ? '\t'
              : (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const lines = text.split('\n').filter(l=>l.trim());
  const parseLine = (line) => {
    const out = []; let cur = ''; let q = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c === '"'){
        if(q && line[i+1] === '"'){ cur += '"'; i++; }
        else q = !q;
      } else if(c === delim && !q){
        out.push(cur); cur = '';
      } else cur += c;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const headers = parseLine(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
  const rows = lines.slice(1).map(parseLine);
  return {headers, rows, delim};
}

// Mapeo de columnas LiftingCast (acepta varias variantes) → campos LiveCast
function _impMap(headers){
  const find = (...cands)=>{
    for(const c of cands){
      const norm = c.toLowerCase().replace(/[^a-z0-9]/g,'');
      const idx = headers.indexOf(norm);
      if(idx>=0) return idx;
    }
    return -1;
  };
  return {
    nombre: find('lifter','liftername','name','nombre','fullname'),
    rut:    find('rut','memberid','memberno','lifterid','usapl','member','license'),
    sexo:   find('sex','gender','sexo','gen'),
    edad:   find('age','edad'),
    bw:     find('bwkg','bw','bodyweight','bodyweightkg','weight','bweight'),
    cat:    find('bwclass','weightclass','class','wtclass','categoria','category','divisionclass'),
    div:    find('division','agedivision','agedivisn','divname','divisn'),
    mod:    find('equipment','eq','equip','modalidad','modality','rawequiped','tested'),
    club:   find('team','club','gym','equipo'),
    flight: find('flight','vuelo','session','sessionletter','platform','day'),
    lot:    find('lot','lotnumber','lotno','platformorder','order','sessionorder'),
    s1: find('squat1kg','s1','squat1','sq1','squatopener'),
    s2: find('squat2kg','s2','squat2','sq2'),
    s3: find('squat3kg','s3','squat3','sq3'),
    b1: find('bench1kg','b1','bench1','bp1','benchopener'),
    b2: find('bench2kg','b2','bench2','bp2'),
    b3: find('bench3kg','b3','bench3','bp3'),
    d1: find('deadlift1kg','d1','dead1','deadlift1','dl1','deadliftopener'),
    d2: find('deadlift2kg','d2','dead2','deadlift2','dl2'),
    d3: find('deadlift3kg','d3','dead3','deadlift3','dl3'),
  };
}

function _impNormalize(row, m){
  const get = i => i>=0 && i<row.length ? (row[i]||'').trim() : '';
  const nombre = get(m.nombre);
  if(!nombre) return null;
  // Sexo
  let sexo = get(m.sexo).toUpperCase();
  if(sexo==='M'||sexo==='MALE'||sexo==='MAN'||sexo==='HOMBRE') sexo='Hombre';
  else if(sexo==='F'||sexo==='FEMALE'||sexo==='WOMAN'||sexo==='MUJER') sexo='Mujer';
  else sexo='';
  // Modalidad
  const modRaw = get(m.mod).toLowerCase();
  let modalidad = 'Powerlifting Classic';
  if(modRaw.includes('eq')||modRaw.includes('single')||modRaw.includes('multi')||modRaw.includes('equipped')||modRaw.includes('equipado')){
    modalidad = 'Powerlifting Equipped';
  }
  // Categoría: extraer el número y formatear "-83 kg (Hombre)"
  let catRaw = get(m.cat);
  let categoria = catRaw;
  const catMatch = catRaw.match(/([+\-]?\d+\.?\d*)/);
  if(catMatch && sexo){
    const num = catMatch[1];
    const isPlus = catRaw.includes('+') || /\d+\+/.test(catRaw);
    categoria = (isPlus?'':'-') + num + (isPlus?'+':'') + ' kg ('+sexo+')';
  }
  // División: normalizar a Open/Junior/Subjunior/Master I-IV
  const divRaw = get(m.div).toLowerCase();
  let division = get(m.div);
  if(divRaw.includes('open')) division='Open';
  else if(divRaw.includes('subjun')||divRaw.includes('sub-jun')||divRaw.includes('sub jun')||divRaw.includes('teen')) division='Sub Junior';
  else if(divRaw.includes('jun')) division='Junior';
  else if(divRaw.includes('master 4')||divRaw.includes('master iv')||divRaw.includes('m4')) division='Master IV';
  else if(divRaw.includes('master 3')||divRaw.includes('master iii')||divRaw.includes('m3')) division='Master III';
  else if(divRaw.includes('master 2')||divRaw.includes('master ii')||divRaw.includes('m2')) division='Master II';
  else if(divRaw.includes('master')||divRaw.includes('m1')) division='Master I';
  // Flight: tomar la primera letra A-F si existe
  let flight = get(m.flight).toUpperCase().match(/^[A-F]/)?.[0] || 'A';
  // Lot
  const lotRaw = get(m.lot);
  const lot = parseInt(lotRaw,10) || 0;
  // BW
  const bw = parseFloat(get(m.bw)) || 0;
  // Pesos de intentos (si vienen)
  const num = i => { const v = parseFloat(get(i)); return Number.isFinite(v)&&v>0 ? v : 0; };
  const att = {
    sq:[{w:num(m.s1),r:null},{w:num(m.s2),r:null},{w:num(m.s3),r:null}],
    bp:[{w:num(m.b1),r:null},{w:num(m.b2),r:null},{w:num(m.b3),r:null}],
    dl:[{w:num(m.d1),r:null},{w:num(m.d2),r:null},{w:num(m.d3),r:null}],
  };
  return {
    nombre,
    rut: get(m.rut),
    sexo, division, categoria, modalidad,
    club: get(m.club),
    flight, lot, bw,
    edad: parseInt(get(m.edad),10)||null,
    att,
  };
}

window.impLoadFile = function(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = (e)=>{
    _impState.csvText = String(e.target.result||'');
    _impParseAndPreview();
  };
  r.readAsText(f, 'utf-8');
};
window.impLoadPaste = function(textarea){
  _impState.csvText = textarea.value || '';
  _impParseAndPreview();
};
window.impSelectEvento = function(sel){
  _impState.evento = sel.value;
  render();
};
function _impParseAndPreview(){
  const parsed = _impParseCsv(_impState.csvText);
  if(!parsed.rows.length){ _impState.parsed=null; _impState.preview=null; render(); return; }
  const m = _impMap(parsed.headers);
  const items = parsed.rows.map(r=>_impNormalize(r,m)).filter(Boolean);
  _impState.parsed = {parsed, mapping:m, items};
  render();
}

window.impDoImport = async function(btn){
  if(!_impState.parsed || !_impState.evento){
    alert('Faltan datos: cargá un CSV y elegí un campeonato destino.');
    return;
  }
  const items = _impState.parsed.items;
  if(!items.length){ alert('No hay filas para importar.'); return; }
  if(!confirm('Importar '+items.length+' atletas al campeonato "'+_impState.evento+'"?\n\nSe crearán como inscripciones APROBADAS (status:approved). Si quieres revisarlas, puedes editarlas después en Nóminas.')) return;
  if(btn){btn.disabled=true; btn.textContent='Importando...';}
  let ok=0, err=0;
  for(const a of items){
    try{
      const id = 'lc_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      const data = {
        evento: _impState.evento,
        nombre: a.nombre,
        rut: a.rut || '',
        sexo: a.sexo || '',
        division: a.division || '',
        categoria: a.categoria || '',
        modalidad: a.modalidad || 'Powerlifting Classic',
        club: a.club || '',
        status: 'approved',
        timestamp: Date.now(),
        importedFromLiftingCast: true,
        sortOrder: a.lot || 0,
      };
      // Si vienen attempts pre-cargados, los guardamos para que LiveCast los levante
      const hasAttempts = ['sq','bp','dl'].some(k => a.att[k].some(x=>x.w>0));
      if(hasAttempts) data.attempts = a.att;
      if(a.flight) data.flight = a.flight;
      if(a.bw>0) data.bw = a.bw;
      await setDoc(doc(db,'inscripciones',id), data);
      ok++;
    }catch(e){ console.error('Import row failed:', a.nombre, e); err++; }
  }
  if(btn){btn.disabled=false; btn.textContent='Importar a Firestore';}
  alert('Importación terminada.\n✓ Importados: '+ok+'\n✗ Errores: '+err+(err?'\n\nRevisa la consola (F12) para detalles.':''));
  _impState = {evento:_impState.evento, csvText:'', parsed:null, status:'', preview:null};
  render();
};

// Re-renderiza el canvas de preview aplicando el transform actual
function _redrawFotoPreview(){
  const F = window._fotosState;
  if(!F.bgRemovedImg) return;
  const W=600, H=800;
  const c = document.createElement('canvas');
  c.width=W; c.height=H;
  const ctx = c.getContext('2d');
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2 + F.transform.offsetX, H/2 + F.transform.offsetY);
  ctx.rotate(F.transform.rotation * Math.PI / 180);
  const img = F.bgRemovedImg;
  const baseScale = Math.min(W/img.width, H/img.height);
  const s = baseScale * F.transform.zoom;
  const dw = img.width * s, dh = img.height * s;
  ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  ctx.restore();
  F.preview = c.toDataURL('image/jpeg', 0.92);
  // Actualizar ambos previews en vivo (sin re-render completo)
  const previewEl = document.getElementById('fotoPreviewImg');
  if(previewEl) previewEl.src = F.preview;
  const previewObs = document.getElementById('fotoPreviewObs');
  if(previewObs) previewObs.src = F.preview;
}

window.editorFotoZoom = function(delta){
  const F = window._fotosState;
  F.transform.zoom = Math.max(0.3, Math.min(3, F.transform.zoom + delta));
  _redrawFotoPreview();
};
window.editorFotoMove = function(dx,dy){
  const F = window._fotosState;
  F.transform.offsetX += dx;
  F.transform.offsetY += dy;
  _redrawFotoPreview();
};
window.editorFotoRotate = function(deg){
  const F = window._fotosState;
  F.transform.rotation = (F.transform.rotation + deg) % 360;
  _redrawFotoPreview();
};
window.editorFotoReset = function(){
  const F = window._fotosState;
  F.transform = {zoom:1.0, offsetX:0, offsetY:0, rotation:0};
  _redrawFotoPreview();
};
window.editorFotoSetZoom = function(v){
  window._fotosState.transform.zoom = parseFloat(v);

// ── Eliminar un club que ya no está en FECHIPO ─────────────────────
// La lista de clubes NO es una lista: se arma de los atletas. Un club figura
// mientras alguien lo tenga puesto, así que "eliminarlo" es vaciarle el club a
// sus atletas — ahí desaparece solo. Los atletas y TODO su historial de
// competencias quedan intactos: solo pierden la referencia al club.
window.clubEliminar=async function(club){
  if(ST.adminInfo?.role!=='owner'&&!ST.adminInfo?.bootstrap){
    showToast('Solo el owner puede eliminar clubes',null,true); return;
  }
  const atletas=(ST.data||[]).filter(a=>a.club===club);
  if(!confirm('Eliminar el club "'+club+'"\n\n'
    +'Se le va a VACIAR el club a '+atletas.length+' atleta(s).\n'
    +'Sus perfiles, resultados y récords NO se tocan: siguen igual, solo quedan sin club.\n\n'
    +'El club desaparece de la lista porque ya no lo tiene nadie.\n\n¿Seguir?'))return;
  if(!confirm('Confirma de nuevo.\n\n'+atletas.length+' atleta(s) van a quedar sin club.\n'
    +'Para revertirlo hay que volver a asignárselo uno por uno.'))return;
  let ok=0,fallaron=[];
  for(const a of atletas){
    try{ a.club=''; await _saveEdit(a); ok++; }
    catch(e){ fallaron.push(a.nombre||a.codigo); console.warn('[clubEliminar]',a.codigo,e); }
  }
  // El logo guardado del club ya no tiene a quién representar
  try{ const slug=window.normClub(club); if((window._CLUBS_FS||{})[slug]) await deleteDoc(doc(db,'clubs',slug)); }catch(e){}
  await logAction('club_eliminado',club,atletas.length+' atletas',null,{atletas:atletas.map(a=>a.codigo).slice(0,80)});
  render();
  if(fallaron.length) showToast('Club eliminado en '+ok+' atleta(s), fallaron '+fallaron.length+': '+fallaron.slice(0,3).join(', '),null,true);
  else showToast('Club "'+club+'" eliminado — '+ok+' atleta(s) quedaron sin club');
};

// Comprime imágenes en el navegador antes de subir a Storage

// ══════════════════════════════════════════════════════════════════
// FOTOS SUDAMERICANO — carga masiva desde una carpeta del PC.
// Evita el ZIP/Drive: los archivos van DIRECTO del PC a Firebase Storage.
// Cada foto se convierte a WebP en el navegador ANTES de subir (pesa ~80%
// menos que el PNG/JPEG original), y se emparejan con la nómina por el
// nombre del archivo. Los chilenos con perfil además reciben la foto en su
// perfil (atleta_fotos); el resto queda solo en su FICHA de la nómina.
// ══════════════════════════════════════════════════════════════════
function _sfNrm(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[ﬁ]/g,'fi').replace(/[ﬂ]/g,'fl')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function _sfSlug(s){ return _sfNrm(s).replace(/\s+/g,'-').slice(0,80); }
function _sfToks(s){ return new Set(_sfNrm(s).split(' ').filter(t=>t.length>1)); }
// Empareja el nombre de archivo con un atleta de la nómina.
// Acepta "Apellido Nombre.jpg", "nombre_apellido.png", con números/prefijos.
function _sfMatch(fileName, pool){
  const base=String(fileName).replace(/\.[^.]+$/,'').replace(/^\d+[\s._-]*/,'');
  const t=_sfToks(base);
  if(!t.size) return {status:'sin-nombre'};
  // Puntaje por CONTENCIÓN: tolera que el archivo traiga apellidos/nombres de más
  // (ej. "Perez Gomez Ana Maria.jpg" para "Perez Gomez Ana"). Exige al menos 2
  // tokens en común (salvo nombres de un solo token) para no casar por el apellido solo.
  let best=null,bestC=0,bestJ=0,tie=false;
  for(const a of pool){
    const inter=[...t].filter(x=>a._toks.has(x)).length;
    if(!inter) continue;
    if(inter<2 && Math.min(t.size,a._toks.size)>1) continue;
    const cont=inter/Math.min(t.size,a._toks.size);
    const jac=inter/Math.max(t.size,a._toks.size);
    if(cont>bestC||(cont===bestC&&jac>bestJ)){best=a;bestC=cont;bestJ=jac;tie=false;}
    else if(cont===bestC&&jac===bestJ&&best&&a.n!==best.n) tie=true;
  }
  if(!best||bestC<0.8) return {status:'sin-match'};
  if(tie) return {status:'ambiguo', a:best, score:bestJ};
  return {status:bestJ>=0.99?'exacto':'probable', a:best, score:bestJ};
}
window.sfPick=async function(inp){
  const files=[...(inp.files||[])].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));
  if(!files.length){showToast('No se encontraron imágenes en la selección',null,true);return;}
  // Nómina: una entrada por atleta (no por inscripción)
  if(!ST.sudaNom){
    try{ ST.sudaNom=await (await fetch('nomina_sudamericano.json?'+Date.now())).json(); }
    catch(e){ showToast('No se pudo leer nomina_sudamericano.json',null,true); return; }
  }
  const byName={};
  (ST.sudaNom.atletas||[]).forEach(a=>{
    const k=_sfNrm(a.n);
    if(!byName[k]) byName[k]={n:a.n,pais:a.pais,cod:a.cod||null,listas:[],_toks:_sfToks(a.n)};
    byName[k].listas.push(a.lista);
  });
  const pool=Object.values(byName);
  ST.sfPool=pool;
  ST.sfItems=files.map(f=>{ const m=_sfMatch(f.name,pool); return {file:f,name:f.name,size:f.size,...m,done:false}; });
  ST.view='sudaFotos'; render();
};
window.sfClear=function(){ ST.sfItems=null; render(); };
// Reasignar a mano un archivo que no matcheó (o quedó ambiguo)
window.sfAssign=function(i,val){
  const it=ST.sfItems[i]; if(!it)return;
  if(!val){ it.a=null; it.status='sin-match'; }
  else { const a=(ST.sfPool||[]).find(x=>x.n===val); if(a){ it.a=a; it.status='manual'; } }
  render();
};
window.sfSkip=function(i){ const it=ST.sfItems[i]; if(it){it.skip=!it.skip;render();} };
window.sfUpload=async function(){
  const items=(ST.sfItems||[]).filter(x=>x.a && !x.skip && !x.done);
  if(!items.length){showToast('No hay fotos emparejadas para subir',null,true);return;}
  if(!confirm('Se van a convertir a WebP y subir '+items.length+' foto(s).\n\nLas chilenas con perfil también se cargan en su perfil.\n\n¿Continuar?'))return;
  ST.sfBusy=true; ST.sfProg={done:0,total:items.length,err:0}; render();
  const storage=getStorage(app);
  for(const it of items){
    try{
      const webp=await compressImg(it.file,900,0.82);   // ← conversión a WebP
      const slug=_sfSlug(it.a.n);
      // Se sube bajo public/: es la ruta que las reglas de Storage ya permiten
      // (lectura pública + escritura de admin). Fuera de public/ la subida era
      // rechazada por permisos — de ahí el error de autenticación.
      const sref=storageRef(storage,'public/nomina_suda/'+slug+'.webp');
      await uploadBytes(sref,webp,{contentType:'image/webp'});
      const url=await getDownloadURL(sref);
      it.url=url; it.outSize=webp.size;
      // Ficha de la nómina (todos los países)
      await setDoc(doc(db,'nomina_suda_fotos',slug),
        {nombre:it.a.n,pais:it.a.pais,foto_url:url,codigo:it.a.cod||null,ts:Date.now()},{merge:true});
      // Chilenos con perfil → también a su perfil YourLift
      if(it.a.cod){
        await setDoc(doc(db,'atleta_fotos',it.a.cod),
          {codigo:it.a.cod,name:it.a.n,foto_url:url,status:'approved',source:'sudamericano_2026',ts:Date.now()},{merge:true});
      }
      it.done=true;
    }catch(e){
      const c=String(e&&e.code||''), m=String(e&&e.message||e);
      it.err=/unauthoriz|permission|denied|unauthenticated/i.test(c+' '+m)
        ? 'Sin permiso — iniciá sesión como admin y reintentá'
        : m;
      ST.sfProg.err++;
    }
    ST.sfProg.done++;
    if(ST.sfProg.done%3===0)render();
  }
  ST.sfBusy=false; render();
  showToast('Listo: '+(ST.sfProg.total-ST.sfProg.err)+' foto(s) subidas'+(ST.sfProg.err?' · '+ST.sfProg.err+' con error':''));
};
function renderSudaFotos(){

  let h=`<div style="margin-bottom:18px"><h2 style="font-family:Oswald;font-size:22px;letter-spacing:1px">FOTOS SUDAMERICANO 2026</h2>
    <p style="color:var(--muted);font-size:12px;margin-top:4px">Elige la carpeta con las fotos. Se convierten a <b style="color:var(--gold)">WebP</b> en tu navegador antes de subir (pesan ~80% menos) y se emparejan solas con la nómina por el nombre del archivo. No hace falta ZIP ni Drive: van directo de tu PC a Firebase.</p></div>`;
  h+=`<div class="card" style="padding:18px;margin-bottom:16px">

        <input type="file" multiple accept="image/*" onchange="sfPick(this)" style="display:none"></label>

  h+=`<div class="card" style="padding:14px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center">

    ${g('ambiguo')?`<span style="color:var(--gold);font-size:12px">⚠ ${g('ambiguo')} ambiguos</span>`:''}
    ${g('sin-match')?`<span style="color:var(--accent);font-size:12px">✕ ${g('sin-match')} sin match</span>`:''}
    <span style="flex:1"></span>
    ${ST.sfBusy
      ? `<span style="font-family:Oswald;color:var(--gold)">Subiendo ${ST.sfProg.done}/${ST.sfProg.total}…</span>`
      : `<button class="btn" onclick="sfUpload()" ${ok?'':'disabled'} style="padding:10px 20px;${ok?'':'opacity:.5'}">Convertir a WebP y subir (${ok})</button>`}
  </div>`;
  const opts=pool.map(a=>a.n).sort();
  h+=`<div class="card" style="padding:0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr style="background:var(--blue)">${['Archivo','Peso','Atleta de la nómina','País','Estado',''].map(t=>`<th style="padding:8px;color:#fff;text-align:left;font-family:Oswald">${t}</th>`).join('')}</tr>`;
  items.forEach((it,i)=>{
    const st=it.done?['✓ subida','var(--green)']

      :it.skip?['omitida','var(--muted)']
      :it.status==='exacto'?['exacto','var(--green)']
      :it.status==='probable'?['probable '+Math.round(it.score*100)+'%','var(--gold)']

          <option value="">— sin asignar —</option>
