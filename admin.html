function renderNominas(){
  // Events from Firebase inscriptions only (Firestore is the source of truth)
  const fbEvents=[...new Set(ST.inscripciones.map(i=>i.evento))].filter(Boolean);
  const allEvents=[...new Set([...fbEvents])];
  if(!ST.filterEv&&allEvents.length)ST.filterEv=allEvents[0];
  // La nómina del Sudamericano llega de FESUPO en un archivo, no por inscripciones:
  // tiene su propia tabla (mismo selector de evento).
  if(ST.filterEv===NS_EV) return renderNomSuda(allEvents);

  const inFirebase=fbEvents.includes(ST.filterEv);
  const hasEventoDoc=ST.eventos.some(e=>e.id===ST.filterEv||e.name===ST.filterEv);
  const needsMetaSync=inFirebase && !hasEventoDoc;

  let filtered;
  if(inFirebase){
    filtered=ST.inscripciones.filter(i=>i.evento===ST.filterEv&&i.status!=='rejected');
    filtered.sort((a,b)=>(a.sortOrder||999)-(b.sortOrder||999));
  }else{
    filtered=[];
  }
  // Mostrar columna "Nacional 2026" (modalidad/lugar + marcas SQ/BP/DL) solo si el evento la pide.
  const _posNacCol = !!(ST.eventos||[]).find(e=>e.id===ST.filterEv)?.posNac2026;
  // Clasificación Sudamericano: 1° = clasificado, 2°/3° = lista de espera
  const _clasifSud = i => { const p=parseInt(i.posNacLugar)||0; return p===1?'clasificado':p===2||p===3?'espera':p>0?'sin':'sin'; };
  if(_posNacCol && ST.filterClasif) filtered=filtered.filter(i=>_clasifSud(i)===ST.filterClasif);
  // Columna "Universidad": si el evento la configuró (extraCols) o si algún inscrito trae universidad (modalidad Universitario).
  const _uniEvObj = (ST.eventos||[]).find(e=>e.id===ST.filterEv||e.name===ST.filterEv);
  const _esUni = x => /universitar/i.test(String((x&&x.division)||'')+' '+String((x&&x.modalidad)||''));
  // Universidad por RUT/nombre desde CUALQUIER inscripción que la tenga (ej. nómina del Nacional Universitario),
  // para rellenar automáticamente a los del Sudamericano (división Universitario) que no la traen.
  const _uNN=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const _uNR=s=>String(s||'').replace(/[^0-9kK]/g,'').toLowerCase();
  const _uByRut={}, _uByName={};
  (ST.inscripciones||[]).forEach(x=>{ if(!x.universidad)return; if(x.rut)_uByRut[_uNR(x.rut)]=x.universidad; if(x.nombre)_uByName[_uNN(x.nombre)]=x.universidad; });
  const _resolveUni=i=> i.universidad || _uByRut[_uNR(i.rut)] || _uByName[_uNN(i.nombre)] || '';
  const _uniCol = (_uniEvObj?.extraCols||[]).includes('universidad') || filtered.some(i=>_resolveUni(i)) || filtered.some(_esUni);

  return `
    <div class="h1">Nóminas</div>
    <p class="subtitle">Edita inscripciones · ${filtered.length} atletas en evento seleccionado</p>
    <div class="search-box">
      <select class="inp" onchange="ST.filterEv=this.value;ST.filterClasif='';render()">
        ${allEvents.map(e=>`<option value="${e}" ${ST.filterEv===e?'selected':''}>${e}</option>`).join('')}
        <option value="${NS_EV}">Sudamericano 2026 — nómina FESUPO</option>
      </select>
      ${_posNacCol?`<select class="inp" style="max-width:190px" onchange="ST.filterClasif=this.value;render()">
        <option value="">Todos</option>
        <option value="clasificado" ${ST.filterClasif==='clasificado'?'selected':''}>✓ Clasificados</option>
        <option value="espera" ${ST.filterClasif==='espera'?'selected':''}>⏳ Lista de espera</option>
        <option value="sin" ${ST.filterClasif==='sin'?'selected':''}>— Sin clasificar</option>
      </select>`:''}
      ${inFirebase?`<button class="btn btn-b" onclick="sortNominaByEvent('${ST.filterEv}')">⇅ ORDENAR</button>`:''}
      <button class="btn btn-g" onclick="openInscribirModal()" style="padding:8px 16px;font-size:12px">Inscribir atleta</button>
      <button id="btnExportNomina" class="btn btn-b" onclick="exportNominaExcel()" style="padding:8px 16px;font-size:12px">Exportar Excel</button>
      <button id="btnExportDocs" class="btn btn-b" onclick="exportNominaDocsZip()" style="padding:8px 16px;font-size:12px" title="ZIP con una carpeta por atleta (con su nombre) y adentro sus documentos subidos">Descargar Docs (ZIP)</button>
      <button id="btnExportFotos" class="btn btn-b" onclick="exportNominaFotosZip()" style="padding:8px 16px;font-size:12px" title="ZIP con las fotos de perfil de todos los atletas inscritos, convertidas a JPG (formato que piden IPF/goodlift)">Descargar Fotos (ZIP · JPG)</button>
      <button id="btnExportPaquete" class="btn btn-b" onclick="exportPaqueteInternacionalZip()" style="padding:8px 16px;font-size:12px;background:rgba(212,168,67,.12);border-color:#D4A843;color:#D4A843" title="ZIP con una carpeta por atleta: foto fondo blanco (JPEG, garantizada) + Consentimiento IPF (PDF) + WADA (PDF). Para envíos a la federación internacional (ej. Sudamericano). Al final avisa qué atletas están incompletos.">Paquete Internacional (ZIP)</button>
    </div>
    ${needsMetaSync?'<div class="card" style="background:rgba(212,168,67,.08);border-color:rgba(212,168,67,.3);padding:12px 16px;margin-bottom:12px"><span style="color:var(--gold);font-size:12px">Las inscripciones están en Firebase pero falta el doc de evento en <code>eventos/</code>. Sin eso no puedes editar fecha/cierre/ubicación desde <b>Campeonatos</b>. Creá el evento desde el panel de Campeonatos.</span></div>':''}
    <div class="card" style="padding:0;overflow-x:auto">
      ${_cupoSelectorHtml()}
      <table class="tbl">
        <tr><th>#</th><th>Nombre</th><th>Sexo</th><th>División</th><th>Cat.</th><th>Modalidad</th><th>Club</th><th title="Comuna / Región">Zona</th><th title="Correo que dejó el atleta al inscribirse. Solo lo ve el panel: no está en la lista pública.">Correo</th>${_uniCol?'<th title="Universidad del atleta (modalidad Universitario)">Universidad</th>':''}${_posNacCol?'<th title="Posición y marcas del Nacional 2026">Nacional 2026</th>':''}${_posNacCol?'<th title="Clasificación Sudamericano">Clasif. Sud.</th>':''}<th title="Si ya compitió este año, según los resultados cargados en YourLift">Compitió</th><th title="Documentos subidos">Docs</th><th>Estado</th><th></th></tr>
        ${filtered.map((i,idx)=>{
          const editable=!i._json;
          const click=(f)=>editable?`onclick="editInsc('${i.id}','${f}')"`:'';
          const cls=editable?'editable':'';
          const sid=encodeURIComponent(i.id||'');
          // Datos privados (carnet + WADA): solo si la inscripción es de Firebase
          const priv = editable ? (ST.inscripcionesPrivate?.[i.id]||{}) : {};
          // Detectar si tiene perfil en data.json o en atletas_pending
          const rutNormRow=s=>String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();
          const tienePerfilRow=!!(ST.data||[]).find(a=>rutNormRow(a.rut)===rutNormRow(i.rut));
          const sinPerfilBtn=editable&&!tienePerfilRow?`<button onclick="crearPerfilDebutante('${sid}')" style="background:transparent;border:1px solid rgba(212,168,67,.5);color:var(--gold);padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;font-family:Oswald;white-space:nowrap" title="Crear perfil de debutante">★ Perfil</button>`:'';
          // Contar docs subidos (mapa nuevo `docs` + URLs legacy)
          const docKeys = ['carnetURL','wadeURL','carnetPhotoURL','consentimientoURL','passportURL','ipfConsentURL','notasURL'];
          let docCount = 0;
          docKeys.forEach(k=>{if(priv[k])docCount++});
          if(priv.docs && typeof priv.docs==='object'){
            // Contar los del map que no estén ya contados via legacy
            const docsMapCount = Object.keys(priv.docs).length;
            docCount = Math.max(docCount, docsMapCount);
          }
          const docsCell = docCount>0
            ? `<button onclick="viewInsDocs('${sid}')" title="Ver todos los documentos subidos" style="display:inline-block;padding:4px 10px;background:rgba(34,197,94,.12);border:1px solid var(--green);color:var(--green);border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;font-family:Oswald">Ver (${docCount})</button>`
            : `<span style="color:var(--muted);font-size:11px;opacity:.5">—</span>`;
          return `<tr>
            <td style="color:var(--muted);font-family:Oswald">${idx+1}</td>
            <td>${esc(i.nombre)}<br><span style="font-size:9px;color:var(--muted)">${esc(i.rut||'')}</span></td>
            <td><span class="${cls}" ${click('sexo')}>${esc(i.sexo||'?')}</span></td>
            <td><span class="${cls}" ${click('division')}>${esc(i.division||'—')}</span></td>
            <td><span class="${cls}" ${click('categoria')}>${esc(i.categoria||'—')}</span></td>
            <td><span class="${cls}" ${click('modalidad')}>${esc(i.modalidad||'—')}</span></td>
            ${(()=>{
              // Si el atleta eligió "Otro" en el formulario, el nombre real del
              // club quedó en clubOtro (p.ej. "Wolf Strength"). Mostrar ese y
              // editar ese campo, no la etiqueta "Otro".
              const isOtro=i.club==='Otro';
              const eclub=isOtro?(i.clubOtro||'Otro'):(i.club||'');
              const fld=isOtro?'clubOtro':'club';
              return `<td><span class="${cls}" ${click(fld)} style="display:inline-flex;align-items:center;gap:5px">${window.clubLogoImg?window.clubLogoImg(eclub,18,'background:var(--bg);padding:1px;'):''}${esc(eclub||'—')}</span></td>`;
            })()}
            <td style="font-size:11px;color:var(--muted);max-width:160px"><span class="${cls}" ${click('comuna')} title="${esc(i.comuna||'')}">${esc(i.comuna||'—')}</span></td>
            ${/* El correo vive en inscripciones_private, que solo lee un admin:
                  la colección pública no lo tiene, justamente para que no quede
                  a la vista de cualquiera. Se muestra acá y se puede copiar de
                  un click, que es para lo que se necesita. */''}
            <td style="font-size:11px;max-width:190px">${priv.correo
              ? `<span onclick="copiarCorreo('${esc(priv.correo)}')" title="Click para copiar — ${esc(priv.correo)}" style="cursor:pointer;color:var(--blue);border-bottom:1px dashed rgba(96,165,250,.5);display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom">${esc(priv.correo)}</span>`
              : '<span style="color:var(--muted)">—</span>'}</td>
            ${_uniCol?('<td style="font-size:11px"><span class="'+cls+'" '+click('universidad')+'>'+esc(_resolveUni(i)||'—')+'</span></td>'):''}
            ${_posNacCol?('<td style="font-size:11px;white-space:nowrap">'
              +(i.posNacLugar?('<b style="color:var(--gold)">'+esc(i.posNacMod||'')+' '+esc(i.posNacLugar)+'°</b>'):'<span style="color:var(--muted);opacity:.5">—</span>')
              +((i.posNacSQ||i.posNacBP||i.posNacDL)?('<br><span style="color:var(--muted)">SQ '+esc(i.posNacSQ||'-')+' · BP '+esc(i.posNacBP||'-')+' · DL '+esc(i.posNacDL||'-')+' · <b style="color:var(--text)">T '+esc(i.posNacTotal||(((parseFloat(i.posNacSQ)||0)+(parseFloat(i.posNacBP)||0)+(parseFloat(i.posNacDL)||0))||'-'))+'</b></span>'):'')
              +'</td>'):''}
            ${_posNacCol?(()=>{const cl=_clasifSud(i);return cl==='clasificado'?'<td style="white-space:nowrap"><span style="color:var(--green);font-weight:700;font-size:11px">✓ CLASIFICADO</span></td>':cl==='espera'?'<td style="white-space:nowrap"><span style="color:var(--orange);font-size:11px;font-weight:600">⏳ Lista espera</span></td>':'<td><span style="color:var(--muted);font-size:11px;opacity:.4">—</span></td>';})():''}
            <td style="text-align:center">${_marcaCompitio(_hCargando()?[]:_histDe(i.rut,i.nombre),'nom_'+i.id,_hCargando(),(ST.apprHist||{})['nom_'+i.id])}</td>
            <td style="text-align:center">${docsCell}</td>
            <td><span class="badge ${i.status==='approved'?'b-g':i.status==='pending'?'b-y':'b-r'}">${esc(i.status||'approved')}</span></td>
            <td style="white-space:nowrap">${sinPerfilBtn}${editable?`<button onclick="deleteInsc('${sid}')" style="background:transparent;border:1px solid rgba(239,68,68,.3);color:var(--red);padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;font-family:Oswald;margin-left:4px" title="Eliminar">✕</button>`:''}</td>
          </tr>${(()=>{
            const _h=_hCargando()?[]:_histDe(i.rut,i.nombre);
            if(!_h.length||!(ST.apprHist||{})['nom_'+i.id])return '';
            return `<tr><td colspan="20" style="background:rgba(10,22,40,.55);padding:10px 14px">${_detalleHist(_h,_histAnio().anio)}</td></tr>`;
          })()}`;
        }).join('')}
      </table>
      ${filtered.length===0?'<div class="empty">Sin atletas en este evento</div>':''}
    </div>`;
}

// ══════════════════════════════════════════════════════════════════
// NÓMINA SUDAMERICANO 2026 — editor
// La nómina la manda FESUPO en un Excel y vive en un archivo estático
// (nomina_sudamericano.json), no en `inscripciones`. Cuando llega un dato mal
// (categoría equivocada, división, modalidad, alguien que se bajó), en vez de
// regenerar el archivo se guarda una CORRECCIÓN en Firestore
// (nomina_suda_edits/main → items) y yourlift.cl la aplica encima del archivo.
// Así el archivo original sigue siendo el espejo fiel de lo que mandó FESUPO.
// Clave de cada inscripción: slug(nombre)~slug(lista original) — verificado
// único para las 633. Es la MISMA que usa index.html.
// ══════════════════════════════════════════════════════════════════
const NS_EV='__nomina_sudamericano__';
function nsKey(a){ return _sfSlug(a.n)+'~'+_sfSlug(a._lista0||a.lista); }
async function nsLoad(){
  if(ST.nsLoading)return; ST.nsLoading=true;
  try{
    if(!ST.sudaNom) ST.sudaNom=await (await fetch('nomina_sudamericano.json?'+Date.now())).json();
    if(!ST.nsEdits){
      try{ const s=await getDoc(doc(db,'nomina_suda_edits','main')); ST.nsEdits=(s.exists()&&s.data().items)||{}; }
      catch(e){ ST.nsEdits={}; }
    }
    ST.nsDirty=false;
  }catch(e){ ST.nsErr=e.message; }
  ST.nsLoading=false; render();
}
// Valor vigente de un campo (corrección si la hay, si no lo del archivo)
function nsVal(a,f){ const e=(ST.nsEdits||{})[nsKey(a)]; return (e&&e[f]!==undefined&&e[f]!=='')?e[f]:(a[f]||''); }
function nsDel(a){ const e=(ST.nsEdits||{})[nsKey(a)]; return !!(e&&e.del); }
function nsHasEdit(a){ const e=(ST.nsEdits||{})[nsKey(a)]; return !!(e&&Object.keys(e).length); }
window.nsSet=function(k,f,v){
  const ed=ST.nsEdits||(ST.nsEdits={});
  const a=(ST.sudaNom.atletas||[]).find(x=>nsKey(x)===k); if(!a)return;
  const e=ed[k]||(ed[k]={});
  if(String(v).trim()===String(a[f]||'').trim()) delete e[f];        // volvió al original
  else e[f]=String(v).trim();
  if(!Object.keys(e).length) delete ed[k];
  ST.nsDirty=true; render();
};
window.nsToggleDel=function(k){
  const ed=ST.nsEdits||(ST.nsEdits={});
  const e=ed[k]||(ed[k]={});
  if(e.del) delete e.del; else e.del=true;
  if(!Object.keys(e).length) delete ed[k];
  ST.nsDirty=true; render();
};
window.nsReset=function(k){ if(ST.nsEdits) delete ST.nsEdits[k]; ST.nsDirty=true; render(); };
window.nsResetAll=function(){
  const n=Object.keys(ST.nsEdits||{}).length;
  if(!n){showToast('No hay correcciones para deshacer');return;}
  if(!confirm('¿Descartar las '+n+' corrección(es) y dejar la nómina tal cual la mandó FESUPO?\n\nSe guarda al tocar Guardar.'))return;
  ST.nsEdits={}; ST.nsDirty=true; render();
};
window.nsSave=async function(){
  ST.nsBusy=true; render();
  try{
    await setDoc(doc(db,'nomina_suda_edits','main'),{items:ST.nsEdits||{},ts:Date.now(),by:(ST.adminInfo?.email||'')},{merge:false});
    ST.nsDirty=false;
    showToast('✓ Nómina actualizada — se ve en yourlift.cl en unos minutos');
  }catch(e){ showToast('No se pudo guardar: '+e.message,null,true); }
  ST.nsBusy=false; render();
};
let _nsQT=null;
window.nsFilter=function(f,v){
  ST.nsF=Object.assign({},ST.nsF||{},{[f]:v});
  // La tabla son 633 filas con selects: redibujar en cada tecla se siente
  // pesado, así que el buscador espera a que dejes de escribir. Después del
  // render hay que devolverle el foco al input, que se rehizo.
  if(f==='q'){
    if(_nsQT)clearTimeout(_nsQT);
    _nsQT=setTimeout(()=>{ render();
      const i=document.getElementById('nsQ'); if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}
    },280);
    return;
  }
  render();
};
window.nsVerTodas=function(){ ST.nsAll=true; render(); };
// Selector de evento (el mismo de Nóminas) para poder volver a las otras nóminas
function nsEvSelect(allEvents){
  return `<select class="inp" onchange="ST.filterEv=this.value;ST.filterClasif='';render()">
    ${(allEvents||[]).map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join('')}
    <option value="${NS_EV}" selected>Sudamericano 2026 — nómina FESUPO</option>
  </select>`;
}
function renderNomSuda(allEvents){
  if(!ST.sudaNom||!ST.nsEdits){ nsLoad(); return `<div class="h1">Nóminas</div>
    <div class="search-box">${nsEvSelect(allEvents)}</div>
    <div style="padding:30px;text-align:center;color:var(--muted)">Cargando la nómina del Sudamericano…${ST.nsErr?'<br><span style="color:var(--red)">'+esc(ST.nsErr)+'</span>':''}</div>`; }
  const all=ST.sudaNom.atletas||[];
  const F=ST.nsF||{};
  const uniq=f=>[...new Set(all.map(a=>String(a[f]||'')).filter(Boolean))].sort();
  const listas=uniq('lista'), divs=uniq('div'), mods=uniq('mod'), cats=uniq('cat');
  const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let rows=all;
  if(F.lista) rows=rows.filter(a=>nsVal(a,'lista')===F.lista);
  if(F.q){ const q=nrm(F.q); rows=rows.filter(a=>nrm(a.n).includes(q)||nrm(a.pais).includes(q)); }
  if(F.solo==='edit') rows=rows.filter(nsHasEdit);
  if(F.solo==='baja') rows=rows.filter(nsDel);
  const nEd=Object.keys(ST.nsEdits||{}).length;
  const nBaja=all.filter(nsDel).length;
  const vivos=all.length-nBaja;
  const personas=new Set(all.filter(a=>!nsDel(a)).map(a=>nrm(a.n)+'|'+a.sexo)).size;

  const sel=(a,f,opts)=>{
    const k=nsKey(a), v=nsVal(a,f), ch=v!==String(a[f]||'');
    const list=opts.includes(v)?opts:[v,...opts];
    return `<select onchange="nsSet('${k}','${f}',this.value)" style="max-width:170px;padding:4px 6px;border-radius:6px;border:1px solid ${ch?'var(--gold)':'var(--border)'};background:${ch?'rgba(212,168,67,.10)':'#0a1628'};color:${ch?'var(--gold)':'var(--text)'};font-size:11px">
      ${list.map(o=>`<option value="${esc(o)}"${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  };

  let h=`<div class="h1">Nóminas</div>
  <p class="subtitle">Nómina oficial del Sudamericano (FESUPO) · ${vivos} inscripciones · ${personas} atletas</p>
  <div class="card" style="padding:14px 16px;margin-bottom:14px;background:rgba(212,168,67,.06);border-color:rgba(212,168,67,.28)">
    <div style="font-size:12px;color:var(--muted);line-height:1.55">Esta nómina no son inscripciones de YourLift: la manda FESUPO. Acá corregís <b style="color:var(--gold)">categoría, división, modalidad y lista</b>, o das de baja a alguien, sin tocar el archivo original. Los cambios se publican en yourlift.cl al tocar <b>Guardar</b>. Siempre puedes volver un dato a como venía.</div>
  </div>`;

  h+=`<div class="search-box">
    ${nsEvSelect(allEvents)}
    <select class="inp" onchange="nsFilter('lista',this.value)">
      <option value="">Todas las listas (${all.length})</option>
      ${listas.map(l=>`<option value="${esc(l)}"${F.lista===l?' selected':''}>${esc(l)} (${all.filter(a=>nsVal(a,'lista')===l).length})</option>`).join('')}
    </select>
    <select class="inp" style="max-width:190px" onchange="nsFilter('solo',this.value)">
      <option value="">Todos</option>
      <option value="edit"${F.solo==='edit'?' selected':''}>Solo corregidos (${nEd})</option>
      <option value="baja"${F.solo==='baja'?' selected':''}>Solo dados de baja (${nBaja})</option>
    </select>
    <input id="nsQ" class="inp" placeholder="Buscar por nombre o país…" value="${esc(F.q||'')}" oninput="nsFilter('q',this.value)" style="max-width:260px">
    <button class="btn ${ST.nsDirty?'btn-g':'btn-b'}" onclick="nsSave()" ${ST.nsBusy||!ST.nsDirty?'disabled':''} style="padding:8px 18px;font-size:12px;${ST.nsBusy||!ST.nsDirty?'opacity:.5':''}">${ST.nsBusy?'Guardando…':'Guardar cambios'}</button>
    ${nEd?`<button class="btn btn-r" onclick="nsResetAll()" style="padding:8px 14px;font-size:12px">Descartar todo</button>`:''}
  </div>`;

  if(ST.nsDirty)h+=`<div class="card" style="padding:10px 14px;margin-bottom:12px;background:rgba(212,168,67,.10);border-color:var(--gold)"><span style="color:var(--gold);font-size:12px">Hay cambios sin guardar. Tocá <b>Guardar cambios</b> para que se vean en el sitio.</span></div>`;

  // Tope de filas: 633 filas con selects tardan en dibujarse. Con filtro o
  // búsqueda casi nunca se llega al tope; si igual lo quieres todo, está el botón.
  const TOPE=200, recortado=!ST.nsAll&&rows.length>TOPE;
  if(recortado){
    h+=`<div class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--muted)">Mostrando ${TOPE} de ${rows.length}. Filtrá por lista o buscá el nombre para llegar más rápido.</span>
      <button class="btn btn-b" onclick="nsVerTodas()" style="padding:6px 14px;font-size:11px">Ver las ${rows.length}</button></div>`;
    rows=rows.slice(0,TOPE);
  }
  h+=`<div class="card" style="padding:0;overflow-x:auto"><table class="tbl">
    <tr><th>#</th><th>Atleta</th><th>País</th><th>Cat.</th><th>División</th><th>Modalidad</th><th>Lista</th><th title="Marcas nominadas">SQ / BP / DL</th><th></th></tr>`;
  rows.forEach((a,idx)=>{
    const k=nsKey(a), baja=nsDel(a), ed=nsHasEdit(a);
    h+=`<tr style="${baja?'opacity:.42':''}">
      <td style="color:var(--muted);font-family:Oswald">${idx+1}</td>
      <td style="min-width:190px">${esc(a.n)}${baja?' <span style="color:var(--red);font-size:10px;font-family:Oswald">DE BAJA</span>':''}
        <br><span style="font-size:9px;color:var(--muted)">${a.born||''}${a.cod?' · '+esc(a.cod):''}</span></td>
      <td style="font-size:11px;color:var(--muted);white-space:nowrap">${esc(a.pais||'')}</td>
      <td><input value="${esc(nsVal(a,'cat'))}" onchange="nsSet('${k}','cat',this.value)" list="nsCats" style="width:72px;padding:4px 6px;border-radius:6px;border:1px solid ${nsVal(a,'cat')!==(a.cat||'')?'var(--gold)':'var(--border)'};background:${nsVal(a,'cat')!==(a.cat||'')?'rgba(212,168,67,.10)':'#0a1628'};color:${nsVal(a,'cat')!==(a.cat||'')?'var(--gold)':'var(--text)'};font-size:11px"></td>
      <td>${sel(a,'div',divs)}</td>
      <td>${sel(a,'mod',mods)}</td>
      <td>${sel(a,'lista',listas)}</td>
      <td style="font-size:11px;color:var(--muted);white-space:nowrap">${a.sq||'-'} / ${a.bp||'-'} / ${a.dl||'-'}</td>
      <td style="white-space:nowrap">
        ${ed?`<button onclick="nsReset('${k}')" title="Volver a como lo mandó FESUPO" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;font-family:Oswald">↺</button> `:''}
        <button onclick="nsToggleDel('${k}')" title="${baja?'Volver a la nómina':'Sacar de la nómina'}" style="background:transparent;border:1px solid ${baja?'var(--green)':'rgba(239,68,68,.35)'};color:${baja?'var(--green)':'var(--red)'};padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;font-family:Oswald">${baja?'Reponer':'✕'}</button>
      </td></tr>`;
  });
  h+=`</table>${rows.length?'':'<div class="empty">Sin resultados con esos filtros</div>'}</div>
  <datalist id="nsCats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
  return h;
}

// ═══════════════════════════════════════════════════════════════
// ¿YA COMPITIÓ ESTE AÑO?  —  columna de la revisión de inscripciones
// ═══════════════════════════════════════════════════════════════
// Un atleta puede correr UN SOLO regional por año. Hasta ahora eso se controlaba
// de memoria, o abriendo el perfil de cada uno: con dos regionales abriendo
// inscripciones al mismo tiempo, es cuestión de tiempo que se cuele alguien.
//
// El dato ya lo tenemos: cada campeonato cerrado desde el livecast deja sus
// resultados en competition_results, con RUT. Así que la columna no inventa nada,
// solo mira lo que ya está guardado.
//
// Se cruza por RUT. Si el RUT no calza —o la inscripción vino sin RUT— se prueba
// por nombre normalizado, que es peor pero mejor que no avisar.
function _hRut(s){return String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();}
function _hNom(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
// Al principio esto separaba los regionales del resto, dando por hecho que el
// Debutantes no gastaba cupo. No es así: también lo gasta. Así que la marca es
// una sola —compitió o no compitió— y en qué compitió se ve abriendo el ✓, que es
// donde la comisión tiene el detalle para decidir.
function _esRegional(ev){return /regional/i.test(String(ev||''));}
// Clave para saber si dos líneas son el MISMO campeonato escrito distinto. En los
// datos conviven "Regional Centro 2026" y "Campeonato Regional Centro FECHIPO
// 2026": son el mismo torneo, y sin esto el atleta aparecería compitiendo dos
// veces. Se sacan las palabras de relleno y las tarimas, y queda lo que identifica
// al campeonato. "Regional Centro" y "Regional Centro Sur" siguen siendo distintos.
function _evClave(ev){
  return String(ev||'')
    .replace(/\s*[-–]\s*Tarima\s*\d+\s*$/i,'')
    .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\b(campeonato|fechipo|torneo|de|del|cd)\b/g,' ')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
// ── Qué campeonatos cuentan ──────────────────────────────────────────────────
// Al principio esto era "los de este año", calculado del calendario. Sirve para
// arrancar, pero el sistema va a estar corriendo muchos años y el circuito no
// siempre calza con el año calendario: hay campeonatos que no gastan cupo, otros
// que sí, y temporadas que cruzan diciembre. Así que la lista se puede elegir a
// mano desde el panel y queda guardada.
//
// Sin nada elegido se sigue comportando como antes —los del año en curso— para
// que funcione sin configurar nada. Los campeonatos que aparezcan DESPUÉS de
// guardar salen marcados como nuevos, para que no se cuelen sin que nadie decida.
function _cupoCfg(){ return ST.cupoCfg||null; }
function _cuentaEvento(evento,anioEv,anioActual){
  const cfg=_cupoCfg();
  if(cfg&&Array.isArray(cfg.seleccionados))return cfg.seleccionados.indexOf(_evClave(evento))>=0;
  return anioEv===anioActual;
}
async function cargarCupoCfg(){
  try{
    const s=await getDoc(doc(db,'config','participacion'));
    ST.cupoCfg=s.exists()?s.data():null;
  }catch(e){ ST.cupoCfg=null; }
  window._HIST_ANIO=null;
}
window.cupoToggle=function(clave){
  const H=_histAnio();
  const actuales=(_cupoCfg()&&_cupoCfg().seleccionados)||H.delAnio;
  const s=new Set(actuales);
  if(s.has(clave))s.delete(clave); else s.add(clave);
  ST.cupoCfg=Object.assign({},ST.cupoCfg||{},{seleccionados:[...s]});
  window._HIST_ANIO=null;
  render();
};
window.cupoGuardar=async function(){
  const H=_histAnio();
  const sel=(_cupoCfg()&&_cupoCfg().seleccionados)||H.delAnio;
  try{
    await setDoc(doc(db,'config','participacion'),
      {seleccionados:sel,vistos:H.todos.map(x=>x.clave),ts:new Date().toISOString(),por:ST.user?.email||''});
    ST.cupoCfg={seleccionados:sel,vistos:H.todos.map(x=>x.clave)};
    window._HIST_ANIO=null;
    showToast('Campeonatos guardados: '+sel.length+' cuentan para el control');
    render();
  }catch(e){ showToast('No se pudo guardar: '+e.message,null,true); }
};
window.cupoVolverAlAnio=function(){
  ST.cupoCfg=null; window._HIST_ANIO=null;
  setDoc(doc(db,'config','participacion'),{seleccionados:null,ts:new Date().toISOString()}).catch(()=>{});
  render();
};
window.cupoPanel=function(){ ST.cupoPanelOpen=!ST.cupoPanelOpen; render(); };

function _histAnio(){
  if(window._HIST_ANIO)return window._HIST_ANIO;
  const anio=String(new Date().getFullYear());
  const porRut={}, porNom={};
  const meter=(rut,nombre,it)=>{
    const k=_hRut(rut); if(k)(porRut[k]=porRut[k]||[]).push(it);
    const n=_hNom(nombre); if(n)(porNom[n]=porNom[n]||[]).push(it);
  };
  // Catálogo de TODO lo que aparece, para poder ofrecerlo en el selector.
  const catalogo={};
  const anioDe=(evento,fecha)=>
    String(fecha||'').slice(0,4)||(String(evento||'').match(/\b(20\d\d)\b/)||[])[1]||'';
  const cuenta=(evento,fecha)=>{
    const a=anioDe(evento,fecha);
    const clave=_evClave(evento);
    const c=catalogo[clave]||(catalogo[clave]={clave,nombre:evento||'',anio:a,n:0,conRes:false});
    c.n++;
    if((evento||'').length>c.nombre.length)c.nombre=evento;
    if(!c.anio&&a)c.anio=a;
    return _cuentaEvento(evento,a,anio);
  };
  // `compitio` separa al que estuvo en la tarima del que solo quedó anotado.
  // Inscribirse y después bajarse deja un registro sin resultado, y eso no es
  // haber competido: el cupo de la temporada no se gasta con la inscripción.
  const compitioDe=(r)=>{
    if(!r)return false;
    if(String(r.status||'').toUpperCase()==='DQ')return true;
    return (r.total||0)>0||(r.sq||0)>0||(r.bp||0)>0||(r.dl||0)>0;
  };
  const arma=(evento,fecha,categoria,division,modalidad,r,forzado)=>({
    evento:evento||'',fecha:String(fecha||''),regional:_esRegional(evento),
    categoria:categoria||'',division:division||'',modalidad:modalidad||'',
    compitio:forzado===true||compitioDe(r),
    total:(r||{}).total||0,estado:(r||{}).status||''});

  // 1) Lo cerrado desde el livecast.
  (ST.allCompResults||[]).forEach(d=>{
    if(!cuenta(d.evento,d.fecha))return;
    // Lo que sale del livecast al cerrar la competencia es, por definición, gente
    // que estuvo en la tarima: solo se publica a quien tiene total o quedó DQ.
    meter(d.rut,d.nombre,arma(d.evento,d.fecha,d.categoria,d.division,d.modalidad,d.resultado,true));
  });
  // 2) Y el histórico publicado (data.json). Sin esto faltaba el Campeonato
  //    Nacional 2026 de San Vicente, que nunca pasó por competition_results: los
  //    214 atletas que compitieron ahí salían con una ✗ como si no hubieran
  //    competido en todo el año.
  (ST.data||[]).forEach(a=>{
    (a.competencias||[]).forEach(c=>{
      if(!cuenta(c.evento,c.fecha))return;
      meter(a.rut,a.nombre,arma(c.evento,c.fecha,c.categoria,c.division,c.modalidad,c.resultado));
    });
  });
  // De qué campeonatos hay constancia de que alguien compitió. Sirve para saber
  // si de un campeonato tenemos resultados o solo la nómina: si solo hay nómina,
  // no se puede distinguir al que se bajó y no conviene dar a nadie por ausente.
  Object.keys(porRut).forEach(k=>porRut[k].forEach(it=>{
    const c=catalogo[_evClave(it.evento)];
    if(c&&it.compitio)c.conRes=true;
  }));
  // 3) Las inscripciones que siguen en pie. Es lo que separa al que participó del
  //    que se anotó y después se bajó: en data.json los dos quedan igual —una
  //    línea del campeonato sin resultado— y solo el que participó conserva su
  //    inscripción. Es lo que el perfil del atleta muestra como "inscripciones
  //    activas". Una rechazada no cuenta.
  (ST.inscripciones||[]).forEach(i=>{
    if(i.status==='rejected')return;
    const ev=(ST.eventos||[]).find(e=>e.id===i.evento);
    const nombre=(ev&&ev.name)||i.evento||'';
    if(!cuenta(nombre,''))return;
    meter(i.rut,i.nombre,arma(nombre,'',i.categoria,i.division,i.modalidad,null,true));
  });
  const todos=Object.values(catalogo).sort((a,b)=>
    String(b.anio).localeCompare(String(a.anio))||a.nombre.localeCompare(b.nombre));
  const delAnio=todos.filter(x=>x.anio===anio).map(x=>x.clave);
  return (window._HIST_ANIO={anio,porRut,porNom,todos,delAnio});
}
// Devuelve los campeonatos de este año de una persona, sin repetir. El Debutantes
// vino partido en "Tarima 1" y "Tarima 2": es un solo campeonato en dos tarimas,
// así que se junta para no mostrarlo dos veces.
function _histDe(rut,nombre){
  const H=_histAnio();
  let arr=H.porRut[_hRut(rut)];
  if(!arr||!arr.length)arr=H.porNom[_hNom(nombre)];
  if(!arr)return [];
  // Un campeonato por línea. Se junta el Debutantes, que vino partido en dos
  // tarimas, y las dos escrituras del mismo torneo entre las dos fuentes. De cada
  // grupo se muestra el nombre más completo y la fecha que exista.
  const porClave={};
  arr.forEach(it=>{
    const base=it.evento.replace(/\s*[-–]\s*Tarima\s*\d+\s*$/i,'').trim();
    const k=_evClave(it.evento);
    const y=porClave[k];
    if(!y){porClave[k]=Object.assign({},it,{evento:base});return;}
    if(it.compitio)y.compitio=true;
    if(base.length>y.evento.length)y.evento=base;
    if(!y.fecha&&it.fecha)y.fecha=it.fecha;
    if(!y.total&&it.total)y.total=it.total;
    if(!y.categoria&&it.categoria)y.categoria=it.categoria;
    if(!y.division&&it.division)y.division=it.division;
    if(!y.modalidad&&it.modalidad)y.modalidad=it.modalidad;
  });
  // Si del campeonato solo tenemos la nómina, no hay con qué distinguir: se deja
  // como participación, igual que antes. La duda se resuelve cuando se cargan sus
  // resultados.
  Object.keys(porClave).forEach(k=>{
    const cat=(H.todos||[]).find(c=>c.clave===k);
    if(cat&&!cat.conRes)porClave[k].compitio=true;
  });
  return Object.values(porClave).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
}
// ── Orden de prioridad cuando hay menos cupos que inscritos ──────────────────
// Es el reglamento, no un cálculo: va como recordatorio para la comisión técnica
// y NO dice en qué punto cae cada atleta. Eso lo resuelve la comisión mirando el
// caso; el sistema no tiene cómo saber, por ejemplo, si alguien quiere bajar de
// categoría o de qué organización viene.
// Si el reglamento cambia, se edita acá y cambia en todas partes.
// Texto LITERAL del Anexo 3 del Compendio de Normas de Clasificación FECHIPO
// 2026. Se copia tal cual a propósito: es normativa, y una paráfrasis por bien
// intencionada que sea puede cambiarle el sentido a un punto. Ya pasó — el punto
// 2 estaba escrito al revés ("se consideran" en vez de "no considera"), que es
// justo el error capaz de dejar entrar a quien no correspondía.
const PRIORIDAD_CUPOS=[
  'Atletas debutantes sin registro de participación de ninguna organización diferente a la IPF y reconocidas por la WADA como federación firmante.',
  'Atletas que ya han competido pero que no tienen registro en el actual circuito competitivo (ranking). Este punto no considera a los atletas que compitieron y fueron descalificados en alguna competencia durante el año.',
  'Atletas debutantes que han cumplido su período de restricción de participación según el Anexo 2, por ingreso desde organización de Powerlifting o fuera del reconocimiento de la WADA.',
  'Atletas que durante el año compitieron y fueron descalificados en modalidad powerlifting u only bench classic o equipado según corresponda.',
  'Atletas cuyo último registro competitivo fue el Campeonato Nacional (hasta el Segundo lugar).',
  'Atletas campeones de su categoría en el último Campeonato Nacional.',
  'Atletas cuyo último registro competitivo fue en un evento internacional y competirán en la misma categoría de peso.',
  'Atletas que compitieron y desean bajar de categoría de peso corporal respecto a la de su última competencia en Campeonato nacional o internacional.',
  'Atletas que compitieron y desean subir de categoría de peso corporal respecto a la de su última competencia en Campeonato nacional o internacional, pero sin convalidar el total registrado a una nueva categoría de peso corporal.',
];
const PRIORIDAD_NOTA='De lo anterior en el punto 7, 8 y 9, quedará a criterio de la Comisión Técnica y del organizador del evento deportivo, considerando la disposición de cupos totales para el evento, volumen de inscritos según prioridad y factibilidad de tiempo/costos.';
// Los cupos son la razón por la que existe la priorización, así que van al lado.
const PRIORIDAD_CUPOS_TOPE='Máximo por torneo: 65 atletas de Powerlifting / Powerlifting+Only Bench por día, en dos grupos AM/PM de 32 a 33, con un máximo de 14 por tanda · 6 a 10 de Only Bench por día, en la tanda de banca de su categoría · 71 en total, que puede variar hasta un 15% según el cronograma que la organización presente a la Comisión Técnica.';
function _prioridadHtml(){
  return `<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(212,168,67,.28)">
    <div style="font-family:Oswald;font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-bottom:3px">ORDEN DE PRIORIDAD SI FALTAN CUPOS · ANEXO 3</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.5">Texto literal del Compendio de Normas de Clasificación FECHIPO 2026. <b>No dice en qué punto cae este atleta</b> — eso lo define la comisión técnica.</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:8px;line-height:1.5;padding:6px 9px;background:rgba(10,22,40,.5);border-radius:6px">${esc(PRIORIDAD_CUPOS_TOPE)}</div>
    <ol style="margin:0;padding-left:20px;font-size:11px;line-height:1.55;color:var(--text)">
      ${PRIORIDAD_CUPOS.map(t=>`<li style="padding:2px 0">${esc(t)}</li>`).join('')}
    </ol>
    <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5;font-style:italic">${esc(PRIORIDAD_NOTA)}</div>
  </div>`;
}
// La marca de la columna: un ✓ si compitió este año, una ✗ si no. Sin colores ni
// etiquetas — todos los campeonatos del año gastan cupo, así que no hay nada que
// distinguir a simple vista. El ✓ se abre y ahí está el detalle.
// El detalle que se abre bajo el ✓: en qué compitió este año y, debajo, el
// recordatorio del orden de prioridad. Lo usan las dos pantallas —revisión de
// inscripciones y nóminas— así que vive en un solo lugar.
function _detalleHist(hist,anio){
  const nComp=hist.filter(x=>x.compitio).length;
  const nSolo=hist.length-nComp;
  return `<div style="font-family:Oswald;font-size:10px;letter-spacing:1.5px;color:var(--gold);margin-bottom:7px">
      COMPITIÓ EN ${anio} — ${nComp} campeonato${nComp===1?'':'s'}${nSolo?` <span style="color:var(--muted);letter-spacing:1px">· ${nSolo} inscripción${nSolo===1?'':'es'} sin competir</span>`:''}</div>
    ${hist.map(x=>`<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:3px 0;border-top:1px solid rgba(30,58,95,.35)">
      <span style="font-size:10px;color:var(--muted);min-width:74px;font-family:Oswald">${esc(x.fecha||'—')}</span>
      <span style="font-size:12px;color:var(--text)">${esc(x.evento)}</span>
      <span style="font-size:10px;color:var(--muted)">${esc(x.categoria||'')}${x.division?' · '+esc(x.division):''}${x.modalidad?' · '+esc(x.modalidad):''}${x.total?' · '+x.total+' kg':''}${x.estado&&x.estado!=='OK'?' · '+esc(x.estado):''}</span>
      ${x.compitio?'':'<span style="font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px">solo inscrito — sin resultado</span>'}
    </div>`).join('')}
    <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5">
      Sale de los resultados ya cargados en YourLift. Un campeonato que no se cerró desde acá no aparece.</div>
    ${_prioridadHtml()}`;
}
// El selector de campeonatos. Va arriba de la tabla, plegado: se abre cuando hay
// que decidir y no estorba el resto del tiempo.
function _cupoSelectorHtml(){
  const H=_histAnio();
  const cfg=_cupoCfg();
  const sel=new Set((cfg&&cfg.seleccionados)||H.delAnio);
  const vistos=new Set((cfg&&cfg.vistos)||[]);
  const aMano=!!(cfg&&Array.isArray(cfg.seleccionados));
  const nuevos=aMano?H.todos.filter(x=>!vistos.has(x.clave)):[];
  let h='<div style="padding:8px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap">';
  h+=`<span>Contando <b style="color:var(--gold)">${sel.size}</b> campeonato${sel.size===1?'':'s'} `
    +(aMano?'elegidos a mano':`de ${H.anio}`)+'.</span>';
  h+=`<button onclick="cupoPanel()" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 10px;border-radius:6px;font-size:11px;cursor:pointer;font-family:Oswald">${ST.cupoPanelOpen?'Cerrar':'Elegir cuáles'}</button>`;
  if(nuevos.length)h+=`<span style="color:var(--orange)">⚠ ${nuevos.length} campeonato${nuevos.length===1?'':'s'} nuevo${nuevos.length===1?'':'s'} sin decidir</span>`;
  h+='</div>';
  if(!ST.cupoPanelOpen)return h;

  h+='<div style="padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(10,22,40,.4)">';
  h+='<div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.55">Marca los campeonatos que gastan cupo. Sirve para cuando el circuito no calza con el año calendario, o cuando algún torneo no debe contar. Si no se guarda nada, se usan los del año en curso.</div>';
  let anioAct='';
  H.todos.forEach(x=>{
    if(x.anio!==anioAct){anioAct=x.anio;h+=`<div style="font-family:Oswald;font-size:10px;letter-spacing:1.5px;color:var(--gold);margin:10px 0 5px">${esc(anioAct||'sin año')}</div>`;}
    const on=sel.has(x.clave), nuevo=aMano&&!vistos.has(x.clave);
    h+=`<label style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;color:${on?'var(--text)':'var(--muted)'}">
      <input type="checkbox" ${on?'checked':''} onchange="cupoToggle('${esc(x.clave)}')" style="cursor:pointer">
      <span>${esc(x.nombre)}</span>
      <span style="font-size:10px;color:var(--muted)">· ${x.n} registro${x.n===1?'':'s'}</span>
      ${nuevo?'<span style="font-size:9px;font-family:Oswald;letter-spacing:1px;background:rgba(245,158,11,.18);color:var(--orange);padding:1px 6px;border-radius:8px">NUEVO</span>':''}
    </label>`;
  });
  h+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';

// Orden de los días. Se escriben a mano ("Día 1", "Sábado 8", "8 de agosto"…),
// así que se ordena por el primer número que aparezca y, si no hay, alfabético.
// Los que todavía no tienen día quedan al final.
// Orden de los días del cronograma. El día se escribe a mano ("Día 1", "Sábado 8",
// "sábado"…), así que hay que entender las tres formas. Con el nombre del día suelto
// el orden alfabético dejaba el domingo ANTES del sábado, que es justo al revés de
// como se corre un fin de semana.
const _DIAS_SEMANA=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
function _cronoDiaKey(d){
  const s=String(d||'').trim();
  if(!s)return [3,Infinity,''];                                  // sin día: al final
  const n=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let i=_DIAS_SEMANA.findIndex(x=>n.indexOf(x)>=0);              // "sábado", "Sábado 8"
  // Abreviaturas, con borde de palabra para no confundir "mar" con "marzo".
  if(i<0){const m=n.match(/\b(lun|mar|mie|jue|vie|sab|dom)\b/);
          if(m)i=['lun','mar','mie','jue','vie','sab','dom'].indexOf(m[1]);}
  if(i>=0)return [0,i,n];
  const num=n.match(/\d+/);
  if(num)return [1,parseInt(num[0],10),n];                       // "Día 1", "8 de agosto"
  return [2,0,n];                                                // texto suelto: alfabético
}
function _cronoCmpDia(a,b){
  const ka=_cronoDiaKey(a),kb=_cronoDiaKey(b);
  return (ka[0]-kb[0])||(ka[1]-kb[1])||ka[2].localeCompare(kb[2]);
}

// Reglas: cada categoría+división JUNTA en un flight · máx 14 por flight · una sola tarima
window.cronoAutoDistribute=async function(){
  const rows=ST.cronoRows||[]; if(!rows.length){showToast('No hay atletas',null,true);return;}
  if(!confirm('Auto-distribuir '+rows.length+' atletas?\n\nReglas del reglamento:\n· Hombres y mujeres nunca en la misma tanda\n· Una categoría de peso + división de edad NO se parte: va entera en una tanda\n· 8 mínimo, 14 máximo de powerlifting por tanda\n· Only Bench no cuenta para el 14 y puede llevar la tanda hasta 17\n\nUna sola tarima, tandas A, B, C… la primera mitad en AM y la segunda en PM.'))return;
  // Los tres números del reglamento, juntos y con nombre.
  const MIN_PL=8;      // mínimo de powerlifting por tanda
  const MAX_PL=14;     // máximo de powerlifting por tanda
  const MAX_TOT=17;    // tope con los Only Bench encima
  const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  // H=hombre, M=mujer (como en la nómina). Si no hay sexo, se infiere de la categoría (IPF).
  const sexOf=r=>{
    const s=String(r.sexo||'').trim().toLowerCase();
    if(s==='h'||/hom|masc|varon/.test(s))return'H';
    if(s==='m'||/muj|fem/.test(s))return'M';
    const c=parseFloat(String(r.categoria||'').replace(/[^0-9.]/g,''));
    const MUJ=[43,47,52,57,63,69,76,84], HOM=[53,59,66,74,83,93,105,120];
    if(MUJ.includes(c))return'M'; if(HOM.includes(c))return'H'; return '?';
  };
  // Only Bench puro = menciona bench/banca y NO es powerlifting. Sube a tarima
  // una sola vez y por eso no ocupa lugar en el cupo de 14.
  const isBench=m=>{m=(m||'').toLowerCase();return (/bench|banca/.test(m))&&!/powerlifting/.test(m);};
  const nPL=g=>g.filter(r=>!isBench(r.modalidad)).length;
  // Las mujeres abren. Así salió el Regional Centro Sur —tanda A de mujeres,
  // B a E de hombres— y así se levanta en IPF. El código las dejaba al final.
  const srank={M:0,H:1,'?':2};

  // ── Grupos indivisibles ────────────────────────────────────────────────
  // Misma categoría de peso + misma división de edad = un grupo, y un grupo NO
  // se parte. Antes, un grupo de más de 14 se cortaba en pedazos de 14: eso
  // reparte una misma premiación en dos tandas distintas, que es justo lo que
  // hubo que deshacer a mano en el Regional Norte.
  const groups={};
  rows.forEach(r=>{const k=sexOf(r)+'|'+(r.division||'?')+'|'+(r.categoria||'?');(groups[k]=groups[k]||[]).push(r);});
  // De la más liviana a la más pesada, y dentro de cada peso de la más joven a
  // la más vieja: así están armados los cronogramas de la federación. El orden
  // salía al revés porque se comparaba parseFloat('-83 kg'), que da −83: las
  // categorías quedaban de mayor a menor y la competencia arrancaba por los
  // +120. El signo se saca antes de comparar, y el '+120' va después del '-120'.
  const kilos=c=>{const n=parseFloat(String(c||'').replace(/[^0-9.]/g,''));return isNaN(n)?999:(/\+/.test(c)?n+0.5:n);};
  const DIVS=['sub-junior','junior','open','master i','master ii','master iii','master iv'];
  const drank=d=>{const i=DIVS.indexOf(String(d||'').trim().toLowerCase());return i<0?9:i;};
  const keys=Object.keys(groups).sort((a,b)=>{const A=a.split('|'),B=b.split('|');
    return (srank[A[0]]-srank[B[0]])||(kilos(A[2])-kilos(B[2]))||(drank(A[1])-drank(B[1]))||A[1].localeCompare(B[1]);});

  // ── Armado ─────────────────────────────────────────────────────────────
  // Se arma sexo por sexo, y son dos decisiones: CUÁNTAS tandas y CÓMO se
  // reparten. Las dos salen del mismo cálculo, y las dos importan: una tanda de
  // más es cerca de una hora más de competencia, y tandas desparejas hacen
  // jornadas desparejas.
  //
  // Lo que se puede mover y lo que no. El orden de PESO no se toca: la
  // competencia va de la categoría más liviana a la más pesada. Pero dentro de
  // un mismo peso, las divisiones de edad sí se pueden reordenar, y ese permiso
  // es el que hace la diferencia. En el Regional Centro Sur la federación dejó
  // los -93 Open en la tanda D y los -93 Junior en la E; si hubiera respetado
  // el orden de edad, D quedaba en 15 —pasada del tope— y había que abrir una
  // quinta tanda de hombres. Con el movimiento, cuatro tandas de 12·12·13·13.
  //
  // El reparto se busca entero, no tanda a tanda. Cerrar cada tanda al llegar
  // al promedio deja un resto en cada una, y los restos se acumulan al final:
  // así salían tandas de 14 al lado de una de 2. Acá se arma un grafo de
  // CORTES —un corte es "ya están puestos los pesos anteriores y estas
  // divisiones del peso actual"—, de cada corte salen las tandas posibles hacia
  // el siguiente, y se recorre guardando el mejor reparto para cada cantidad de
  // tandas. Después se toma la menor cantidad que alcanza y, entre los repartos
  // de esa cantidad, el más parejo.
  //
  // "Parejo" se mide sumando el cuadrado de cada tanda. Con el total y la
  // cantidad de tandas ya fijos, minimizar esa suma es lo mismo que minimizar
  // lo que cada tanda se aleja del promedio, y tiene la ventaja de no depender
  // de cuántas tandas sean: se calcula una sola vez y sirve para todas.
  const fl=[];   // {sex, rows, grandes:[categorías que solas pasan de 14]}
  const porSexo={};
  keys.forEach(k=>{(porSexo[k.split('|')[0]]=porSexo[k.split('|')[0]]||[]).push(k)});
  for(const sex of Object.keys(porSexo).sort((a,b)=>srank[a]-srank[b])){
    const gs=porSexo[sex];
    // Los grupos, juntados por categoría de peso. Vienen ya ordenados, así que
    // los de un mismo peso quedan seguidos. El tope de 10 divisiones por peso
    // es para que las combinaciones de más abajo no se disparen; con las
    // divisiones que existen (Sub-Junior a Master IV) nunca se llega.
    const pesos=[];
    gs.forEach(k=>{
      const cat=k.split('|')[2], u=pesos[pesos.length-1];
      if(u&&u.cat===cat&&u.ks.length<10)u.ks.push(k); else pesos.push({cat,ks:[k]});
    });
    const W=pesos.length;
    // Cuánta gente suma cada combinación de divisiones dentro de un peso.
    const plM=[],totM=[],cntM=[];
    pesos.forEach(p=>{
      const d=p.ks.length,P=[],T=[],C=[];
      for(let m=0;m<(1<<d);m++){
        let a=0,b=0,c=0;
        for(let i=0;i<d;i++)if(m&(1<<i)){a+=nPL(groups[p.ks[i]]);b+=groups[p.ks[i]].length;c++;}
        P.push(a);T.push(b);C.push(c);
      }
      plM.push(P);totM.push(T);cntM.push(C);
    });
    // Los cortes. Uno por cada (peso, combinación de divisiones ya puestas),
    // más el corte final. La combinación completa de un peso no es un corte
    // propio: es el corte de arranque del peso siguiente.
    const base=[],bw=[],bm=[];
    let nb=0;
    for(let w=0;w<W;w++){
      base.push(nb);
      const lleno=(1<<pesos[w].ks.length)-1;
      for(let m=0;m<lleno;m++){bw.push(w);bm.push(m);}
      nb+=lleno;
    }
    base.push(nb); bw.push(W); bm.push(0); nb++;
    const idC=(w,m)=>{
      while(w<W&&m===(1<<pesos[w].ks.length)-1){w++;m=0;}
      return w>=W?base[W]:base[w]+m;
    };
    // Qué grupos quedan entre dos cortes.
    const entre=(w1,m1,w2,m2)=>{
      const out=[];
      if(w2===w1){const s=m2&~m1;pesos[w1].ks.forEach((k,i)=>{if(s&(1<<i))out.push(k);});return out;}
      pesos[w1].ks.forEach((k,i)=>{if(!(m1&(1<<i)))out.push(k);});
      for(let w=w1+1;w<w2;w++)pesos[w].ks.forEach(k=>out.push(k));
      if(w2<W)pesos[w2].ks.forEach((k,i)=>{if(m2&(1<<i))out.push(k);});
      return out;
    };
    const KMAX=gs.length;
    const costo=[],deW=[],deM=[];
    for(let b=0;b<nb;b++){costo.push(new Array(KMAX+1).fill(Infinity));deW.push(new Array(KMAX+1).fill(-1));deM.push(new Array(KMAX+1).fill(0));}
    costo[idC(0,0)][0]=0;
    for(let b=0;b<nb-1;b++){
      const w=bw[b],mask=bm[b],resto=((1<<pesos[w].ks.length)-1)&~mask;
      for(let k=0;k<KMAX;k++){
        const c0=costo[b][k]; if(c0===Infinity)continue;
        const poner=(b2,p,q,c)=>{
          // Un grupo solo SIEMPRE puede formar tanda: si por sí mismo pasa de
          // 14 no hay dónde partirlo. Los topes rigen de dos grupos en adelante.
          if(c>1&&(p>MAX_PL||q>MAX_TOT))return;
          // Quedar bajo el mínimo de 8 se castiga fuerte: se prefiere cualquier
          // reparto legal antes que ese.
          const cc=c0+p*p+(p>0&&p<MIN_PL?100:0);
          if(cc<costo[b2][k+1]){costo[b2][k+1]=cc;deW[b2][k+1]=w;deM[b2][k+1]=mask;}
        };
        // La tanda se cierra dentro del mismo peso.
        for(let S=resto;S;S=(S-1)&resto)poner(idC(w,mask|S),plM[w][S],totM[w][S],cntM[w][S]);
        // O sigue hacia pesos más altos, llevándose lo que queda de este.
        let aP=plM[w][resto],aQ=totM[w][resto],aC=cntM[w][resto];
        for(let w2=w+1;w2<W;w2++){
          const F=(1<<pesos[w2].ks.length)-1;
          for(let S=F;;S=(S-1)&F){
            poner(idC(w2,S),aP+plM[w2][S],aQ+totM[w2][S],aC+cntM[w2][S]);
            if(!S)break;
          }
          aP+=plM[w2][F];aQ+=totM[w2][F];aC+=cntM[w2][F];
          if(aP>MAX_PL||aQ>MAX_TOT)break;   // más allá ya no cabe nada
        }
      }
    }
    // La menor cantidad de tandas que alcanza, y de esas la más pareja.
    let tandasMinimas=-1;
    for(let k=1;k<=KMAX;k++)if(costo[nb-1][k]<Infinity){tandasMinimas=k;break;}
    const tandas=[];
    if(tandasMinimas>0){
      let b=nb-1,k=tandasMinimas;
      while(k>0){
        const w1=deW[b][k],m1=deM[b][k];
        tandas.unshift(entre(w1,m1,bw[b],bm[b]));
        b=idC(w1,m1); k--;
      }
    }else{
      // No debería pasar: cada grupo suelto es una tanda válida, así que
      // siempre hay reparto. Si igual pasara, mejor eso que un cronograma vacío.
      gs.forEach(k=>tandas.push([k]));
    }
    tandas.forEach(ks=>{
      const f={sex,rows:[],grandes:[]};
      ks.forEach(k=>{
        f.rows=f.rows.concat(groups[k]);
        // Un grupo que POR SÍ SOLO pasa de 14 no se puede partir sin romper la
        // regla, así que queda entero y se avisa: es decisión de la comisión
        // técnica dividir la categoría o correr una tanda más grande.
        if(nPL(groups[k])>MAX_PL)f.grandes.push(k.split('|')[2]+' '+k.split('|')[1]);
      });
      fl.push(f);
    });
  }

  // ── Mínimo de 8 ────────────────────────────────────────────────────────
  // Una tanda de dos personas no se corre. Si quedó corta, se junta con la
  // vecina del MISMO sexo mientras el resultado siga cabiendo en los topes.
  for(let i=0;i<fl.length;i++){
    if(nPL(fl[i].rows)>=MIN_PL)continue;
    // Una tanda de puro Only Bench no se mide contra el mínimo de powerlifting:
    // son los que compiten solo en banca y no ocupan ese cupo.
    if(nPL(fl[i].rows)===0)continue;
    for(const j of [i+1,i-1]){
      const o=fl[j]; if(!o||o.sex!==fl[i].sex)continue;
      if(nPL(fl[i].rows)+nPL(o.rows)>MAX_PL)continue;
      if(fl[i].rows.length+o.rows.length>MAX_TOT)continue;
      o.rows=(j>i?fl[i].rows.concat(o.rows):o.rows.concat(fl[i].rows));
      o.grandes=o.grandes.concat(fl[i].grandes);
      fl.splice(i,1); i--; break;
    }
  }

  // ── Asignar tarima, letra y jornada ────────────────────────────────────
  const half=Math.ceil(fl.length/2);
  fl.forEach((f,idx)=>{
    const jor=idx<half?'AM':'PM', let_=LETTERS[idx%LETTERS.length];
    f.rows.forEach(r=>{r.tarima='1';r.flight=let_;r.jornada=jor;});
  });
  ST.cronoRows=fl.reduce((a,f)=>a.concat(f.rows),[]);
  await cronoSaveDoc();

  // ── Qué salió, y qué hay que mirar ─────────────────────────────────────
  const cortas=fl.filter(f=>nPL(f.rows)>0&&nPL(f.rows)<MIN_PL);
  const largas=fl.filter(f=>nPL(f.rows)>MAX_PL);
  let msg=fl.length+' tandas · '+half+' AM / '+(fl.length-half)+' PM';
  const avisos=[];
  if(largas.length)avisos.push(largas.length+' pasan de '+MAX_PL+' ('+largas.map(f=>LETTERS[fl.indexOf(f)]+': '+nPL(f.rows)).join(', ')+') porque una categoría no se puede partir');
  if(cortas.length)avisos.push(cortas.length+' quedan bajo '+MIN_PL+' ('+cortas.map(f=>LETTERS[fl.indexOf(f)]+': '+nPL(f.rows)).join(', ')+') y no se pudieron juntar sin pasarse del tope');
  showToast(msg+(avisos.length?' — revisar: '+avisos.join(' · '):''), null, avisos.length>0);
  if(avisos.length)console.warn('[crono] '+avisos.join('\n'));
  render();
};
window.cronoLoadFromNomina=async function(){
  if(!ST.cronoEv){showToast('Elige un campeonato primero',null,true);return;}
  const evObj=(ST.eventos||[]).find(e=>e.id===ST.cronoEv);
  const evName=evObj?evObj.name:'';
  const list=(ST.inscripciones||[]).filter(i=>(i.evento===evName||i.evento===ST.cronoEv)&&i.status==='approved');
  if(!list.length){showToast('No hay inscripciones aprobadas en este campeonato',null,true);return;}
  if(!confirm('Cargar '+list.length+' atletas desde la nómina (inscripciones aprobadas)?\nReemplaza el cronograma actual de este evento.\nLuego ajustas tarima/flight/jornada y handlers.'))return;
  // OJO: NO usar solo la primera letra de i.sexo — las inscripciones guardan
  // "Masculino"/"Femenino" (a veces "Hombre"/"Mujer"), y "Masculino"[0] es
  // "M", igual que Mujer → todos terminaban marcados "M". Hay que reconocer
  // ambas formas explícitamente.
  const _sexoHM=s=>{s=String(s||'').trim().toLowerCase();return /^(hombre|masculino|m(a|á)sc)/.test(s)?'H':/^(mujer|femenino|fem)/.test(s)?'M':'';};
  ST.cronoRows=list.map(i=>({
    nombre:i.nombre||'', rut:i.rut||'', division:i.division||'', categoria:i.categoria||'', sexo:_sexoHM(i.sexo),
    club:i.club||'', modalidad:i.modalidad||'', tarima:'1', flight:(i.flight||'A'), jornada:'',
    entrenador:'', handler1:{nombre:'',correo:''}, handler2:{nombre:'',correo:''}
  })).sort((a,b)=>String(a.flight).localeCompare(String(b.flight))||(a.nombre||'').localeCompare(b.nombre||''));
  await cronoSaveDoc();
  showToast('Cargados '+ST.cronoRows.length+' atletas desde la nómina');
};
// Suma a los atletas aprobados que todavía NO están en el cronograma (por
// nombre), sin tocar a los que ya están — a diferencia de "Cargar desde
// nómina" (que reemplaza todo), esto no pierde el trabajo de acomodar
// flights/handlers ya hecho. Los nuevos entran en flight "A" sin jornada,
// para ubicarlos a mano.
window.cronoAddMissingFromNomina=async function(){
  if(!ST.cronoEv){showToast('Elige un campeonato primero',null,true);return;}
  const evObj=(ST.eventos||[]).find(e=>e.id===ST.cronoEv);
  const evName=evObj?evObj.name:'';
  const list=(ST.inscripciones||[]).filter(i=>(i.evento===evName||i.evento===ST.cronoEv)&&i.status==='approved');
  if(!list.length){showToast('No hay inscripciones aprobadas en este campeonato',null,true);return;}
  const _nn=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  const _sexoHM=s=>{s=String(s||'').trim().toLowerCase();return /^(hombre|masculino|m(a|á)sc)/.test(s)?'H':/^(mujer|femenino|fem)/.test(s)?'M':'';};
  const yaEsta=new Set((ST.cronoRows||[]).map(r=>_nn(r.nombre)));
  const nuevos=list.filter(i=>!yaEsta.has(_nn(i.nombre)));
  if(!nuevos.length){showToast('No hay atletas nuevos — el cronograma ya tiene a todos los aprobados');return;}
  if(!confirm('Agregar '+nuevos.length+' atleta(s) nuevo(s) al cronograma?\n\n'+nuevos.map(i=>'• '+i.nombre).join('\n')+'\n\nEntran en flight "A" sin jornada — los movés a mano después. No toca a los que ya están ubicados.'))return;
  ST.cronoRows=(ST.cronoRows||[]).concat(nuevos.map(i=>({
    nombre:i.nombre||'', rut:i.rut||'', division:i.division||'', categoria:i.categoria||'', sexo:_sexoHM(i.sexo),
    club:i.club||'', modalidad:i.modalidad||'', tarima:'1', flight:'A', jornada:'',
    entrenador:'', handler1:{nombre:'',correo:''}, handler2:{nombre:'',correo:''}
  })));
  await cronoSaveDoc();
  showToast('Agregados '+nuevos.length+' atleta(s) nuevo(s) al cronograma');
};
function _xlsxDownload(aoa, sheetName, filename){
  if(typeof XLSX==='undefined'){ showToast('Excel no cargó (revisa internet)',null,true); return; }
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,(sheetName||'Hoja').slice(0,28));
  XLSX.writeFile(wb, filename);
}
window.cronoExportXlsx=function(){
  const rows=ST.cronoRows||[]; if(!rows.length){showToast('Nada que exportar',null,true);return;}
  const _jr=x=>x==='AM'?0:x==='PM'?1:2;
  const order=rows.map((r,i)=>i).sort((a,b)=>_cronoCmpDia(rows[a].dia,rows[b].dia)||(_jr(rows[a].jornada)-_jr(rows[b].jornada))||String(rows[a].flight).localeCompare(String(rows[b].flight)));
  const head=['Nombre','División','Categoría','Sexo','Club','Modalidad','Día','Flight','Jornada','Entrenador','Handler 1','Correo handler 1','Handler 2','Correo handler 2'];
  const aoa=[head];
  order.forEach(i=>{const r=rows[i];aoa.push([r.nombre||'',r.division||'',r.categoria||'',r.sexo||'',r.club||'',r.modalidad||'',r.dia||'',r.flight||'',r.jornada||'',r.entrenador||'',(r.handler1||{}).nombre||'',(r.handler1||{}).correo||'',(r.handler2||{}).nombre||'',(r.handler2||{}).correo||'']);});
  _xlsxDownload(aoa,'Cronograma','Cronograma_'+(ST.cronoEv||'evento')+'.xlsx');
};
// Importa un cronograma armado en Excel (mismas columnas que exporta cronoExportXlsx,
// detectadas por nombre de encabezado — no importa el orden exacto). Reemplaza el
// cronograma actual del evento seleccionado.
window.cronoImportXlsx=function(){
  if(!ST.cronoEv){showToast('Elige un campeonato primero',null,true);return;}
  if(typeof XLSX==='undefined'){showToast('Excel no cargó (revisa internet)',null,true);return;}
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!aoa.length){showToast('Archivo vacío',null,true);return;}
      const headers=aoa[0].map(h=>String(h||'').trim().toLowerCase());
      const idx=name=>headers.findIndex(h=>h.includes(name));
      const iNombre=idx('nombre'), iDiv=idx('divisi'), iCat=idx('categor'), iSexo=idx('sexo'),
        iClub=idx('club'), iMod=idx('modalidad'), iFlight=idx('flight'), iJor=idx('jornada'),
        iEnt=idx('entrenador'),
        // Ojo: "dia" a secas también matchea "modalidad", así que la columna del
        // día se busca exacta (con o sin tilde).
        iDia=headers.findIndex(h=>/^d[ií]as?$/.test(h)),
        iH1n=headers.findIndex(h=>h.includes('handler 1')&&!h.includes('correo')),
        iH1c=headers.findIndex(h=>h.includes('correo')&&h.includes('1')),
        iH2n=headers.findIndex(h=>h.includes('handler 2')&&!h.includes('correo')),
        iH2c=headers.findIndex(h=>h.includes('correo')&&h.includes('2'));
      if(iNombre<0){showToast('No encontré la columna "Nombre" en el Excel',null,true);return;}
      const rows=aoa.slice(1).filter(r=>r[iNombre]).map(r=>({
        nombre:String(r[iNombre]||'').trim(), division:iDiv>=0?String(r[iDiv]??'').trim():'',
        categoria:iCat>=0?String(r[iCat]??'').trim():'', sexo:iSexo>=0?String(r[iSexo]??'').trim():'',
        club:iClub>=0?String(r[iClub]??'').trim():'', modalidad:iMod>=0?String(r[iMod]??'').trim():'',
        tarima:'1', flight:iFlight>=0?String(r[iFlight]??'').trim()||'A':'A',
        jornada:iJor>=0?String(r[iJor]??'').trim():'',
        dia:iDia>=0?String(r[iDia]??'').trim():'',
        entrenador:iEnt>=0?String(r[iEnt]??'').trim():'',
        handler1:{nombre:iH1n>=0?String(r[iH1n]??'').trim():'',correo:iH1c>=0?String(r[iH1c]??'').trim():''},
        handler2:{nombre:iH2n>=0?String(r[iH2n]??'').trim():'',correo:iH2c>=0?String(r[iH2c]??'').trim():''}
      }));
      if(!rows.length){showToast('No se encontraron filas de atletas en el Excel',null,true);return;}
      if(!confirm('Importar '+rows.length+' atletas desde "'+file.name+'"?\nReemplaza el cronograma actual de este evento.'))return;
      ST.cronoRows=rows;
      await cronoSaveDoc();
      showToast('Importados '+rows.length+' atletas desde Excel');
    }catch(e){console.error(e);showToast('Error leyendo el Excel: '+e.message,null,true);}
  };
  inp.click();
};

function renderCronoEditor(){
  const evs=(ST.eventos||[]).filter(e=>e.status!=='archived');
  const evOpts=evs.map(e=>`<option value="${esc(e.id)}" ${ST.cronoEv===e.id?'selected':''}>${esc(e.name||e.id)}</option>`).join('');
  let h=`<div class="h1">Cronograma</div>
    <p class="subtitle">Start list editable por campeonato · mueve atletas de tarima/flight y se guarda en vivo</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0">
      <select onchange="cronoPickEvent(this.value)" style="background:rgba(10,22,40,.7);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;min-width:240px">
        <option value="">— Elegir campeonato —</option>${evOpts}
      </select>
      ${ST.cronoEv?`<button onclick="cronoLoadFromNomina()" class="btn btn-g" title="Reemplaza TODO el cronograma actual">Cargar desde nómina</button><button onclick="cronoAddMissingFromNomina()" class="btn btn-g" title="Suma solo los aprobados que todavía no están — no toca a los ya ubicados">+ Nuevos de nómina</button><button onclick="cronoAutoDistribute()" class="btn">Auto-distribuir flights</button><button onclick="cronoImportXlsx()" class="btn" title="Sube un Excel con las columnas Nombre/División/Categoría/Sexo/Club/Modalidad/Flight/Jornada/Entrenador/Handlers">Importar Excel</button><button onclick="cronoAddRow()" class="btn">+ Atleta</button><button onclick="cronoExportXlsx()" class="btn">Exportar Excel</button><button onclick="cronoClear()" class="btn" style="border-color:var(--red);color:var(--red)">Vaciar</button><label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;margin-left:4px"><input type="checkbox" ${ST.cronoHideCoaches?'checked':''} onchange="cronoToggleCoaches(this.checked)"> Ocultar entrenador/handlers en el público</label>`:''}
    </div>`;
  if(!ST.cronoEv) return h+`<div class="card" style="color:var(--muted)">Elige un campeonato para ver y editar su cronograma.</div>`;
  if(ST.cronoRows===null) return h+`<div class="card" style="color:var(--muted)">Cargando…</div>`;
  if(!ST.cronoRows.length) return h+`<div class="card" style="color:var(--muted)">Este campeonato no tiene cronograma. Usa <b>“Cargar desde nómina”</b> (inscripciones aprobadas), <b>“Importar debutantes”</b> (solo debutantes) o <b>“+ Atleta”</b>.</div>`;
  // orden de visualización: jornada (AM/PM), flight
  const _jr=x=>x==='AM'?0:x==='PM'?1:2;
  // Día primero: un campeonato de dos días se lee por día, y adentro por
  // jornada (AM/PM) y flight.
  const order=ST.cronoRows.map((r,i)=>i).sort((a,b)=>{

    return _cronoCmpDia(ra.dia,rb.dia)||(_jr(ra.jornada)-_jr(rb.jornada))||String(ra.flight).localeCompare(String(rb.flight))||0;
  });

    }
    return `${_hdr}<tr style="background:${_bg};${_bd}">

    <td>${inp(i,'club',r.club,98)}</td>

    <td><select onchange="cronoSet(${i},'flight',this.value)" style="${sSel}">${flOpts(r.flight)}</select></td>
    <td><select onchange="cronoSet(${i},'jornada',this.value)" style="${sSel}"><option value="" ${(r.jornada!=='AM'&&r.jornada!=='PM')?'selected':''}>—</option><option ${r.jornada==='AM'?'selected':''}>AM</option><option ${r.jornada==='PM'?'selected':''}>PM</option></select></td>
    <td>${inp(i,'entrenador',r.entrenador,104)}</td>
    <td>${inp(i,'h1n',(r.handler1||{}).nombre,98)}<br>${inp(i,'h1c',(r.handler1||{}).correo,124)}</td>
    <td>${inp(i,'h2n',(r.handler2||{}).nombre,98)}<br>${inp(i,'h2c',(r.handler2||{}).correo,124)}</td>
    <td><button onclick="cronoDelRow(${i})" style="background:transparent;border:1px solid rgba(239,68,68,.4);color:var(--red);padding:3px 7px;border-radius:5px;font-size:10px;cursor:pointer">✕</button></td>
  </tr>`;}).join('');
  h+=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${ST.cronoRows.length} atletas · cambiar Tarima/Flight mueve al atleta · todo se guarda al instante</div>

// ═══════════════════════════════════════════
// COMPETENCIAS PASADAS — actas para descargar desde yourlift.cl
// ═══════════════════════════════════════════
// El acta se genera en el livecast (PDF o Excel) y se baja al computador. Acá se
// sube y queda publicada en la sección "Competencias pasadas" del sitio, para que
// cualquiera la descargue sin tener que pedirla.
//
// Se guarda el archivo en Storage (actas/{evento}/…) y la ficha en Firestore
// (competencias_pasadas/{evento}), con la lista de documentos de ese campeonato.
// Un campeonato puede tener varios: acta oficial, acta en Excel, resultados por
// tanda, lo que haga falta.
const CP_TIPOS='.pdf,.xlsx,.xls,.csv';
const CP_MAX_MB=20;

// Un campeonato es "pasado" si está archivado o si su fecha ya quedó atrás.
function cpEsPasado(e){
  if(!e)return false;
  if(e.status==='archived')return true;
  const f=String(e.date||e.fecha||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f))return false;
  return f < new Date().toISOString().slice(0,10);
}
function cpPasados(){
  return (ST.eventos||[]).filter(cpEsPasado)
    .slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
function cpFicha(id){ return (ST.pasadas||{})[id]||null; }
function cpFecha(f){
  const m=String(f||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return f||'—';
  const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return (+m[3])+' de '+M[(+m[2])-1]+' de '+m[1];
}
function cpPeso(b){
  const n=+b||0;
  return n<1024*1024 ? Math.max(1,Math.round(n/1024))+' KB' : (n/1024/1024).toFixed(1)+' MB';
}

// ════════════════════════════════════════════════════════════════
// REINICIO DEL RANKING
//
// El ranking arranca de cero con cada Campeonato Nacional: lo que se corrió
// antes deja de contar. Antes esto era editar el archivo del ranking a mano.
//
// Lo que se guarda es una FECHA DE CORTE en ranking_config/ciclo. El ranking
// público muestra solo los resultados publicados desde esa fecha. No se borra
// nada: los resultados siguen enteros en Firestore, se siguen viendo en el
// perfil de cada atleta y en las actas, y quitando el corte vuelve el ranking
// completo. Por eso la pantalla insiste en que es reversible: si alguien lo
// aprieta por error un día de campeonato, se deshace en dos clics.
//
// Va acá y no dentro de la ficha del campeonato porque es una decisión de la
// comisión técnica, no una propiedad del evento, y porque tiene que poder
// deshacerse sin volver a abrir un campeonato ya cerrado.
// ════════════════════════════════════════════════════════════════
function _puedeCiclo(){
  const r=ST.adminInfo?.role;
  return r==='owner'||r==='superadmin'||r==='admin'||!!ST.adminInfo?.bootstrap;
}

// Los campeonatos que pueden abrir un ciclo: los que ya tienen resultados
// publicados. No tiene sentido cortar el ranking en un campeonato que todavía
// no corrió — dejaría el ranking vacío.
function _cicloCandidatos(){
  const porEvento={};
  (ST.allCompResults||[]).forEach(r=>{
    const nombre=r.evento||''; if(!nombre) return;
    const f=r.fecha||'';
    const k=r.evento_id||nombre;
    if(!porEvento[k])porEvento[k]={id:r.evento_id||'',nombre,fecha:f,n:0};
    porEvento[k].n++;
    // Se usa la fecha más TEMPRANA del campeonato: si duró dos días, el corte
    // tiene que dejar dentro también el primero.
    if(f&&(!porEvento[k].fecha||f<porEvento[k].fecha))porEvento[k].fecha=f;
  });
  return Object.values(porEvento).filter(e=>e.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

function renderRankingCiclo(){
  const c=ST.rankingCiclo;
  const cands=_cicloCandidatos();
  const sel=ST.rankingCicloSel||'';
  const elegido=cands.find(x=>(x.id||x.nombre)===sel)||null;
  const activo=!!(c&&c.desde);
  let h=`<div class="hdr"><h1>Reinicio ranking</h1></div>`;

  h+=`<div class="card" style="border-color:${activo?'var(--gold)':'var(--border)'}">
    <div style="font-family:Oswald;font-size:13px;letter-spacing:1px;color:${activo?'var(--gold)':'var(--muted)'};margin-bottom:8px">ESTADO ACTUAL</div>`;
  if(activo){
    h+=`<div style="font-size:15px;color:var(--text);margin-bottom:6px">El ranking parte desde <b>${esc(c.evento||'—')}</b></div>
      <div style="font-size:12px;color:var(--muted)">Cuentan los resultados publicados desde el <b>${esc(c.desde)}</b>. Lo anterior no aparece en el ranking, pero sigue guardado y visible en el perfil de cada atleta.</div>
      <button class="btn" style="margin-top:14px;background:transparent;border:1px solid var(--red);color:var(--red)" onclick="quitarCicloRanking()">Quitar el corte y volver al ranking completo</button>`;
  }else{
    h+=`<div style="font-size:15px;color:var(--text);margin-bottom:6px">El ranking muestra <b>todos</b> los resultados</div>
      <div style="font-size:12px;color:var(--muted)">No hay ningún ciclo abierto. Es lo normal hasta que se corra el próximo Nacional.</div>`;
  }
  h+=`</div>`;

  h+=`<div class="card">
    <div style="font-family:Oswald;font-size:13px;letter-spacing:1px;color:var(--text);margin-bottom:4px">ABRIR UN CICLO NUEVO</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px">
      Se elige el campeonato que abre el ciclo —normalmente el Nacional recién cerrado— y desde ese momento el ranking cuenta solo ese campeonato en adelante.
      <b style="color:var(--text)">No se borra ningún resultado:</b> quedan guardados en la base, se siguen viendo en el perfil de cada atleta y en las actas, y este mismo corte se puede quitar cuando se quiera.
    </div>`;
  if(!cands.length){
    h+=`<div style="font-size:12px;color:var(--muted)">Todavía no hay campeonatos con resultados publicados. Un campeonato aparece acá después de cerrarlo desde el control en vivo.</div>`;
  }else{
    h+=`<label class="field" style="max-width:560px"><span>Campeonato que abre el ciclo</span>
      <select class="inp" onchange="ST.rankingCicloSel=this.value;render()">
        <option value="">— Elegir campeonato —</option>
        ${cands.map(e=>`<option value="${esc(e.id||e.nombre)}" ${sel===(e.id||e.nombre)?'selected':''}>${esc(e.nombre)} · ${esc(e.fecha)} · ${e.n} resultados</option>`).join('')}
      </select></label>`;
    if(elegido){
      const quedan=(ST.allCompResults||[]).filter(r=>(r.fecha||'')>=elegido.fecha).length;
      const fuera=(ST.allCompResults||[]).length-quedan;
      h+=`<div style="margin-top:12px;padding:12px 14px;background:rgba(212,168,67,.07);border:1px solid rgba(212,168,67,.3);border-radius:8px;font-size:12px;color:var(--text);line-height:1.7">
        Si abres el ciclo en <b>${esc(elegido.nombre)}</b>:<br>
        · el corte queda en el <b>${esc(elegido.fecha)}</b>;<br>
        · el ranking pasa a contar <b>${quedan}</b> resultados;<br>
        · dejan de aparecer <b>${fuera}</b> resultados anteriores, que <b>siguen guardados</b>.
      </div>
      <button class="btn btn-g" style="margin-top:14px" onclick="abrirCicloRanking()">Reiniciar el ranking desde ${esc(elegido.nombre)}</button>`;
    }
  }
  h+=`</div>`;
  return h;
}

window.abrirCicloRanking=async function(){
  const sel=ST.rankingCicloSel||'';
  const e=_cicloCandidatos().find(x=>(x.id||x.nombre)===sel);
  if(!e){ showToast('Elige primero el campeonato', null, true); return; }
  if(!confirm(`REINICIAR EL RANKING\n\nEl ranking pasará a mostrar solo los resultados desde el ${e.fecha} — "${e.nombre}" en adelante.\n\nNo se borra nada: los resultados anteriores quedan guardados y se siguen viendo en el perfil de cada atleta. Este corte se puede quitar cuando quieras.\n\n¿Confirmar?`)) return;
  try{
    await setDoc(doc(db,'ranking_config','ciclo'),
      {desde:e.fecha, evento:e.nombre, evento_id:e.id||'', ts:serverTimestamp(), por:ST.user?.email||''});
    await logAction('ranking_ciclo_abrir', e.id||e.nombre, null, e.fecha);
    ST.rankingCiclo={desde:e.fecha,evento:e.nombre,evento_id:e.id||''};
    showToast('Ranking reiniciado desde '+e.nombre);
    render();
  }catch(err){ showToast('Error: '+err.message, null, true); console.error(err); }
};

window.quitarCicloRanking=async function(){
  if(!confirm('QUITAR EL CORTE\n\nEl ranking vuelve a mostrar todos los resultados, como antes del reinicio.\n\n¿Confirmar?')) return;
  try{
    await deleteDoc(doc(db,'ranking_config','ciclo'));
    await logAction('ranking_ciclo_quitar', 'ciclo', null, '');
    ST.rankingCiclo=null;
    showToast('Corte quitado — el ranking vuelve a estar completo');
    render();
  }catch(err){ showToast('Error: '+err.message, null, true); console.error(err); }
};

    return h;
  }

  const ev=evs.find(e=>e.id===sel);
  const f=cpFicha(sel)||{};
  const docs=f.docs||[];
  h+='<div class="card">';
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div><div style="font-family:Oswald;font-size:17px;letter-spacing:1px">${esc(ev.name||ev.id)}</div>
        <div style="color:var(--muted);font-size:12px">${esc(cpFecha(ev.date))}${ev.location?' · '+esc(ev.location):''}</div></div>
        <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer">
          <input type="checkbox" ${f.publicado?'checked':''} onchange="cpPublicar('${esc(sel)}',this.checked)"> Visible en yourlift.cl
        </label>
      </div>`;

  h+=`<label class="btn btn-g" style="display:inline-block">
        <input type="file" accept="${CP_TIPOS}" multiple style="display:none" onchange="cpSubir('${esc(sel)}',this)">
        + Subir acta
      </label>
      <span style="color:var(--muted);font-size:12px;margin-left:10px">PDF o Excel, hasta ${CP_MAX_MB} MB. Puedes subir varios de una.</span>`;

  if(!docs.length){
    h+='<div style="color:var(--muted);font-size:13px;margin-top:16px">Todavía no subiste ningún documento de este campeonato.</div>';
  }else{
    h+='<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:16px">';
    h+='<tr style="color:var(--muted);font-size:11px;text-align:left"><th style="padding:6px 4px">Nombre que se ve en el sitio</th><th style="padding:6px 4px">Archivo</th><th style="padding:6px 4px"></th></tr>';
    docs.forEach((d,i)=>{
      h+=`<tr style="border-top:1px solid var(--border)">
        <td style="padding:7px 4px"><input class="inp" style="padding:6px 8px;font-size:12px" value="${esc(d.nombre||'')}" onchange="cpRenombrar('${esc(sel)}',${i},this.value)"></td>
        <td style="padding:7px 4px;color:var(--muted);white-space:nowrap">${esc((d.archivo||'').slice(-34))} · ${esc(cpPeso(d.tamano))}</td>
        <td style="padding:7px 4px;white-space:nowrap;text-align:right">
          <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener" style="background:var(--border);color:var(--text);text-decoration:none">Ver</a>
          <button class="btn" onclick="cpBorrar('${esc(sel)}',${i})" style="background:transparent;border:1px solid var(--red);color:var(--red);margin-left:5px">Borrar</button>
        </td>
      </tr>`;
    });
    h+='</table>';
  }
  h+='</div>';
  return h;
}
