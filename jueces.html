<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YourLift — Panel de Jueces</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0A1628;--card:#0f1e35;--border:#1E3A5F;--text:#D4E1F0;--muted:#7A8FA6;--accent:#C41E3A;--green:#22c55e;--gold:#D4A843}
body{font-family:'Oswald',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}

/* ── Screens ─────────────────────────────────────── */
.screen{display:none;width:100%;height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.screen.active{display:flex}

/* ── Pick screen ──────────────────────────────────── */
.logo{font-size:28px;font-weight:700;letter-spacing:3px;text-align:center;margin-bottom:8px}
.logo span{color:var(--accent)}
.subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}
.pick-btn{width:min(320px,88vw);padding:22px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:Oswald;font-size:22px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:center}
.pick-btn:active{transform:scale(.97)}
.pick-btn.izq:hover{border-color:#3b82f6}
.pick-btn.cen:hover{border-color:#f0f0f0}
.pick-btn.der:hover{border-color:#3b82f6}

/* ── Login ────────────────────────────────────────── */
.log-in{width:min(320px,88vw);padding:16px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--text);font-family:Oswald;font-size:17px;letter-spacing:1px;outline:none}
.log-in:focus{border-color:var(--gold)}
.log-in::placeholder{color:var(--muted)}

/* ── Panel screen ─────────────────────────────────── */
/* overflow-y:auto: con los motivos abajo, en un teléfono chico el contenido
   puede pasarse de alto. Antes se cortaban los botones de voto, que es lo
   último que puede faltarle a un juez. */
#panel{padding:16px;justify-content:space-between;overflow-y:auto;gap:12px}
.panel-header{width:100%;display:flex;justify-content:space-between;align-items:center}
.pos-badge{font-size:13px;font-weight:700;letter-spacing:3px;padding:6px 14px;border-radius:8px;border:2px solid var(--border);color:var(--muted)}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.fb-dot.on{background:var(--green)}
.athlete-info{text-align:center;flex:0}
.ath-name{font-size:clamp(20px,5vw,32px);font-weight:700;letter-spacing:1px;line-height:1.1}
.ath-meta{font-size:13px;color:var(--muted);margin-top:4px}
.ath-weight{font-size:clamp(44px,12vw,72px);font-weight:700;color:var(--gold);letter-spacing:2px;line-height:1}
.ath-lift{font-size:14px;color:var(--muted);letter-spacing:2px;margin-top:2px}

/* ── Preview lights ───────────────────────────────── */
.preview{display:flex;flex-direction:column;align-items:center;gap:8px}
.preview-big{width:72px;height:72px;border-radius:50%;background:var(--border);border:4px solid var(--border);transition:all .2s}
.preview-small{width:22px;height:22px;border-radius:50%;background:var(--border);border:3px solid var(--border);transition:all .2s}
.preview-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px}

/* ── Motivos de nulo ──────────────────────────────── */
/* Las tres guías —sentadilla, banca y peso muerto— van una al lado de la otra y
   se pasan deslizando con el dedo. Antes se mostraba solo la del movimiento en
   tarima: si el juez quería consultar otra, no la tenía.
   Puestas así el bloque ocupa lo que ocupa UNA sola, y los botones de voto no se
   mueven de su lugar ni se van fuera de la pantalla, que es lo último que puede
   faltarle a un juez. */
.motivos{width:100%;max-width:360px;border:1px solid var(--border);border-radius:12px;background:rgba(15,30,53,.55);overflow:hidden;flex-shrink:0}
.motivos-head{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer}
.motivos-head #motTitulo{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:700}
.motivos-head .chev{font-size:11px;color:var(--muted)}
/* Los puntitos dicen en cuál de las tres está parado y que hay más al costado. */
.mot-nav{display:flex;gap:5px;align-items:center;margin-left:auto}
.mot-nav i{width:6px;height:6px;border-radius:50%;background:var(--border);display:block;transition:background .2s}
.mot-nav i.on{background:var(--gold)}
.motivos-body{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.motivos-body::-webkit-scrollbar{display:none}
.motivos.closed .motivos-body{display:none}
.mot-lift{flex:0 0 100%;scroll-snap-align:center;padding:0 12px 10px;box-sizing:border-box}
.mot-lift h4{font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700;margin-bottom:7px}
.mot-row{display:flex;align-items:flex-start;gap:9px}
.mot-row+.mot-row{margin-top:6px}
.mot-dots{display:flex;align-items:center;gap:3px;flex-shrink:0;padding-top:2px}
.mot-dots i{display:block;border-radius:50%}
.mot-dots i.big{width:13px;height:13px;background:#ef4444}
.mot-dots i.small{width:9px;height:9px}
.mot-txt{font-size:11px;line-height:1.4;color:var(--text);font-weight:400;letter-spacing:.2px}

/* ── Pantallas bajas ──────────────────────────────── */
/* Con la guía puesta, en un teléfono de pantalla corta los botones de voto se
   iban abajo del borde y había que scrollear para votar. Eso no puede pasar: en
   pantalla baja se achica todo lo que es informativo —el círculo de vista previa,
   los datos del atleta, los márgenes— y se dejan intactos los botones y la guía,
   que son lo que el juez usa y lee. */
@media (max-height:800px){
  #panel{padding:10px;gap:7px}
  .athlete-info .ath-name{font-size:clamp(17px,4.4vw,24px)}
  .athlete-info .ath-weight{font-size:clamp(32px,9vw,46px)}
  .athlete-info .ath-meta,.athlete-info .ath-lift{font-size:11px}
  .preview{gap:4px}
  .preview-big{width:48px;height:48px;border-width:3px}
  .preview-small{width:16px;height:16px;border-width:2px}
  .preview-label{margin-top:0}
  .vote-btn{padding:13px 10px;gap:4px}
  .vote-btn .dot-big{width:28px;height:28px}
  .vote-grid{gap:9px}
  .mot-row+.mot-row{margin-top:4px}
}
/* Teléfonos muy antiguos: ni achicando todo entra la guía entera. Se le pone
   tope y se lee deslizando hacia abajo dentro de ella. Sigue estando a la vista
   y, sobre todo, los botones de voto no se van de la pantalla. */
@media (max-height:700px){
  .mot-lift{max-height:104px;overflow-y:auto;overscroll-behavior-y:contain}
}

/* ── Vote buttons ─────────────────────────────────── */
.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
.vote-btn{padding:20px 12px;border-radius:16px;border:3px solid transparent;background:var(--card);font-family:Oswald;font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px}
.vote-btn:active{transform:scale(.95)}
.vote-btn .dot-big{width:36px;height:36px;border-radius:50%}
.vote-btn .dot-small{width:12px;height:12px;border-radius:50%}

.vote-btn.white-btn{border-color:#f0f0f0;color:#f0f0f0}
.vote-btn.white-btn .dot-big{background:#f0f0f0}
.vote-btn.white-btn .dot-small{background:#f0f0f0}
.vote-btn.white-btn:active,.vote-btn.white-btn.selected{background:rgba(240,240,240,.12)}

.vote-btn.red-btn{border-color:#ef4444;color:#ef4444}
.vote-btn.red-btn .dot-big{background:#ef4444}
.vote-btn.red-btn .dot-small{background:#ef4444}
.vote-btn.red-btn:active,.vote-btn.red-btn.selected{background:rgba(239,68,68,.12)}

.vote-btn.blue-btn{border-color:#3b82f6;color:#3b82f6}
.vote-btn.blue-btn .dot-big{background:#ef4444}  /* big = red = no lift */
.vote-btn.blue-btn .dot-small{background:#3b82f6}
.vote-btn.blue-btn:active,.vote-btn.blue-btn.selected{background:rgba(59,130,246,.12)}

.vote-btn.yellow-btn{border-color:#f59e0b;color:#f59e0b}
.vote-btn.yellow-btn .dot-big{background:#ef4444}  /* big = red = no lift */
.vote-btn.yellow-btn .dot-small{background:#f59e0b}
.vote-btn.yellow-btn:active,.vote-btn.yellow-btn.selected{background:rgba(245,158,11,.12)}

.vote-btn.selected{box-shadow:0 0 0 4px rgba(255,255,255,.15)}

/* ── Action bar ───────────────────────────────────── */
.action-bar{display:flex;gap:10px;width:100%;max-width:360px}
.btn-timer{flex:2;padding:14px;border-radius:12px;border:2px solid var(--green);background:rgba(34,197,94,.1);color:var(--green);font-family:Oswald;font-size:15px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .15s}
.btn-timer:active{transform:scale(.97);background:rgba(34,197,94,.2)}
.btn-clear{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:transparent;color:var(--muted);font-family:Oswald;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s}
.btn-clear:active{transform:scale(.97);border-color:var(--accent);color:var(--accent)}
.btn-clear.has-vote{border-color:#ef4444;color:#ef4444}
</style>
</head>
<body>

<!-- ══ LOGIN ════════════════════════════════════════════════
     Es lo PRIMERO que se ve, siempre. No hay forma de llegar a juzgar sin entrar
     con una cuenta: quién marcó cada luz tiene que quedar claro. La sesión dura
     lo que dure la jornada y se cierra sola — ver SESION_MAX_MS más abajo. -->
<div id="login" class="screen active">
  <div>
    <div class="logo">YOUR<span>LIFT</span></div>
    <div class="subtitle">Panel de Jueces</div>
  </div>
  <p id="logMsg" style="font-size:13px;color:var(--muted);text-align:center;max-width:320px;line-height:1.6">
    Entra con tu cuenta de juez para que tus luces lleguen a la tarima.
  </p>
  <input id="logEmail" class="log-in" type="email" inputmode="email" autocomplete="username"
         placeholder="Correo" autocapitalize="off" spellcheck="false">
  <input id="logPass" class="log-in" type="password" autocomplete="current-password"
         placeholder="Clave" onkeydown="if(event.key==='Enter')entrar()">
  <div id="logErr" style="font-size:12px;color:#ef4444;min-height:16px;text-align:center"></div>
  <button id="logBtn" class="pick-btn cen" onclick="entrar()" style="font-size:18px">ENTRAR</button>
  <p style="font-size:11px;color:var(--muted);text-align:center;max-width:320px;line-height:1.5;opacity:.8">
    La sesión se cierra al cerrar esta página, y también sola a las 4 horas.
  </p>
</div>

<!-- ══ PICK SCREEN ══════════════════════════════════════════ -->
<div id="pick" class="screen">
  <div>
    <div class="logo">YOUR<span>LIFT</span></div>
    <div class="subtitle">Panel de Jueces</div>
  </div>
  <p style="font-size:13px;color:var(--muted)">Selecciona tu posición</p>
  <button class="pick-btn izq" onclick="selectPos('izq')">◀ JUEZ IZQ</button>
  <button class="pick-btn cen" onclick="selectPos('central')">● JUEZ CENTRAL</button>
  <button class="pick-btn der" onclick="selectPos('der')">JUEZ DER ▶</button>
</div>

<!-- ══ PANEL SCREEN ═════════════════════════════════════════ -->
<div id="panel" class="screen">

  <!-- Header -->
  <div class="panel-header">
    <div class="pos-badge" id="posBadge">—</div>
    <div id="tarimaBadge" style="display:none;font-size:11px;font-weight:700;letter-spacing:2px;padding:6px 12px;border-radius:8px;border:2px solid var(--gold);color:var(--gold)"></div>
    <div style="text-align:center;font-size:11px;color:var(--muted)" id="liftBadge">—</div>
    <div onclick="abrirLogin()" style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);cursor:pointer">
      <div class="fb-dot" id="fbDot"></div><span id="fbLabel">Conectando</span>
    </div>
  </div>

  <!-- Athlete info -->
  <div class="athlete-info">
    <div class="ath-name" id="athName">Esperando…</div>
    <div class="ath-meta" id="athMeta">—</div>
    <div class="ath-weight" id="athWeight">—</div>
    <div class="ath-lift" id="athLiftLabel">—</div>
  </div>

  <!-- Preview lights -->
  <div class="preview">
    <div class="preview-big" id="prevBig"></div>
    <div class="preview-small" id="prevSmall"></div>
    <div class="preview-label" id="prevLabel">SIN VOTO</div>
  </div>

  <!-- Las tres guías de motivos de nulo, siempre a la vista -->
  <div class="motivos" id="motivos">
    <div class="motivos-head" onclick="toggleMotivos()">
      <span id="motTitulo">MOTIVOS DE NULO</span>
      <span class="mot-nav" id="motNav"></span>
      <span class="chev" id="motChev">▾</span>
    </div>
    <div class="motivos-body" id="motBody"></div>
  </div>

  <!-- Vote buttons -->
  <div class="vote-grid">
    <button class="vote-btn white-btn" onclick="castVote('white')">
      <div class="dot-big"></div>
      <div class="dot-small"></div>
      BLANCO
    </button>
    <button class="vote-btn red-btn" onclick="castVote('red')">
      <div class="dot-big"></div>
      <div class="dot-small"></div>
      ROJO
    </button>
    <button class="vote-btn blue-btn" onclick="castVote('blue')">
      <div class="dot-big" style="background:#ef4444"></div>
      <div class="dot-small"></div>
      AZUL
    </button>
    <button class="vote-btn yellow-btn" onclick="castVote('yellow')">
      <div class="dot-big" style="background:#ef4444"></div>
      <div class="dot-small"></div>
      AMARILLO
    </button>
  </div>

  <!-- Action bar: timer + limpiar -->
  <div class="action-bar">
    <button class="btn-timer" id="btnTimer" onclick="sendStartTimer()" style="display:none">▶ INICIAR TIMER</button>
    <button class="btn-clear" id="btnClear" onclick="clearVote()">✕ LIMPIAR</button>
  </div>

  <!-- Para no dejar la sesión abierta en un teléfono al terminar el campeonato. -->
  <button onclick="salir()" style="background:none;border:none;color:var(--muted);font-family:Oswald;font-size:11px;letter-spacing:1px;text-decoration:underline;cursor:pointer;padding:4px 8px">
    Cerrar sesión en este dispositivo
  </button>

</div>

<script type="module">
// ══ Firebase ═══════════════════════════════════════════════
const FB_CFG={apiKey:"AIzaSyA21IHMus2bklPLJm7ExRrVJJL9bzLhyp4",authDomain:"fechipo-db-13148.firebaseapp.com",projectId:"fechipo-db-13148",storageBucket:"fechipo-db-13148.firebasestorage.app",messagingSenderId:"551573388751",appId:"1:551573388751:web:5fcc377a8d595378ab26ba"};

let fbDB=null,fbReady=false,fbSesion=false;

// ── En qué tarima está este juez ────────────────────────────
// En un campeonato de dos tarimas cada una tiene sus propios jueces y sus propias
// luces. Sin esto, los tres jueces de la tarima 1 y los tres de la tarima 2
// escribirían el mismo documento: se pisarían el voto y las luces saldrían
// cruzadas en las dos pantallas. El link lo entrega el panel de Transmisión.
const TARIMA=(()=>{try{return new URLSearchParams(location.search).get('tarima')||null}catch(e){return null}})();
const JUEZ_DOC=TARIMA?'current_T'+TARIMA:'current';

(async()=>{
  try{
    const{initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const fb=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    // Las reglas piden sesión para escribir los votos. Esta página no tenía el
    // módulo de auth, así que sus escrituras salían ANÓNIMAS y Firestore las
    // rechazaba: el juez veía su luz en la tablet y no llegaba a ningún lado.
    // Con el módulo cargado se usa la sesión que ya tiene ese navegador (la de
    // haber entrado al livecast o al panel con la cuenta del evento).
    const fa=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    const app=initializeApp(FB_CFG);
    fbDB=fb.getFirestore(app);
    window._fb=fb;
    fbReady=true;
    setFBStatus(true);
    startAthleteListener();
    // …y si ese navegador NO tiene sesión, se inicia acá mismo. Antes había que
    // ir a entrar al admin o al livecast en el mismo navegador y recién volver:
    // en la tablet donde ya se había entrado funcionaba, en el teléfono del juez
    // decía "sin permiso" y no había en la página dónde arreglarlo.
    fbAuth=fa.getAuth(app);
    _fa=fa;
    // La sesión NO se guarda entre visitas: se borra al cerrar la página. Por
    // defecto Firebase la deja en el navegador para siempre, y en el teléfono de
    // un juez prestado eso significa que el que lo tome después entra sin que
    // nadie le pregunte nada. Acá la sesión vive lo que vive la pestaña.
    try{ await fa.setPersistence(fbAuth,fa.browserSessionPersistence); }
    catch(e){ console.warn('persistencia de sesión',e); }
    fa.onAuthStateChanged(fbAuth,u=>{
      // Puede llegar una sesión que no se abrió acá: la del panel o la del
      // livecast en ese mismo navegador. No sirve — hay que ver a la persona
      // entrar. Sin la marca de esta pestaña, se cierra y se vuelve a pedir.
      if(u&&!_sesionVigente()){ _vencerSesion(false); return; }
      fbSesion=!!u;
      setFBStatus(true);
      if(u){ _armarVigilancia(); cerrarLogin(); } else abrirLogin();
    });
  }catch(e){
    console.error('Firebase error',e);
    setFBStatus(false);
  }
})();

function setFBStatus(ok){
  document.getElementById('fbDot').className='fb-dot'+(ok&&fbSesion?' on':'');
  document.getElementById('fbLabel').textContent=!ok?'Sin conexión':(fbSesion?'En vivo':'Sin sesión — toca aquí');
}

// ══ Sesión ═════════════════════════════════════════════════
// La sesión de Firebase vive en el navegador, no en la cuenta: entrar en la
// tablet no sirve para el teléfono, y Chrome no comparte con el navegador de
// Samsung ni con una pestaña de incógnito. Por eso cada dispositivo que vaya a
// juzgar necesita entrar — y se hace acá, sin pasar por el panel.
//
// Cuánto dura. Un juez marca luces a nombre de una cuenta, así que la sesión no
// puede quedar abierta después de la jornada: el teléfono se presta, se deja en
// la mesa, se lo lleva otro. Se cierra sola de dos formas:
//   · al cerrar la página (la marca vive en sessionStorage, que muere con la
//     pestaña — y la sesión de Firebase está en browserSessionPersistence);
//   · y a las 4 horas de haber entrado, aunque la página siga abierta.
// Se avisa 10 minutos antes para que nadie se quede sin luces en medio de un
// intento, y al volver a entrar se regresa a la misma posición que tenía.
const SESION_MAX_MS=4*60*60*1000;
const SESION_AVISO_MS=10*60*1000;
const SESION_KEY='yl_juez_desde';
let fbAuth=null,_fa=null,_vigilancia=null,_avisado=false;
function _sesionDesde(){
  try{ return parseInt(sessionStorage.getItem(SESION_KEY)||'0',10)||0; }catch(e){ return 0; }
}
function _sesionVigente(){
  const d=_sesionDesde();
  return d>0 && (Date.now()-d)<SESION_MAX_MS;
}
function _marcarSesion(){
  try{ sessionStorage.setItem(SESION_KEY,String(Date.now())); }catch(e){}
  _avisado=false;
}
function _borrarMarca(){
  try{ sessionStorage.removeItem(SESION_KEY); }catch(e){}
}
// Cierra la sesión y vuelve a pedir la cuenta. `porTiempo` distingue las 4 horas
// cumplidas de una sesión que simplemente no se abrió en esta pestaña.
async function _vencerSesion(porTiempo){
  _borrarMarca();
  if(_vigilancia){clearInterval(_vigilancia);_vigilancia=null;}
  try{ if(_fa&&fbAuth)await _fa.signOut(fbAuth); }catch(e){ console.warn(e); }
  fbSesion=false; myVote=null;
  try{ updatePreview(); updateButtons(); }catch(e){}
  setFBStatus(true);
  abrirLogin(porTiempo
    ? 'Pasaron 4 horas desde que entraste. Vuelve a entrar con tu cuenta para seguir juzgando.'
    : 'Entra con tu cuenta de juez para que tus luces lleguen a la tarima.');
}
// Expuesta a propósito: la batería de pruebas necesita adelantar el reloj para
// ver qué pasa a las 4 horas sin esperarlas.
window._vencerSesion=_vencerSesion;
function _armarVigilancia(){
  if(_vigilancia)return;
  _vigilancia=setInterval(()=>{
    const d=_sesionDesde();
    if(!d)return;
    const queda=SESION_MAX_MS-(Date.now()-d);
    if(queda<=0){ _vencerSesion(true); return; }
    if(queda<=SESION_AVISO_MS&&!_avisado){
      _avisado=true;
      try{ showPulse('Tu sesión vence en '+Math.max(1,Math.round(queda/60000))+' min','#f59e0b'); }catch(e){}
    }
  },30000);
}
window.abrirLogin=function(msg){
  if(fbSesion)return;
  const m=document.getElementById('logMsg');
  if(m&&typeof msg==='string')m.textContent=msg;
  const pw=document.getElementById('logPass'); if(pw)pw.value='';
  document.getElementById('login').classList.add('active');
  document.getElementById('panel').classList.remove('active');
  document.getElementById('pick').classList.remove('active');
};
function cerrarLogin(){
  document.getElementById('login').classList.remove('active');
  // Si ya había elegido posición antes de que se venciera la sesión, vuelve
  // directo a juzgar. Hacerlo elegir de nuevo en medio de una tanda es perder
  // tiempo de tarima por nada.
  document.getElementById(myPos?'panel':'pick').classList.add('active');
}
window.salir=async function(){
  if(!confirm('¿Cerrar la sesión en este teléfono?\nTus luces dejan de llegar a la tarima hasta que vuelvas a entrar.'))return;
  myPos=null;
  await _vencerSesion(false);
};
window.entrar=async function(){
  const em=document.getElementById('logEmail').value.trim();
  const pw=document.getElementById('logPass').value;
  const err=document.getElementById('logErr');
  err.textContent='';
  if(!em||!pw){err.textContent='Falta el correo o la clave';return;}
  if(!fbAuth||!_fa){err.textContent='Conectando con el servidor… prueba de nuevo en unos segundos';return;}
  const btn=document.getElementById('logBtn');
  btn.disabled=true; btn.textContent='ENTRANDO…';
  try{
    await _fa.signInWithEmailAndPassword(fbAuth,em,pw);
    // La marca va ANTES de mostrar el panel: el observador de sesión la busca, y
    // sin ella daría por buena una sesión que no se abrió acá y cerraría todo.
    _marcarSesion();
    _armarVigilancia();
    // Se cierra acá, sin esperar a onAuthStateChanged. El observador igual va a
    // avisar, pero si por lo que sea no llega, el juez quedaría mirando el login
    // con la sesión ya iniciada y sin entender qué le falta.
    fbSesion=true; setFBStatus(true); cerrarLogin();
    showPulse('Sesión iniciada','#22c55e');
  }catch(e){
    const c=(e&&e.code)||'';
    err.textContent=/wrong-password|invalid-credential|user-not-found/.test(c)
      ? 'Correo o clave incorrectos'
      : (/network/.test(c)?'Sin internet':'No se pudo entrar');
    console.error(e);
  }
  btn.disabled=false; btn.textContent='ENTRAR';
};

// ══ State ══════════════════════════════════════════════════
let myPos=null;     // 'izq' | 'central' | 'der'
let myVote=null;    // 'white' | 'red' | 'blue' | 'yellow' | null
const POS_LABEL={izq:'◀ JUEZ IZQ',central:'● CENTRAL',der:'JUEZ DER ▶'};
const LIFT_LABEL={sq:'SQUAT',bp:'BENCH PRESS',dl:'DEADLIFT'};
const VOTE_COLOR={white:'#f0f0f0',red:'#ef4444',blue:'#3b82f6',yellow:'#f59e0b'};

// ══ Motivos de nulo ════════════════════════════════════════
// Qué significa cada combinación de luces, por movimiento. El juez marca el
// color; esto es solo el recordatorio de por qué. Si algún criterio cambia, se
// edita acá y listo — no está repartido por la página.
const MOTIVOS={
  sq:{
    nombre:'SENTADILLA',
    red:'Profundidad: no alcanza la paralela.',
    blue:'Descenso de la barra · doble rebote · rodillas no bloqueadas.',
    yellow:'Se salta el comando · cambia la posición inicial · no termina el movimiento.'
  },
  bp:{
    nombre:'PRESS DE BANCA',
    red:'No toca el pecho · no da la profundidad de codos.',
    blue:'Descenso de la barra · codos no bloqueados al inicio o al término del movimiento.',
    yellow:'Se salta el comando · cambia la postura inicial · levanta glúteo, cabeza o pies · sube la barra con el pecho.'
  },
  dl:{
    nombre:'PESO MUERTO',
    red:'Hombros no bloqueados o por delante de la línea de la barra.',
    blue:'Tirones en la barra al subir · apoya la barra en las piernas o la sube contra los muslos.',
    yellow:'Se salta el comando · cambia la posición inicial · no termina el movimiento.'
  }
};
// Las tres guías se dibujan siempre, las tres completas. El juez que está en
// banca puede querer mirar la de peso muerto un minuto antes de que empiece, y
// antes no la tenía: se mostraba solo la del movimiento en tarima.
//
// La del movimiento que se está juzgando queda destacada y con la marca "EN
// TARIMA", para que la vista vaya sola a la que corresponde sin que las otras
// desaparezcan.
const ORDEN_MOT=['sq','bp','dl'];
let _liftActual=null;
let _motMontado=false;

// Se dibuja UNA vez: las tres guías quedan puestas una al lado de la otra y no se
// vuelven a armar. Si se rearmaran en cada cambio, al juez que está leyendo la de
// peso muerto se le movería la pantalla debajo del dedo.
function _montarMotivos(){
  const cont=document.getElementById('motBody');
  if(!cont||_motMontado)return;
  const fila=(color,id)=>
    '<div class="mot-row"><div class="mot-dots"><i class="big"></i><i class="small" style="background:'+color+'"></i></div>'+
    '<div class="mot-txt" id="'+id+'"></div></div>';
  cont.innerHTML=ORDEN_MOT.map(k=>
    '<div class="mot-lift" id="mot_'+k+'">'+
      '<h4 id="mot_'+k+'_tit"></h4>'+
      fila('#ef4444','mot_'+k+'_red')+
      fila('#3b82f6','mot_'+k+'_blue')+
      fila('#f59e0b','mot_'+k+'_yellow')+
    '</div>').join('');
  // El texto va por textContent y no dentro del HTML de arriba: así un motivo con
  // un signo raro no puede romper el bloque entero.
  ORDEN_MOT.forEach(k=>{
    const m=MOTIVOS[k];
    document.getElementById('mot_'+k+'_tit').textContent=m.nombre;
    document.getElementById('mot_'+k+'_red').textContent=m.red;
    document.getElementById('mot_'+k+'_blue').textContent=m.blue;
    document.getElementById('mot_'+k+'_yellow').textContent=m.yellow;
  });
  document.getElementById('motNav').innerHTML=ORDEN_MOT.map(()=>'<i></i>').join('');
  // Al deslizar se actualizan el título y los puntitos. Se mira dónde quedó el
  // scroll en vez de escuchar gestos: así funciona igual con el dedo, con el
  // mouse y con el teclado.
  cont.addEventListener('scroll',()=>{
    clearTimeout(cont._t);
    cont._t=setTimeout(()=>_marcarMotivo(Math.round(cont.scrollLeft/Math.max(1,cont.clientWidth))),60);
  },{passive:true});
  _motMontado=true;
  _marcarMotivo(0);
}
// El nombre del movimiento va en la propia tarjeta, no en el encabezado: así se
// mueve junto con el dedo y no queda repetido dos veces en una pantalla chica.
// Acá solo se marca en cuál de las tres está parado.
function _marcarMotivo(i){
  i=Math.max(0,Math.min(ORDEN_MOT.length-1,i||0));
  const nav=document.getElementById('motNav');
  if(nav)[...nav.children].forEach((d,j)=>d.classList.toggle('on',j===i));
}
// Cuando cambia el movimiento en la tarima, la guía que corresponde se trae sola
// al frente. El juez igual puede deslizar a cualquiera de las otras.
function pintarMotivos(lift){
  _montarMotivos();
  const i=ORDEN_MOT.indexOf(lift);
  if(i<0)return;
  const cont=document.getElementById('motBody');
  if(cont)cont.scrollTo({left:i*cont.clientWidth,behavior:'smooth'});
  _marcarMotivo(i);
}
window.pintarMotivos=pintarMotivos;
// Se puede plegar: el juez que ya se los sabe recupera la pantalla, y la
// elección le queda guardada en ese teléfono.
window.toggleMotivos=function(){
  const el=document.getElementById('motivos');
  const cerrado=el.classList.toggle('closed');
  document.getElementById('motChev').textContent=cerrado?'▸':'▾';
  try{localStorage.setItem('_yl_jueces_motivos',cerrado?'0':'1');}catch(e){}
};
(function(){
  try{
    if(localStorage.getItem('_yl_jueces_motivos')==='0'){
      document.getElementById('motivos').classList.add('closed');
      document.getElementById('motChev').textContent='▸';
    }
  }catch(e){}
  pintarMotivos(null);
})();

// ══ Position selection ═════════════════════════════════════
window.selectPos=function(pos){
  myPos=pos;
  const tb=document.getElementById('tarimaBadge');
  if(tb&&TARIMA){tb.textContent='TARIMA '+TARIMA;tb.style.display='';}
  document.getElementById('posBadge').textContent=POS_LABEL[pos];
  document.getElementById('pick').classList.remove('active');
  document.getElementById('panel').classList.add('active');
  // Timer button only for central judge
  const btn=document.getElementById('btnTimer');
  if(btn)btn.style.display=pos==='central'?'block':'none';
};

// ══ Athlete listener (shows current athlete from Firebase) ═
function startAthleteListener(){
  if(!fbReady)return;
  // Listen to judge_decisions/current for athlete info
  window._fb.onSnapshot(window._fb.doc(fbDB,'judge_decisions',JUEZ_DOC),(snap)=>{
    if(!snap.exists())return;
    const d=snap.data();
    // If reset signal, clear local vote UI
    if(d.reset_ts&&d.reset_ts>(_lastReset||0)){
      _lastReset=d.reset_ts;
      myVote=null;
      updatePreview();
      updateButtons();
    }
    if(d.athlete_name)document.getElementById('athName').textContent=d.athlete_name;
    if(d.athlete_weight)document.getElementById('athWeight').textContent=d.athlete_weight+'  kg';
    if(d.athlete_lift)document.getElementById('liftBadge').textContent=(LIFT_LABEL[d.athlete_lift]||d.athlete_lift)+' · Int.'+(d.athlete_round!=null?d.athlete_round+1:'—');
    if(d.athlete_lift)document.getElementById('athLiftLabel').textContent=(LIFT_LABEL[d.athlete_lift]||d.athlete_lift)+' · Intento '+(d.athlete_round!=null?d.athlete_round+1:'—');
    // Los motivos siguen al movimiento que está en la tarima.
    if(d.athlete_lift&&d.athlete_lift!==_liftActual){_liftActual=d.athlete_lift;pintarMotivos(_liftActual);}
    // Y si ya votaron los tres, se programa el apagado.
    _programarLimpieza(d);
  });
}
let _lastReset=0;

// ══ Las luces se apagan solas ═══════════════════════════════
// Cuando los tres jueces votaron, las luces quedaban puestas hasta que alguien
// las cambiara: en la pantalla de tarima se veían las del intento anterior
// mientras el siguiente atleta ya estaba en la barra.
//
// Nadie las limpiaba. resetJudgeLights() del control solo corre con el "modo
// jueces" encendido, y ese modo no se usa —es el que da válido/nulo desde las
// luces, que es justo lo que no se quiere—. Así que la limpieza la hace esta
// página, que es la misma que puso los votos.
//
// Se limpia el documento, no la pantalla: la tarima es un espejo y no escribe
// nada, así que si acá no se borra, allá no se apaga. De paso queda lista la
// vuelta siguiente, con los tres teléfonos en blanco.
const LUCES_SEGUNDOS=5;   // lo que quedan a la vista una vez completas
let _limpiezaTimer=null,_completo=false;
function _programarLimpieza(d){
  const completo=!!(d.izq&&d.central&&d.der);
  _completo=completo;
  if(!completo){
    if(_limpiezaTimer){clearTimeout(_limpiezaTimer);_limpiezaTimer=null;}
    return;
  }
  if(_limpiezaTimer)return;   // ya está contando
  // Los tres teléfonos programan la limpieza, no solo uno: si el juez central
  // cerró la página o se quedó sin señal, las luces igual se apagan. Van
  // escalonados para que normalmente escriba uno solo; si dos llegan a escribir,
  // escriben lo mismo y no pasa nada.
  const atraso={izq:0,central:250,der:500}[myPos]||0;
  _limpiezaTimer=setTimeout(async()=>{
    _limpiezaTimer=null;
    if(!_completo)return;     // alguien ya las limpió mientras esperábamos
    if(!fbReady||!fbSesion)return;
    try{
      await window._fb.updateDoc(window._fb.doc(fbDB,'judge_decisions',JUEZ_DOC),
        {izq:null,central:null,der:null,reset_ts:Date.now()});
    }catch(e){console.warn('No se pudieron apagar las luces',e);}
  },LUCES_SEGUNDOS*1000+atraso);
}

// ══ Vote ════════════════════════════════════════════════════
window.castVote=async function(color){
  if(!myPos){alert('Selecciona tu posición primero');return;}
  myVote=color;
  updatePreview();
  updateButtons();
  if(!fbReady){showPulse('Sin Firebase — voto solo local','#ef4444');return;}
  try{
    await window._fb.updateDoc(window._fb.doc(fbDB,'judge_decisions',JUEZ_DOC),{[myPos]:color});
    showPulse('Voto enviado','#22c55e');
  }catch(e){
    // Doc might not exist yet, create it
    try{
      await window._fb.setDoc(window._fb.doc(fbDB,'judge_decisions',JUEZ_DOC),{izq:null,central:null,der:null,[myPos]:color,reset_ts:0,athlete_name:'',athlete_weight:0,athlete_lift:'',athlete_round:0});
      showPulse('Voto enviado','#22c55e');
    }catch(e2){
      // Antes decía solo "Error al enviar" y el juez no tenía cómo saber por qué.
      const sinPermiso=e2&&(e2.code==='permission-denied'||/permission/i.test(e2.message||''));
      showPulse(sinPermiso?'Sin permiso — inicia sesión en este dispositivo':'Error al enviar','#ef4444');
      // Y se abre el login en vez de dejar al juez leyendo un cartel sin salida.
      if(sinPermiso&&!fbSesion)abrirLogin();
      console.error(e2);
    }
  }
};

window.clearVote=async function(){
  myVote=null;
  updatePreview();
  updateButtons();
  if(!fbReady||!myPos)return;
  try{
    await window._fb.updateDoc(window._fb.doc(fbDB,'judge_decisions',JUEZ_DOC),{[myPos]:null});
    showPulse('Voto limpiado','#7A8FA6');
  }catch(e){console.warn('Clear vote error',e);}
};

// ══ Timer signal ════════════════════════════════════════════
window.sendStartTimer=async function(){
  if(!fbReady){showPulse('Sin Firebase','#ef4444');return;}
  try{
    await window._fb.setDoc(window._fb.doc(fbDB,'timer_control',JUEZ_DOC),{action:'start',ts:Date.now(),by:myPos||'judge'});
    showPulse('Timer iniciado','#22c55e');
  }catch(e){showPulse('Error','#ef4444');console.error(e);}
};

// ══ UI updates ══════════════════════════════════════════════
function updatePreview(){
  const bigEl=document.getElementById('prevBig');
  const smallEl=document.getElementById('prevSmall');
  const labelEl=document.getElementById('prevLabel');
  if(!myVote){
    bigEl.style.background='var(--border)';bigEl.style.borderColor='var(--border)';bigEl.style.boxShadow='none';
    smallEl.style.background='var(--border)';smallEl.style.borderColor='var(--border)';smallEl.style.boxShadow='none';
    labelEl.textContent='SIN VOTO';labelEl.style.color='var(--muted)';
    return;
  }
  const bigCol=myVote==='white'?'#f0f0f0':'#ef4444';
  const smallCol=VOTE_COLOR[myVote];
  const bigGlow=myVote==='white'?'0 0 28px rgba(240,240,240,.7)':'0 0 28px rgba(239,68,68,.7)';
  bigEl.style.background=bigCol;bigEl.style.borderColor=bigCol;bigEl.style.boxShadow=bigGlow;
  smallEl.style.background=smallCol;smallEl.style.borderColor=smallCol;smallEl.style.boxShadow='0 0 10px '+smallCol;
  const labels={white:'BUENO ✓',red:'NO LIFT ✗',blue:'NO LIFT ✗',yellow:'NO LIFT ✗'};
  labelEl.textContent=labels[myVote];
  labelEl.style.color=myVote==='white'?'#22c55e':'#ef4444';
}

function updateButtons(){
  document.querySelectorAll('.vote-btn').forEach(b=>b.classList.remove('selected'));
  if(myVote){
    const map={white:'.white-btn',red:'.red-btn',blue:'.blue-btn',yellow:'.yellow-btn'};
    const btn=document.querySelector(map[myVote]);
    if(btn)btn.classList.add('selected');
  }
  const clearBtn=document.getElementById('btnClear');
  if(myVote)clearBtn.classList.add('has-vote');
  else clearBtn.classList.remove('has-vote');
}

function showPulse(msg,color){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0D1F38;border:1px solid '+color+';color:'+color+';padding:10px 20px;border-radius:10px;z-index:9999;font-size:13px;letter-spacing:1px;font-family:Oswald;font-weight:700';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}
</script>
