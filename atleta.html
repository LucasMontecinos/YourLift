<script type="module">
const FB_CFG={apiKey:"AIzaSyA21IHMus2bklPLJm7ExRrVJJL9bzLhyp4",authDomain:"fechipo-db-13148.firebaseapp.com",projectId:"fechipo-db-13148"};

let DB=[], INSC=[], NOM_EVENTS=[];
let _fbDB=null, _fbMod=null; // Exposed for atletas_pending merge after data.json loads
// Comparativa en categoría. Antes esto era una constante gigante generada a mano y
// pegada acá, así que envejecía: mostraba el total que el atleta tenía el día que se
// generó, no el de hoy. Ahora se arma en el momento desde el padrón que la página ya
// carga (`_peersBuild`), así que un resultado nuevo aparece apenas se publica.
let PEERS={};
// Cómo se lee la modalidad de un resultado. Son CUATRO cosas distintas y hasta
// ahora la comparativa miraba solo dos (clásico vs equipado), así que una banca
// sola entraba a la bolsa del powerlifting: el que solo hizo Only Bench aparecía
// en el grupo de powerlifting con su banca puesta como si fuera un total, y el que
// hizo las dos podía terminar comparando peras con manzanas.
function _modalKey(c){
  const m=String((c&&c.modalidad)||'').toLowerCase();
  const isEq=/equip/.test(m);
  // "Powerlifting Classic + Only Bench Classic" es una inscripción a las dos cosas,
  // pero el resultado que la trae es el total: manda powerlifting.
  if(/powerlifting|potencia/.test(m))return isEq?'equipped':'classic';
  if(/only ?bench|bench ?only|solo ?banca|press ?banca/.test(m)||(c&&c.view==='bench'))
    return isEq?'bench_eq':'bench';
  return isEq?'equipped':'classic';
}
const _MODAL_LABEL={classic:'Powerlifting Clásico',equipped:'Powerlifting Equipado',
  bench:'Only Bench Clásico',bench_eq:'Only Bench Equipado'};
// Mejor total del atleta DENTRO de la categoría y modalidad del grupo. No se filtra
// por división: si un Junior hizo su mejor total compitiendo en Open en la misma
// categoría, ese es el que vale para compararse.
function _peerMejor(a,key){
  const p=String(key).split('|'), cat=p[1], modal=p[3];
  let total=0, glp=0;
  (a.competencias||[]).forEach(c=>{
    const r=c.resultado||{};
    if(!(r.total>0))return;
    if(_modalKey(c)!==modal)return;
    if(String(c.categoria||'').trim()!==cat)return;
    if(r.total>total){total=r.total;glp=+(r.glp||r.gl||0)||0;}
  });
  return {total,glp};
}
function _peersBuild(db){
  const grupos={};
  (db||[]).forEach(a=>{
    // Un atleta puede pertenecer a varios grupos: el que compite en powerlifting y
    // en banca sola entra en los dos, cada uno con la marca de ESE grupo.
    _peerKeys(a).forEach(key=>{
      const m=_peerMejor(a,key);
      if(!(m.total>0))return;
      (grupos[key]=grupos[key]||[]).push({codigo:a.codigo,nombre:a.nombre,total:m.total,glp:m.glp});
    });
  });
  const out={};
  Object.keys(grupos).forEach(k=>{
    const ms=grupos[k].sort((x,y)=>y.total-x.total||String(x.nombre).localeCompare(String(y.nombre)));
    const tot=ms.map(m=>m.total), gl=ms.map(m=>m.glp).filter(x=>x>0);
    const pct=p=>tot[Math.min(tot.length-1,Math.max(0,Math.round((1-p)*(tot.length-1))))];
    const prom=l=>l.length?l.reduce((s,x)=>s+x,0)/l.length:0;
    out[k]={n:ms.length,
      avg:+prom(tot).toFixed(1), top:tot[0], p75:pct(.75), p50:pct(.5), p25:pct(.25),
      glp_avg:+prom(gl).toFixed(2), glp_top:gl.length?Math.max.apply(null,gl):0,
      // `totals` es el grupo ENTERO: con él se calcula el puesto y el percentil.
      // `members` son solo los que se dibujan (el top 10). Antes el puesto salía de
      // members, así que un atleta de un grupo de 47 quedaba "#5 de 11" y con el
      // percentil hundido: el cartel de arriba decía 47 y el de al lado, 11.
      totals:tot,
      members:ms.slice(0,10)};
  });
  return out;
}

// ── Overlays que dependen de data.json ────────────────────
// Los datos que llegan de Firestore y se pegan sobre un atleta (resultados de
// competencias cerradas en el livecast, fotos, logros, posiciones) buscan al atleta
// dentro de DB. Si DB todavía no cargó, no encuentran a nadie y se pierden — no hay
// reintento. Con la caché caliente eso pasaba SIEMPRE: los overlays salen del
// localStorage y se aplican al toque, mucho antes de que termine de bajar data.json,
// así que un atleta se quedaba sin su última competencia hasta que a alguien se le
// vencía la caché. Ahora se encolan y se aplican apenas DB está lista.
window._DB_LISTA=false;
const _pendientesDB=[];
function _conDB(fn){ if(window._DB_LISTA)fn(); else _pendientesDB.push(fn); }
function _dbLista(){ window._DB_LISTA=true; while(_pendientesDB.length){ try{ _pendientesDB.shift()(); }catch(e){ console.warn('[overlay]',e); } } }

// ── Cache helpers ─────────────────────────────────────────
function _aC(k,ttl){try{const v=localStorage.getItem('_yfc_'+k);if(!v)return null;const o=JSON.parse(v);if(Date.now()-o.ts<ttl)return o.d;}catch(e){}return null;}
function _aSC(k,d){try{localStorage.setItem('_yfc_'+k,JSON.stringify({ts:Date.now(),d}));}catch(e){}}

// ── Firebase ─────────────────────────────────────────────
(async()=>{
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const fb=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app=initializeApp(FB_CFG);
    const db=fb.getFirestore(app);
    _fbDB=db; _fbMod=fb;

    // Inscripciones: getDocs + caché 5min
    const ci=_aC('atl_insc',5*60*1000);
    if(ci){INSC=ci;}
    else{fb.getDocs(fb.collection(db,'inscripciones')).then(snap=>{INSC=snap.docs.map(d=>({id:d.id,...d.data()}));_aSC('atl_insc',INSC);if(window._curCodigo)showProfile(window._curCodigo);});}

    // Eventos: getDocs + caché 10min
    const ce=_aC('atl_evs',10*60*1000);
    if(ce){NOM_EVENTS=ce;}
    else{fb.getDocs(fb.collection(db,'eventos')).then(snap=>{NOM_EVENTS=snap.docs.map(d=>({...d.data(),id:d.id})).filter(e=>e.status!=='archived');_aSC('atl_evs',NOM_EVENTS);});}

    // Fotos de perfil: getDocs + caché 30min
    const cf=_aC('atl_fotos',30*60*1000);
    const _applyFotos=docs=>{docs.forEach(data=>{const codigo=data.codigo||data.id;const ath=(DB||[]).find(a=>a.codigo===codigo);if(ath&&data.foto_url)ath.foto_url=data.foto_url;});if(window._curCodigo)showProfile(window._curCodigo);};
    if(cf){_conDB(()=>_applyFotos(cf));}
    else{fb.getDocs(fb.collection(db,'atleta_fotos')).then(snap=>{const docs=snap.docs.map(d=>({...d.data(),id:d.id}));_aSC('atl_fotos',docs);_conDB(()=>_applyFotos(docs));});}

    // Logros: getDocs + caché 30min
    const ca=_aC('atl_ach',30*60*1000);
    const _applyAch=docs=>{docs.forEach(data=>{const codigo=data.codigo||data.id;const ath=(DB||[]).find(a=>a.codigo===codigo);if(ath)ath.achievements=data.achievements||[];});if(window._curCodigo)showProfile(window._curCodigo);};
    if(ca){_conDB(()=>_applyAch(ca));}
    else{fb.getDocs(fb.collection(db,'atleta_achievements')).then(snap=>{const docs=snap.docs.map(d=>({...d.data(),id:d.id}));_aSC('atl_ach',docs);_conDB(()=>_applyAch(docs));});}

    // Resultados de competencias cerradas en livecast (en vivo, sin redeploy).
    // Mergea cada doc en el atleta correspondiente como nueva competencia.
    const _applyResults=docs=>{
      const _catPlus=(c,bw,sx)=>{var s=String(c||'').trim();if(s.indexOf('+')>=0)return s;var m=s.match(/(\d+(?:\.\d+)?)/);if(!m)return s;var n=parseFloat(m[1]);var f=/^(f|muj|w)/i.test(String(sx||''));if(n===84&&f&&(bw||0)>84)return '84+';if(n===120&&!f&&(bw||0)>120)return '120+';return s;};
      const _placeTab=(sx,mod,view)=>{const s=/^(f|muj|w)/i.test(String(sx||''))?'f':'m';const m=String(mod||'');const isOE=/special olympics|olimpiadas|\bOE\b/i.test(m);const isEq=/equipado|equipped/i.test(m);const isUni=/universitar/i.test(m);const isBench=view==='bench'||/only ?bench/i.test(m);if(isUni&&!isBench&&!isOE)return 'uni_'+s;if(isOE)return 'oe_'+s;if(isBench)return (isEq?'bch_eq_':'bch_cl_')+s;return (isEq?'eq_':'cl_')+s;};
      const _grp={};
      docs.forEach(d=>{if(!d.evento)return;const r=d.resultado||{};if(r.status==='DQ'||(r.total||0)<=0)return;if(d.source==='manual')return;const cat=_catPlus(d.categoria,r.bw,d.sexo);const div=String(d.division||'').toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');const key=[d.evento_id||d.evento,_placeTab(d.sexo,d.modalidad,d.view),cat,div].join('|');(_grp[key]=_grp[key]||[]).push({id:d.id,total:r.total||0,bw:r.bw||0});});
      const _placeMap={};
      Object.keys(_grp).forEach(k=>{_grp[k].sort((a,b)=>(b.total-a.total)||(a.bw-b.bw));_grp[k].forEach((e,i)=>{_placeMap[e.id]=i+1;});});
      docs.forEach(d=>{
        if(!d.evento)return;
        let ath = d.codigo ? (DB||[]).find(a=>a.codigo===d.codigo) : null;
        if(!ath && d.rut){const rnorm=String(d.rut).replace(/[^0-9kK]/g,'').toLowerCase();ath=(DB||[]).find(a=>String(a.rut||'').replace(/[^0-9kK]/g,'').toLowerCase()===rnorm);}
        if(!ath && d.nombre){const nnorm=String(d.nombre).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');ath=(DB||[]).find(a=>String(a.nombre||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')===nnorm);}
        if(!ath){ath={codigo:d.codigo||('FB_'+d.id),rut:d.rut||'',nombre:d.nombre||'',club:d.club||'',competencias:[]};(DB||[]).push(ath);}
        ath.competencias=ath.competencias||[];
        const _catPlus2=(c,bw,sx)=>{var s=String(c||'').trim();if(s.indexOf('+')>=0)return s;var m=s.match(/(\d+(?:\.\d+)?)/);if(!m)return s;var n=parseFloat(m[1]);var f=/^(f|muj|w)/i.test(String(sx||''));if(n===84&&f&&(bw||0)>84)return '84+';if(n===120&&!f&&(bw||0)>120)return '120+';return s;};
        const sameIdx=ath.competencias.findIndex(c=>c.evento===d.evento&&c.modalidad===d.modalidad);
        const comp={evento:d.evento,fecha:d.fecha||'',sexo:d.sexo||'',division:d.division||'',categoria:_catPlus2(d.categoria||'',(d.resultado||{}).bw||0,d.sexo||''),modalidad:d.modalidad||'',posicion:((d.posicion!=null&&d.posicion!=='')?parseInt(d.posicion,10):0)||_placeMap[d.id]||null,resultado:d.resultado||{},source:d.source||'yourlift_livecast'};
        if(sameIdx>=0)ath.competencias[sameIdx]=comp;else ath.competencias.push(comp);
      });
      // Los grupos de la comparativa se arman con data.json, que es de ayer. Estos
      // resultados son de recién, así que hay que rehacerlos: si no, el atleta se
      // compara con su marca nueva contra un grupo que todavía no la tiene.
      PEERS=_peersBuild(DB);
      if(window._curCodigo)showProfile(window._curCodigo);
    };
    const cr=_aC('atl_res',10*60*1000);
    if(cr){_conDB(()=>_applyResults(cr));}
    else{fb.getDocs(fb.collection(db,'competition_results')).then(snap=>{const docs=snap.docs.map(d=>({...d.data(),id:d.id}));_aSC('atl_res',docs);_conDB(()=>_applyResults(docs));});}

    // Overrides de posición para competencias históricas (data.json): getDocs + caché 1h
    const _applyPos=docs=>{window._HIST_POS={};docs.forEach(v=>{if(v.codigo&&v.evento)window._HIST_POS[v.codigo+'__'+v.evento]=v;});if(window._curCodigo)showProfile(window._curCodigo);};
    const cp=_aC('atl_pos',60*60*1000);
    if(cp){_conDB(()=>_applyPos(cp));}
    else{fb.getDocs(fb.collection(db,'comp_pos_overrides')).then(snap=>{const docs=snap.docs.map(d=>({...d.data(),id:d.id}));_aSC('atl_pos',docs);_conDB(()=>_applyPos(docs));});}

    // Logos de clubes: getDocs + caché 24h (reutiliza _yfc_clubs de index.html)
    const _applyClubs=docs=>{window._CLUBS_FS={};docs.forEach(v=>{if(v.slug&&v.logoUrl)window._CLUBS_FS[v.slug]=v;});};
    const cc=_aC('clubs',24*60*60*1000);
    if(cc){_applyClubs(cc);}
    else{fb.getDocs(fb.collection(db,'clubs')).then(snap=>{const docs=snap.docs.map(d=>({...d.data(),id:d.id}));_aSC('clubs',docs);_applyClubs(docs);});}
  }catch(e){console.warn('Firebase unavailable',e)}

  try{
    const _STOR='https://firebasestorage.googleapis.com/v0/b/fechipo-db-13148.firebasestorage.app/o/';
    DB=await fetch('data.json')
      .then(r=>r.ok?r.json():fetch(_STOR+'public%2Fdata.json?alt=media').then(r=>r.json()))
      .catch(()=>fetch(_STOR+'public%2Fdata.json?alt=media').then(r=>r.json()));
    PEERS=_peersBuild(DB);
    // Cargar records.json para mostrar reconocimientos
    try{window.RECORDS=await fetch('records.json')
      .then(r=>r.ok?r.json():fetch(_STOR+'public%2Frecords.json?alt=media').then(r=>r.json()))
      .catch(()=>fetch(_STOR+'public%2Frecords.json?alt=media').then(r=>r.json()));}catch(e){window.RECORDS={};}
    // Nómina Sudamericano (badges de inscripción en el perfil) — no bloquea la carga.
    // El flag de preview se captura ACÁ (una vez): showProfile() hace replaceState
    // y borra ?nominasuda=1 de la URL, así que no se puede releer después.
    window._NOMSUDA_PREVIEW=(()=>{try{return new URLSearchParams(location.search).get('nominasuda')==='1'}catch(e){return false}})();

    // Merge debutant athletes from Firestore (inscribed but not yet in data.json)

          let fn=pd.fechaNac||'';

          const insc=INSC.find(i=>rutNorm(i.rut)===rutNorm(pd.rut));
          const ev=insc?NOM_EVENTS.find(e=>e.id===insc.evento):null;
          DB.push({
            codigo:pd.codigo, rut:pd.rut, nombre:pd.nombre,
            fechaNac:fn, club:pd.club||'', debut:String(new Date().getFullYear()),
            zona:pd.zona||'', _pending:true,
            competencias: insc?[{
              evento:ev?.name||insc.evento||'',
              division:insc.division||'', categoria:insc.categoria||'',
              modalidad:insc.modalidad||'', sexo:insc.sexo||''
            }]:[]
          });
        });
      }catch(ep){console.warn('[atletas_pending]',ep.message);}

      // Ediciones y bajas del panel (yl-ediciones.js). La copia y el criterio son
      // los mismos para todas las páginas: antes cada una tenía su versión y no
      // decían lo mismo.
      try{
        const edDocs=await window.YLEdiciones.cargar(async()=>{
          const snap=await _fbMod.getDocs(_fbMod.collection(_fbDB,'athlete_edits'));
          return snap.docs.map(d=>({...d.data(),id:d.id}));
        });
        window.YLEdiciones.aplicar(DB,edDocs);
      }catch(ee){console.warn('[athlete_edits]',ee.message);}
    }

    // Recién acá DB está completa (data.json + altas pendientes + ediciones del
    // admin, que pueden cambiar código o RUT). Se sueltan los overlays encolados.
    _dbLista();

    const params=new URLSearchParams(location.search);
    const cod=params.get('codigo');
    const q=params.get('q');
    if(cod){
      showProfile(cod.toUpperCase());
    } else if(q){
      // Name search from ranking — auto-search and show best match
      document.getElementById('sInput').value=q;
      onSearch(q);
    }
  }catch(e){console.warn('data.json unavailable',e)}
  // Si data.json no cargó, igual hay que soltar la cola: sin esto los overlays
  // quedarían esperando para siempre y la página no mostraría nada.
  if(!window._DB_LISTA)_dbLista();
})();

// ── Helpers ──────────────────────────────────────────────
function nrm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}

// Sexo + categoría + división con los que se compara el atleta. Sale de su
// resultado más reciente. La modalidad se agrega aparte (ver _peerKeys).
function _peerBase(a){
  const comps=[...(a.competencias||[])]
    .filter(c=>c.sexo&&c.categoria&&c.resultado&&(c.resultado.total>0||c.resultado.status==='DQ'))
    .sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));
  if(!comps.length)return null;
  const l=comps[0];
  const sex=(l.sexo||'').match(/mujer|fem/i)?'F':'M';
  const cat=(l.categoria||'').trim();
  const div=(l.division||'Open').trim();
  // Si el resultado más reciente (por fecha) es de división etaria (Junior, Sub-Junior,
  // Master…) pero el atleta tiene alguna competencia Open en la misma categoría,
  // usar Open. Ocurre cuando la comp Open no tiene fecha registrada y queda al final
  // del sort, pero representa la división actual del atleta.
  if(div!=='Open'){
    const hasOpen=comps.some(c=>
      (c.division||'').trim()==='Open'&&
      (c.categoria||'').trim()===cat&&
      (c.resultado||{}).total>0
    );
    if(hasOpen)return sex+'|'+cat+'|Open';
  }
  return sex+'|'+cat+'|'+div;
}
// Los grupos a los que pertenece: uno por cada modalidad en la que tiene marca
// dentro de esa categoría. Powerlifting y Only Bench son competencias distintas y
// no se comparan entre sí — un total de 712.5 y una banca de 165 no son lo mismo.
// El que hizo las dos tiene las dos comparativas.
const _MODAL_ORDEN=['classic','equipped','bench','bench_eq'];
function _peerKeys(a){
  const base=_peerBase(a);
  if(!base)return [];
  const cat=base.split('|')[1];
  const mods=new Set();
  (a.competencias||[]).forEach(c=>{
    const r=c.resultado||{};
    if(!(r.total>0))return;
    if(String(c.categoria||'').trim()!==cat)return;
    mods.add(_modalKey(c));
  });
  return _MODAL_ORDEN.filter(m=>mods.has(m)).map(m=>base+'|'+m);
}
// Se mantiene para quien la use: la clave principal (la primera modalidad).
function getPeerKey(a){ return _peerKeys(a)[0]||null; }

function peerPerc(myTotal,key){
  let g=PEERS[key];
  // Fallback: si no hay grupo para la división exacta (ej. Sub-Junior con pocos
  // atletas), comparar contra el grupo OPEN de la misma categoría/sexo/modalidad.
  if(!g&&key){
    const parts=key.split('|'); // sexo|cat|division|modal
    if(parts.length===4&&parts[2]!=='Open'){
      const openKey=parts[0]+'|'+parts[1]+'|Open|'+parts[3];
      g=PEERS[openKey];
      if(g)key=openKey;
    }
  }
  if(!g)return null;
  // El puesto sale del grupo COMPLETO. Antes salía de `members`, que son solo los
  // diez que se dibujan: un atleta de un grupo de 47 quedaba "#5 de 11" y con el
  // percentil hundido (55 en vez de ~89), contradiciendo al cartel de arriba.
  const totals=g.totals||g.members.map(m=>m.total);
  const all=[...totals];
  // Solo si el atleta no está en el grupo (pasa con el fallback a Open).
  if(!totals.includes(myTotal))all.push(myTotal);
  all.sort((a,b)=>b-a);
  const rank=all.indexOf(myTotal)+1;   // a igual marca, el mejor puesto de los empatados
  return{rank,n:all.length,pct:Math.round((1-rank/all.length)*100),g,_key:key};
}

  (function(){

    const mNames=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const r2=v=>Math.round((+v||0)*100)/100;
    // Normaliza la categoría: "-74", "74", "74 kg", "74kg" → "74"; "+120"/"120+" → "120+"
    window._glNormCat=function(c){
      const s=String(c||'').trim(); if(!s) return '';
      const plus=/\+/.test(s);
      const m=s.match(/(\d+(?:\.\d+)?)/);
      return m? (m[1]+(plus?'+':'')) : s.toUpperCase();
    };
    window._GLDATA=[...compsWithResults].filter(c=>(c.resultado&&(c.resultado.glp||c.resultado.gl))).map(c=>{
      const ts=parseFecha(c); const d=ts!=null?new Date(ts):null; const k=glModalKey(c);
      return {gl:r2(c.resultado.glp||c.resultado.gl||0), ts:ts, year:d?d.getFullYear():null,
        cat:window._glNormCat(c.categoria), mod:k, modLabel:GL_MODAL_LABEL[k]||'',

    });
    window._GLCATSEL=window._GLCATSEL||new Set();
    window._GLCATSEL.clear();
  })();
  // Dibuja el SVG (grande) a partir de una lista ya filtrada
  window._glDrawSVG=function(items){
    if(!items||items.length<1) return '<div style="text-align:center;color:var(--muted);padding:34px;font-size:13px">Sin datos para los filtros elegidos.</div>';
    if(items.length<2) return '<div style="text-align:center;color:var(--muted);padding:34px;font-size:13px">Se necesita más de una competencia para graficar la evolución.</div>';
    items=[...items].sort((a,b)=>{if(a.ts!=null&&b.ts!=null)return a.ts-b.ts;if(a.ts!=null)return -1;if(b.ts!=null)return 1;return 0;});
    const W=760,H=320,PX=44,PY=28,PB=58;
    const gls=items.map(x=>x.gl); const maxG=Math.max(...gls); const posG=gls.filter(v=>v>0); const minG=posG.length?Math.min(...posG):0;
    const padG=Math.max(2,(maxG-minG)*0.15); const yMin=Math.max(0,minG-padG),yMax=maxG+padG;
    const pal=['#D4A843','#3B82F6','#22C55E','#F59E0B','#C41E3A','#A78BFA','#F472B6'];
    const uCats=[...new Set(items.map(x=>x.cat).filter(Boolean))];
    const cColor=c=>{const i=uCats.indexOf((c||'').trim());return i>=0?pal[i%pal.length]:'#D4A843';};
    const withTs=items.filter(x=>x.ts!=null); const useTime=withTs.length>=2; const xAvail=W-PX*2;
    let X;
    if(useTime){
      const tmin=Math.min(...withTs.map(x=>x.ts)),tmax=Math.max(...withTs.map(x=>x.ts)),span=Math.max(1,tmax-tmin);
      X=items.map((it,i)=>it.ts==null?PX+i*xAvail/Math.max(1,items.length-1):PX+(it.ts-tmin)/span*xAvail);
      const GAP=62; for(let i=1;i<X.length;i++){if(X[i]-X[i-1]<GAP)X[i]=X[i-1]+GAP;}
      const last=X[X.length-1]; if(last>W-PX){const f=(W-2*PX)/(last-PX);X=X.map(x=>PX+(x-PX)*f);}
    } else { X=items.map((it,i)=>PX+i*xAvail/Math.max(1,items.length-1)); }
    const pts=items.map((it,i)=>({x:X[i],y:PY+(H-PY-PB)*(1-(it.gl-yMin)/Math.max(yMax-yMin,1)),v:it.gl,ev:it.evento,cat:it.cat,dateLabel:it.dateLabel}));
    const poly=pts.map(p=>p.x+','+p.y).join(' '); const yBase=H-PB+2;
    const area=pts[0].x+','+yBase+' '+poly+' '+pts[pts.length-1].x+','+yBase;
    const labelPos=pts.map((p,i)=>{const close=j=>j>=0&&j<pts.length&&Math.abs(pts[j].x-p.x)<50&&Math.abs(pts[j].y-p.y)<16;let above=true;if(close(i-1))above=!(i%2===0);return above;});
    const gid='gg_'+Math.random().toString(36).slice(2,7);
    let out='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;display:block">'
      +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4A843" stop-opacity="0.30"/><stop offset="100%" stop-color="#D4A843" stop-opacity="0.02"/></linearGradient></defs>'
      +[0,0.25,0.5,0.75,1].map(p=>{const yy=PY+(H-PY-PB)*p;const val=Math.round((yMax-(yMax-yMin)*p)*10)/10;return '<line x1="'+PX+'" y1="'+yy+'" x2="'+(W-PX)+'" y2="'+yy+'" stroke="rgba(30,58,95,.4)" stroke-dasharray="2,3"/><text x="'+(PX-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="rgba(160,180,210,.55)" font-family="Oswald">'+val+'</text>';}).join('')
      +'<polygon points="'+area+'" fill="url(#'+gid+')"/>'
      +'<polyline points="'+poly+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
      +pts.map((p,i)=>{const ly=labelPos[i]?(p.y-12):(p.y+20);return '<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="'+cColor(p.cat)+'" stroke="var(--bg)" stroke-width="2"><title>'+p.ev+' — '+p.dateLabel+' — '+p.v+' GL</title></circle>'
        +'<text x="'+p.x+'" y="'+ly+'" text-anchor="middle" font-size="12.5" fill="rgba(212,168,67,.97)" font-family="Oswald" font-weight="700">'+p.v+'</text>'
        +'<text x="'+p.x+'" y="'+(H-PB+17)+'" text-anchor="middle" font-size="10" fill="rgba(160,180,210,.75)" font-family="Oswald">'+p.dateLabel+'</text>';}).join('')
      +'</svg>';
    if(uCats.length>1) out+='<div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(30,58,95,.3)">'+uCats.map(c=>'<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:'+cColor(c)+'"></span>'+c+' kg</span>').join('')+'</div>';
    return out;
  };
  // Toggle de una categoría (multi-selección por chips). Vacío = todas.
  window.glToggleCat=function(cat){

    // refrescar estilos de los chips
    document.querySelectorAll('.glcat-chip').forEach(b=>{
      const c=b.getAttribute('data-cat');
      const on = c==='__all' ? sel.size===0 : sel.has(c);
      b.style.background=on?'rgba(212,168,67,.18)':'transparent';
      b.style.borderColor=on?'var(--gold)':'var(--border)';
      b.style.color=on?'var(--gold)':'var(--muted)';
    });
    window.glApplyFilter();
  };
  // Aplica los filtros elegidos y redibuja
  window.glApplyFilter=function(){
    const d=window._GLDATA||[]; const g=id=>document.getElementById(id);
    const mod=(g('glfMod')&&g('glfMod').value)||'';
    const sel=window._GLCATSEL||new Set();
    const y1=parseInt(g('glfY1')&&g('glfY1').value)||0; const y2=parseInt(g('glfY2')&&g('glfY2').value)||9999;
    const items=d.filter(x=>(!mod||x.mod===mod)&&(sel.size===0||sel.has(x.cat))&&(x.year==null||(x.year>=y1&&x.year<=y2)));
    const box=g('glChartBox'); if(box)box.innerHTML=window._glDrawSVG(items);
    const cnt=g('glfCount'); if(cnt)cnt.textContent=items.length+' competencia'+(items.length!==1?'s':'');
  };
  // Tarjeta con filtros + contenedor del gráfico
  if((window._GLDATA||[]).length>1){
    const dd=window._GLDATA;
    const ORDER={classic:0,equipped:1,bench:2,bench_eq:3};
    const mods=[...new Set(dd.map(x=>x.mod))].sort((a,b)=>(ORDER[a]||9)-(ORDER[b]||9));
    const cats=[...new Set(dd.map(x=>x.cat).filter(Boolean))].sort((a,b)=>(parseFloat(a)||999)-(parseFloat(b)||999));
    const years=[...new Set(dd.map(x=>x.year).filter(Boolean))].sort((a,b)=>a-b);
    const minY=years[0], maxY=years[years.length-1];
    const SS='padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-family:Oswald;cursor:pointer';
    const chip='display:inline-flex;align-items:center;padding:6px 12px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:Oswald;font-size:12px;letter-spacing:.5px;cursor:pointer;transition:all .15s';
    const catChips='<button class="glcat-chip" data-cat="__all" onclick="glToggleCat(\'__all\')" style="'+chip+';background:rgba(212,168,67,.18);border-color:var(--gold);color:var(--gold)">Todas</button>'
      +cats.map(c=>'<button class="glcat-chip" data-cat="'+c+'" onclick="glToggleCat(\''+c+'\')" style="'+chip+'">'+c+' kg</button>').join('');
    h+='<div class="card"><div class="sec-title">Evolución GL</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">'
      +'<select id="glfMod" onchange="glApplyFilter()" style="'+SS+'"><option value="">Todas las modalidades</option>'+mods.map(m=>'<option value="'+m+'">'+(GL_MODAL_LABEL[m]||m)+'</option>').join('')+'</select>'
      +(years.length>1
        ? '<span style="font-size:11px;color:var(--muted)">Años</span><select id="glfY1" onchange="glApplyFilter()" style="'+SS+'">'+years.map(y=>'<option value="'+y+'" '+(y===minY?'selected':'')+'>'+y+'</option>').join('')+'</select><span style="color:var(--muted)">→</span><select id="glfY2" onchange="glApplyFilter()" style="'+SS+'">'+years.map(y=>'<option value="'+y+'" '+(y===maxY?'selected':'')+'>'+y+'</option>').join('')+'</select>'
        : '<input type="hidden" id="glfY1" value="0"><input type="hidden" id="glfY2" value="9999">')
      +'<span id="glfCount" style="font-size:11px;color:var(--muted);margin-left:auto"></span>'
      +'</div>'
      +(cats.length>1?'<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px"><span style="font-size:11px;color:var(--muted);margin-right:2px">Categorías:</span>'+catChips+'</div>':'')
      +'<div id="glChartBox"></div>'
      +'</div>';
  }

  // ── Peer comparison ─────────────────────────────────────
  peerCards.forEach(({peer,pg,mio})=>{
    const pctColor=peer.pct>=75?'var(--green)':peer.pct>=50?'var(--gold)':'var(--accent)';
    const keyParts=String(peer._key).split('|'); // la key real del grupo (puede ser fallback Open)
    const peerLabel=(keyParts[0]==='F'?'Mujer':'Hombre')+' · '+keyParts[1]+' kg · '+keyParts[2];
    const modLabel=_MODAL_LABEL[keyParts[3]]||'';
    const maxT=Math.max(pg.members[0]?.total||1,mio);
    // Con más de una modalidad, el título dice cuál es cada una: si no, quedan dos
    // tarjetas iguales con números distintos y no se entiende de qué habla cada una.
    const titulo=peerCards.length>1?'Comparativa · '+modLabel:'Comparativa en categoría';

    h+='<div class="card"><div class="sec-title">'+titulo+'</div>'
      // El tamaño que se anuncia es EL MISMO contra el que se contó el puesto. Antes

        +(peerCards.length>1?'':' · '+modLabel)+' · '+peer.n+' atletas en el grupo</div>'
      // Percentile gauge
      +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">'
        +'<div style="flex:1">'
          +'<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">'
            +'<span style="color:var(--muted)">Tu posición</span>'
            +'<span style="font-weight:700;color:'+pctColor+'">Top '+(100-peer.pct)+'% · #'+peer.rank+' de '+peer.n+'</span>'
          +'</div>'

          +'<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:3px">'

        +'</div>'
        +'<div style="text-align:center;min-width:54px">'
          +'<div class="os" style="font-size:30px;font-weight:700;color:'+pctColor+'">'+peer.pct+'°</div>'
          +'<div style="font-size:9px;color:var(--muted)">PERCENTIL</div>'
        +'</div>'
      +'</div>'
      // Reference points
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'
        +[['Promedio',pg.avg,'var(--muted)'],['Mediana',pg.p50,'var(--text)'],['Top 1',pg.top,'var(--gold)']].map(([lbl,val,col])=>
          '<div style="background:var(--bg);border-radius:8px;padding:8px;text-align:center">'

          +'</div>'
        ).join('')
      +'</div>'
      // Top bar chart
      +'<div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-family:Oswald;letter-spacing:1px">TOP DE LA CATEGORÍA</div>'
      +pg.members.map((m,i)=>{
        const isMe=m.codigo===a.codigo;
        const pct=Math.round(m.total/maxT*100);
        const col=isMe?'var(--accent)':i===0?'var(--gold)':'var(--blue)';
        return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'

            +'<div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px">'

      }).join('')
      // Si el atleta no entró al top 10, igual se muestra su barra al final: si no,

      +(pg.members.some(m=>m.codigo===a.codigo)?''
        :'<div style="display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(30,58,95,.3)">'

        +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+c.evento+'</div>'
          +(posBadge?'<div style="margin-top:4px">'+posBadge+'</div>':'')
          +'<div style="font-size:11px;color:var(--muted);margin-top:2px">'+(c.division||'—')+' · '+(c.categoria||'—')+(c.modalidad?' · '+c.modalidad:'')+'</div>'
          +(c.fecha?'<div style="font-size:10px;color:var(--muted)">'+c.fecha+'</div>':'')
          +'<div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px">'
            +(r.sq?'<span style="font-size:9px;background:rgba(59,130,246,.1);color:var(--blue);padding:1px 5px;border-radius:3px">SQ '+r.sq+'</span>':'')
            +(r.bp?'<span style="font-size:9px;background:rgba(245,158,11,.1);color:var(--orange);padding:1px 5px;border-radius:3px">BP '+r.bp+'</span>':'')
            +(r.dl?'<span style="font-size:9px;background:rgba(34,197,94,.1);color:var(--green);padding:1px 5px;border-radius:3px">DL '+r.dl+'</span>':'')
          +'</div>'
        +'</div>'
        +'<div style="text-align:right;flex-shrink:0;margin-left:12px">'
          +(isDQ
            ? '<div class="os" style="font-size:19px;font-weight:700;color:var(--red)">DQ</div>'
              +(dqLiftedTotal>0?'<div style="font-size:13px;font-weight:700;color:var(--muted)">'+dqLiftedTotal+' kg levantados</div>':'')
              // El motivo por defecto es el habitual (tres nulos en un lift), pero
              // no es el único: también se queda sin total quien no da el peso de
              // su categoría. Cuando el resultado trae `motivo`, manda ese.
              +'<div style="font-size:10px;color:var(--red);opacity:.85">'+(r.motivo||'3 fallos en algún lift')+'</div>'
            : '<div class="os" style="font-size:19px;font-weight:700;color:var(--gold)">'+(r.total||'—')+' kg</div>'
              +(delta!==null?'<div style="font-size:11px;font-weight:700;color:'+(delta>0?'var(--green)':delta<0?'var(--red)':'var(--muted)')+'">'+  (delta>0?'+':'')+delta+' kg</div>':'')
              +(glVal?'<div style="font-size:10px;color:var(--muted)">GL '+glVal+(r.pos?' · #'+r.pos:'')+'</div>':'')
          )
        +'</div>'
      +'</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="card" style="text-align:center;padding:28px;color:var(--muted)">Sin resultados registrados.</div>';
  }

  const ps=document.getElementById('profileSection');
  ps.innerHTML=h;
  if(window._GLDATA&&window._GLDATA.length>1&&typeof window.glApplyFilter==='function')window.glApplyFilter();
  ps.style.display='block';
  document.getElementById('searchSection').style.display='none';
  window.scrollTo(0,0);
}

  document.getElementById('searchSection').style.display='block';
  window._curCodigo=null;
  history.replaceState(null,'','atleta.html');
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(r=>console.log('[PWA] SW registered:',r.scope))
      .catch(e=>console.warn('[PWA] SW failed:',e));
  });
}
</script>
