<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourLift · Sin conexión</title>
<style>
  :root { --fondo: #0A1628; --tinta: #F2F5FA; --suave: #9FB0C8; --rojo: #C41E3A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fondo); color: var(--tinta);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
  }
  img { width: min(240px, 62vw); height: auto; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  p { margin: 0; max-width: 32ch; color: var(--suave); }
  button {
    font: inherit; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: var(--rojo); border: 0; border-radius: 10px;
    padding: 14px 28px; min-width: 200px;
  }
  button:active { transform: translateY(1px); filter: brightness(.92); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <img src="logo.png" alt="YourLift">
  <h1>Sin conexión</h1>
  <p>Las inscripciones, las nóminas y la competencia en vivo necesitan internet. Revisa tu conexión y vuelve a intentar.</p>
  <button type="button" id="reintentar">Reintentar</button>
<script>
  var ir = function () { location.href = 'https://yourlift.cl/'; };
  document.getElementById('reintentar').addEventListener('click', ir);
  window.addEventListener('online', ir);
</script>
</body>
</html>
