function _txDetectTransitions(){
  const comps=['profile','scoreboard','leaderboard','timer','breakTimer','tablaActual','medals'];
  const fullscreen=new Set(['profile','leaderboard','breakTimer']);
  const fsJustActivated=[...fullscreen].some(c=>!_txDirPrevActive[c]&&_txDirActive(c));
  const fsCurrentlyExiting=Object.keys(_txDirAnims).some(c=>fullscreen.has(c)&&_txDirAnims[c].dir==='out');
  const fsJustDeactivated=[...fullscreen].some(c=>!!_txDirPrevActive[c]&&!_txDirActive(c));
  const fsVisible=_txDirActive('profile')||_txDirActive('leaderboard')||_txDirActive('breakTimer')||fsCurrentlyExiting||fsJustDeactivated;
  const effectiveActive=(c)=>{
    if(c==='scoreboard'||c==='timer'||c==='medals')return _txDirActive(c)&&!fsVisible;
    return _txDirActive(c);
  };
  comps.forEach(c=>{
    const prev=!!_txDirPrevActive[c];
    const now=effectiveActive(c);
    if(prev!==now){
      const dur=fullscreen.has(c)?TX_ANIM_MS.fullscreen:TX_ANIM_MS.corner;
      if(fullscreen.has(c)){
        // Guard: si ya hay una animación en curso para este componente, no la retriggereamos.
        // Evita que renders rápidos en sucesión (sync, Firestore, etc.) lancen el barrido 2 veces.
        if(!_txDirAnims[c]){
        _txDirAnims[c]={dir:now?'in':'out',startedAt:Date.now(),dur};
        _startBarrido(now?'in':'out');
        setTimeout(()=>{
          if(_txDirAnims[c]&&Date.now()-_txDirAnims[c].startedAt>=dur-50){
            delete _txDirAnims[c];
            _txDirLastSig=null;
            if(typeof renderTxWidget==='function')renderTxWidget();
          }
        },dur+50);
        }
      } else {
        // Corner (scoreboard/timer): desaparece SIN animación cuando activa un fullscreen
        if(!now&&fsJustActivated){
          delete _txDirAnims[c]; // hide instantáneo, sin animación de salida
        } else {
          _txDirAnims[c]={dir:now?'in':'out',startedAt:Date.now(),dur};
          const _animDirCur=now?'in':'out';
          setTimeout(()=>{
            if(_txDirAnims[c]&&Date.now()-_txDirAnims[c].startedAt>=dur-50){
              delete _txDirAnims[c];
              // Para entradas IN de scoreboard/tablaActual: NO forzar re-render.
              // El wrapper-anim class se quita en el próximo render natural (sin replay
              // de animaciones internas como ta-logo-anim que están gateadas en .ta-wrap-anim).
              if(_animDirCur==='in' && (c==='scoreboard'||c==='tablaActual')){
                _txDirLastSig=null; // marca para que el próximo render compute la nueva sig
                return;
              }
              _txDirLastSig=null;
              if(typeof renderTxWidget==='function')renderTxWidget();
            }
          },dur+50);
        }
      }
    }
    _txDirPrevActive[c]=now;
  });
}
function _txAnimActive(comp){
  const a=_txDirAnims[comp];
  if(!a)return null;
  if(Date.now()-a.startedAt>=a.dur){delete _txDirAnims[comp];return null}
  return a;
}
function _txDirScheduleHide(){
  // Re-render automático cuando el componente con menor `until` expire
  if(!_txDirState)return;
  const now=Date.now();
  let next=Infinity;
  Object.values(_txDirState).forEach(c=>{
    if(c&&c.active&&c.until>0&&c.until>now&&c.until<next)next=c.until;
  });
  if(next!==Infinity){setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},next-now+50);}
}
function renderTxDirector(container){
  const c=container||document.getElementById('txWidget');
  if(!c)return;
  _txStartDirectorListener();
  _widgetStartDirectObsListener();
  if(!_txDirState){c.innerHTML='';return}
  const cur=liftQueue()[0];
  const showProf=_txDirActive('profile');
  const showLb=_txDirActive('leaderboard');
  const showSlam=_txDirActive('slam');
  // Break timer: activo si tiene `active=true` y aún hay tiempo (o pausado)
  const bt=_txDirState.breakTimer||{};
  const showBreak=!!bt.active&&bt.startedAt>0&&bt.durationSec>0;
  // Scoreboard y Timer (corners) se OCULTAN cuando hay un fullscreen tapando
  // O cuando uno está en animación de salida — para que el scoreboard no entre
  // encima del perfil/leaderboard mientras todavía está saliendo.
  const _fsExiting=['profile','leaderboard','breakTimer'].some(c=>{const a=_txDirAnims[c];return a&&a.dir==='out'&&Date.now()-a.startedAt<(a.dur||TX_ANIM_MS.fullscreen);});
  const _fsVisible=showProf||showLb||showBreak||_fsExiting;
  const showSb=_txDirActive('scoreboard')&&!_fsVisible;
  const showTm=_txDirActive('timer')&&!_fsVisible;
  const showMedals=_txDirActive('medals')&&!_fsVisible;
  // Detectar transiciones (cambios on↔off) para reproducir animaciones
  _txDetectTransitions();
  // Signature p/ evitar flicker por timer cada 1s
  const md=_txDirState.medals||{};
  const sig=[showProf,showSb,showLb,showTm,showSlam,showBreak,_txDirActive('tablaActual'),showMedals].join('|')
    +'|'+(cur?cur.id+'|'+(cur.att?.[DATA.lift]||[]).map(a=>a.w+'-'+(a.r||'')).join(','):'')
    +'|'+DATA.lift+'|'+DATA.round+'|'+DATA.flight
    +'|'+(_txDirState.leaderboard?.cat||'')+'|'+(_txDirState.slam?.type||'')
    +'|md-'+(md.mod||'')+'-'+(md.sex||'')+'-'+(md.div||'')+'-'+(md.cat||'')+'-'+(md.until||0)
    +'|'+(_txDirState.profile?.until||0)+'|'+(_txDirState.scoreboard?.until||0)+'|'+(_txDirState.leaderboard?.until||0)+'|'+(_txDirState.slam?.until||0)
    +'|bt-'+(bt.startedAt||0)+'-'+(bt.durationSec||0)+'-'+(bt.pausedAt||0)+'-'+(bt.label||'')+'-'+(bt.videos||[]).length+'-'+(bt.movement||'')+'-'+JSON.stringify(bt.style||{})
    +'|sc-'+(_txDirState.profile?.scale||1)+'-'+(_txDirState.scoreboard?.scale||1)+'-'+(_txDirState.leaderboard?.scale||1)+'-'+(_txDirState.timer?.scale||1)+'-'+(_txDirState.slam?.scale||1)+'-'+(_txDirState.breakTimer?.scale||1)
    +'|col-'+JSON.stringify(_txDirState.colors||{});
  if(sig===_txDirLastSig){
    // Updates in-place sin re-render para evitar flicker
    const tm=document.getElementById('cerTimer');
    if(tm){
      const t=Math.max(0,DATA.timer||0);
      tm.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
      tm.style.color=DATA.timerOn&&t<=10?'#ef4444':DATA.timerOn&&t<=30?'#f59e0b':'#fff';
    }
    // Break timer: actualizar el conteo cada segundo sin tocar innerHTML
    const btEl=document.getElementById('dirBreakDisplay');
    if(btEl&&showBreak){
      const elapsed=bt.pausedAt?(bt.pausedAt-bt.startedAt):(Date.now()-bt.startedAt);
      const rem=Math.max(0,Math.ceil((bt.durationSec*1000-elapsed)/1000));
      const m=Math.floor(rem/60),s=rem%60;
      btEl.textContent=m+':'+(s<10?'0':'')+s;
      btEl.style.color=rem<=10?'#ef4444':rem<=30?'#f59e0b':'#fff';
      // Si terminó, forzar re-render para que se vacíe (fin de break)
      if(rem<=0){_txDirLastSig=null;renderTxDirector(c);return}
    }
    // Re-tick: si el break está activo y NO pausado, agendar próxima
    // actualización en 1s (el setTimeout del fin del re-render solo
    // dispara una vez; sin esto el contador se queda pegado).
    if(showBreak&&!bt.pausedAt){
      setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},1000);
    }
    return;
  }
  _txDirLastSig=sig;
  // Stack: leaderboard tiene prioridad fullscreen, profile fullscreen, scoreboard/timer corners
  // Break timer también es fullscreen — gana sobre todo si está activo
  // Las animaciones de salida ('out') mantienen el componente visible durante la animación
  const animProf=_txAnimActive('profile');
  const animSb=_txAnimActive('scoreboard');
  const animLb=_txAnimActive('leaderboard');
  const animTm=_txAnimActive('timer');
  const animBt=_txAnimActive('breakTimer');
  // Mantener body opaco mientras un fullscreen esté activo O en transición
  document.body.classList.toggle('tx-opaque', showLb||showProf||showBreak||(animProf&&animProf.dir==='out')||(animLb&&animLb.dir==='out')||(animBt&&animBt.dir==='out'));
  // Video de fondo del break timer (persiste independiente del innerHTML)
  if(showBreak){
    const bvids=bt.videos||[];
    if(bvids.length){
      _btVideoSetup(bvids);
      // Sincronizar posición/tamaño/blur desde style params
      const _bts=bt.style||{};
      if(_btVideoFgEl){
        _btVideoFgEl.style.left=(_bts.videoX!=null?_bts.videoX:0)+'%';
        _btVideoFgEl.style.top=(_bts.videoY!=null?_bts.videoY:5)+'%';
        _btVideoFgEl.style.width=(_bts.videoW!=null?_bts.videoW:40)+'%';
        _btVideoFgEl.style.height=(_bts.videoH!=null?_bts.videoH:80)+'%';
        _btVideoFgEl.style.transform='none';
        _btVideoFgEl.style.borderRadius='0';
        _btVideoFgEl.style.clipPath='none';
        _btVideoFgEl.style.objectFit='cover';
        _btVideoFgEl.style.zIndex='3';
      }
      if(_btVideoBgEl){
        const blur=_bts.blurAmount!=null?Number(_bts.blurAmount):24;
        _btVideoBgEl.style.filter='blur('+blur+'px) brightness(.28)';
      }
    } else _btVideoTeardown();
  } else if(!(animBt&&animBt.dir==='out')){
    // Solo limpiar cuando la animación de salida ya terminó también
    _btVideoTeardown();
  }
  let html='';
  // (el barrido/curtain vive en document.body como overlay independiente — ver _startBarrido)
  // Break timer (fullscreen, prioridad alta)
  if(showBreak||(animBt&&animBt.dir==='out')){
    const fade=animBt?(animBt.dir==='in'?'animation:txContentFadeIn 1.2s ease forwards;':'animation:txContentFadeOut 1.2s ease forwards;'):'';
    html+='<div style="position:fixed;inset:0;'+fade+'">'+_renderTxBreakTimer(bt,_txDirState.breakTimer?.scale||1)+'</div>';
  } else if(showLb||(animLb&&animLb.dir==='out')){
    const cat=_txDirState.leaderboard.cat;
    const ref=cat?DATA.athletes.find(a=>a.cat===cat&&!a.bombed):cur;
    const lbScale=_txDirState.leaderboard?.scale||1;
    if(ref){
      const fade=animLb?(animLb.dir==='in'?'animation:txContentFadeIn 1.2s ease forwards;':'animation:txContentFadeOut 1.2s ease forwards;'):'';
      html+='<div style="position:fixed;inset:0;'+(lbScale!==1?'transform:scale('+lbScale+');transform-origin:center center;':'')+fade+'">'+renderTxLeaderboard(ref,false,{allFlights:true})+'</div>';
    }
  } else if(showProf||(animProf&&animProf.dir==='out')){
    const fade=animProf?(animProf.dir==='in'?'animation:txContentFadeIn 1.2s ease forwards;':'animation:txContentFadeOut 1.2s ease forwards;'):'';
    if(cur){
      const pfScale=_txDirState.profile?.scale||1;
      html+='<div style="position:fixed;inset:0;'+(pfScale!==1?'transform:scale('+pfScale+');transform-origin:center center;':'')+fade+'">'+renderTxProfile(cur)+'</div>';
    } else if(showProf){
      html+='<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:Oswald,sans-serif;'+fade+'">'
        +'<div style="font-size:clamp(28px,3vw,42px);color:#D4A843;letter-spacing:4px;margin-bottom:16px">SIN LEVANTADOR ACTUAL</div>'
        +'<div style="font-size:clamp(14px,1.4vw,18px);color:rgba(220,230,245,.7);max-width:600px;line-height:1.6">El widget no encontró un atleta con peso cargado en el intento actual del flight '+(DATA.flight||'?')+'. Andá a Atletas &amp; Pesaje en YourLift y cargá pesos de apertura para que aparezca.</div>'
      +'</div>';
    }
  }
  // Scoreboard (corner) — anim "explode from logo" si HAY logo, cascade original si no.
  if((showSb||(animSb&&animSb.dir==='out'))&&cur){
    const hasLogoSb = !!(DATA.event?.logoUrl);
    const sbHtml=_renderTxCerScoreboardBL(cur,{noAnimate:true,scale:_txDirState.scoreboard?.scale||1,animDir:animSb?.dir||null});
    const isSbEnter = animSb && animSb.dir==='in';
    // Sin logo: usar el HTML directo (la cascada _sbRowAnim ya viene del render con animDir)
    // Con logo: envolvemos para gatear logo zoom + explode, sin replay en updates
    html += (hasLogoSb && isSbEnter) ? '<div class="sb-wrap-anim">'+sbHtml+'</div>' : sbHtml;
  }
  // Timer (corner) — slide-in/out desde la derecha
  if(showTm||(animTm&&animTm.dir==='out')){
    const tmAnim=animTm?(animTm.dir==='in'?'animation:txSlideInRight .65s cubic-bezier(.2,.85,.3,1) forwards;':'animation:txSlideOutRight .55s cubic-bezier(.5,0,.7,.5) forwards;'):'';
    const tmHtml=_renderTxCerTimerCorner(_txDirState.timer?.scale||1);
    html+=tmAnim?'<div style="'+tmAnim+'">'+tmHtml+'</div>':tmHtml;
  }
  // Tabla Actual (corner inferior derecha) — anim "explode from logo" si HAY logo, slide-up si no.
  const showTabla=_txDirActive('tablaActual');
  const animTabla=_txAnimActive('tablaActual');
  if((showTabla||(animTabla&&animTabla.dir==='out'))&&cur){
    const hasLogo = !!(DATA.event?.logoUrl);
    const isEntering = animTabla && animTabla.dir==='in';
    const isExiting  = animTabla && animTabla.dir==='out';
    let wrapClass = '';
    let taAnim = '';
    if(hasLogo){
      wrapClass = isEntering ? 'ta-wrap-anim' : '';
      taAnim = isExiting ? 'animation:txSlideOutBottom .55s cubic-bezier(.5,0,.7,.5) forwards;' : '';
    } else {
      // Sin logo: animación original slide-up desde abajo
      taAnim = isEntering
        ? 'animation:txSlideInBottom .75s cubic-bezier(.2,.85,.3,1.05) forwards;'
        : (isExiting ? 'animation:txSlideOutBottom .55s cubic-bezier(.5,0,.7,.5) forwards;' : '');
    }
    const taScale=_txDirState.tablaActual?.scale||1;
    const taHtml=renderTxTablaActual(cur);
    const wrap='<div class="'+wrapClass+'" style="position:fixed;inset:0;pointer-events:none;'+(taScale!==1?'transform:scale('+taScale+');transform-origin:bottom right;':'')+taAnim+'">'+taHtml+'</div>';
    html+=wrap;
  }
  // Medallero (Top 3) — banda inferior-centro, entra/sale deslizando desde abajo
  const animMedals=_txAnimActive('medals');
  if(showMedals||(animMedals&&animMedals.dir==='out')){
    const mdAnim=animMedals?(animMedals.dir==='in'?'animation:txSlideInBottom .75s cubic-bezier(.2,.85,.3,1.05) forwards;':'animation:txSlideOutBottom .55s cubic-bezier(.5,0,.7,.5) forwards;'):'';
    const mdScale=md.scale||1;
    const mdHtml=renderTxMedals(md);
    if(mdHtml)html+='<div style="position:fixed;inset:0;pointer-events:none;'+(mdScale!==1?'transform:scale('+mdScale+');transform-origin:bottom center;':'')+mdAnim+'">'+mdHtml+'</div>';
  }
  if(showSlam){
    // Slam armado: cuando el operador marca ✓/✗ en Control en Vivo,
    // _txSlamScan detecta la nueva transición y setea _txSlamType/_txSlamUntil.
    // El corner se muestra solo durante la ventana del flash.
    // Si el botón fue disparado con type explícito (legacy), respetamos eso también.
    _txSlamScan();
    let slamType=null, slamUntil=0;
    if(_txDirState.slam?.type&&(_txDirState.slam?.until||0)>Date.now()){
      // Modo manual legacy (action:slam type:g/n)
      slamType=_txDirState.slam.type;
      slamUntil=_txDirState.slam.until;
    } else if(_txSlamType&&Date.now()<_txSlamUntil){
      // Modo auto (toggle slam armado, dispara cuando hay decisión)
      slamType=_txSlamType;
      slamUntil=_txSlamUntil;
    }
    if(slamType){
      html+=_renderTxCerSlamCorner(slamType,_txDirState.slam?.scale||1);
      setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},Math.max(50,slamUntil-Date.now()+50));
    }
  }
  c.innerHTML=html;
  _txDirScheduleHide();
  // Programar tick cada 1s para el break timer (re-update via signature skip)
  if(showBreak){
    setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},1000);
  }
}
function _renderTxBreakTimer(bt,scale){

  const rem=Math.max(0,Math.ceil((bt.durationSec*1000-elapsed)/1000));

  const txt=m+':'+(s<10?'0':'')+s;

  // ── Parámetros de estilo editables ────────────────────────────────────

  const overlayRgba=_h2r(bgColor,overlayOp);
  // NEO logo — N con diagonal correcta (top-left → bottom-right) + barra derecha

    +'<rect x="103" y="66" width="87" height="24"/>'
    +'<path fill-rule="evenodd" d="M203,0 L290,0 L290,90 L203,90 Z M226,22 L267,22 L267,68 L226,68 Z"/>'

      +'<img src="YourLift_logo.png" style="height:clamp(22px,3.2vh,40px);width:auto;object-fit:contain;filter:brightness(1.1)" onerror="this.style.display=\'none\'">'
      +(stl.eventLogoUrl?'<div style="width:1px;height:36%;background:rgba(255,255,255,.2)"></div><img src="'+stl.eventLogoUrl+'" style="height:clamp(22px,3.2vh,40px);width:auto;max-width:clamp(80px,12vw,180px);object-fit:contain;filter:brightness(0) invert(1)" onerror="this.style.display=\'none\'">':'')
      +'<div style="width:1px;height:36%;background:rgba(255,255,255,.2)"></div>'
      +neoSvg+'</div>'
    :'';
  const scStyle=sc!==1?'transform:scale('+sc+');transform-origin:center center;':'';

  if(hasVideo){
    // fades que cubren los bordes del video (z:3, encima del _btVideoFgEl en z:2)
    const vl=videoX,vt=videoY,vw=videoW,vh=videoH;
    const colorOv='<div style="position:absolute;inset:0;background:'+overlayRgba+';pointer-events:none"></div>';
    const fadeR='<div style="position:absolute;left:'+vl+'%;top:'+vt+'%;width:'+vw+'%;height:'+vh+'%;pointer-events:none;background:linear-gradient(to right,transparent 52%,'+overlayRgba+' 94%)"></div>';
    const fadeT='<div style="position:absolute;left:'+vl+'%;top:'+vt+'%;width:'+vw+'%;height:22%;pointer-events:none;background:linear-gradient(to bottom,'+overlayRgba+' 0%,transparent 100%)"></div>';
    const fadeB='<div style="position:absolute;left:'+vl+'%;top:'+(vt+vh-22)+'%;width:'+vw+'%;height:22%;pointer-events:none;background:linear-gradient(to top,'+overlayRgba+' 0%,transparent 100%)"></div>';
    return '<div style="position:fixed;inset:0;z-index:3;overflow:hidden;background:transparent;'+scStyle+'">'
      +colorOv+fadeR+fadeT+fadeB

        +(movement?'<div style="font-family:Oswald,Impact,sans-serif;font-size:'+movSize+'vw;font-weight:700;color:#ffffff;line-height:1;letter-spacing:2px;margin-bottom:clamp(6px,1vh,16px);white-space:nowrap">'+movement+'</div>':'')
        +'<div id="dirBreakDisplay" style="font-family:Oswald,Impact,sans-serif;font-size:'+timerSz+'vw;font-weight:900;color:'+timerColor+';line-height:.9;letter-spacing:2px;text-shadow:0 4px 22px rgba(0,0,0,.85)">'+txt+'</div>'
        +pausedBadge

    +'<div style="position:absolute;inset:0;bottom:'+barH+';display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:'+titleTop+'vh 4vw 3vh">'
      +''
      +'<div style="font-family:Oswald,Impact,sans-serif;font-size:'+titleSize+'vw;font-weight:900;color:#ffffff;line-height:.88;letter-spacing:2px;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.9)">YA VOLVEMOS</div>'
      +'<div style="width:clamp(50px,6vw,110px);height:3px;background:'+accentColor+';margin:clamp(8px,1.2vh,18px) auto;box-shadow:0 0 10px '+accentColor+'99"></div>'
      +(movement?'<div style="font-family:Oswald,Impact,sans-serif;font-size:'+movSize+'vw;font-weight:700;color:#ffffff;line-height:1;letter-spacing:2px;margin-bottom:clamp(6px,1vh,14px)">'+movement+'</div>':'')
      +'<div id="dirBreakDisplay" style="font-family:Oswald,Impact,sans-serif;font-size:'+timerSz+'vw;font-weight:900;color:'+timerColor+';line-height:.9;letter-spacing:3px;text-shadow:0 6px 28px rgba(0,0,0,.85)">'+txt+'</div>'
      +pausedBadge
      +(evName?'<div style="font-family:Oswald;font-size:clamp(10px,1.1vw,16px);letter-spacing:5px;color:rgba(255,255,255,.38);margin-top:clamp(8px,1.2vh,16px)">'+String(evName).toUpperCase()+'</div>':'')
    +'</div>'
    +sponsorBar
  +'</div>';
}

// ─── SLAM (GOOD LIFT / NO LIFT flash) ──────────────────────────
let _txSlamSeen=null;          // Map<key, 'g'|'r'|null>
let _txSlamUntil=0;            // timestamp until which to show
let _txSlamType=null;          // 'g' | 'r'
let _txSlamLifterName='';
function _txSlamScan(){
  // Detecta nueva transición null → g/r en cualquier intento.
  // Primera pasada: solo poblar el set, no disparar nada.
  const isFirst=(_txSlamSeen===null);
  if(isFirst)_txSlamSeen={};
  let fired=null;
  DATA.athletes.forEach(a=>{
    LIFTS.forEach(l=>{
      (a.att&&a.att[l]||[]).forEach((att,i)=>{
        const k=a.id+'-'+l+'-'+i;
        const prev=_txSlamSeen[k];
        const now=att.r||null;
        if(!isFirst&&(prev==null||prev===undefined)&&(now==='g'||now==='r')){
          fired={type:now,name:a.name||'',lift:l,round:i};
        }
        _txSlamSeen[k]=now;
      });
    });
  });
  if(fired){
    _txSlamUntil=Date.now()+2200;
    _txSlamType=fired.type;
    _txSlamLifterName=fired.name;
    setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},2300);
  }
}
function renderTxSlam(){
  _txSlamScan();
  if(!_txSlamType||Date.now()>=_txSlamUntil){
    return '';
  }
  const isGood=_txSlamType==='g';
  const text=isGood?'GOOD LIFT':'NO LIFT';
  const color=isGood?'#22c55e':'#ef4444';
  const glow=isGood?'rgba(34,197,94,.85)':'rgba(239,68,68,.85)';
  return '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:txSlamFlash 2.1s ease-in-out forwards">'
    +'<div style="font-family:Oswald,sans-serif;font-size:clamp(80px,14vw,200px);font-weight:900;letter-spacing:8px;color:'+color+';text-shadow:0 0 60px '+glow+',0 0 120px '+glow+',0 8px 30px rgba(0,0,0,.9);animation:txSlamIn .55s cubic-bezier(.2,.9,.2,1) backwards,txSlamOut .35s ease-in 1.75s forwards;-webkit-text-stroke:3px rgba(0,0,0,.4)">'+text+'</div>'
    +(_txSlamLifterName?'<div style="margin-top:18px;font-family:Oswald,sans-serif;font-size:clamp(18px,2vw,28px);letter-spacing:6px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.9);animation:txFade .8s ease .35s backwards">'+_txSlamLifterName.toUpperCase()+'</div>':'')
    +'</div>';
}

// de OBS que ya tengan esta fuente agregada — simplemente queda transparente/sin contenido.
function renderTxTimer(){
  return '';
}

// ─── LIGHTS (3 luces de jueces) ────────────────────────────────
let _txLightsUnsub=null;
let _txLights={izq:null,central:null,der:null};
let _txLightsResetTs=0;
let _txLightsPoll=null;
function _txStartLightsListener(){
  if(_txLightsUnsub)return;
  if(!fbReady||!window._fb){
    if(!_txLightsPoll){
      _txLightsPoll=setInterval(()=>{
        if(fbReady&&window._fb){clearInterval(_txLightsPoll);_txLightsPoll=null;_txStartLightsListener()}
      },300);
    }
    return;
  }
  try{
    _txLightsUnsub=window._fb.onSnapshot(window._fb.doc(fbDB,'judge_decisions','current'),(snap)=>{
      if(!snap.exists())return;
      const d=snap.data();
      _txLights={izq:d.izq||null,central:d.central||null,der:d.der||null};

      if(typeof renderTxWidget==='function')renderTxWidget();

}

let _txSbSig=null;
let _txSbShownAt=0;
const TX_SCOREBOARD_DURATION=20000; // 20s visible
function renderTxScoreboard(cur,lifterChanged){
  if(!cur)return '';
  // Atleta real + índice del intento actual (3 si es un 4º). Las estadísticas y la
  // fila de intentos se calculan sobre el atleta real; el clon del 4º solo sirve
  // para saber cuál es el intento en curso (curAtt).
  const ra=_realAth(cur), ci=curAtt(cur);
  // Auto-hide: el marcador aparece al cambiar levantador / intento / peso / lift,
  // queda 20s en pantalla y se va con animación. Hasta el próximo cambio: oculto.
  // En modo widget (?tx=scoreboard), el render que importa es éste.
  if(TX_MODE==='scoreboard'){
    const sig=cur.id+'-'+DATA.lift+'-'+ci+'-'+((ra.att[DATA.lift][ci]&&ra.att[DATA.lift][ci].w)||0);
    if(sig!==_txSbSig){
      _txSbSig=sig;
      _txSbShownAt=Date.now();
      setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},TX_SCOREBOARD_DURATION+400);
    }
    if(Date.now()-_txSbShownAt>TX_SCOREBOARD_DURATION)return '';
  }
  const nombreAtleta=_nombrePropio(cur.name);
  const divS=txDivShort(cur.div);
  const catLabel=(cur.cat?txCatLabel(cur.cat)+' ':'')+divS;
  const rk=catRankBySub(ra);
  const st=subTotal(ra,DATA.lift);
  const cw=(ra.att[DATA.lift][ci]&&ra.att[DATA.lift][ci].w)||0;
  const simBest=Math.max(bestOf(ra,DATA.lift),cw);
  let newSub;
  if(DATA.lift==='sq')newSub=simBest;
  else if(DATA.lift==='bp')newSub=bestOf(ra,'sq')+simBest;
  else newSub=bestOf(ra,'sq')+bestOf(ra,'bp')+simBest;
  // Mismo sexo + cat + div (separar divisiones de edad)
  const sameCat=DATA.athletes.filter(a=>a.cat===cur.cat&&a.div===cur.div&&a.sex===cur.sex&&a.flight===DATA.flight&&!a.bombed);
  const simRanked=sameCat.map(a=>{
    if(a.id===cur.id)return{id:a.id,sub:newSub};
    return{id:a.id,sub:subTotal(a,DATA.lift)};
  }).filter(x=>x.sub>0).sort((a,b)=>b.sub-a.sub);
  const simPos=simRanked.findIndex(x=>x.id===cur.id)+1;
  const totalAth=simRanked.length;
  // Forecast mejorado: muestra cambio de posición si corresponde
  const forecastPos=simPos||rk.pos||0;
  const willChange=rk.pos>0&&simPos>0&&simPos!==rk.pos;
  let forecastTxt,forecastColor;
  if(forecastPos<=0){forecastTxt='—';forecastColor=_txC('puesto');}
  else if(willChange){
    forecastTxt='Puesto '+rk.pos+' → '+simPos;
    forecastColor=simPos===1?_txC('goodLift'):simPos<=3?_txC('accent'):_txC('puesto');
  }else{
    forecastTxt='Posición '+forecastPos;
    forecastColor=forecastPos===1?_txC('goodLift'):forecastPos<=3?_txC('accent'):_txC('puesto');
  }
  const _animDir=TX_MODE==='scoreboard'?null:(lifterChanged?'in':null);
  // ── Colores: el marcador sigue la paleta elegida en Control TX ──
  // Antes estaban fijos acá y la paleta no le hacía nada. El contorno negro del
  // texto NO entra en la paleta, a propósito: es lo que lo mantiene legible.
  const YL_NAVY=_txC('headerBg'), YL_GOLD=_txC('accent'), YL_TXT=_txC('nameText');
  const WHITE='#ffffff', WHITE_DIM='rgba(255,255,255,.55)', GREEN='#22c55e', RED='#ef4444';
  // ── SQUAT / BENCH PRESS / DEADLIFT / TOTAL — mejor marca válida de cada uno + estado ──
  const sqB=bestOf(ra,'sq'), bpB=bestOf(ra,'bp'), dlB=bestOf(ra,'dl');
  const dq=isDQ(ra);
  const _liftFailed=l=>ra.att[l].every(x=>x.r==='n')&&ra.att[l].some(x=>x.w>0);
  const _liftCell=(l,label,best)=>{
    let val,clr;
    if(best>0){val=best;clr=GREEN}
    else if(_liftFailed(l)){val='—';clr=RED}
    else{val='—';clr=WHITE_DIM}
    return `<div style="padding:8px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.08)">
      <div style="font-family:Oswald;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.4);margin-bottom:2px">${label}</div>
      <div style="font-family:Oswald;font-size:20px;font-weight:800;color:${clr}">${val}</div>
    </div>`;
  };
  const totB=sqB+bpB+dlB;
  let totVal,totClr;
  if(dq){totVal='DQ';totClr=RED}
  else if(sqB>0&&bpB>0&&dlB>0){totVal=totB.toFixed(1);totClr=GREEN}
  else if(totB>0){totVal=totB.toFixed(1);totClr=WHITE}
  else{totVal='—';totClr=WHITE_DIM}
  const flagHtml=_flagImg(_ctry(cur),22);
  return `
    <div class="sb-card-explode" style="position:absolute;bottom:0;left:0;right:0;display:flex;align-items:stretch;${TX_MODE==='scoreboard'?'animation:txScoreboardCycle '+(TX_SCOREBOARD_DURATION/1000)+'s ease-in-out forwards':''}">
      <div style="flex-shrink:0;width:110px;background:${YL_NAVY};border-top:3px solid ${YL_GOLD};display:flex;align-items:center;justify-content:center">
        <img src="YourLift_logo.png" alt="" style="height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7))" onerror="this.style.display='none'">
      </div>
      <div class="sb-wipe-content" style="flex:1;overflow:hidden">
        <div style="${_sbRowAnim(_animDir,0)}display:flex;justify-content:space-between;align-items:center;background:${YL_NAVY};border-top:3px solid ${YL_GOLD};padding:6px 22px">
          <div style="font-family:Oswald;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%">${cur.club||''}</div>
          <div style="font-family:Oswald;font-size:13px;letter-spacing:1px;color:rgba(255,255,255,.6)">${(rk.pos&&totalAth?rk.pos+'/'+totalAth+' en categoría':'')}</div>
          <div style="font-family:Oswald;font-size:${willChange?'15px':'18px'};font-weight:800;color:${forecastColor};letter-spacing:${willChange?'1px':'2px'};white-space:nowrap" title="Posición forecast en su sexo+categoría+división">${forecastTxt}</div>
        </div>
        <div style="${_sbRowAnim(_animDir,1)}background:linear-gradient(90deg,${_txC('nameBg')},${_txC('nameBg2')});padding:7px 22px;display:flex;align-items:center;gap:12px">
          ${flagHtml}
          <div style="flex:1;font-family:Oswald;color:${YL_TXT};letter-spacing:1px;overflow:hidden">
            <div style="font-size:28px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nombreAtleta}</div>
          </div>
          <div style="background:rgba(10,22,40,.9);color:${YL_GOLD};padding:5px 14px;border-radius:4px;font-family:Oswald;font-size:16px;letter-spacing:1px;font-weight:700;white-space:nowrap">${catLabel}</div>
        </div>
        <div style="${_sbRowAnim(_animDir,2)}display:grid;grid-template-columns:repeat(${ra.att[DATA.lift].length},1fr) repeat(4,1fr);background:${_txC('gridBg')}">
          ${ra.att[DATA.lift].map((at,j)=>{
            let clr,td='none',boxSh='';
            const is4=j===3&&at.extra;
            const x4lbl=((at.grantedRound||0)>=2)?'4º':'EXT';
            if(at.r==='g'){clr=GREEN}
            else if(at.r==='n'){clr=RED;td='line-through'}
            else if(j===ci&&at.w>0){clr=WHITE;boxSh='box-shadow:inset 0 -3px 0 '+LIFT_C[DATA.lift]+';'}
            else{clr=WHITE_DIM}
            return '<div style="padding:8px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.08);font-family:Oswald;font-size:22px;font-weight:700;color:'+clr+';text-decoration:'+td+';'+boxSh+'"'+(is4?' title="Intento extra / 4º"':'')+'>'+(at.w||'—')+(is4?'<sup style="font-size:10px;color:'+YL_GOLD+'">'+x4lbl+'</sup>':'')+'</div>';
          }).join('')}
          ${_liftCell('sq','SQUAT',sqB)}
          ${_liftCell('bp','BENCH PRESS',bpB)}
          ${_liftCell('dl','DEADLIFT',dlB)}
          <div style="padding:8px 6px;text-align:center">
            <div style="font-family:Oswald;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.4);margin-bottom:2px">TOTAL</div>
            <div style="font-family:Oswald;font-size:20px;font-weight:800;color:${totClr}">${totVal}</div>
          </div>
        </div>
      </div>
    </div>`;
}

window._SCREEN_LOCAL={mode:'jornada',flights:[],nameScale:1};
async function _screenPush(){
  // Modo práctica: sin Firebase. El estado de la pantalla (modo/tandas/tamaño) va
  // por localStorage; la otra pestaña (?tx=screen&practica=1) lo lee por 'storage'.
  if(PRACTICE_MODE){
    try{localStorage.setItem(PRACTICE_SCREEN_KEY,JSON.stringify({
      mode:window._SCREEN_LOCAL.mode,
      flights:window._SCREEN_LOCAL.flights,
      nameScale:window._SCREEN_LOCAL.nameScale||1,
      ts:Date.now()
    }));}catch(e){}
    return;
  }
  if(!fbReady||!DATA.event){showToastLC('Sin evento activo');return;}
  const id=(DATA.event.name||'comp').replace(/[^a-zA-Z0-9]/g,'_').substring(0,60);
  try{
    await window._fb.setDoc(window._fb.doc(fbDB,'livecast_screen',id),{
      mode:window._SCREEN_LOCAL.mode,
      flights:window._SCREEN_LOCAL.flights,
      nameScale:window._SCREEN_LOCAL.nameScale||1,
      ts:Date.now()
    });
  }catch(e){showToastLC('Error: '+e.message);}
}
window.screenSetMode=function(m){window._SCREEN_LOCAL.mode=m;_screenPush();R();};
window.screenSetNameScale=function(v){
  let n=parseFloat(v)||1; n=Math.max(0.6,Math.min(2.2,n)); n=Math.round(n*100)/100;
  window._SCREEN_LOCAL.nameScale=n; window._JORNADA_NAMESCALE=n;
  _screenPush();
  // Actualizar el panel SIN re-render (para no cortar el arrastre del slider)
  const sl=document.getElementById('scrNameRange'); if(sl&&parseFloat(sl.value)!==n)sl.value=n;
  const lb=document.getElementById('scrNamePct'); if(lb)lb.textContent=Math.round(n*100)+'%';
  const pv=document.getElementById('scrNamePrev'); if(pv)pv.style.fontSize=Math.round(15*n)+'px';
};
window.screenNudgeNameScale=function(d){window.screenSetNameScale((window._SCREEN_LOCAL.nameScale||1)+d);};
window.screenToggleFlight=function(f){
  const arr=window._SCREEN_LOCAL.flights;
  const i=arr.indexOf(f);
  if(i>=0)arr.splice(i,1);else arr.push(f);
  _screenPush();R();
};
window.screenAllFlights=function(){
  const all=[...new Set(DATA.athletes.map(a=>a.flight))].sort();
  window._SCREEN_LOCAL.flights=all;_screenPush();R();
};

  const screenUrl=base+'livecast.html?tx=screen&evento='+enc+PRACTICE_Q;

window._SCREEN_STATE={mode:'jornada',flights:null}; // mode: 'profile' | 'jornada' | 'off'
async function loadBirthYears(){
  if(!fbReady||!DATA.event)return;
  try{
    // Las inscripciones se buscan por RUT sin filtrar por evento: traemos TODAS
    // y cruzamos por RUT. Así funciona para sub-tarimas y cualquier evento.
    const snap=await window._fb.getDocs(window._fb.collection(fbDB,'inscripciones'));
    snap.docs.forEach(d=>{
      const x=d.data();
      const k=String(x.rut||'').replace(/[^0-9kK]/gi,'').toUpperCase();
      if(k&&x.fechaNac)window.BIRTH_BY_RUT[k]=x.fechaNac;
    });
    console.log('[screen] fechaNac cargadas:',Object.keys(window.BIRTH_BY_RUT).length);
    if(TX_MODE==='jornada'||TX_MODE==='screen')R();
  }catch(e){console.warn('[screen] loadBirthYears',e.message);}
}
function _screenDocId(){
  if(!DATA.event)return null;
  return (DATA.event.name||'comp').replace(/[^a-zA-Z0-9]/g,'_').substring(0,60);
}
let _screenUnsub=null, _screenFirstSnap=true;
function subscribeScreenChannel(){
  if(!fbReady)return;
  const id=_screenDocId();if(!id)return;
  if(_screenUnsub)return; // evitar suscripciones duplicadas
  try{
    _screenUnsub=window._fb.onSnapshot(window._fb.doc(fbDB,'livecast_screen',id),(snap)=>{
      const d=snap.data()||{};
      window._SCREEN_STATE={mode:d.mode||'jornada',flights:Array.isArray(d.flights)?d.flights:null,nameScale:typeof d.nameScale==='number'?d.nameScale:1};
      window._JORNADA_FLIGHTS=window._SCREEN_STATE.flights;
      window._JORNADA_NAMESCALE=window._SCREEN_STATE.nameScale;
      if(window._SCREEN_LOCAL){
        window._SCREEN_LOCAL.nameScale=window._SCREEN_STATE.nameScale;
        if(window._SCREEN_STATE.mode)window._SCREEN_LOCAL.mode=window._SCREEN_STATE.mode;
        if(Array.isArray(window._SCREEN_STATE.flights))window._SCREEN_LOCAL.flights=window._SCREEN_STATE.flights;
      }
      if(TX_MODE==='screen'||TX_MODE==='jornada')R();
      else if(!TX_MODE&&DATA.phase==='screen'&&_screenFirstSnap)R(); // cargar estado guardado una vez
      _screenFirstSnap=false;
    });
  }catch(e){console.warn('[screen] subscribe',e.message);}
}
// El widget screen: alterna perfil / jornada según el canal de control
function renderTxScreen(c){
  const st=window._SCREEN_STATE||{mode:'jornada'};
  window._JORNADA_FLIGHTS=st.flights;
  window._JORNADA_NAMESCALE=typeof st.nameScale==='number'?st.nameScale:1;
  if(st.mode==='off'){c.innerHTML='';return;}
  if(st.mode==='profile'){
    const cur=liftQueue()[0]||DATA.athletes.find(a=>a.flight===DATA.flight&&!a.bombed);
    document.body.classList.add('tx-opaque');
    c.innerHTML=cur?renderTxProfile(cur):'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(220,230,245,.5);font-family:Oswald;font-size:22px">Sin atleta en tarima</div>';
    return;
  }
  if(st.mode==='intentos'){
    const _piQ=liftQueue();
    const cur=_piQ[0]||DATA.athletes.find(a=>a.flight===DATA.flight&&!a.bombed);
    const nxt=_piQ[1]||null;
    document.body.classList.add('tx-opaque');
    c.innerHTML=cur?renderScreenIntentos(cur,nxt):'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(220,230,245,.5);font-family:Oswald;font-size:22px">Sin atleta en tarima</div>';
    return;
  }
  // jornada (default)
  document.body.classList.add('tx-opaque');
  c.innerHTML=renderTxJornada();
}

// ════════════════════════════════════════════════════════════════
// TABLA DE JORNADA (estilo IPF) — pantalla de tarima, todas las
// categorías de las tandas seleccionadas. Filas con país, año nac,
// BW, SQ/BP/DL (3 intentos c/u + subtotal), total y GL.
// Las tandas a mostrar se eligen vía window._JORNADA_FLIGHTS (set
// por el control de pantalla). Año de nacimiento via BIRTH_BY_RUT.
// ════════════════════════════════════════════════════════════════
window.BIRTH_BY_RUT = window.BIRTH_BY_RUT || {};
function _rutN(s){return String(s||'').replace(/[^0-9kK]/gi,'').toUpperCase();}
function _yob2(a){
  // 2 dígitos del año de nacimiento. Busca por RUT en BIRTH_BY_RUT.
  const k=_rutN(a.rut);
  let fn=k&&window.BIRTH_BY_RUT[k];
  if(!fn) return '';
  const m=String(fn).match(/(\d{4})/);
  if(!m) return '';
  return m[1].slice(2);
}
// celda de un intento: peso con color válido/nulo
function _attCell(at){
  if(!at||(!at.w&&at.r===null)) return '<span style="color:rgba(150,170,200,.35)">—</span>';
  const w=at.w||0;
  if(at.r==='g') return '<span style="color:#22c55e;font-weight:700">'+(w?w.toFixed(1):'—')+'</span>';
  if(at.r==='n') return '<span style="color:#ef4444;font-weight:700;text-decoration:line-through;text-decoration-color:rgba(239,68,68,.6)">'+(w?w.toFixed(1):'—')+'</span>';
  // pendiente (peso declarado, sin resultado)
  return '<span style="color:rgba(220,230,245,.85)">'+(w?w.toFixed(1):'—')+'</span>';
}
// Celda de intento para la PANTALLA DE TARIMA: marca el resultado con COLOR DE FONDO
// (válido = verde, nulo = rojo), legible a distancia en una proyección grande.
function _attTd(at, base){
  if(!at || (!at.w && at.r===null)) return '<td style="'+base+';color:rgba(150,170,200,.30)">—</td>';
  const w=at.w||0; const val=w?w.toFixed(1):'—';
  if(at.r==='g') return '<td style="'+base+';background:rgba(34,197,94,.88);color:#06210f;font-weight:800">'+val+'</td>';
  if(at.r==='n') return '<td style="'+base+';background:rgba(225,40,40,.85);color:#fff;font-weight:800;text-decoration:line-through;text-decoration-thickness:2px">'+val+'</td>';
  // peso declarado, sin juzgar todavía
  return '<td style="'+base+';color:#fff;font-weight:700">'+val+'</td>';
}
function renderTxJornada(){
  // Determinar qué tandas mostrar: las seleccionadas, o la actual si no hay set.
  let flights=window._JORNADA_FLIGHTS;
  if(!flights||!flights.length) flights=[DATA.flight];
  const pool=DATA.athletes.filter(a=>flights.includes(a.flight)&&!a.bombed);
  if(!pool.length) return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Oswald;color:rgba(220,230,245,.6);font-size:24px;letter-spacing:3px">SIN ATLETAS EN LAS TANDAS SELECCIONADAS</div>';
  // Agrupar por categoría (sexo|cat|div)
  const groups={};
  pool.forEach(a=>{const k=_catGroupKey(a);(groups[k]=groups[k]||[]).push(a);});
  // Orden de grupos: sexo (M antes F), luego peso asc, luego división
  const DIVO={'Sub Junior':0,'Sub-Junior':0,'Subjunior':0,'Junior':1,'Open':2,'Master I':3,'Master II':4,'Master III':5,'Master IV':6};
  const catNum=c=>{const s=String(c||'');return s.includes('+')?1000+(parseFloat(s)||0):(parseFloat(s)||999);};
  const sexO=s=>(s==='Femenino'||s==='Mujer'||s==='F')?1:0;
  const keys=Object.keys(groups).sort((A,B)=>{
    const a=A.split('|'),b=B.split('|');
    if(sexO(a[0])!==sexO(b[0]))return sexO(a[0])-sexO(b[0]);
    if(catNum(a[1])!==catNum(b[1]))return catNum(a[1])-catNum(b[1]);
    return (DIVO[a[2]]??9)-(DIVO[b[2]]??9);
  });

  // ── Escalado dinámico: la tabla SIEMPRE llena toda la pantalla ──
  // Calculamos el alto de cada fila según cuántos atletas/categorías hay,
  // de modo que ocupen exactamente el alto disponible (sin sobra ni overflow).

  const weight=numAth*1.0+numCats*1.32;          // las cabeceras de categoría pesan +
  const unit=availH/weight;                       // alto de una fila de atleta (px)
  const hdrH=unit*1.32;                            // alto de fila de categoría (px)
  const s=Math.max(.6,Math.min(2.1,unit/26));     // factor de escala de fuente (más grande para proyección)
  const fs=b=>Math.max(8,Math.round(b*s));        // tamaño de fuente escalado
  // Escala extra solo para el NOMBRE, controlable a distancia desde el panel
  const nameScale=(typeof window._JORNADA_NAMESCALE==='number')?window._JORNADA_NAMESCALE:1;

  let rows='';
  keys.forEach(k=>{
    const parts=k.split('|');
    const sexLabel=sexO(parts[0])? '♀':'♂';
    const divS=txDivShort(parts[2]);
    // ranking dentro del grupo por total (luego GL)
    const list=groups[k].map(a=>{
      const tot=totalOf(a);
      return {a,tot,gl:calcGL(tot,a.bw,a.sex,_glMod(a))};
    }).sort((x,y)=>(y.tot-x.tot)||(y.gl-x.gl));
    // header de categoría
    rows+='<tr style="height:'+hdrH.toFixed(2)+'px"><td colspan="16" style="padding:0 12px;background:linear-gradient(90deg,rgba(196,30,58,.32),rgba(196,30,58,.05));border-left:'+Math.max(3,Math.round(4*s))+'px solid #C41E3A;vertical-align:middle">'
      +'<span style="font-family:Oswald;font-size:'+fs(16)+'px;font-weight:700;letter-spacing:2px;color:#fff">'+sexLabel+' '+parts[1]+' kg · '+divS+'</span>'
      +'<span style="font-family:Oswald;font-size:'+fs(12)+'px;color:rgba(212,168,67,.85);margin-left:10px">'+list.length+' atletas</span></td></tr>';
    list.forEach((row,i)=>{
      const a=row.a;
      const sub=l=>{const b=bestOf(a,l);return b?b.toFixed(1):'—';};
      const td='vertical-align:middle;text-align:center;font-family:Oswald;font-size:'+fs(14)+'px';
      rows+='<tr style="height:'+unit.toFixed(2)+'px;border-bottom:1px solid rgba(212,168,67,.12);background:'+(i%2?'rgba(255,255,255,.035)':'transparent')+'">'
        +'<td style="'+td+';font-weight:700;color:#D4A843;padding:0 4px">'+(row.tot>0?(i+1):'—')+'</td>'
        +'<td style="vertical-align:middle;padding:0 10px;font-family:Inter,sans-serif;font-weight:600;color:#fff;font-size:'+Math.round(fs(15)*nameScale)+'px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+a.name+'</td>'
        +'<td style="'+td+';color:rgba(220,230,245,.85);white-space:nowrap">'+_flagImg(_ctry(a),fs(14))+_ctry(a)+'</td>'
        +'<td style="'+td+';color:rgba(220,230,245,.65)">'+(_yob2(a)||'—')+'</td>'
        +'<td style="'+td+';color:rgba(220,230,245,.9)">'+(a.bw?a.bw.toFixed(1):'—')+'</td>'
        // SQ 3 intentos + subtotal
        +_attTd(a.att.sq[0],td)
        +_attTd(a.att.sq[1],td)
        +_attTd(a.att.sq[2],td)
        +'<td style="'+td+';font-weight:700;color:#7fb2ff;background:rgba(59,130,246,.16)">'+sub('sq')+'</td>'
        // BP 3 intentos + subtotal

        // total + GL

        +'<td style="'+td+';font-size:'+fs(16)+'px;font-weight:800;color:#F0C04A">'+(row.gl>0?row.gl.toFixed(2):'—')+'</td>'

    +'<div style="height:'+topBarH+'px;box-sizing:border-box;padding:0 26px;background:rgba(10,22,40,.6);border-bottom:2px solid #D4A843;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">'

    +'<div style="flex:1;overflow:hidden;padding:0 14px;box-sizing:border-box">'

// ══════════════════════════════════════════════
// TX: BARBELL WIDGET
// ══════════════════════════════════════════════
function renderTxBarbell(cur,lifterChanged){
  if(!cur)return'';
  const att=cur.att[DATA.lift][DATA.round];
  const weight=att?.w||0;
  if(!weight)return'';
  const isMale=cur.sex==='Hombre'||cur.sex==='M'||cur.sex==='Masculino';
  const barKg=20; // barra de 20kg para todos (según la foto de referencia de LiftingCast, incluso en Women's)
  const collarsKg=5; // 2 collares × 2.5kg — se muestran aparte de los discos, pero SÍ pesan
  const barW=barKg+collarsKg; // 25kg fijo antes de los discos
  const sideKg=Math.max(0,(weight-barW)/2);
  // Plate greedy algorithm — solo el set de competencia (25→1.25kg); los
  // fraccionarios de récord (0.75/0.5/0.25/0.125) aún no están habilitados.
  const PLATE_SIZES=[25,20,15,10,5,2.5,1.25];
  const plates=[];
  let rem=Math.round(sideKg*100)/100;
  for(const p of PLATE_SIZES){while(rem>=p-0.001){plates.push(p);rem=Math.round((rem-p)*100)/100;}}
  // Visual props per plate weight. Anchos a la mitad: los discos calibrados de
  // powerlifting son finos, y con el canto grueso la barra parecía cargada con
  // bumpers de halterofilia.
  function pp(kg){
    if(kg>=25) return{h:88,w:12,fill:'#B91C1C',stroke:'#7F1D1D'};
    if(kg>=20) return{h:80,w:11,fill:'#1E40AF',stroke:'#1E3A8A'};
    if(kg>=15) return{h:72,w:10,fill:'#B45309',stroke:'#78350F'};
    if(kg>=10) return{h:62,w:9, fill:'#15803D',stroke:'#14532D'};
    if(kg>=5)  return{h:50,w:8, fill:'#D1D5DB',stroke:'#9CA3AF'};
    if(kg>=2.5)return{h:38,w:7, fill:'#EF4444',stroke:'#991B1B'};
    if(kg>=1.25)return{h:28,w:6, fill:'#9CA3AF',stroke:'#6B7280'};
    if(kg>=0.75)return{h:22,w:5, fill:'#9CA3AF',stroke:'#6B7280'};
    if(kg>=0.5) return{h:20,w:5, fill:'#6B7280',stroke:'#374151'};
                return{h:16,w:4, fill:'#4B5563',stroke:'#1F2937'};
  }
  // Position forecast
  const peers=DATA.athletes.filter(a=>a.sex===cur.sex&&a.cat===cur.cat&&a.div===cur.div&&a.mod===cur.mod);
  const curGL=calcGL(totalOf(cur),cur.bw,cur.sex,_glMod(cur));
  const hypBest=Math.max(bestOf(cur,DATA.lift),weight);
  const sqH=DATA.lift==='sq'?hypBest:bestOf(cur,'sq');
  const bpH=DATA.lift==='bp'?hypBest:bestOf(cur,'bp');
  const dlH=DATA.lift==='dl'?hypBest:bestOf(cur,'dl');
  const hypTotal=(sqH&&bpH&&dlH)?sqH+bpH+dlH:0;
  const hypGL=hypTotal>0?calcGL(hypTotal,cur.bw,cur.sex,_glMod(cur)):0;
  const othersGL=peers.filter(a=>a.id!==cur.id).map(a=>calcGL(totalOf(a),a.bw,a.sex,_glMod(a))).filter(g=>g>0).sort((a,b)=>b-a);
  const curRank=curGL>0?othersGL.filter(g=>g>curGL).length+1:null;
  const newRank=hypGL>0?othersGL.filter(g=>g>hypGL).length+1:null;
  let posHtml='';
  if(newRank!==null){
    const pc=newRank===1?'#22c55e':newRank<=3?'#D4A843':'#7A8FA6';
    if(curRank!==null&&curRank!==newRank)posHtml=`<div style="font-family:Oswald;font-size:17px;letter-spacing:1px;color:${pc};text-align:right">Si es válido pasará del <b>${curRank}°</b> al <b style="font-size:22px">${newRank}° lugar</b></div>`;
    else if(curRank!==null)posHtml=`<div style="font-family:Oswald;font-size:17px;letter-spacing:1px;color:${pc};text-align:right">Mantiene el <b style="font-size:22px">${newRank}° lugar</b> si es válido</div>`;
    else posHtml=`<div style="font-family:Oswald;font-size:17px;letter-spacing:1px;color:${pc};text-align:right">Si es válido: <b style="font-size:22px">${newRank}° lugar</b></div>`;
  }
  const liftName={sq:'SENTADILLA',bp:'PRESS DE BANCA',dl:'PESO MUERTO'}[DATA.lift]||DATA.lift.toUpperCase();
  const roundLabel=['1er INTENTO','2do INTENTO','3er INTENTO'][DATA.round]||`INTENTO ${DATA.round+1}`;
  const weightLbs=(weight*2.20462).toFixed(1);
  // SVG barbell (1920×140)
  const VW=1920,VH=140,cy=VH/2;
  const shaftHalf=120,shaftCX=VW/2,shaftThick=10,sleeveThick=16,collarH=30,collarW=18;
  const barL=40,barR=VW-40;
  const rightColX=shaftCX+shaftHalf;
  const leftColX=shaftCX-shaftHalf-collarW;
  let s=[];
  // Sleeves
  s.push(`<rect x="${barL+8}" y="${cy-sleeveThick/2}" width="${leftColX-barL-8}" height="${sleeveThick}" fill="#71717A" rx="2"/>`);
  s.push(`<rect x="${rightColX+collarW}" y="${cy-sleeveThick/2}" width="${barR-8-(rightColX+collarW)}" height="${sleeveThick}" fill="#71717A" rx="2"/>`);
  // Central shaft
  s.push(`<rect x="${shaftCX-shaftHalf}" y="${cy-shaftThick/2}" width="${shaftHalf*2}" height="${shaftThick}" fill="#D4D4D8" rx="2"/>`);
  // Knurling
  for(let xi=shaftCX-shaftHalf+12;xi<shaftCX+shaftHalf-8;xi+=13)s.push(`<line x1="${xi}" y1="${cy-shaftThick/2-1}" x2="${xi}" y2="${cy+shaftThick/2+1}" stroke="#A1A1AA" stroke-width="1.5" opacity="0.5"/>`);
  // End caps
  s.push(`<rect x="${barL}" y="${cy-collarH/2}" width="10" height="${collarH}" fill="#27272A" rx="2"/>`);
  s.push(`<rect x="${barR-10}" y="${cy-collarH/2}" width="10" height="${collarH}" fill="#27272A" rx="2"/>`);
  // Collars
  s.push(`<rect x="${leftColX}" y="${cy-collarH/2}" width="${collarW}" height="${collarH}" fill="#52525B" rx="2"/>`);
  s.push(`<rect x="${rightColX}" y="${cy-collarH/2}" width="${collarW}" height="${collarH}" fill="#52525B" rx="2"/>`);
  // Plates
  let rxR=rightColX+collarW+2,rxL=leftColX-2;
  plates.forEach(kg=>{
    const p=pp(kg);const py=cy-p.h/2;
    s.push(`<rect x="${rxR}" y="${py}" width="${p.w}" height="${p.h}" fill="${p.fill}" rx="2" stroke="${p.stroke}" stroke-width="1.5"/>`);
    const brillo=Math.max(1.5,p.w*0.22);
    s.push(`<rect x="${rxR+1}" y="${py+2}" width="${brillo}" height="${p.h-4}" fill="rgba(255,255,255,0.2)" rx="1"/>`);
    s.push(`<rect x="${rxL-p.w}" y="${py}" width="${p.w}" height="${p.h}" fill="${p.fill}" rx="2" stroke="${p.stroke}" stroke-width="1.5"/>`);
    // El brillo va del lado de adentro (hacia la barra) en los dos lados, para que
    // la carga se vea simétrica. El disco izquierdo ocupa [rxL-p.w, rxL].
    s.push(`<rect x="${rxL-brillo-1}" y="${py+2}" width="${brillo}" height="${p.h-4}" fill="rgba(255,255,255,0.2)" rx="1"/>`);
    rxR+=p.w+1;rxL-=p.w+1;
  });
  const bbSvg=`<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${VH}px;display:block">${s.join('')}</svg>`;
  const anim=lifterChanged?'animation:txSlideInBottom .7s cubic-bezier(.2,.8,.2,1) both':'';
  const rackH=DATA.lift==='sq'?cur.rackSQ:DATA.lift==='bp'?cur.rackBP:'';
  const sexLbl=isMale?'HOMBRES':'MUJERES';
  return`<div style="position:fixed;bottom:0;left:0;right:0;${anim};background:linear-gradient(180deg,rgba(10,22,40,0) 0%,rgba(10,22,40,.9) 16%,rgba(10,22,40,.97) 38%,rgba(10,22,40,1) 100%);padding:22px 70px 28px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
      <div style="font-family:Oswald;font-size:15px;letter-spacing:3px;color:rgba(212,225,245,.5)">${liftName} <span style="opacity:.7">·</span> ${roundLabel}${rackH?` <span style="opacity:.7">·</span> RACK ${rackH}`:''}</div>
      <div style="font-family:Oswald;font-size:44px;font-weight:700;color:#fff;line-height:1;letter-spacing:1px">${weight}<span style="font-size:22px;color:rgba(212,225,245,.55);margin-left:6px">KG</span><span style="font-size:16px;color:rgba(212,225,245,.3);margin-left:14px">/ ${weightLbs} LBS</span></div>
    </div>
    <div>${bbSvg}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
      <div>
        <div style="font-family:Oswald;font-size:34px;font-weight:700;letter-spacing:1px;color:#fff;line-height:1">${cur.name||''}</div>
        <div style="font-family:Oswald;font-size:12px;letter-spacing:2.5px;color:rgba(212,225,245,.45);margin-top:5px">${[sexLbl,cur.club,cur.cat,cur.div].filter(Boolean).map(x=>(x+'').toUpperCase()).join(' · ')}</div>
      </div>
      ${posHtml}
    </div>
  </div>`;
}

// PANTALLA DE INTENTOS — modo de la "Pantalla de Tarima" (?tx=screen),
// pensada para un monitor/TV en el lugar de la competencia (junto a la
// tarima), calcada de la vista de barra con discos de LiftingCast:
// peso grande, barra con discos IPF a color, altura de rack, nombre,
// sexo/club/categoría, pronóstico de posición y el reloj de 1:00 para
// dar el intento. A diferencia de los widgets de OBS/transmisión, esta
// pantalla NO se transmite al stream — es solo para quienes están en
// el lugar (jueces, atletas, público presencial), así que el reloj
// tiene sentido acá aunque ya no sea público en la transmisión online.
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
// LAYOUT EDITABLE de Pantalla de Intentos — cada bloque (peso, barra,
// nombre, etc.) se puede mover y agrandar/achicar a mano, como una foto:
// click para seleccionarlo (ahí aparece el borde + la manija redonda en
// la esquina para redimensionar), arrastrarlo para moverlo, arrastrar la
// manija para agrandar/achicar. Click en el fondo deselecciona — en ese
// estado la pantalla se ve limpia, sin ningún borde ni manija, lista
// para mostrar en la competencia. Se guarda por navegador/pantalla.
// ════════════════════════════════════════════════════════════════
const PI_LAYOUT_KEY='yl_pant_intentos_layout';
const PI_DEFAULT_LAYOUT={
  record:{x:50,y:7,scale:100},       // cartel de intento de récord: arriba de todo
  liftLabel:{x:50,y:15,scale:100},
  weight:{x:50,y:22,scale:100},
  barbell:{x:50,y:50,scale:100},
  name:{x:50,y:72,scale:100},
  subtitle:{x:50,y:78,scale:100},
  position:{x:50,y:84,scale:100},
  next:{x:50,y:93,scale:100}
};
function _piLoadLayout(){
  try{
    const raw=localStorage.getItem(PI_LAYOUT_KEY);
    if(raw){const saved=JSON.parse(raw);const merged={};Object.keys(PI_DEFAULT_LAYOUT).forEach(k=>{merged[k]=Object.assign({},PI_DEFAULT_LAYOUT[k],saved[k]||{});});return merged;}
  }catch(e){}
  return JSON.parse(JSON.stringify(PI_DEFAULT_LAYOUT));
}
window._piLayout=_piLoadLayout();
window._piSelected=null;
function _piSaveLayout(){try{localStorage.setItem(PI_LAYOUT_KEY,JSON.stringify(window._piLayout))}catch(e){}}
window.piResetLayout=function(){
  if(!confirm('¿Restablecer las posiciones y tamaños de la Pantalla de Intentos a los valores por defecto?'))return;
  window._piLayout=JSON.parse(JSON.stringify(PI_DEFAULT_LAYOUT));
  _piSaveLayout();
  window._piSelected=null;
  if(typeof R==='function')R();
};
// Ajustes de pantalla: mostrar/ocultar cronómetro y colores personalizados
// (fondo/acento/texto), para adaptarse a la iluminación de cada recinto.
// Se guardan por navegador/pantalla, igual que la disposición de bloques.
const PI_SETTINGS_KEY='yl_pant_intentos_settings';
// showTimer en false: la pantalla de tarima no muestra cronómetro (el reloj del
// minuto lo lleva el control, no la proyección). Se puede prender desde el
// engranaje de esa misma pantalla.
const PI_DEFAULT_SETTINGS={showTimer:false,bgColor:'',accentColor:'#D4A843',textColor:'#ffffff'};
function _piLoadSettings(){
  try{
    const raw=localStorage.getItem(PI_SETTINGS_KEY);
    if(raw){
      const g=JSON.parse(raw);
      // El cronómetro se sacó de la pantalla de tarima: si venía prendido de antes
      // (era el default viejo) se apaga, salvo que se haya tocado el interruptor.
      if(g.showTimer===true&&!g._timerElegido)delete g.showTimer;
      return Object.assign({},PI_DEFAULT_SETTINGS,g);
    }
  }catch(e){}
  return Object.assign({},PI_DEFAULT_SETTINGS);
}
function _piSaveSettings(){try{localStorage.setItem(PI_SETTINGS_KEY,JSON.stringify(window._piSettings))}catch(e){}}
window._piSettings=_piLoadSettings();
window._piPanelOpen=false;
window.piSetSetting=function(key,val){
  window._piSettings[key]=val;
  _piSaveSettings();
  if(typeof R==='function')R();
};
window.piToggleSettingsPanel=function(){
  window._piPanelOpen=!window._piPanelOpen;

};

// Un bloque movible/redimensionable. isBarbell=true le agrega overflow visible
// (la barra es más ancha que su contenedor centrado).
function _piBlock(key,innerHtml){
  const pos=window._piLayout[key]||{x:50,y:50,scale:100};
  const selected=window._piSelected===key;
  let h='<div class="pi-block" data-pi-key="'+key+'" style="position:absolute;left:'+pos.x+'%;top:'+pos.y+'%;transform:translate(-50%,-50%);padding:10px;border-radius:8px;'+(selected?'outline:2px dashed #D4A843;background:rgba(212,168,67,.08);':'')+'cursor:'+(selected?'move':'pointer')+'">';
  h+='<div class="pi-inner" style="transform:scale('+((pos.scale||100)/100)+');transform-origin:center center">'+innerHtml+'</div>';
  if(selected){
    h+='<div class="pi-resize" data-pi-key="'+key+'" title="Arrastrá para agrandar/achicar" style="position:absolute;right:-15px;bottom:-15px;width:26px;height:26px;background:#D4A843;border:3px solid #0A1628;border-radius:50%;cursor:nwse-resize;box-shadow:0 2px 8px rgba(0,0,0,.5)"></div>';
  }

// Handlers globales de click/arrastre/redimensión — se registran una sola vez,
// funcionan sobre cualquier .pi-block presente en el DOM en cada momento.
if(!window._piHandlersInit){
  window._piHandlersInit=true;
  // mousedown solo arranca redimensión o arrastre (necesita capturar la posición
  // inicial en el acto). La selección/deselección vive en 'click' (más abajo):
  // si se hiciera acá, un R() en pleno mousedown reemplaza el DOM antes de que
  // el navegador dispare 'click', y ese click se pierde — por ejemplo al hacer
  // clic en el engranaje de ajustes justo después de tener un bloque seleccionado.
  document.addEventListener('mousedown',function(e){
    const container=document.getElementById('pantIntentosBox');
    if(!container||!container.contains(e.target))return;
    const resizeEl=e.target.closest && e.target.closest('.pi-resize');
    if(resizeEl){
      e.preventDefault();
      const key=resizeEl.getAttribute('data-pi-key');
      window._piResize={key,startY:e.clientY,startScale:(window._piLayout[key]||{}).scale||100};
      return;
    }
    const block=e.target.closest && e.target.closest('.pi-block');
    if(!block||block.getAttribute('data-pi-key')!==window._piSelected)return;
    e.preventDefault();
    const key=block.getAttribute('data-pi-key');
    const rect=container.getBoundingClientRect();
    const pos=window._piLayout[key];
    window._piDrag={key,startX:e.clientX,startY:e.clientY,startPosX:pos.x,startPosY:pos.y,rectW:rect.width,rectH:rect.height};
  });
  document.addEventListener('click',function(e){
    const container=document.getElementById('pantIntentosBox');
    if(!container||!container.contains(e.target))return;
    if(e.target.closest && e.target.closest('.pi-resize'))return;
    const block=e.target.closest && e.target.closest('.pi-block');
    if(!block){
      if(window._piSelected){window._piSelected=null;if(typeof R==='function')R();}
      return;
    }
    const key=block.getAttribute('data-pi-key');
    if(window._piSelected!==key){
      window._piSelected=key;
      if(typeof R==='function')R();
    }
  });
  document.addEventListener('mousemove',function(e){
    if(window._piDrag){
      const d=window._piDrag;
      const pos=window._piLayout[d.key];
      pos.x=Math.max(2,Math.min(98,d.startPosX+(e.clientX-d.startX)/d.rectW*100));
      pos.y=Math.max(2,Math.min(98,d.startPosY+(e.clientY-d.startY)/d.rectH*100));
      const el=document.querySelector('.pi-block[data-pi-key="'+d.key+'"]');
      if(el){el.style.left=pos.x+'%';el.style.top=pos.y+'%';}
    } else if(window._piResize){
      const r=window._piResize;
      const pos=window._piLayout[r.key];
      pos.scale=Math.max(20,Math.min(400,r.startScale+(e.clientY-r.startY)/2));
      const el=document.querySelector('.pi-block[data-pi-key="'+r.key+'"] .pi-inner');
      if(el)el.style.transform='scale('+(pos.scale/100)+')';
    }
  });
  document.addEventListener('mouseup',function(){
    if(window._piDrag){_piSaveLayout();window._piDrag=null;}
    if(window._piResize){_piSaveLayout();window._piResize=null;}
  });
  // Touch — mismo criterio, con un solo dedo. La selección/deselección no se
  // toca acá: el tap sintetiza un 'click' propio, que ya cubre eso arriba.
  document.addEventListener('touchstart',function(e){
    const container=document.getElementById('pantIntentosBox');
    if(!container||!e.touches[0]||!container.contains(e.target))return;
    const t=e.touches[0];
    const resizeEl=e.target.closest && e.target.closest('.pi-resize');
    if(resizeEl){
      const key=resizeEl.getAttribute('data-pi-key');
      window._piResize={key,startY:t.clientY,startScale:(window._piLayout[key]||{}).scale||100};
      return;
    }
    const block=e.target.closest && e.target.closest('.pi-block');
    if(!block||block.getAttribute('data-pi-key')!==window._piSelected)return;
    const key=block.getAttribute('data-pi-key');
    const rect=container.getBoundingClientRect();
    const pos=window._piLayout[key];
    window._piDrag={key,startX:t.clientX,startY:t.clientY,startPosX:pos.x,startPosY:pos.y,rectW:rect.width,rectH:rect.height};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!e.touches[0])return;
    const t=e.touches[0];
    if(window._piDrag){
      const d=window._piDrag;
      const pos=window._piLayout[d.key];
      pos.x=Math.max(2,Math.min(98,d.startPosX+(t.clientX-d.startX)/d.rectW*100));
      pos.y=Math.max(2,Math.min(98,d.startPosY+(t.clientY-d.startY)/d.rectH*100));
      const el=document.querySelector('.pi-block[data-pi-key="'+d.key+'"]');
      if(el){el.style.left=pos.x+'%';el.style.top=pos.y+'%';}
    } else if(window._piResize){
      const r=window._piResize;
      const pos=window._piLayout[r.key];
      pos.scale=Math.max(20,Math.min(400,r.startScale+(t.clientY-r.startY)/2));
      const el=document.querySelector('.pi-block[data-pi-key="'+r.key+'"] .pi-inner');
      if(el)el.style.transform='scale('+(pos.scale/100)+')';
    }
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(window._piDrag){_piSaveLayout();window._piDrag=null;}
    if(window._piResize){_piSaveLayout();window._piResize=null;}
  });
}
// Engranaje discreto (esquina inferior izquierda) + panel de ajustes. Cerrado
