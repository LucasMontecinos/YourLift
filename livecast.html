<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A1628;--card:#11223B;--border:#1E3A5F;--side:#0d1b30;--text:#D4E1F0;--muted:#7A8FA6;--accent:#C41E3A;--blue:#1E5BA8;--gold:#D4A843;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit;outline:none}
.os{font-family:'Oswald',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Intento de récord sudamericano: el cartel entra y sale, como en las pantallas
   de la IPF. Se ve casi dos segundos y desaparece uno, para que el público lo
   note sin que tape el peso — la carga de la barra tiene que leerse siempre. */
@keyframes srParpadeo{0%,58%{opacity:1;transform:scale(1)}68%,90%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
.sr-parpadea{animation:srParpadeo 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sr-parpadea{animation:none}}
.fade{animation:fadeIn .3s ease}
.shell{min-height:100vh}
/* Botón hamburguesa: siempre visible arriba a la izquierda */
.hamb{position:fixed;top:12px;left:12px;z-index:1001;width:46px;height:46px;border-radius:10px;border:1px solid rgba(212,168,67,.45);background:#0d1b30;color:#D4A843;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.hamb:hover{border-color:#D4A843;background:#12233f}
body.nav-open .hamb{opacity:0;pointer-events:none}
.nav-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
.nav-close:hover{color:#fff;border-color:var(--accent)}
/* Sidebar como cajón deslizante (off-canvas) */
.side{background:var(--side);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;width:248px;overflow-y:auto;z-index:1000;transform:translateX(-106%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
body.nav-open .side{transform:translateX(0);box-shadow:0 0 44px rgba(0,0,0,.6)}
.nav-backdrop{position:fixed;inset:0;background:rgba(2,8,20,.55);opacity:0;pointer-events:none;transition:opacity .24s;z-index:999}
body.nav-open .nav-backdrop{opacity:1;pointer-events:auto}
.main{padding:20px;padding-top:70px;min-height:100vh;overflow-y:auto}
.logo{font-family:'Oswald';font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
.logo span{color:var(--accent)}
.side-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 8px;font-family:'Oswald'}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-align:left;transition:all .15s;font-family:'DM Sans';margin-bottom:2px}
.side-btn:hover{background:rgba(196,30,58,.08);color:var(--text)}
.side-btn.active{background:var(--accent);color:#fff}
.side-btn .icon{font-size:16px;width:22px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.inp{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.inp:focus{border-color:var(--accent)}
.inp-sm{padding:6px 4px;font-size:12px;text-align:center;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:100%}
.inp-sm:focus{border-color:var(--accent)}
.inp-sm.expired{border-color:var(--red)!important;background:rgba(239,68,68,.1)!important}
.inp-sm.countdown{border-color:var(--orange)!important;background:rgba(245,158,11,.08)!important}
.btn{padding:10px 20px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:'Oswald';letter-spacing:1px;text-transform:uppercase;transition:all .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-r{background:var(--accent);color:#fff}.btn-g{background:var(--green);color:#fff}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-o:hover{border-color:var(--accent);color:var(--text)}
.flight-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:'Oswald';color:#fff}
.att{text-align:center;padding:5px 3px;border-radius:5px;font-weight:700;font-family:'Oswald';font-size:12px;min-width:46px;cursor:pointer;display:inline-block}
.att-g{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.att-n{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);text-decoration:line-through}
.att-p{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.att-e{background:transparent;color:var(--muted);border:1px solid rgba(30,58,95,.3)}
.plate{display:inline-flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;border-radius:3px;margin:0 1px;color:#fff}
.sb-wrap{background:var(--bg);min-height:100vh}
.sb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 30px;background:linear-gradient(90deg,var(--accent),#8B1525);color:#fff}
.sb-body{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 56px)}
@media(max-width:900px){
  .side{width:84vw;max-width:300px}
  .main{padding:14px;padding-top:68px}
  .sb-body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="R"></div>
<script src="clubs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5/dist/obs-ws.min.js" integrity="sha384-Vce9u7FN5Pbapc8dhpMdg2EjTels5H1cGOVLAe7THp3fEtfb89nD6YOIaf8781ay" crossorigin="anonymous"></script>
<script>

let DATA={phase:'setup',events:[],event:null,athletes:[],lift:'sq',round:0,flight:'A',timer:60,timerOn:false,changeTimers:{},lotsGenerated:false,forcedCurrent:null,compTimer:null};

// ══════════════════════════════════════════════
// TRANSMISSION WIDGETS (?tx=<widget>)
// Standalone widgets for OBS Browser Sources. Read-only.
// ══════════════════════════════════════════════
const TX_URL=new URLSearchParams(location.search);
const TX_MODE=TX_URL.get('tx')||null; // 'profile' | 'scoreboard' | 'leaderboard' | 'lbauto' | 'slam' | 'timer' | 'lights' | 'ceremony' | null
const TARIMA=TX_URL.get('tarima')||null; // '1' o '2' para modo 2 tarimas; null = todas
// ¿Estamos adentro de una fuente de navegador de OBS? OBS inyecta window.obsstudio
// en cada browser source, y además se anuncia en el user agent. Importa porque su
// navegador interno (CEF) no es Chrome: el canal en tiempo real de Firestore se
// queda colgado ahí — la página carga bien, muestra el estado del momento y ya no
// se entera de nada más. Es lo que pasó en el Regional: el control remoto movía la
// competencia, el mismo link abierto en Chrome respondía, y el de OBS no.
// ?longpoll=1 fuerza el mismo tratamiento en cualquier navegador que se comporte así.
const EN_OBS=(function(){
  try{
    if(window.obsstudio)return true;
    if(/\bOBS\b/i.test(navigator.userAgent||''))return true;
  }catch(e){}
  return false;
})();
const FORZAR_LONGPOLL=EN_OBS||TX_URL.get('longpoll')==='1';
const DEMO_MODE=TX_URL.get('demo')==='1'; // Modo demo para grabar videos promocionales
// Modo práctica (?practica=1): livecast.html completo (Control en Vivo, Atletas y
// Pesaje, Control TX, todo) pero con una tanda ficticia de atletas inventados, sin
// tocar Firebase para nada — ni lectura ni escritura. Pensado para que los jueces
// se familiaricen con la herramienta sin riesgo de tocar una competencia real.
// Ver _initPracticeMode() más abajo.
const PRACTICE_MODE=TX_URL.get('practica')==='1';
// ?practica=1&espectador=1 → vista de ESPECTADOR de la práctica: lo mismo que ve
// el público (COMPETENCIA EN VIVO, sin controles de admin), leyendo la data de
// práctica compartida por localStorage. Para mandarle el link a la gente que
// quiere ir mirando mientras los jueces practican. Ver _initPracticeMode().
const PRACTICE_VIEWER=PRACTICE_MODE && TX_URL.get('espectador')==='1';
// ?practica=1&real=1 → PRÁCTICA CON NÓMINA REAL: mismas condiciones que un evento
// real (elegís un campeonato y carga sus atletas reales desde Firestore), pero en
// modo práctica: Firebase queda de SOLO LECTURA (un candado bloquea toda escritura,
// ver initFB) y NO se sincroniza el estado en vivo (ver startFBSync), así nunca
// toca la competencia real. La data vive en el localStorage de práctica.
const PRACTICE_REAL=PRACTICE_MODE && TX_URL.get('real')==='1';
// ?remote=1 → al loguearse admin, aterriza directo en el Control Remoto (phone-first).
// Pensado para mandarle el link al teléfono que controla el overlay de OBS.
const WANT_REMOTE=TX_URL.get('remote')==='1';
function _inTarima(flightLetter){if(!TARIMA)return true;return String(flightLetter||'').endsWith(TARIMA);}
if(TX_MODE){
  const css=document.createElement('style');
  css.textContent=`
    html,body{background:transparent!important;overflow:hidden!important;margin:0}
    body.tx-opaque{background:linear-gradient(135deg,#0A1628 0%,#0E1F3A 50%,#0A1628 100%)!important}
    #R{display:none!important}
    #txWidget{position:fixed;inset:0;font-family:'Oswald',sans-serif;color:#fff;z-index:2}
    @keyframes txSlideRight{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes txSlideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes txSlideDown{from{transform:translateY(-40px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes txFade{from{opacity:0}to{opacity:1}}
    @keyframes txScaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes txGrowLine{from{transform:scaleY(0);transform-origin:top}to{transform:scaleY(1);transform-origin:top}}
    @keyframes txGrowLineH{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
    @keyframes txSlamIn{0%{transform:scale(.4) rotate(-8deg);opacity:0;letter-spacing:30px}55%{transform:scale(1.15) rotate(0);opacity:1;letter-spacing:8px}75%{transform:scale(.95)}100%{transform:scale(1);letter-spacing:8px}}
    @keyframes txSlamOut{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0;filter:blur(8px)}}
    @keyframes txSlamFlash{0%,100%{background:rgba(0,0,0,0)}40%{background:rgba(0,0,0,.45)}}
    @keyframes txLightOn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes txTimerPulse{0%,100%{opacity:1}50%{opacity:.55}}
    /* ─── IPF-style flag wipe (3 cintas diagonales) ─── */
    @keyframes txStripeFwd{0%{transform:translateX(-160%) skewX(-18deg)}45%{transform:translateX(0) skewX(-18deg)}55%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(160%) skewX(-18deg)}}
    @keyframes txStripeBack{0%{transform:translateX(160%) skewX(-18deg)}45%{transform:translateX(0) skewX(-18deg)}55%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(-160%) skewX(-18deg)}}
    @keyframes txContentFadeIn{0%,55%{opacity:0;transform:scale(.96)}65%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
    @keyframes txContentFadeOut{0%,45%{opacity:1;transform:scale(1)}55%{opacity:0;transform:scale(.96)}100%{opacity:0;transform:scale(.96)}}
    @keyframes txLogoBeat{0%,55%{opacity:0;transform:scale(.5)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7)}}
    /* ─── Slide-in / build animations para componentes corner ─── */
    @keyframes txSlideInLeft{0%{transform:translateX(-110%);opacity:0}60%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:1}}
    @keyframes txSlideOutLeft{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-110%);opacity:0}}
    @keyframes txSlideInRight{0%{transform:translateX(110%);opacity:0}60%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:1}}
    @keyframes txSlideOutRight{0%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
    /* Scoreboard: entra desde abajo (sube hacia su posición) */

async function initFB(){
  try{

    const storageMod=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js');
    const app=initializeApp(FB_CFG);
    try{
      // experimentalAutoDetectLongPolling: en el wifi de un gimnasio (portal
      // cautivo, proxy, router que corta conexiones largas) el canal en tiempo
      // real de Firestore a veces queda a medias y los cambios llegan tarde o de
      // a montones. Con esto el SDK lo detecta y se pasa solo a long polling.
      // Si la red está bien, no cambia nada.
      //
      // Adentro de OBS no alcanza con detectarlo: en su navegador interno la
      // detección da por bueno un canal que después nunca entrega nada, y la
      // fuente se queda congelada en el estado que había al abrirla. Ahí se fuerza
      // el long polling de entrada. Y se usa caché en memoria en vez de
      // IndexedDB, que en OBS es inestable y no aporta nada a una pantalla que
      // solo muestra.
      let _cfgFS;
      if(FORZAR_LONGPOLL){
        _cfgFS={experimentalForceLongPolling:true};
        if(fb.memoryLocalCache)_cfgFS.localCache=fb.memoryLocalCache();
      }else{
        _cfgFS={localCache:fb.persistentLocalCache({tabManager:fb.persistentMultipleTabManager()}),
                experimentalAutoDetectLongPolling:true};
      }
      fbDB=fb.initializeFirestore(app,_cfgFS);
      if(FORZAR_LONGPOLL)console.log('[FB] long polling forzado'+(EN_OBS?' (fuente de navegador de OBS)':''));
    }catch(e){
      fbDB=fb.getFirestore(app); // fallback si ya fue inicializado
    }
    fbAuth=authMod.getAuth(app);
    // ── CANDADO DE PRÁCTICA ──────────────────────────────────────────────
    // En modo práctica (incluida la práctica con nómina real) Firebase queda de
    // SOLO LECTURA: reemplazamos toda función de ESCRITURA del SDK por un no-op.
    // Así, pase lo que pase en el código, la práctica JAMÁS escribe en la base y
    // no puede tocar una competencia real. Las lecturas (getDoc/getDocs/onSnapshot/
    // query/where/collection/doc) siguen intactas.

      window._fb=Object.assign({},fb,{setDoc:_noWrite,updateDoc:_noWrite,addDoc:_noWrite,deleteDoc:_noWrite,setDocs:_noWrite,writeBatch:_fakeBatch,runTransaction:_noWrite});
      const _stNoop=async()=>({ref:{},metadata:{},_practice:true});
      window._fbSt=Object.assign({},storageMod,{uploadBytes:_stNoop,uploadBytesResumable:_stNoop,uploadString:_stNoop,deleteObject:_noWrite});
      console.log('[Práctica] Firebase en SOLO LECTURA — escrituras bloqueadas');
    }else{

    }
    window._fbAuth=authMod;fbReady=true;
    window._fbStInst=storageMod.getStorage(app);

    if(typeof _setupLcMediaListener==='function')_setupLcMediaListener(); // foto/gif persistente por atleta (livecast)
    if(typeof _cargarFotosSuda==='function')_cargarFotosSuda();               // fotos de la nómina del Sudamericano
    // Keep LIVE_EVENTS in sync with Firestore eventos
    fb.onSnapshot(fb.collection(fbDB,'eventos'),async (snap)=>{
      const evs={};
      window.LIVE_EVENT_META=window.LIVE_EVENT_META||{};

      window.LIVE_EVENT_HIDDEN_NAMES=new Set();
      // Competencias habilitadas para el público (admin → YourLift Público). El
      // espectador solo ve estas: nunca la lista completa de lo que hay cargado.
      window.LIVE_EVENT_PUB=new Set();

      snap.docs.forEach(d=>{
        const e=d.data();
        // "Visible para el público" y "visible en el livecast" son dos interruptores
        // distintos: el primero es lo que ve la gente en Competencia en Vivo, el
        // segundo es si aparece en la lista del operador. Se lee ANTES de la salida
        // por archivado, porque si no un campeonato archivado pero publicado (el
        // Sudamericano es justo eso) dejaba al público sin nada que ver.

      } else {

function fbDocId(){
  if(!DATA.event)return null;
  const base=(DATA.event.name||'comp').replace(/[^a-zA-Z0-9]/g,'_').substring(0,55);
  // Si está en modo 2 tarimas (?tarima=1 o ?tarima=2), cada tarima usa su propio doc
  // Así dos PCs (uno por tarima) escriben a docs separados y NO se pisan datos.
  return TARIMA?`${base}_T${TARIMA}`:base;
}
// Sufijo para docs auxiliares (record alerts, director scene) cuando hay 2 tarimas
// → cada tarima maneja sus widgets sin pisar a la otra.
function txDocId(base){return TARIMA?`${base}_T${TARIMA}`:base;}
// Id de los docs de ESTADO de transmisión (director, record) — separado POR EVENTO
// (y por tarima si aplica). Así dos competencias DISTINTAS y simultáneas no se pisan:
// cada evento tiene su propio director/record. Control y widget calculan el mismo id
// porque ambos usan fbDocId() (basado en el nombre del evento). Si no hay evento, cae
// al id viejo (compatibilidad).
function evStateDocId(base){const ev=fbDocId();return ev?(base+'__'+ev):txDocId(base);}
// Firma liviana de la competencia (cuántas decisiones y suma de pesos). Sirve
// para detectar si esta pantalla EDITÓ algo que no se está guardando.
function _dataSig(){
  let n=0,s=0;
  (DATA.athletes||[]).forEach(a=>{['sq','bp','dl'].forEach(l=>{
    ((a.att&&a.att[l])||[]).forEach(x=>{ if(x){ s+=(x.w||0); if(x.r)n++; } });
  })});

  // (la modalidad solo separa el ranking, no cambia la fórmula)
  // const isOE=(mod==='oe_classic'||mod==='oe_bench');

  if(snap===window._histCur)return; // nada cambió (ej. tic de reloj)
  window._histUndo.push(window._histCur);
  if(window._histUndo.length>_HIST_MAX)window._histUndo.shift();
  window._histRedo.length=0; // una acción nueva invalida el "rehacer"
  window._histCur=snap;
  _histUpdateButtons();
}

  DATA.forcedCurrent=d.fc||null; DATA.compTimer=d.ct||null;

}

// ═══════════════════════════════════════════════════════════════════
// MULTI-ESCRITOR: merge por-celda para que varios controladores (ej. la
// planilla cargando pesos + tú u otros marcando resultados o cargando pesos
// en otras casillas) NO se pisen. Cada edición local marca su "celda" con
// timestamp; cuando llega un snapshot de OTRO escritor, se absorben todos
// sus cambios EXCEPTO las celdas que toqué en los últimos HOLD ms (esas las
// conservo). Si conservé algo que difería del remoto, reenvío mi versión
// para que Firestore (y por lo tanto Control TX) converja con ambos cambios.
// ═══════════════════════════════════════════════════════════════════
window._recentAtt = window._recentAtt || {};   // "athId|campo" -> ts
const _MERGE_HOLD_MS = 4000;
// Campos del atleta (todo lo que no son los intentos) que una edición reciente
// conserva frente a lo que llega del servidor. Van también los de identidad
// —nombre, división, categoría, sexo, club— porque una corrección de nómina
// hecha desde una pantalla se perdía sola: el merge partía del remoto y esos
// campos no estaban en la lista, así que el primer snapshot los devolvía.
const _MERGE_META_FIELDS=['bw','rackSQ','rackBP','sqAbat','bpSeg','bpPalm','mod','country',
  'flight','lot','bombed','weighedIn','jornada','name','div','cat','sex','club','uni'];
// Ediciones locales todavía NO confirmadas en Firebase. A diferencia de
// _recentAtt (ventana de 4s para el merge de LECTURA), estas se conservan hasta
// que una escritura sale bien: así, con varios PCs operando, una edición mía
// nunca se pierde aunque el guardado tarde o haya que reintentar.
window._pendingEdits=new Set();
function _markAtt(id, field){
  try{ window._recentAtt[id+'|'+field]=Date.now(); window._pendingEdits.add(id+'|'+field); }catch(e){}
}
// Merge para ESCRITURA: parte del estado REMOTO (lo que hicieron los otros
// controladores) y encima aplica solo MIS ediciones pendientes. Así dos PCs que
// tocan atletas distintos no se pisan nunca — antes, cada escritura mandaba el
// documento completo y la última en llegar borraba lo del otro.
function _mergeForWrite(localArr, remoteArr){
  if(!remoteArr||!remoteArr.length)return localArr;
  const pend=window._pendingEdits||new Set();
  const META=_MERGE_META_FIELDS;
  const byId={}; (localArr||[]).forEach(a=>{ if(a&&a.id!=null) byId[a.id]=a; });
  const out=(remoteArr||[]).map(ra=>{
    const la=byId[ra.id];
    // Mismo id pero otra persona → roster de otro campeonato: manda el remoto.
    if(!la || _nnCrono(la.name||'')!==_nnCrono(ra.name||''))return ra;
    const m=JSON.parse(JSON.stringify(ra));
    if(pend.has(ra.id+'|meta'))META.forEach(f=>{ if(la[f]!==undefined)m[f]=la[f]; });
    ['sq','bp','dl'].forEach(l=>{
      const lL=(la.att&&la.att[l])||[], lR=(m.att&&m.att[l])||[];
      const n=Math.max(lL.length,lR.length), arr=[];
      for(let r=0;r<n;r++){
        if(pend.has(ra.id+'|att_'+l+'_'+r)){ if(lL[r])arr[r]=lL[r]; }  // mío (incluye borrar el 4º)
        else if(lR[r]!==undefined)arr[r]=lR[r];
        // Sin la condición de arriba, un intento extra que otro control ya borró
        // volvía a subir desde acá y le revivía a todo el equipo. Lo que tengo
        // local y no está ni en el servidor ni entre mis ediciones pendientes es
        // data vieja: no se reenvía.
      }
      while(arr.length&&arr[arr.length-1]===undefined)arr.pop();
      if(!m.att)m.att={};
      m.att[l]=arr;
    });
    return m;
  });
  const rids=new Set((remoteArr||[]).map(a=>a&&a.id));
  (localArr||[]).forEach(a=>{ if(a&&!rids.has(a.id))out.push(a); });
  return out;
}
function _mergeAthletes(localArr, remoteArr){
  const now=Date.now();
  const pend=window._pendingEdits||new Set();
  const held={};
  for(const k in window._recentAtt){ if(now-window._recentAtt[k]<_MERGE_HOLD_MS) held[k]=true; else delete window._recentAtt[k]; }
  const localById={}; (localArr||[]).forEach(a=>{ if(a&&a.id!=null) localById[a.id]=a; });
  let overrode=false;
  const out=(remoteArr||[]).map(ra=>{
    const la=localById[ra.id];
    // Mismo id pero OTRA persona = rosters de campeonatos distintos. No se
    // mezcla nada: manda el del servidor. Los ids se reparten por evento, así
    // que sin este control las ediciones de un campeonato le caían encima a
    // otro atleta en el otro.
    if(!la || _nnCrono(la.name||'')!==_nnCrono(ra.name||'')) return ra;
    const m=JSON.parse(JSON.stringify(ra));
    if(held[ra.id+'|meta']){
      _MERGE_META_FIELDS.forEach(f=>{ if(la[f]!==undefined) m[f]=la[f]; });
      overrode=true;
    }
    ['sq','bp','dl'].forEach(l=>{
      const lLocal=(la.att&&la.att[l])||[];
      const lRemote=(m.att&&m.att[l])||[];
      const maxLen=Math.max(lLocal.length,lRemote.length);
      const arr=[];
      for(let r=0;r<maxLen;r++){
        const heldR=held[ra.id+'|att_'+l+'_'+r];
        if(heldR){
          // Yo toqué esta celda hace poco → mi versión manda. Si la BORRÉ (ej.
          // eliminé el 4º intento: lLocal[r] ya no existe) NO la re-agrego desde el
          // remoto — así la eliminación no "revive" por un snapshot de otro control.
          if(lLocal[r]){ arr[r]={w:lLocal[r].w,r:lLocal[r].r}; }
          overrode=true;
        }
        else if(lRemote[r]!==undefined){ arr[r]=lRemote[r]; }
        // El remoto viene más corto que lo que tengo acá: o alguien borró ese
        // intento extra, o yo lo acabo de agregar y todavía no salió de este
        // equipo. Solo se conserva en el segundo caso — o sea, si es una edición
        // MÍA sin confirmar. Sin esa condición, una pantalla de espectador se
        // quedaba con el 4º intento para siempre: el servidor ya no lo traía, pero
        // acá seguía en memoria y ganaba en cada snapshot. Por eso, al borrar el
        // extra o reiniciar los datos en vivo, el público lo seguía viendo.
        else if(lLocal[r]!==undefined && pend.has(ra.id+'|att_'+l+'_'+r)){
          arr[r]={w:lLocal[r].w,r:lLocal[r].r}; overrode=true;
        }
      }
      // Sacar huecos finales (ej. borré el último índice estando held).
      while(arr.length && arr[arr.length-1]===undefined) arr.pop();
      if(!m.att) m.att={};
      m.att[l]=arr;
    });
    return m;
  });
  // Atletas que tengo local y no vinieron en el remoto, con edición reciente →
  // conservarlos (ej. acabo de agregar uno y todavía no llegó al servidor).
  // PERO solo si los dos rosters son del MISMO campeonato: se compara cuántos
  // nombres comparten. Si no comparten casi ninguno, lo que tengo cargado es el
  // roster de otro evento y meterlo acá cruza las nóminas — fue exactamente lo
  // que pasó entre el Sudamericano de prueba y el Regional Centro Sur.
  const remoteIds=new Set((remoteArr||[]).map(a=>a&&a.id));
  const remoteNames=new Set((remoteArr||[]).map(a=>_nnCrono(a&&a.name||'')));
  const comunes=(localArr||[]).filter(a=>remoteNames.has(_nnCrono(a&&a.name||''))).length;
  const mismoRoster=!(localArr||[]).length||!(remoteArr||[]).length
    ||comunes>=Math.ceil(Math.min((localArr||[]).length,(remoteArr||[]).length)*0.5);
  if(mismoRoster){
    (localArr||[]).forEach(a=>{
      if(a && !remoteIds.has(a.id) && !remoteNames.has(_nnCrono(a.name||'')) && held[a.id+'|meta']){
        out.push(a); overrode=true;
      }
    });
  }else{
    console.warn('[FB] El roster local no coincide con el del servidor — no se agregan atletas locales');
  }
  window.__mergeOverrode=overrode;
  return out;
}
// Reenvío diferido: si el merge conservó ediciones mías que no estaban en el
// remoto, empujo mi versión para que Firestore quede con AMBOS cambios. Sale
// del handler de snapshot (por eso el setTimeout) y solo si soy controlador.
let _wbTimer=null;
function _scheduleWriteback(){
  if(!window.IS_CONTROLLER)return;
  if(_wbTimer)return;
  _wbTimer=setTimeout(()=>{ _wbTimer=null; try{ if(typeof syncToFB==='function') syncToFB(); }catch(e){} }, 450);
}

function _evAthlete(a,j,flightMap){

    const rawMod=(a.modalidad||a.mod||'').toLowerCase();
    // Mapear todas las modalidades soportadas
    let mod;
    const isOE=rawMod.includes('special olympics')||rawMod.includes('olimpiadas')||rawMod.includes(' oe')||rawMod.endsWith('oe');
    const isEq=rawMod.includes('equipado')||rawMod.includes('equipped');
    const isBench=rawMod.includes('only bench')||rawMod.includes('onlybench')||rawMod.includes('only_bench');
    const isCombined=rawMod.includes('+');
    // OE solo soporta Powerlifting Classic — no hay Only Bench OE
    if(isOE) mod='oe_classic';
    else if(isCombined&&isEq) mod='equipped_bench';
    else if(isCombined) mod='classic_bench';
    else if(isBench&&isEq) mod='equipped_bench'; // edge case raro
    else if(isBench) mod='onlybench';
    else if(isEq) mod='equipped';
    else mod='classic';
    const _rawSex=(a.sexo||a.sex||'').trim();
    const _normSex=(_rawSex==='Femenino'||_rawSex==='F'||_rawSex==='Mujer')?'Mujer':(_rawSex==='Masculino'||_rawSex==='M'||_rawSex==='Hombre')?'Hombre':_rawSex;
    const _countryCode=String(a.pais||a.country||a.pais3||'CHI').toUpperCase();
    // Los eventos de ENSAYO vienen con intentos y peso corporal ya cargados en el
    // archivo, para poder practicar sobre una competencia a medio correr. Un evento
    // normal no trae nada de esto y arranca en cero, como siempre.
    const _att=l=>{
      const src=(a.att&&a.att[l])||null;
      const base=[0,1,2].map(j=>{
        const x=src&&src[j];
        return {w:(x&&+x.w)||0, r:(x&&(x.r==='g'||x.r==='n'))?x.r:null};
      });
      if(src&&src[3]&&+src[3].w)base.push({w:+src[3].w,r:(src[3].r==='g'||src[3].r==='n')?src[3].r:null,extra:true});

// RÉCORDS SUDAMERICANOS (FESUPO)
// records_suda.json trae los 997 récords oficiales con la clave
//   sexo|equipo|division|categoria|movimiento   (mov: sq bp dl total bpsl)
// 'bpsl' es la banca de Only Bench, que tiene récord propio y distinto del
// press de banca dentro del powerlifting.
//
// Un atleta puede batir el récord de SU división y además el OPEN (criterio IPF:
// el Open está abierto a todas las edades), así que siempre se chequean las dos.
// Los universitarios no tienen récord propio en FESUPO: se comparan solo contra
// el Open. Special Olympics no tiene tabla de récords.
// ══════════════════════════════════════════════════════════════════
let RECSUDA=null;
function _srOn(){
  if(!RECSUDA||!DATA.event)return false;
  return DATA.event.records==='suda'||/^suda2026/.test(String(DATA.event.id||''));
}
function _srSexo(a){ return /^(f|muj|dam|fem)/i.test(String(a&&a.sex||''))?'F':'M'; }
function _srEquip(a){
  const m=String(a&&a.mod||'');
  if(m.indexOf('oe_')===0)return null;                       // Special Olympics: sin récords
  if(m==='invitado')return null;                             // fuera de competencia: no marca récord
  return (m==='equipped'||m==='equipped_bench')?'equipped':'classic';
}
function _srSoloBanca(a){ const m=String(a&&a.mod||''); return m==='onlybench'||m==='equipped_bench'; }
// "-83 kg (Hombre)", "83", "120+" → "-83" / "+120"
function _srCat(a){
  const s=String(a&&a.cat||'');
  const m=s.match(/([+-]?)\s*(\d+(?:[.,]\d+)?)/);
  if(!m)return '';
  const antes=s.slice(0,s.search(/\d/));
  const plus=m[1]==='+'||antes.indexOf('+')>=0||/^\s*\d+(?:[.,]\d+)?\s*\+/.test(s);
  return (plus?'+':'-')+String(parseFloat(String(m[2]).replace(',','.')));

// Divisiones contra las que se mide este atleta: la suya y el Open.
function _srDivs(a){

  const out=[];

  if(out.indexOf('Open')<0)out.push('Open');

function _srLiftKey(a,l){ return (l==='bp'&&_srSoloBanca(a))?'bpsl':l; }
// Récords vigentes de un atleta para un movimiento: [{div,kg,quien,pais,fecha,lugar}]
// Si una división no tiene récord cargado, va con kg:0 (cualquier marca válida lo abre).
function _srRecords(a,l){

  const eq=_srEquip(a); if(!eq)return [];
  const cat=_srCat(a); if(!cat)return [];
  if(l==='total'&&_srSoloBanca(a))return [];                 // Only Bench no hace total
  const key=_srLiftKey(a,l), sx=_srSexo(a);

// ── Récords logrados EN ESTA competencia ───────────────────────────
// El panel y los avisos tienen que mostrar el récord VIGENTE: si alguien lo
// rompe, el que viene atrás ya no compite contra la marca del archivo sino
// contra la nueva. No se guarda nada: se recalcula de los intentos válidos, así
// deshacer, corregir un peso o anular una decisión lo dejan al día solo.
// Se cachea por render (_SR_HOY) porque lo consulta cada casilla de la tabla.
function _srHoyCalc(){
  const out={};
  if(!_srOn())return out;
  const poner=(k,kg,a)=>{ if(!out[k]||kg>out[k].kg)out[k]={kg:kg,quien:a.name,id:a.id}; };
  (DATA.athletes||[]).forEach(a=>{
    const eq=_srEquip(a); if(!eq)return;
    const cat=_srCat(a); if(!cat)return;
    const sx=_srSexo(a), divs=_srDivs(a);
    LIFTS.forEach(l=>{
      let b=0;(a.att[l]||[]).forEach(x=>{ if(x&&x.r==='g'&&x.w>b)b=x.w; });
      if(b<=0)return;
      const lk=_srLiftKey(a,l);

// Récord vigente de una clave: el del archivo, o el de hoy si ya lo superaron.
function _srVigente(k,hoy){

  if(base)return {kg:base.kg,quien:base.quien,pais:base.pais,fecha:base.fecha,lugar:base.lugar,vacio:false,hoy:false};

// ¿Este peso sería récord? Devuelve las divisiones que rompería (vacío = no).
// El propio atleta que acaba de poner el récord sigue viendo su casilla marcada

function _srRompe(a,l,w){

// ── Al romperse un récord, subir a los que quedaron cortos ─────────
// Récord en 102.5, uno tira 103 y queda en 103: el que venía atrás con 103
// declarado YA NO rompe nada (hay que superarlo, no igualarlo). Se le sube al
// múltiplo de 2.5 siguiente por encima del récord nuevo — 105.
// Solo se toca a quien todavía NO levantó ese intento, y solo si su peso ERA de
// récord contra la marca anterior: a quien no iba por el récord no se le mueve

function _srMinRec(b,l,hoy){

  const sx=_srSexo(b), lk=_srLiftKey(b,l);

// Normaliza coma → punto para que 72,5 y 72.5 sean lo mismo
function parseWeight(v){return parseFloat(String(v==null?'':v).replace(',','.'))||0;}
function setAtt(id,l,r,val){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  const w=parseWeight(val);
  // Warn if change timer expired but still allow entry
  const key=id+'_'+l+'_'+r;
  const ct=DATA.changeTimers[key];
  if(ct&&ct.expired){
    showToastLC('\u23F0 Timer expirado — peso ingresado igual');
  }
  if(w>0){
    // Rule: each attempt must be ≥ all previous attempts (successful or not)
    for(let prev=r-1;prev>=0;prev--){
      const p=a.att[l][prev];
      if(p.w>0&&w<p.w){
        showToastLC('\u26A0\uFE0F '+a.name+': intento '+(r+1)+' ('+w+'kg) menor al intento '+(prev+1)+' ('+p.w+'kg) — bloqueado');
        const el=document.getElementById('ct_'+key);
        if(el)el.value=a.att[l][r].w||'';
        return;
      }
    }
    // Warn if weight seems unusually small vs category (< 50% of cat number)
    const catKg=parseFloat((a.cat||'').replace(/[^0-9.]/g,''))||0;
    if(catKg>0&&w<catKg*0.3){
      if(!confirm('\u26A0\uFE0F El peso '+w+'kg parece muy bajo para la categoría '+a.cat+'. ¿Confirmar igualmente?')){
        const el=document.getElementById('ct_'+key);
        if(el)el.value=a.att[l][r].w||'';
        return;
      }
    }
  }
  a.att[l][r].w=w;
  _markAtt(id,'att_'+l+'_'+r);
  if(DATA.changeTimers[key])delete DATA.changeTimers[key];
  // El peso sale YA, sin esperar el debounce: es el dato que la pantalla de tarima
  // necesita para cargar la barra. Además setAtt corre en 'change' (una vez, al
  // salir de la casilla), así que acá no hay ráfaga de tecleo que juntar.
  saveNow();
  // Refrescar la UI para que la celda muestre el peso (no el countdown viejo)
  if(typeof R==='function')R();
}

// Timer de cambio (60s tras marcar un intento) — APAGADO por defecto.
// El operador lo prende desde Control en Vivo si lo necesita. Con él apagado,
// las celdas no muestran el reloj y se carga el próximo peso directo.
window._CT_ENABLED = localStorage.getItem('yl_ct')==='1';
window.toggleChangeTimers=function(){
  window._CT_ENABLED=!window._CT_ENABLED;
  try{localStorage.setItem('yl_ct', window._CT_ENABLED?'1':'0')}catch(e){}
  if(!window._CT_ENABLED) DATA.changeTimers={}; // limpiar los timers activos al apagar
  if(typeof saveNow==='function')saveNow();
  if(typeof R==='function')R();
};
// Auto-relleno del próximo intento al vencer el tiempo de cambio — switch
// aparte, APAGADO por defecto, solo tiene efecto si el timer de cambio
// (_CT_ENABLED) también está prendido. Nulo → mismo peso. Válido → +2.5kg.
window._CT_AUTOFILL_ENABLED = localStorage.getItem('yl_ct_autofill')==='1';
window.toggleChangeTimerAutofill=function(){
  window._CT_AUTOFILL_ENABLED=!window._CT_AUTOFILL_ENABLED;
  try{localStorage.setItem('yl_ct_autofill', window._CT_AUTOFILL_ENABLED?'1':'0')}catch(e){}
  if(typeof R==='function')R();

// ¿Este atleta tiene un intento EXTRA todavía sin levantar en este movimiento?
function _extraPendienteDe(a,l){ const at=(a&&a.att&&a.att[l]||[])[3]; return !!(at&&at.extra&&at.r===null); }
// Arranca (o cancela) el minuto para declarar el intento siguiente.
// No corre si el atleta tiene un intento EXTRA sin levantar: recién después de
// ese intento sabe con cuánto seguir, así que pedirle el peso antes —y hacerle
// sonar la alarma a los 60s— no tiene sentido. Cuando el extra se juzga, el
// minuto arranca ahí.
// Tampoco corre si el peso del siguiente ya estaba cargado.
function _armarChangeTimer(a,l,rSig){
  if(!a||!(rSig>=0)||rSig>2)return;
  const key=a.id+'_'+l+'_'+rSig;
  const yaTienePeso=a.att[l][rSig]&&a.att[l][rSig].w;
  if(window._CT_ENABLED && !yaTienePeso && !_extraPendienteDe(a,l)){
    DATA.changeTimers[key]={remaining:60,expired:false,startedAt:Date.now()};
    startCT(key);
  } else if(DATA.changeTimers[key]){
    delete DATA.changeTimers[key];
  }
}
function setResult(id,l,r,res){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  // Foto de los récords ANTES de esta decisión: si la marca los mueve, hay que
  // saber contra qué estaban tirando los demás para reacomodar sus declarados.
  const _hoyAntes=(res==='g'&&_srOn())?_srHoyCalc():null;
  a.att[l][r].r=res;
  _markAtt(id,'att_'+l+'_'+r);
  if(_hoyAntes)_srAvisarSubidas(_srSubirDeclarados(_hoyAntes));
  _clearCompIfJudged(id,l,r);
  // Al juzgar el EXTRA, el minuto del intento siguiente arranca recién ahora.
  if(r===3) _armarChangeTimer(a,l,((a.att[l][3]||{}).grantedRound??DATA.round)+1);
  else if(r<2) _armarChangeTimer(a,l,r+1);
  // NOTA: si falla los 3 intentos de un lift, queda DQ para el total
  // pero NO bombed (sigue compitiendo en los lifts siguientes).
  // bombed solo si falla los 9 intentos del meet completo.
  if(a.att.sq.every(x=>x.r==='n')&&a.att.bp.every(x=>x.r==='n')&&a.att.dl.every(x=>x.r==='n'))a.bombed=true;
  // Reset timer y arrancar automáticamente para el próximo atleta
  // Record alert: check if this good lift breaks a national record
  if(res==='g')checkRecord(a,l,r);
  // Reset judge lights for next athlete
  if(judgeMode)resetJudgeLights();
  saveNow();R();
  // Auto-advance: if liftQueue is now empty, round is done
  const snapLift=DATA.lift,snapRound=DATA.round;
  if(liftQueue().length===0){
    showToastLC('Ronda completada — avanzando en 3s…');
    setTimeout(()=>{if(DATA.lift===snapLift&&DATA.round===snapRound)advanceLift();},3000);
  }
}

function startJudgeListener(){
  if(!fbReady)return;
  if(judgeUnsub){judgeUnsub();judgeUnsub=null}
  // Also listen for timer-start signals from judge panel
  let _timerListenerFirst=true;
  window._fb.onSnapshot(window._fb.doc(fbDB,'timer_control','current'),(snap)=>{
    if(!snap.exists())return;
    const d=snap.data();
    // First snapshot: just record current ts to ignore stale signals already in Firestore
    if(_timerListenerFirst){
      _timerListenerFirst=false;
      if(d.ts)_lastTimerSignal=d.ts;
      return;
    }
    if(d.action==='start'&&d.ts&&d.ts>_lastTimerSignal){
      _lastTimerSignal=d.ts;
      if(!DATA.timerOn)startTimer();
    }
  });
  judgeUnsub=window._fb.onSnapshot(window._fb.doc(fbDB,'judge_decisions','current'),(snap)=>{
    if(!snap.exists())return;
    const d=snap.data();
    judgeLights={izq:d.izq||null,central:d.central||null,der:d.der||null};
    // Check if all 3 judges voted
    if(judgeLights.izq&&judgeLights.central&&judgeLights.der){
      // Determine result by majority
      const votes=[judgeLights.izq,judgeLights.central,judgeLights.der];
      const goods=votes.filter(v=>v==='white').length;
      const result=goods>=2?'g':'n';
      // Auto-apply result to current athlete
      const queue=liftQueue();
      if(queue.length>0){
        const cur=queue[0];
        setTimeout(()=>{
          setResult(cur.id,DATA.lift,DATA.round,result);
        },2000); // 2s delay to show lights before advancing
      }
    }
    R();
  });
}

// ── Foto / GIF persistente por atleta (se guarda y se reutiliza si vuelve) ──────
// Clave estable: RUT si tiene; si no, país + nombre normalizado. Se guarda en
// Firestore atleta_fotos/<clave> (reusa colección existente, lectura pública) y
// los archivos en Storage athlete_photos/ y athlete_gifs/ (reusa paths existentes).
window._LC_MEDIA = window._LC_MEDIA || {};
// Fotos subidas desde Admin (inscripción/panel "Fotos Atletas") — quedan en el
// mismo doc atleta_fotos/{codigo} pero con id que NO empieza con 'lc_', y traen
// el RUT del atleta como campo. Se indexan acá por RUT para poder mostrarlas
// en Control TX / Perfil aunque livecast nunca haya subido nada por su cuenta.
window._ADMIN_FOTOS_BY_RUT = window._ADMIN_FOTOS_BY_RUT || {};
function _rutKey(r){ return String(r||'').replace(/[^0-9kK]/gi,'').toUpperCase(); }
function _adminFotoFor(a){ const r=_rutKey(a&&a.rut); return (r&&window._ADMIN_FOTOS_BY_RUT[r])||null; }
// ── Fotos de la nómina del Sudamericano ───────────────────────────
// Se cargaron desde Admin → Fotos Sudamericano a la colección nomina_suda_fotos,
// con el nombre del atleta como clave (los extranjeros no tienen RUT ni código en
// YourLift, así que por ahí no se les encuentra). Acá se leen igual para que el
// perfil y Control TX muestren la foto de cualquiera, chileno o no.
window.NSUDA_FOTOS_LC=window.NSUDA_FOTOS_LC||{};
function _nsudaSlugLC(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,'-').slice(0,80);
}
function _fotoSudaFor(a){
  const u=window.NSUDA_FOTOS_LC[_nsudaSlugLC(a&&a.name)];
  return u?{foto_url:u}:null;
}
function _cargarFotosSuda(){
  if(!fbReady||!window._fb||!fbDB||window._nsudaFotosLC)return;
  window._nsudaFotosLC=true;
  try{
    window._fb.getDocs(window._fb.collection(fbDB,'nomina_suda_fotos')).then(snap=>{
      snap.docs.forEach(d=>{const v=d.data();if(v&&v.foto_url)window.NSUDA_FOTOS_LC[d.id]=v.foto_url;});
      const n=Object.keys(window.NSUDA_FOTOS_LC).length;
      if(n){console.log('[livecast] fotos del Sudamericano:',n);
        if(typeof renderTxWidget==='function')renderTxWidget();
        if(typeof R==='function')R();}
    }).catch(e=>console.warn('[livecast] nomina_suda_fotos:',e.message));
  }catch(e){console.warn('[livecast] nomina_suda_fotos:',e.message);}
}
function _mediaKey(a){
  const rut=String((a&&a.rut)||'').replace(/[^0-9kK]/gi,'').toUpperCase();
  if(rut) return 'lc_rut_'+rut;
  const nm=String((a&&a.name)||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  return 'lc_'+_ctry(a).toLowerCase()+'_'+nm;
}
// Foto/GIF efectivos de un atleta: base = foto de inscripción aprobada en Admin
// (si existe), y encima se superpone lo que se haya subido puntualmente desde
// livecast (foto o GIF distinto para la transmisión), si lo hay.
function _lcMediaFor(a){
  const own=(a&&window._LC_MEDIA[_mediaKey(a)])||null;
  // Orden: lo que se subió puntualmente desde livecast > la foto del perfil (por
  // RUT) > la foto de la nómina del Sudamericano (por nombre).
  const admin=_adminFotoFor(a)||_fotoSudaFor(a);
  if(!own&&!admin)return null;
  const merged=Object.assign({},admin?{foto_url:admin.foto_url}:{},own||{});
  if(!merged.foto_url&&admin&&admin.foto_url)merged.foto_url=admin.foto_url;
  return merged;
}
function _setupLcMediaListener(){
  if(!fbReady||!window._fb||!fbDB||window._lcMediaUnsub)return;
  // Logos de clubes desde admin
  try{
    if(!window._lcClubsUnsub){
      window._lcClubsUnsub=window._fb.onSnapshot(window._fb.collection(fbDB,'clubs'),snap=>{
        window._CLUBS_FS={};
        snap.docs.forEach(d=>{const v=d.data();if(v.slug&&v.logoUrl)window._CLUBS_FS[v.slug]=v;});
      });
    }
  }catch(e){}
  try{
    window._lcMediaUnsub=window._fb.onSnapshot(window._fb.collection(fbDB,'atleta_fotos'),snap=>{
      snap.docs.forEach(d=>{
        const data=d.data();
        if(String(d.id).indexOf('lc_')===0){ window._LC_MEDIA[d.id]=data; return; }
        const r=_rutKey(data.rut);
        if(r&&data.foto_url&&data.status!=='rejected')window._ADMIN_FOTOS_BY_RUT[r]={foto_url:data.foto_url};
      });
      if(typeof renderTxWidget==='function')renderTxWidget();
      if(!TX_MODE && DATA.phase==='manage' && typeof R==='function')R();
    });
  }catch(e){console.warn('[lc-media]',e.message);}
}

async function uploadAthleteMedia(id,kind,file){
  if(!file)return;
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!window._fbSt||!window._fbStInst){alert('Storage no disponible todavía, esperá un momento');return;}
  if(!isAdmin){alert('Solo admin puede subir fotos');return;}
  const st=document.getElementById('amStatus');if(st)st.textContent='Subiendo…';
  try{
    const {ref,uploadBytes,getDownloadURL}=window._fbSt;
    const key=_mediaKey(a);
    const dot=file.name.lastIndexOf('.');const ext=(dot>=0?file.name.slice(dot+1):'').toLowerCase()||(kind==='foto'?'jpg':'mp4');
    const folder=kind==='foto'?'athlete_photos/':'athlete_gifs/';
    const path=folder+key+'_'+Date.now()+'.'+ext;
    const r=ref(window._fbStInst,path);
    await uploadBytes(r,file,{contentType:file.type||(kind==='foto'?'image/jpeg':'video/mp4')});
    const url=await getDownloadURL(r);
    const patch=kind==='foto'?{foto_url:url}:{gif_url:url};
    await window._fb.setDoc(window._fb.doc(fbDB,'atleta_fotos',key),Object.assign({codigo:key,name:a.name,country:_ctry(a),ts:Date.now()},patch),{merge:true});
    window._LC_MEDIA[key]=Object.assign({},window._LC_MEDIA[key]||{},patch);
    if(st)st.textContent='✓ Guardado';
    // refrescar preview
    const isVid=kind==='gif'&&!String(url).toLowerCase().endsWith('.gif');
    const pv=document.getElementById(kind==='foto'?'amPrevFoto':'amPrevGif');
    if(pv)pv.innerHTML=isVid?'<video src="'+url+'" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover"></video>':'<img src="'+url+'" style="width:100%;height:100%;object-fit:cover">';
    R();
  }catch(e){if(st)st.textContent=''+e.message; console.warn('[lc-media] upload',e);}
}
async function removeAthleteMedia(id){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!confirm('¿Quitar la foto/gif de '+a.name+'?'))return;
  try{
    const key=_mediaKey(a);
    await window._fb.setDoc(window._fb.doc(fbDB,'atleta_fotos',key),{foto_url:'',gif_url:'',ts:Date.now()},{merge:true});
    delete window._LC_MEDIA[key];
    document.getElementById('athMediaModal')?.remove();
    showToastLC('Foto/gif quitada de '+a.name);R();
  }catch(e){alert('Error: '+e.message);}
}

      if(v>0 && v<=catKg){st.textContent=''+v+'kg NO califica para +'+catKg+'kg (debe pesar más de '+catKg+'kg)';st.style.color='var(--red)';}
      else if(v>catKg){st.textContent='✓ '+v+'kg califica para +'+catKg+'kg';st.style.color='var(--green)';}
      else{st.textContent='Categoría +'+catKg+' kg (debe pesar más de '+catKg+' kg)';st.style.color='var(--muted)';}
    }
  });
}

// Borra el pesaje del atleta: BW, racks y todos los intentos (vuelve a "sin pesar")
window.clearWeighIn = function(id){
  const a = DATA.athletes.find(x=>x.id===id);
  if(!a) return;
  const msg = `¿Borrar el pesaje de ${a.name}?\n\nSe borrarán:\n• Peso corporal (BW)\n• Alturas de rack (SQ y BP)\n• Todos los intentos cargados\n\nEsto NO borra al atleta del evento. Solo le reinicia el pesaje.`;
  if(!confirm(msg)) return;
  a.bw = 0;
  a.rackSQ = '';
  a.rackBP = '';
  a.sqAbat = ''; a.bpSeg = ''; a.bpPalm = '';
  a.weighedIn = false;
  _markAtt(id,'meta');
  // Limpiar intentos del atleta (pesos y resultados). Igual que en el confirmar:
  // sin marcar cada celda, el borrado no viajaba y el primer snapshot del
  // servidor le devolvía los intentos al atleta.
  ['sq','bp','dl'].forEach(l=>{
    if(a.att && a.att[l]){
      a.att[l].forEach((at,r)=>{at.w=0; at.r=null; _markAtt(id,'att_'+l+'_'+r);});
    }
  });
  // Limpiar cualquier change timer activo del atleta
  Object.keys(DATA.changeTimers).forEach(k=>{
    if(k.startsWith(id+'_')) delete DATA.changeTimers[k];
  });
  saveNow();
  const modal = document.getElementById('weighInModal');
  if(modal) modal.remove();
  R();
  showToastLC('Pesaje borrado: '+a.name);
};

function confirmWeighIn(id,catKg,limit){
  const bw=parseWeight(document.getElementById('wi_bw').value);
  const rSQ=(document.getElementById('wi_rackSQ').value||'').trim();
  const rBP=(document.getElementById('wi_rackBP').value||'').trim();
  const _v=id=>{const e=document.getElementById(id);return e?(e.value||'').trim():'';};
  const sqAbat=_v('wi_sqAbat');                       // '' | izq | der | ambos
  const bpSeg=_v('wi_bpSeg');                         // altura de los seguros de banca
  const bpPalm=(parseInt(_v('wi_bpPalm'),10)||0)||''; // 0 → vacío (no se muestra)
  const mod=document.getElementById('wi_mod').value;
  const country=(document.getElementById('wi_country')?.value||'CHI');
  const sq1=parseWeight(document.getElementById('wi_sq1')?.value);
  const bp1=parseWeight(document.getElementById('wi_bp1')?.value);
  const dl1=parseWeight(document.getElementById('wi_dl1')?.value);
  const alertEl=document.getElementById('wi_alert');
  // Validate BW > 0
  if(!bw){alertEl.style.display='block';alertEl.textContent='Ingresa el peso corporal';return;}
  // Re-derivar si es categoría "+" (sin límite superior)
  const _a=DATA.athletes.find(x=>x.id===id);
  const _isPlusCat=_a&&(_a.cat||'').includes('+');
  // Warn según el tipo de categoría
  if(_isPlusCat && catKg>0 && bw<=catKg){
    if(!confirm('El peso '+bw+'kg NO califica para la categoría +'+catKg+'kg (debe pesar más de '+catKg+'kg).\n¿Confirmar igualmente?'))return;
  } else if(!_isPlusCat && limit>0 && bw>limit){
    if(!confirm('El peso '+bw+'kg EXCEDE el límite de la categoría ('+limit+'kg).\n¿El atleta compite fuera de categoría o el jurado aprobó? Confirmar igualmente.'))return;
  }
  // Save
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  a.bw=bw;a.rackSQ=rSQ;a.rackBP=rBP;a.sqAbat=sqAbat;a.bpSeg=bpSeg;a.bpPalm=bpPalm;a.mod=mod;a.country=country;
  _markAtt(id,'meta');
  a.weighedIn=true;
  // Guardar primeros intentos (apertura) si vinieron en el modal.
  // Cada celda que se toca hay que MARCARLA: el merge de escritura parte del
  // estado remoto y solo le pega encima las celdas marcadas. Sin la marca, la
  // apertura cargada acá se perdía — el BW y las alturas de rack sí subían
  // (van en 'meta'), pero los primeros intentos no llegaban ni al público ni a
  // la pantalla de tarima, y al recargar la página desaparecían.
  if(a.att){
    if(sq1>0 && a.att.sq && a.att.sq[0] && a.att.sq[0].r===null){ a.att.sq[0].w = sq1; _markAtt(id,'att_sq_0'); }
    if(bp1>0 && a.att.bp && a.att.bp[0] && a.att.bp[0].r===null){ a.att.bp[0].w = bp1; _markAtt(id,'att_bp_0'); }
    if(dl1>0 && a.att.dl && a.att.dl[0] && a.att.dl[0].r===null){ a.att.dl[0].w = dl1; _markAtt(id,'att_dl_0'); }
  }
  saveNow();
  document.getElementById('weighInModal').remove();
  R();
}

// ── REAL-TIME ATHLETE LOADING FROM FIRESTORE ────────────────
// Trae el flight/jornada asignado en la pestaña Cronograma del admin
// (doc Firestore cronograma/{eventId}), matcheando por nombre normalizado.
// Es un getDoc puntual (no listener en vivo) — se llama solo cuando se
// carga o resincroniza la nómina, no en cada cambio, para no sumar
// lecturas de Firestore de más.
function _nnCrono(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
// Busca la tanda de un atleta en el mapa del Cronograma. Primero intenta match exacto
// (nombre normalizado); si no hay, intenta un match flexible por subconjunto de palabras.
// Motivo: el Cronograma a veces trae el nombre completo con segundo nombre (ej. "Andres
// SIMÓN Neira Acevedo") mientras que la inscripción solo tiene "Andres Neira Acevedo" — con
// match exacto esos casos quedaban sin tanda asignada. Requiere que TODAS las palabras del
// nombre más corto estén contenidas en el más largo, así nunca cruza por coincidencia
// parcial de un solo apellido suelto entre dos personas distintas.
function _cronoLookup(map,name){
  if(!map)return null;
  const key=_nnCrono(name);
  if(map[key])return map[key];
  const qTokens=key.split(' ').filter(Boolean);
  if(qTokens.length<2)return null;
  const qSet=new Set(qTokens);
  for(const k in map){
    const kTokens=k.split(' ').filter(Boolean);
    if(kTokens.length<2)continue;
    const kSet=new Set(kTokens);
    const small=qSet.size<=kSet.size?qSet:kSet, big=qSet.size<=kSet.size?kSet:qSet;
    let subset=true;
    for(const t of small){if(!big.has(t)){subset=false;break;}}
    if(subset)return map[k];
  }
  return null;
}
// El Cronograma ahora puede traer el DÍA además de la jornada (campeonatos de dos
// o más días, como el Regional Norte). Viajan juntos en la misma etiqueta —
// "Día 1 · AM" — porque `jornada` solo se muestra, no se compara con nada.
const _cronoJor=r=>[r.dia,r.jornada].map(x=>String(x||'').trim()).filter(Boolean).join(' · ');
// El Cronograma manda también en división de edad, categoría y modalidad, no solo
// en la tanda: es la planilla que la federación revisa y firma, mientras que la
// inscripción la llenó el atleta y suele venir con la división vieja o sin marcar
// Olimpiadas Especiales. Estos tres helpers traducen lo que trae el Cronograma al
// formato que guarda el livecast.
function _modDesdeTexto(txt){
  const t=String(txt||'').toLowerCase();
  const eq=t.includes('equipado')||t.includes('equipped');
  const bench=t.includes('only bench')||t.includes('onlybench')||t.includes('only_bench');
  const comb=t.includes('+');
  const oe=t.includes('special olympics')||t.includes('olimpiadas')||t.includes(' oe')||t.trim().endsWith('oe');
  let mod;
  if(oe) mod=bench?'oe_bench':'oe_classic';
  else if(comb&&eq) mod='equipped_bench';
  else if(comb) mod='classic_bench';
  else if(bench&&eq) mod='equipped_bench';
  else if(bench) mod='onlybench';
  else if(eq) mod='equipped';
  else mod='classic';
  return {mod,plusBench:comb};
}
// "-83 kg" -> "83", "+120 kg" -> "120+", "84+" -> "84+"
function _cronoCat(txt){
  const m=String(txt||'').match(/(\d+)\s*\+|\+\s*(\d+)|(\d+)/);
  if(!m)return '';
  return m[1]?m[1]+'+':(m[2]?m[2]+'+':m[3]);
}
// Divisiones válidas. Si el Cronograma trae algo que no está en la lista (un error de
// tipeo como "Subunior") NO se pisa lo que ya tiene el atleta: mejor dejarlo como está
// que meterle una división inventada a la nómina.
const _CRONO_DIVS=['Sub-Junior','Junior','Open','Master I','Master II','Master III','Master IV'];
function _cronoDiv(txt){
  const t=_nnCrono(txt).replace(/[^a-z0-9]/g,'');
  return _CRONO_DIVS.find(d=>_nnCrono(d).replace(/[^a-z0-9]/g,'')===t)||'';
}
function _cronoMapDeRows(rows){
  const map={};
  (rows||[]).forEach(r=>{
    if(!r.nombre)return;
    const e={flight:r.flight||'',jornada:_cronoJor(r),div:_cronoDiv(r.division),cat:_cronoCat(r.categoria)};
    if(String(r.modalidad||'').trim()){const m=_modDesdeTexto(r.modalidad);e.mod=m.mod;e.plusBench=m.plusBench;}
    map[_nnCrono(r.nombre)]=e;
  });
  return map;
}
async function _loadCronoFlightMap(evId){
  if(!fbReady||!window._fb||!evId)return null;
  try{
    const snap=await window._fb.getDoc(window._fb.doc(fbDB,'cronograma',evId));
    if(!snap.exists())return null;
    const rows=snap.data().rows;
    if(!Array.isArray(rows)||!rows.length)return null;
    return _cronoMapDeRows(rows);
  }catch(e){console.warn('[crono] flightMap',e.message);return null;}
}
// Suscripción en vivo al Cronograma (además del getDoc puntual de arriba, usado para la
// carga inicial). Un doc, se reescribe poco (solo cuando el admin edita el Cronograma), así
// que el costo extra en Firestore es despreciable — y evita el bug de tandas desactualizadas
// si el Cronograma se sigue ajustando DESPUÉS de abrir el evento en YourLift, sin tener que
// acordarse de tocar "Re-sincronizar nómina" cada vez.
let _cronoFlightUnsub=null;
function _subscribeCronoFlightMap(evId){
  if(!fbReady||!window._fb||!evId)return;
  if(_cronoFlightUnsub){_cronoFlightUnsub();_cronoFlightUnsub=null;}
  try{
    _cronoFlightUnsub=window._fb.onSnapshot(window._fb.doc(fbDB,'cronograma',evId),(snap)=>{
      if(!snap.exists())return;
      const rows=snap.data().rows;
      if(!Array.isArray(rows))return;
      const map=_cronoMapDeRows(rows);
      window._cronoFlightMap=map;
      _applyCronoFlightsToAthletes(map);
    });
  }catch(e){console.warn('[crono] subscribe',e.message);}
}
// Reaplica flight/jornada del Cronograma a los atletas ya cargados (por si cambiaron
// DESPUÉS de la carga inicial). Solo toca lo que vino del Cronograma — no inventa nada
// si un atleta no está ahí.
// El número de lote LLEVA la tanda adentro: se sortean como base de tanda + posición
// (A → 100, 101…; B → 200, 201…). Así que si un atleta cambia de tanda, su lote queda
// de la tanda vieja: aparece un 104 en la tanda E y el orden de salida se desordena.
// Acá se le da el primer lote libre de su tanda nueva. NO se toca el de nadie más:
// re-sortear todo cambiaría el orden de salida de los 62.
function _reubicarLote(a){
  if(!DATA.lotsGenerated||!a||!a.flight)return false;
  const base=(String(a.flight).charCodeAt(0)-64)*100;
  if(!(base>0))return false;
  if(a.lot>=base&&a.lot<base+100)return false;      // ya está en el rango de su tanda
  const usados=new Set(DATA.athletes.filter(x=>x!==a).map(x=>x.lot));
  let n=base;
  while(usados.has(n))n++;
  a.lot=n;
  return true;
}
function _applyCronoFlightsToAthletes(map){
  if(!map||!DATA.athletes||!DATA.athletes.length)return;
  let tandas=0,datos=0;
  const armando=(DATA.phase==='setup'||DATA.phase==='manage');
  DATA.athletes.forEach(a=>{
    const entry=_cronoLookup(map,a.name);
    if(!entry)return;
    if(entry.flight && a.flight!==entry.flight){a.flight=entry.flight;tandas++;if(_reubicarLote(a))tandas++;}
    if(typeof entry.jornada==='string' && a.jornada!==entry.jornada){a.jornada=entry.jornada;tandas++;}
    // División, categoría y modalidad: manda el Cronograma. Solo se pisa cuando el
    // Cronograma trae el dato y es distinto — nunca se borra lo que ya tiene el atleta.
    // Y solo mientras se arma la nómina: con la competencia andando manda el operador,
    // porque un atleta que se pasa de peso cambia de categoría en el pesaje y el
    // Cronograma no se entera. La categoría además se respeta apenas está pesado.
    if(!armando)return;
    if(entry.div && a.div!==entry.div){a.div=entry.div;datos++;}
    if(entry.cat && String(a.cat)!==entry.cat && !a.weighedIn && !(+a.bw>0)){a.cat=entry.cat;datos++;}
    // Un invitado/a lo marca el operador en el pesaje, por algo que el Cronograma
    // no puede saber (no dio el peso). No se le devuelve la modalidad de nómina.
    if(_esInvitado(a))return;
    if(entry.mod && (a.mod!==entry.mod||!!a.plusBench!==!!entry.plusBench)){
      a.mod=entry.mod;a.plusBench=entry.plusBench;datos++;
    }
  });
  if(tandas||datos){
    save();R();
    showToastLC(datos?'Nómina actualizada desde el Cronograma (división, categoría y modalidad)'
                     :'Tandas actualizadas desde el Cronograma');
  }
}
function _inscToAthlete(ins, j, flightMap){
  const name=ins.nombre||'';
  const cronoEntry=_cronoLookup(flightMap,name);
  const fl=cronoEntry?cronoEntry.flight:(ins.flight||'A');
  // Modalidad, división y categoría: si el Cronograma las trae, manda el Cronograma;
  // la inscripción queda de respaldo para los atletas que no figuren ahí.
  // (Special Olympics vive acá: sin esto los OE de eventos EN VIVO quedaban como
  // 'classic' y competían en el ranking general en vez del suyo.)
  const insMod=_modDesdeTexto(ins.modalidad||'');
  const mod=(cronoEntry&&cronoEntry.mod)||insMod.mod;
  const isCombined=(cronoEntry&&cronoEntry.mod)?!!cronoEntry.plusBench:insMod.plusBench;
  const catNum=(cronoEntry&&cronoEntry.cat)||_cronoCat(ins.categoria)||(ins.categoria||'');
  const div=(cronoEntry&&cronoEntry.div)||ins.division||'';
  return{
    id:j,lot:j+1,name,rut:ins.rut||'',sex:ins.sexo||'',
    cat:catNum,div,club:ins.club==='Otro'?ins.clubOtro:ins.club||'',
    uni:ins.universidad||'',mod,plusBench:isCombined,bw:0,flight:fl,jornada:cronoEntry?cronoEntry.jornada:(ins.jornada||''),born:(String(ins.fechaNac||ins.dob||ins.born||'').match(/\d{4}/)||[''])[0],rackSQ:'',rackBP:'',
    bombed:false,weighedIn:false,
    att:{sq:[{w:0,r:null},{w:0,r:null},{w:0,r:null}],
         bp:[{w:0,r:null},{w:0,r:null},{w:0,r:null}],
         dl:[{w:0,r:null},{w:0,r:null},{w:0,r:null}]}
  };
}

function _mergeFirebaseAthletes(fbAthletes){
  // Merge: update existing athletes by name/rut, add new ones, remove deleted
  let changed=false;
  // Matchea atleta local con uno de Firestore: RUT primero; si no, nombre. El nombre
  // se compara igual que en el Cronograma (sin tildes, y aceptando que a uno le falte
  // el segundo nombre). Con la comparación exacta anterior, un "José Salamanca Ormeño"
  // contra "José Tomás Salamanca Ormeño" NO matcheaba: el atleta entraba como nuevo,
  // el viejo se borraba por sobrante, y de paso perdía su número de lote.
  const _r=s=>String(s||'').replace(/[^0-9kK]/g,'');
  const _mismoNombre=(x,y)=>{
    const a=_nnCrono(x||'').split(' ').filter(Boolean), b=_nnCrono(y||'').split(' ').filter(Boolean);
    if(!a.length||!b.length)return false;
    if(a.join(' ')===b.join(' '))return true;
    const A=new Set(a), B=new Set(b);
    const chico=A.size<=B.size?A:B, grande=A.size<=B.size?B:A;
    if(chico.size<2)return false;
    for(const t of chico){ if(!grande.has(t))return false; }
    return true;
  };
  const matches=(local,fa)=>(_r(fa.rut)&&_r(local.rut)&&_r(local.rut)===_r(fa.rut))||_mismoNombre(local.name,fa.name);

  fbAthletes.forEach((fa,j)=>{
    const existing=DATA.athletes.find(a=>matches(a,fa));
    if(!existing){
      // New athlete — only add if competition not started
      if(DATA.phase==='manage'||DATA.phase==='setup'){
        const newId=DATA.athletes.length?Math.max(...DATA.athletes.map(a=>a.id))+1:0;
        const nuevo={...fa,id:newId,lot:newId+1};
        DATA.athletes.push(nuevo);
        // Con los lotes ya sorteados, el que entra toma el primer lote libre de SU
        // tanda (A→100…, B→200…) en vez de un correlativo suelto que rompe el orden.
        _reubicarLote(nuevo);
        changed=true;
      }
    }else{
      // Update flight if changed in Firestore
      if(fa.flight&&fa.flight!==existing.flight){
        existing.flight=fa.flight;changed=true;
        _reubicarLote(existing);   // el lote lleva la tanda adentro (A→100, B→200…)
      }
      // División, categoría y modalidad vienen del Cronograma (ver _inscToAthlete),
      // que es lo que manda. Sin esto la re-sincronización solo arreglaba la tanda y
      // dejaba, por ejemplo, a los de Olimpiadas Especiales corriendo como Classic.
      // La categoría no se toca si el atleta ya está pesado: ahí manda la balanza.
      if(fa.div&&fa.div!==existing.div){existing.div=fa.div;changed=true;}
      if(fa.cat&&String(fa.cat)!==String(existing.cat)&&!existing.weighedIn&&!(+existing.bw>0)){
        existing.cat=fa.cat;changed=true;
      }
      if(fa.mod&&(fa.mod!==existing.mod||!!fa.plusBench!==!!existing.plusBench)){
        existing.mod=fa.mod;existing.plusBench=fa.plusBench;changed=true;
      }
    }
  });

  // ── DETECCIÓN DE BORRADOS ─────────────────────────────────────
  // Atletas locales que ya no existen en Firestore (admin los eliminó)
  const stale=DATA.athletes.filter(local=>!fbAthletes.some(fa=>matches(local,fa)));
  if(stale.length){
    // Atletas con datos ya cargados (peso, intentos, resultados) — no auto-borrar
    const hasData=a=>a.bw>0||['sq','bp','dl'].some(l=>(a.att?.[l]||[]).some(x=>x.w>0||x.r));
    const safeToRemove=stale.filter(a=>!hasData(a));
    const withData=stale.filter(hasData);
    // Borrado automático de los que no tienen datos
    if(safeToRemove.length){
      const ids=new Set(safeToRemove.map(a=>a.id));
      DATA.athletes=DATA.athletes.filter(a=>!ids.has(a.id));
      // Un borrado debe REEMPLAZAR el remoto: el merge conserva los atletas que
      // están en el servidor y no en local, así que sin esto no se propagaría.
      window._forceFullWrite=true;
      changed=true;
      showToastLC(''+safeToRemove.length+' atleta'+(safeToRemove.length>1?'s':'')+' eliminado'+(safeToRemove.length>1?'s':'')+' (borrados desde admin)');
    }
    // Aviso sobre los que tienen datos — el operador decide manualmente
    if(withData.length){
      console.warn('[LC] Atletas con datos pero borrados del admin:',withData.map(a=>a.name));
      showToastLC(''+withData.length+' atleta'+(withData.length>1?'s':'')+' borrado'+(withData.length>1?'s':'')+' del admin pero con datos cargados acá. Revisá Atletas & Pesaje y borralo'+(withData.length>1?'s':'')+' a mano si corresponde.');
    }
  }
  if(changed){save();R();}
}

async function loadLiveAthletes(ev){
  // Stop previous listener
  if(_liveUnsub){_liveUnsub();_liveUnsub=null;}
  // Find event ID from name
  const evId=Object.keys(LIVE_EVENTS).find(k=>LIVE_EVENTS[k]===ev.name)||null;
  if(!evId){
    console.warn('[LiveCast] No Firestore ID for event:',ev.name);
    return;
  }
  // Flight/jornada asignados en la pestaña Cronograma del admin. Se carga una vez acá
  // y de ahí en más se mantiene al día vía _subscribeCronoFlightMap (onSnapshot) en
  // window._cronoFlightMap — el onSnapshot de acá abajo SIEMPRE lee window._cronoFlightMap
  // (no una copia local vieja), porque si usara una variable capturada en este momento,
  // cualquier cambio posterior en inscripciones (aunque no tenga nada que ver con el
  // Cronograma) volvería a aplicar el mapa viejo y pisaría la tanda ya corregida.
  window._cronoFlightMap=await _loadCronoFlightMap(evId);
  _subscribeCronoFlightMap(evId); // mantiene window._cronoFlightMap al día si el Cronograma se sigue editando

  const q=window._fb.query(
    window._fb.collection(fbDB,'inscripciones'),
    window._fb.where('evento','==',evId),
    window._fb.where('status','in',['approved','pending'])
  );

  _liveUnsub=window._fb.onSnapshot(q,(snap)=>{
    const fbAthletes=snap.docs
      .map(d=>({...d.data(),id:d.id}))
      .sort((a,b)=>(a.lot||9999)-(b.lot||9999))
      .map((ins,j)=>_inscToAthlete(ins,j,window._cronoFlightMap));

    if(!fbAthletes.length)return; // no Firestore data — keep nominas.json data

    if(DATA.phase==='setup'){
      // Full replace: Firestore is source of truth during setup
      DATA.athletes=fbAthletes.map((a,j)=>({...a,id:j,lot:a.lot||j+1}));
      const firstFlight=[...new Set(DATA.athletes.map(a=>a.flight))].filter(_inTarima).sort()[0]||(TARIMA?'A'+TARIMA:'A');
      DATA.flight=firstFlight;
      save();R();
      showToastLC('\uD83D\uDD34 Nómina en vivo: '+fbAthletes.length+' atletas desde Firestore');
    }else{
      // During competition: only merge new approvals, don't touch existing
      _mergeFirebaseAthletes(fbAthletes);
    }
  });
}
// Confirmación antes de tocar una decisión YA tomada (pedido del operador):
// - misma decisión otra vez (✓ sobre ✓ / ✗ sobre ✗) → anula → "¿seguro de ANULAR?"
// - decisión contraria → revierte → "¿seguro de REVERTIR?"
// Primera decisión de un intento sin juzgar: sin confirmación (flujo normal rápido).
function _confirmDecisionChange(a,l,r,res){
  const prev=a.att[l][r].r;
  if(prev!=='g'&&prev!=='n')return true;
  const lbl=prev==='g'?'VÁLIDO ✓':'NULO ✗';
  const att=LIFT_S[l]+(r+1);
  if(res===prev){
    return confirm('¿Estás seguro de ANULAR la decisión?\n\n'+a.name+' — '+att+' está marcado como '+lbl+'.\nEl intento quedará SIN decisión (pendiente de nuevo).');
  }
  const newLbl=res==='g'?'VÁLIDO ✓':'NULO ✗';
  return confirm('¿Estás seguro de REVERTIR la decisión?\n\n'+a.name+' — '+att+': pasa de '+lbl+' a '+newLbl+'.');
}
function overrideResult(id,l,r,res){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!_confirmDecisionChange(a,l,r,res))return;
  // Toggle: clicking same result clears it
  const wasSame=(a.att[l][r].r===res);
  const _hoyAntes=(!wasSame&&res==='g'&&_srOn())?_srHoyCalc():null;
  a.att[l][r].r=wasSame?null:res;
  _markAtt(id,'att_'+l+'_'+r);
  if(_hoyAntes)_srAvisarSubidas(_srSubirDeclarados(_hoyAntes));
  // Si este intento era el forzado como "actual" a mano, se juzgó → volver al orden
  // automático normal (queue).
  if(!wasSame && res && DATA.forcedCurrent===id)DATA.forcedCurrent=null;
  if(!wasSame && res)_clearCompIfJudged(id,l,r);
  // bombed = TODOS los 9 intentos fallidos (atleta totalmente fuera).
  // Si solo falla los 3 de un lift → queda DQ pero sigue compitiendo en los otros.
  a.bombed=a.att.sq.every(x=>x.r==='n')&&a.att.bp.every(x=>x.r==='n')&&a.att.dl.every(x=>x.r==='n');
  // Si MARCAMOS un resultado (no limpiamos), arrancar timer para el siguiente atleta.
  // Si era el current lifter en current round, también activar change timer para el próximo intento.
  if(!wasSame && res){
    // Igual que en setResult: al juzgar el EXTRA arranca el minuto del siguiente,
    // y mientras el extra siga pendiente no arranca ninguno.
    if(r===3) _armarChangeTimer(a,l,((a.att[l][3]||{}).grantedRound??DATA.round)+1);
    else if(l===DATA.lift && r===DATA.round && r<2) _armarChangeTimer(a,l,r+1);
    DATA.timer=60;DATA.timerOn=false;clearInterval(mainTI);mainTI=null;
    setTimeout(()=>{if(typeof startTimer==='function')startTimer();},150);
  }
  saveNow();R();
  // Auto-advance: si la cola de levantamientos quedó vacía, avanzar de ronda automáticamente
  if(!wasSame && res){
    const snapLift=DATA.lift, snapRound=DATA.round;
    if(liftQueue().length===0){
      showToastLC('Ronda completada — avanzando automáticamente en 3s…');
      setTimeout(()=>{
        if(DATA.lift===snapLift && DATA.round===snapRound) advanceLift();
      }, 3000);
    }
  }
}
// Cambiar / revocar la decisión de un intento YA juzgado (corrección del jurado),
// SIN efectos colaterales: no reinicia el cronómetro de tarima, no arranca change
// timers ni auto-avanza la ronda. Alterna: tocar la misma decisión la borra.
function changeResult(id,l,r,res){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!_confirmDecisionChange(a,l,r,res))return;
  const wasSame=(a.att[l][r].r===res);
  a.att[l][r].r=wasSame?null:res;
  _markAtt(id,'att_'+l+'_'+r);
  if(!wasSame && res)_clearCompIfJudged(id,l,r);
  a.bombed=a.att.sq.every(x=>x.r==='n')&&a.att.bp.every(x=>x.r==='n')&&a.att.dl.every(x=>x.r==='n');
  saveNow();R();
  showToastLC(wasSame?'↺ '+a.name+' — '+LIFT_S[l]+(r+1)+': decisión revocada'
    :(res==='g'?'✓ '+a.name+' — '+LIFT_S[l]+(r+1)+': cambiado a VÁLIDO'
                :'✗ '+a.name+' — '+LIFT_S[l]+(r+1)+': cambiado a NULO'));
}

const ctIntervals={};

// Master tick: updates ALL change timers every second, no matter which tab
setInterval(()=>{
  let changed=false;
  let anyActive=false;
  // Solo se fuerza un re-render completo si el auto-relleno cambió un peso (aparecen
  // botones nuevos en la celda que el parche in-place no puede armar solo). Un timer que
  // simplemente vence (sin auto-relleno) NO dispara re-render — su celda y su fila en
  // "timers activos" ya se actualizan en el bloque de abajo sin tocar el resto de la
  // página. Esto es a propósito: con varios timers corriendo a la vez (3, 4, 5...) no
  // puede estar refrescando la pantalla completa cada vez que uno vence.
  let needsRerender=false;
  Object.keys(DATA.changeTimers).forEach(k=>{
    const ct=DATA.changeTimers[k];if(!ct||ct.expired)return;
    // Se recalcula desde startedAt (reloj real) en vez de restar 1 por tick — así el
    // conteo nunca se desincroniza aunque el tab haya estado bloqueado (ej. mientras
    // estaba abierto el prompt() para cargar un peso) o en segundo plano. Con varios
    // timers corriendo a la vez esto tiene que dar siempre el valor correcto.
    if(typeof ct.startedAt!=='number')ct.startedAt=Date.now()-((60-(ct.remaining||60))*1000);
    ct.remaining=Math.max(0,60-Math.floor((Date.now()-ct.startedAt)/1000));
    anyActive=true;
    const justExpired=ct.remaining<=0;
    if(justExpired){ct.expired=true;changed=true;}
    // Update manage tab element
    const el=document.getElementById('ct_'+k);
    if(el){
      if(ct.expired){el.textContent='\u23F0';el.className='inp-sm expired';el.style.borderColor='var(--red)'}
      else{el.textContent=ct.remaining+'s';el.className='inp-sm countdown'}
    }
    // Update compete tab element
    const el2=document.getElementById('cct_'+k);
    if(el2){
      const parts=k.split('_');const aId=parseInt(parts[0]);const lift=parts[1];const rnd=parseInt(parts[2]);
      const a=DATA.athletes.find(x=>x.id===aId);const nm=a?a.name:'';
      if(ct.expired){el2.innerHTML='\u23F0 <strong>'+nm+'</strong> \u2014 '+LIFT_S[lift]+(rnd+1)+' \u2014 TIEMPO';el2.style.color='var(--red)'}
      else{el2.innerHTML='\u23F1 <strong>'+nm+'</strong> \u2014 '+LIFT_S[lift]+(rnd+1)+' \u2014 '+ct.remaining+'s para entregar intento';el2.style.color='var(--orange)'}
    }
    // On expiry: flash alert banner + beep
    if(justExpired){
      const parts=k.split('_');const aId=parseInt(parts[0]);const lift=parts[1];const rnd=parseInt(parts[2]);
      const a=DATA.athletes.find(x=>x.id===aId);
      showChangeExpiredAlert(a?a.name:'Atleta',lift,rnd);
      // Auto-relleno del próximo intento al vencer el tiempo (switch aparte,
      // apagado por defecto). "rnd" es la ronda PENDIENTE de peso (se crea
      // el timer como id_lift_(r+1) al marcar la ronda anterior "r").
      // Nulo → mismo peso. Válido → +2.5kg.
      if(window._CT_AUTOFILL_ENABLED && a && rnd>=1 && rnd<=2){
        const prev=a.att[lift][rnd-1], next=a.att[lift][rnd];
        if(prev && prev.r && prev.w>0 && next && !next.w){
          next.w=prev.r==='n'?prev.w:Math.round((prev.w+2.5)*2)/2;
          changed=true;
          needsRerender=true;
          showToastLC?.(''+a.name+' — '+LIFT_S[lift]+(rnd+1)+' auto-rellenado: '+next.w+'kg');
        }
      }
    }
  });
  if(changed)save();
  // Actualizar las celdas de timer en la tabla de Control en Vivo SIN re-renderizar
  // (evita flicker). Cada celda con timer tiene id="ctcell_KEY".
  Object.keys(DATA.changeTimers).forEach(k=>{
    const ct=DATA.changeTimers[k];
    const cellEl=document.getElementById('ctcell_'+k);
    if(!cellEl)return;
    if(ct&&!ct.expired&&ct.remaining>0){
      cellEl.textContent=''+ct.remaining+'s';
    } else if(ct&&ct.expired){
      // Tiempo expirado → reloj rojo + signo de exclamación
      cellEl.textContent='TIEMPO';
      cellEl.style.background='rgba(239,68,68,.18)';
      cellEl.style.borderColor='var(--red)';
      cellEl.style.color='var(--red)';
      cellEl.style.animation='pulse 1.5s ease-in-out infinite';
      cellEl.title='Tiempo expirado — requiere aprobación del jurado';
    }
  });
  // ── Tiempo compensatorio (4º intento "se sigue a sí mismo") ──────────
  // Solo a la vista, NO bloquea. Se actualiza en Control en Vivo (#compTimerBox)
  // y en la Pantalla de Intentos (#compTimerPant) sin re-render. Puede pasar a
  // negativo (sigue mostrando, en rojo, para que se note que se pasó del tiempo).
  {

      const el=document.getElementById(idEl);
      if(el&&ci)el.textContent=ci.mmss;
    });
  }
  // Re-render completo SOLO si el auto-relleno cambió un peso (ver comentario arriba).
  if(needsRerender && DATA.phase==='compete' && typeof R==='function'){
    setTimeout(R,100);
  }
},1000);
// Info del tiempo compensatorio activo (o null). remaining puede ser negativo.
function _compInfo(){
  const c=DATA.compTimer;
  if(!c||!c.startedAt)return null;
  const a=DATA.athletes.find(x=>x.id===c.id);
  if(!a)return null;
  const remaining=(c.min*60)-Math.floor((Date.now()-c.startedAt)/1000);
  const neg=remaining<0;const abs=Math.abs(remaining);
  const mmss=(neg?'-':'')+Math.floor(abs/60)+':'+String(abs%60).padStart(2,'0');
  return {a,lift:c.lift,min:c.min,remaining,mmss,neg};
}
