// Quién levanta después del actual. Primero el que sigue en la cola de esta
// ronda; si el actual es el último, se mira la ronda siguiente de la misma tanda
// y, si tampoco hay, la primera tanda que quede pendiente en este movimiento.
// Devuelve {a, w, lift, nota} — `nota` explica de dónde sale ("INT 1", "TANDA B").
function _piQuienSigue(nxt){
  if(nxt)return {a:nxt,w:(nxt.att[DATA.lift][curAtt(nxt)]||{}).w,lift:DATA.lift,nota:''};
  const pend=(list,l,r)=>list.filter(a=>{const at=(a.att[l]||[])[r];return at&&at.r===null&&at.w>0;})
    .sort((a,b)=>{const wa=a.att[l][r].w,wb=b.att[l][r].w;return wa!==wb?wa-wb:(a.lot||0)-(b.lot||0);});
  // 1) rondas siguientes de la misma tanda
  const mismaTanda=DATA.athletes.filter(a=>a.flight===DATA.flight&&!a.bombed);
  for(let r=DATA.round+1;r<=2;r++){
    const q=pend(mismaTanda,DATA.lift,r);
    if(q.length)return {a:q[0],w:q[0].att[DATA.lift][r].w,lift:DATA.lift,nota:'INT '+(r+1)};
  }
  // 2) las otras tandas, en el orden en que van a subir
  const fls=(typeof _allFlightsSorted==='function')?_allFlightsSorted():[];
  const i=fls.indexOf(DATA.flight);
  const rot=i>=0?[...fls.slice(i+1),...fls.slice(0,i)]:fls;
  for(const fl of rot){
    if(fl===DATA.flight)continue;
    const list=DATA.athletes.filter(a=>a.flight===fl&&!a.bombed);
    for(let r=0;r<=2;r++){
      const q=pend(list,DATA.lift,r);
      if(q.length)return {a:q[0],w:q[0].att[DATA.lift][r].w,lift:DATA.lift,nota:'TANDA '+fl};
    }
  }
  return null;
}
function renderScreenIntentos(cur,nxt){
  const att=cur.att[DATA.lift][DATA.round];
  const weight=att?.w||0;
  const isMale=cur.sex==='Hombre'||cur.sex==='M'||cur.sex==='Masculino';
  const barKg=20; // barra de 20kg para todos (según la foto de referencia de LiftingCast, incluso en Women's)
  const collarsKg=5; // 2 collares × 2.5kg
  const barW=barKg+collarsKg;
  const sideKg=Math.max(0,(weight-barW)/2);
  // Solo el set de discos que se usa en competencia (25→1.25kg). Los fraccionarios
  // 0.75/0.5/0.25/0.125 son exclusivos para intentos de récord y aún no están
  // habilitados para el Regional — se suman más adelante cuando se necesiten.
  const PLATE_SIZES=[25,20,15,10,5,2.5,1.25];
  const plates=[];
  let rem=Math.round(sideKg*100)/100;
  for(const p of PLATE_SIZES){while(rem>=p-0.001){plates.push(p);rem=Math.round((rem-p)*100)/100;}}
  // Props visuales por disco — todos son rectángulos (vista de canto de un disco real),
  // el 1.25 antes se dibujaba como círculo y parecía una pelota.
  //
  // Los anchos son la MITAD de los que había: así de gruesos parecían bumpers de
  // halterofilia y no discos calibrados de powerlifting, que son mucho más finos
  // (un 25 kg de competencia mide 45 cm de diámetro por unos 3 cm de canto).
  function pp(kg){
    if(kg>=25) return{h:280,w:32,fill:'#DC2626',stroke:'#7F1D1D',round:false};
    if(kg>=20) return{h:250,w:29,fill:'#2563EB',stroke:'#1E3A8A',round:false};
    if(kg>=15) return{h:222,w:26,fill:'#D97706',stroke:'#78350F',round:false};
    if(kg>=10) return{h:190,w:23,fill:'#16A34A',stroke:'#14532D',round:false};
    if(kg>=5)  return{h:150,w:19,fill:'#E5E7EB',stroke:'#9CA3AF',round:false};
    if(kg>=2.5)return{h:112,w:17,fill:'#111827',stroke:'#000000',round:false};   // 2.5 negro
    if(kg>=1.25)return{h:86, w:13,fill:'#2563EB',stroke:'#1E3A8A',round:false};  // 1.25 azul
    if(kg>=0.75)return{h:64, w:9, fill:'#9CA3AF',stroke:'#6B7280',round:false};
    if(kg>=0.5) return{h:54, w:8, fill:'#6B7280',stroke:'#374151',round:false};
    if(kg>=0.25)return{h:46, w:8, fill:'#4B5563',stroke:'#1F2937',round:false};
                return{h:38, w:8, fill:'#374151',stroke:'#111827',round:false};
  }
  // Solo LA MITAD de la barra (un lado): un tramo corto de eje representando el resto de
  // la barra fuera de pantalla, el collar (con el peso fijo "barra+collares"), y los
  // discos de mayor a menor saliendo hacia afuera — igual que la vista de LiftingCast.
  const VH=440,cy=VH/2,shaftThick=26,collarH=90,collarW=34,stubW=90;
  let x=20,s=[];
  s.push(`<rect x="0" y="${cy-shaftThick/2}" width="${x+stubW}" height="${shaftThick}" fill="#71717A" rx="3"/>`);
  x+=stubW;
  for(let xi=20;xi<x-6;xi+=16)s.push(`<line x1="${xi}" y1="${cy-shaftThick/2-3}" x2="${xi}" y2="${cy+shaftThick/2+3}" stroke="#A1A1AA" stroke-width="2" opacity="0.5"/>`);
  s.push(`<rect x="${x}" y="${cy-collarH/2}" width="${collarW}" height="${collarH}" fill="#52525B" rx="4" stroke="#27272A" stroke-width="2"/>`);
  s.push(`<text x="${x+collarW/2}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#F4F4F5" stroke="rgba(0,0,0,.7)" stroke-width="2" paint-order="stroke" stroke-linejoin="round" font-family="Oswald" font-weight="700" font-size="16" transform="rotate(-90 ${x+collarW/2} ${cy})">BAR+COL ${barW}</text>`);
  x+=collarW+6;
  plates.forEach(kg=>{
    const p=pp(kg);const py=cy-p.h/2;
    const label=(kg%1===0)?String(kg):String(kg);
    if(p.round){
      const r=p.w/2;
      s.push(`<circle cx="${x+r}" cy="${cy}" r="${r}" fill="${p.fill}" stroke="${p.stroke}" stroke-width="3"/>`);
      s.push(`<text x="${x+r}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-family="Oswald" font-weight="800" font-size="${Math.max(13,r*0.4)}">${label}</text>`);
    } else {
      const rx=Math.min(4,p.w*0.25);
      const stripeW=Math.max(2,Math.min(4,p.w*0.22));
      s.push(`<rect x="${x}" y="${py}" width="${p.w}" height="${p.h}" fill="${p.fill}" rx="${rx}" stroke="${p.stroke}" stroke-width="2"/>`);
      s.push(`<rect x="${x+3}" y="${py+6}" width="${stripeW}" height="${p.h-12}" fill="rgba(255,255,255,0.22)" rx="2"/>`);
      // El número del disco se tiene que leer desde la platea: letra grande y un
      // contorno oscuro (paint-order:stroke) para que no se pierda contra el color
      // del disco. Con los discos finos el número va rotado en TODOS: de canto no
      // entra a lo ancho, y a lo largo del disco sobra espacio.
      const claro=(kg>=5&&kg<10);                       // el de 5kg es blanco
      const textColor=claro?'#111827':'#fff';
      const halo=claro?'rgba(255,255,255,.85)':'rgba(0,0,0,.75)';
      const fs=Math.max(13,Math.min(30,p.w*0.86));
      const rot=` transform="rotate(-90 ${x+p.w/2} ${cy})"`;
      s.push(`<text x="${x+p.w/2}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="${textColor}" stroke="${halo}" stroke-width="${Math.max(1.6,fs*0.11)}" paint-order="stroke" stroke-linejoin="round" font-family="Oswald" font-weight="800" font-size="${fs}" letter-spacing="0.5"${rot}>${label}</text>`);
    }
    x+=p.w+5;
  });
  const VW=x+20;
  const bbSvg=`<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" style="height:${Math.round(VH*0.85)}px;width:auto;max-width:none;display:block">${s.join('')}</svg>`;
  // Pronóstico de posición (idéntico criterio al del widget de OBS)
  const peers=DATA.athletes.filter(a=>a.sex===cur.sex&&a.cat===cur.cat&&a.div===cur.div&&a.mod===cur.mod);
  const curGL=calcGL(totalOf(cur),cur.bw,cur.sex,_glMod(cur));
  const hypBest=Math.max(bestOf(cur,DATA.lift),weight);
  const sqH=DATA.lift==='sq'?hypBest:bestOf(cur,'sq');
  const bpH=DATA.lift==='bp'?hypBest:bestOf(cur,'bp');
  const dlH=DATA.lift==='dl'?hypBest:bestOf(cur,'dl');
  const hypTotal=(sqH&&bpH&&dlH)?sqH+bpH+dlH:0;
  const hypGL=hypTotal>0?calcGL(hypTotal,cur.bw,cur.sex,_glMod(cur)):0;
  const othersGL=peers.filter(a=>a.id!==cur.id).map(a=>calcGL(totalOf(a),a.bw,a.sex,_glMod(a))).filter(g=>g>0).sort((a,b)=>b-a);
  const curRank=curGL>0?othersGL.filter(g=>g>curGL).length+1:null;
  const newRank=hypGL>0?othersGL.filter(g=>g>hypGL).length+1:null;
  let posTxt='';
  if(newRank!==null){
    if(curRank!==null&&curRank!==newRank)posTxt=`Si es válido pasará del <b>${curRank}°</b> al <b>${newRank}° lugar</b>`;
    else if(curRank!==null)posTxt=`Mantiene el <b>${newRank}° lugar</b> si es válido`;
    else posTxt=`Si es válido: <b>${newRank}° lugar</b>`;
  }
  const liftName={sq:'SENTADILLA',bp:'PRESS DE BANCA',dl:'PESO MUERTO'}[DATA.lift]||DATA.lift.toUpperCase();
  let roundLabel=['1er INTENTO','2do INTENTO','3er INTENTO'][DATA.round]||`INTENTO ${DATA.round+1}`;
  // Enunciado del intento extra en la proyección: "4º INTENTO" si se concedió en
  // la 3ª ronda, "INTENTO EXTRA" en la 1ª/2ª. Se suma al intento normal en curso.
  if(cur.__is4){roundLabel+=((((cur.att[DATA.lift][3]||{}).grantedRound)||0)>=2)?' · 4º INTENTO':' · INTENTO EXTRA';}
  const rackH=DATA.lift==='sq'?cur.rackSQ:DATA.lift==='bp'?cur.rackBP:'';
  const _setup=_rackSetup(_realAth(cur),DATA.lift);
  const sexLbl=isMale?'HOMBRES':'MUJERES';
  const t=Math.max(0,DATA.timer||0);
  const tTxt=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  const tColor=DATA.timerOn&&t<=10?'#ef4444':DATA.timerOn&&t<=30?'#f59e0b':'#22c55e';
  const piSet=window._piSettings||(window._piSettings=_piLoadSettings());
  const accentColor=piSet.accentColor||PI_DEFAULT_SETTINGS.accentColor;
  const textColor=piSet.textColor||PI_DEFAULT_SETTINGS.textColor;
  const liftLabelHtml=`<div style="font-family:Oswald;font-size:22px;letter-spacing:4px;color:rgba(212,225,245,.6);white-space:nowrap">${liftName} · ${roundLabel}${_setup?` · ${_setup}`:''}</div>`;
  // ── INTENTO DE RÉCORD SUDAMERICANO ──────────────────────────────
  // Si el peso cargado supera el récord vigente de su división (o del Open), la
  // pantalla de tarima lo canta: es lo que mira el público y la mesa técnica.
  const _srCur=(typeof _srRompe==='function')?_srRompe(_realAth(cur),DATA.lift,weight):[];
  const recordHtml=_srCur.length?`<div class="sr-parpadea" style="font-family:Oswald;white-space:nowrap;text-align:center">
      <div style="display:inline-block;background:#F2C230;color:#1a1200;padding:8px 26px;border-radius:10px;font-size:30px;font-weight:900;letter-spacing:4px;box-shadow:0 0 34px rgba(242,194,48,.55)">INTENTO DE RÉCORD SUDAMERICANO</div>
      <div style="font-size:17px;letter-spacing:2px;color:#F2C230;margin-top:6px">${_srCur.map(r=>(r.div+' '+r.cat+' · '+(r.vacio?'SIN RÉCORD PREVIO':'ACTUAL '+r.kg+' KG')).toUpperCase()).join('   ·   ')}</div>
    </div>`:'';
  const weightHtml=`<div style="font-family:Oswald;font-size:120px;font-weight:900;color:${textColor};line-height:1;letter-spacing:2px;white-space:nowrap">${weight}<span style="font-size:0.32em;color:rgba(212,225,245,.55);margin-left:10px">KG</span></div>`;
  const nameHtml=`<div style="font-family:Oswald;font-size:56px;font-weight:700;letter-spacing:1px;color:${textColor};line-height:1.15;white-space:nowrap">${cur.name||''}</div>`;
  const subtitleHtml=`<div style="font-family:Oswald;font-size:16px;letter-spacing:3px;color:rgba(212,225,245,.5);white-space:nowrap">${[sexLbl,cur.club,cur.cat,cur.div].filter(Boolean).map(x=>(x+'').toUpperCase()).join(' · ')}</div>`;
  const positionHtml=posTxt?`<div style="font-family:Oswald;font-size:22px;letter-spacing:1px;color:${accentColor};white-space:nowrap">${posTxt}</div>`:'';
  // Quién viene después — para que los cargadores/spotters se vayan preparando.
  // Si el actual es el último de su ronda, el de al lado NO es null: se sigue
  // buscando en la ronda siguiente y después en las otras tandas. Antes el cartel
  // desaparecía justo cuando más se necesita (el último de la tanda es cuando hay
  // que ir preparando la barra del que abre la que viene).
  const _sig=_piQuienSigue(nxt);
  let nextHtml='';
  if(_sig&&_sig.a){
    const s=_sig;
    // Va en el MISMO gris del encabezado (movimiento · intento · rack), no en el
    // blanco del nombre de quien está en tarima: la del que viene tiene que
    // leerse pero sin competirle a la de arriba. Lleva su altura de rack y, según
    // el movimiento, si el rack va abatible (sentadilla) o cuántas palmetas y
    // seguros usa (banca) — es lo que necesitan los cargadores para ir armando.
    const gris='rgba(212,225,245,.6)';
    const ns=_rackSetup(_realAth(s.a),s.lift||DATA.lift);
    nextHtml=`<div style="font-family:Oswald;font-size:22px;letter-spacing:3px;color:${gris};white-space:nowrap">`
      +`SIGUIENTE${s.nota?' · '+s.nota:''} · `
      +`<span style="font-weight:700">${s.a.name||''}</span>`
      +(s.w?` · <span style="font-weight:700">${s.w} KG</span>`:'')
      +(ns?` · ${ns}`:'')
    +`</div>`;
  }
  // Tiempo compensatorio (4º "se sigue a sí mismo") — se ve arriba a la izquierda
  // en la pantalla de tarima. Solo informativo.
  const _ci=(typeof _compInfo==='function')?_compInfo():null;
  const compHtml=_ci?`<div style="position:fixed;top:36px;left:48px;font-family:Oswald,sans-serif;color:#60a5fa;text-shadow:0 4px 20px rgba(0,0,0,.7)">
      <div style="font-size:16px;letter-spacing:3px;opacity:.8">TIEMPO COMPENSATORIO</div>
      <div id="compTimerPant" style="font-size:56px;font-weight:900;color:${_ci.neg?'#ef4444':'#60a5fa'};line-height:1">${_ci.mmss}</div>
    </div>`:'';
  return `<div style="position:fixed;inset:0;overflow:hidden${piSet.bgColor?';background:'+piSet.bgColor:''}" id="pantIntentosBox">
    ${compHtml}
    ${piSet.showTimer===true?`<div id="pantIntentosTimer" style="position:fixed;top:36px;right:48px;font-family:Oswald,sans-serif;font-size:64px;font-weight:900;color:${tColor};letter-spacing:2px;text-shadow:0 4px 20px rgba(0,0,0,.7)">${tTxt}</div>`:''}
    ${_piBlock('liftLabel',liftLabelHtml)}
    ${recordHtml?_piBlock('record',recordHtml):''}
    ${_piBlock('weight',weightHtml)}
    ${_piBlock('barbell',bbSvg)}
    ${_piBlock('name',nameHtml)}
    ${_piBlock('subtitle',subtitleHtml)}
    ${positionHtml?_piBlock('position',positionHtml):''}
    ${nextHtml?_piBlock('next',nextHtml):''}
    ${_piSettingsPanelHtml()}
  </div>`;
}

function R(){
  // Los récords logrados hoy se recalculan una vez por dibujado: los consulta cada
  // casilla de la tabla, pero tienen que reflejar lo último (incluido lo que
  // acaba de llegar de otro controlador).
  window._SR_HOY=null;
  // Paracaídas de render: un error al dibujar NUNCA debe dejar la pantalla en
  // blanco/congelada (crítico con mucha gente operando en vivo). Para los widgets
  // de OBS/pantalla, si falla se conserva lo anterior. Para el admin, se muestra un
  // panel de recuperación (los datos quedan intactos: reintentar / deshacer / recargar).
  if(TX_MODE){ try{renderTxWidget();}catch(e){console.error('[TX] render error',e);} return; }
  try{
    const el=document.getElementById('R');if(!el)return;
    // El Scoreboard salió del menú: si alguien tenía esa pantalla guardada de antes,
    // se lo lleva a Resultados en vez de dejarlo en una pantalla sin salida.
    if(DATA.phase==='scoreboard'){DATA.phase='results';}
    if(DATA.phase==='transmision'){el.innerHTML=renderTransmision();setTimeout(initTxWidgets,0);return}
    if(DATA.phase==='setup'){el.innerHTML=renderSetup();return}
    el.innerHTML=renderShell();
  }catch(e){ console.error('[R] render error',e); _renderRecovery(e); }
}
function _renderRecovery(e){
  try{
    const el=document.getElementById('R');if(!el)return;
    const msg=(e&&e.message)?String(e.message):'error';
    el.innerHTML='<div style="max-width:560px;margin:60px auto;padding:24px;border:2px solid var(--red);border-radius:14px;background:rgba(239,68,68,.06);text-align:center;font-family:Inter,sans-serif">'
      +'<div style="font-family:Oswald;font-size:20px;font-weight:700;color:var(--red);letter-spacing:1px">⚠ ERROR AL DIBUJAR LA PANTALLA</div>'
      +'<div style="font-size:12px;color:var(--muted);margin:10px 0 16px;line-height:1.5">La aplicación sigue funcionando y los datos están a salvo. Reintentá, deshacé el último cambio, o recordá.</div>'
      +'<div style="font-size:10px;color:var(--muted);font-family:monospace;background:rgba(0,0,0,.25);padding:8px;border-radius:6px;margin-bottom:16px;word-break:break-word">'+msg.replace(/[<>&]/g,'')+'</div>'
      +'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
      +'<button onclick="R()" style="padding:9px 18px;border-radius:8px;border:1px solid var(--gold);background:rgba(212,168,67,.12);color:var(--gold);font-family:Oswald;font-weight:700;cursor:pointer">↻ Reintentar</button>'
      +((window._histUndo&&window._histUndo.length)?'<button onclick="histUndo()" style="padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:Oswald;font-weight:700;cursor:pointer">↶ Deshacer</button>':'')
      +'<button onclick="location.reload()" style="padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:Oswald;font-weight:700;cursor:pointer">⟳ Recargar</button>'
      +'</div></div>';
  }catch(_){}
}

function renderSetup(){
  // Check for backup
  let backupInfo='';
  try{
    const bk=localStorage.getItem('fechipo_lc3_backup');
    if(bk){
      const d=JSON.parse(bk);
      if(d.ts&&d.athletes&&d.athletes.length){
        const elapsed=Math.round((Date.now()-d.ts)/60000);
        backupInfo='<div style="background:rgba(212,168,67,.1);border:1px solid var(--gold);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">'
          +'<div><div style="font-family:Oswald;font-size:13px;color:var(--gold);letter-spacing:1px">RESPALDO AUTOMÁTICO DISPONIBLE</div>'
          +'<div style="font-size:11px;color:var(--muted);margin-top:3px">'+(d.event?.name||'Competencia')+' · '+d.athletes.length+' atletas · hace '+elapsed+'m ('+d.tsLabel+')</div></div>'
          +'<button onclick="recoverBackup()" style="padding:8px 18px;border-radius:8px;border:2px solid var(--gold);background:rgba(212,168,67,.1);color:var(--gold);font-family:Oswald;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:1px">RECUPERAR →</button>'
          +'</div>';
      }
    }
  }catch(e){}
  let h='<div style="max-width:700px;margin:60px auto;padding:0 20px" class="fade">'+backupInfo+'<div style="text-align:center;margin-bottom:40px"><img src="YourLift_logo.png" style="height:clamp(70px,11vw,120px);width:auto;max-width:90%;margin-bottom:6px" alt="YourLift" onerror="this.remove()"><p style="color:var(--muted);font-size:14px;margin-top:6px">Sistema de Gesti\u00f3n de Competencia</p><div style="width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));margin:12px auto;border-radius:2px"></div><a href="index.html" style="display:inline-block;margin-top:10px;color:var(--muted);font-size:12px;text-decoration:none;padding:6px 16px;border:1px solid var(--border);border-radius:6px;transition:all .15s" onmouseenter="this.style.borderColor=\'var(--accent)\';this.style.color=\'var(--text)\'" onmouseleave="this.style.borderColor=\'var(--border)\';this.style.color=\'var(--muted)\'">← YourLift</a></div>';
  // Merge: agregar eventos creados desde admin (Firestore) que no est\u00e9n en nominas.json
  if(window.LIVE_EVENT_META){
    Object.entries(window.LIVE_EVENT_META).forEach(function(entry){
      var id=entry[0],meta=entry[1];
      var exists=DATA.events.some(function(e){return e.id===id||e.name===meta.name});
      if(!exists){
        DATA.events.push({id:id,name:meta.name,organizer:meta.org||'',location:meta.location||'',athletes:[],_fromFirestore:true});
      }
    });
  }
  const _hidden=window.LIVE_EVENT_HIDDEN,_hiddenN=window.LIVE_EVENT_HIDDEN_NAMES;
  // Fecha legible + sesiones del cronograma oficial (los eventos por día del
  // Sudamericano traen `sesiones`): así se ve de un vistazo qué se levanta ese día
  // y a qué hora, sin tener que entrar al evento.
  const _fechaEv=f=>{ if(!f)return ''; const m=String(f).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return String(f);
    const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return (+m[3])+' '+MES[(+m[2])-1]+' '+m[1]; };
  const _sesEv=ev=>{ const ss=Array.isArray(ev.sesiones)?ev.sesiones:null; if(!ss||!ss.length)return '';
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">'+ss.map(x=>
      '<span style="font-size:10px;color:var(--muted);background:rgba(30,58,95,.35);border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap">'
      +'<b style="color:var(--gold);font-family:Oswald">'+(x.inicio||'')+'</b> '+(x.nombre||'')+(x.atletas?' <span style="opacity:.6">('+x.atletas+')</span>':'')+'</span>').join('')+'</div>'; };
  // Si se entró a un campeonato de varios días (?evento=Sudamericano_2026), acá se
  // muestran SOLO sus días para elegir cuál operar/mirar, no la lista entera.
  const _flt=window._EV_FILTER;
  // El ESPECTADOR solo ve lo que el admin habilitó en YourLift Público (y, si ese
  // evento se corre en varios días, sus jornadas). Nunca la lista completa: lo que
  // está cargado pero no publicado no se le muestra a nadie.
  // El admin que da un ENSAYO es prestado (para poder operar la prueba sin iniciar
  // sesión). NO habilita a ver el resto de las competencias: para la lista sigue
  // contando como público. Solo el admin de verdad ve todo.
  const _adminReal=isAdmin&&window.ADMIN_ROLE!=='ensayo';
  const _soloPub=!_adminReal;
  const _pub=window.LIVE_EVENT_PUB;
  // Entrada desde el panel (Admin → YourLift): la lista corta con la que se
  // trabaja — lo que está publicado para el público, más los ensayos de prueba.
  // Es además la ÚNICA puerta a los ensayos: en la lista del público no salen.
  const _OPERAR=(()=>{try{return new URLSearchParams(location.search).get('operar')==='1'}catch(e){return false}})();
  // Si entró por el link de un campeonato (?evento=…), sus jornadas se le muestran
  // igual: ese link ES el permiso. El filtro está para que nadie curiosee la lista
  // completa de lo que hay cargado, no para bloquear el link que le pasaron.
  const _esPub=ev=>!!((_flt&&ev.parent===_flt.parent)||(_pub&&(_pub.has(ev.id)||_pub.has(ev.name)||(ev.parent&&_pub.has(ev.parent)))));
  // Qué se dibuja. El encabezado y la lista salen de esta misma función, si no
  // pueden decir cosas distintas ("son 9 jornadas" y abajo ninguna).
  const _verEv=ev=>{
    // Modo operar: solo lo publicado y los ensayos, sin la lista completa de
    // todo lo que hay cargado (que para el día a día es ruido).
    if(_OPERAR&&!_flt){
      const pubOk=!!(_pub&&(_pub.has(ev.id)||_pub.has(ev.name)||(ev.parent&&_pub.has(ev.parent))));
      return pubOk||_isEnsayo(ev);
    }
    // Adentro de un campeonato (?evento=…) NO se aplica el ocultar-de-la-lista:
    // "archivado" y "no visible en el livecast" están para que la lista general no
    // se llene de cosas viejas, no para esconder las jornadas del campeonato al
    // que se entró a propósito. Si no, marcar un día como oculto (para que no
    // apareciera en Nóminas, por ejemplo) lo borraba también de acá.
    if(!_flt&&_hidden&&(_hidden.has(ev.id)||_hiddenN?.has(ev.name)))return false;
    if(_flt&&ev.parent!==_flt.parent)return false;
    if(_soloPub&&!_esPub(ev))return false;
    return true;
  };
  if(_soloPub&&!_pub&&!_flt){
    h+='<div class="card" style="padding:26px;text-align:center;color:var(--muted);font-size:13px">Cargando competencias…</div></div>';
    return h;
  }

function sortByCat(){DATA.athletes.sort((a,b)=>{const na=parseFloat(a.cat.replace(/[^0-9.]/g,''))||999;const nb=parseFloat(b.cat.replace(/[^0-9.]/g,''))||999;return na-nb});save();R()}
function sortByFlight(){DATA.athletes.sort((a,b)=>{if(a.flight!==b.flight)return a.flight.localeCompare(b.flight);const na=parseFloat(a.cat.replace(/[^0-9.]/g,''))||999;const nb=parseFloat(b.cat.replace(/[^0-9.]/g,''))||999;return na-nb});save();R()}
function sortByLot(){DATA.athletes.sort((a,b)=>a.lot-b.lot);save();R()}
function generateLots(){
  const msg=DATA.lotsGenerated
    ? 'Los lotes YA fueron sorteados.\n\n¿Re-sortear y reemplazar todos los números actuales?\n\nLas ediciones manuales se perderán.'
    : '¿Generar números de lote aleatorios?\n\nTanda A → 100, 101, 102…\nTanda B → 200, 201, 202…\netc.';
  if(!confirm(msg))return;
  // Shuffle within each flight, assign lot = flightIndex*100 + position (Tanda A: 100-1XX, B: 200-2XX...)
  const flights=[...new Set(DATA.athletes.map(a=>a.flight))].filter(_inTarima).sort();
  flights.forEach((fl,fi)=>{
    const flightNum=fl.charCodeAt(0)-64; // A=1, B=2, C=3…
    const base=flightNum*100;
    const group=DATA.athletes.filter(a=>a.flight===fl);
    // Fisher-Yates shuffle
    for(let i=group.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[group[i]._rnd,group[j]._rnd]=[group[j]._rnd||Math.random(),group[i]._rnd||Math.random()]}
    group.sort((a,b)=>(a._rnd||0)-(b._rnd||0));
    group.forEach((a,pos)=>{a.lot=base+pos;delete a._rnd});
  });
  DATA.lotsGenerated=true;
  window._forceFullWrite=true;   // el re-sorteo reemplaza los lots de todos
  saveNow();R();
}

// Re-sincroniza la nómina con el admin. Trae todos los atletas aprobados/pendientes
// desde Firestore y reconcilia: agrega nuevos, elimina los que ya no están (sin datos)
// y avisa de los borrados que tienen pesos/intentos cargados.
window.resyncFromAdmin=async function(){
  if(!fbReady||!window._fb){alert('Firebase no listo todavía. Esperá unos segundos y reintentá.');return}
  if(!DATA.event){alert('No hay competencia activa');return}
  if(!confirm('Re-sincronizar la nómina con el admin?\n\n• Trae atletas nuevos\n• Borra los que ya no están en admin (si NO tienen pesos/intentos cargados acá)\n• Avisa de los borrados que sí tienen datos para revisarlos a mano\n• Toma tanda, división, categoría y modalidad de la pestaña Cronograma\n\nLotes y pesaje se conservan. La categoría de los que ya están pesados no se toca.'))return;
  const evId=Object.keys(LIVE_EVENTS).find(k=>LIVE_EVENTS[k]===DATA.event.name)||DATA.event.id||DATA.event.name;
  try{
    const q=window._fb.query(
      window._fb.collection(fbDB,'inscripciones'),
      window._fb.where('evento','==',evId),
      window._fb.where('status','in',['approved','pending'])
    );
    const snap=await window._fb.getDocs(q);
    const flightMap=await _loadCronoFlightMap(evId);
    const fbAthletes=snap.docs
      .map(d=>({...d.data(),id:d.id}))
      .sort((a,b)=>(a.timestamp?.seconds||0)-(b.timestamp?.seconds||0))
      .map((ins,j)=>_inscToAthlete(ins,j,flightMap));
    if(!fbAthletes.length){alert('No hay inscripciones aprobadas/pendientes en Firestore para este campeonato.');return}
    _mergeFirebaseAthletes(fbAthletes);
    // Forzar nuevo render para que los toasts se ordenen
    showToastLC('✓ Re-sincronización completa: '+fbAthletes.length+' atletas en Firestore');
  }catch(e){alert('Error sincronizando: '+(e.message||e));console.error(e)}
};

// Editar el lote a mano. Si el número nuevo ya lo tenía otro atleta,
// hace un swap (intercambia los lotes entre los dos).
window.setLot=function(id,val){
  const n=parseInt(val,10);
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!Number.isFinite(n)||n<1){
    showToastLC('Lote inválido — debe ser un número entero ≥ 1');
    R();return;
  }
  if(n===a.lot){R();return}
  const other=DATA.athletes.find(x=>x.lot===n&&x.id!==id);
  if(other){
    // Swap: el otro recibe el lote anterior
    other.lot=a.lot;
    a.lot=n;
  } else {
    a.lot=n;
  }
  _markAtt(id,'meta');
  save();R();
};

// ─── OBS WEBSOCKET (Stream Deck → OBS → Panel) ─────────────────
// Permite controlar el director con cualquier botón de Stream Deck que
// envíe un "Custom Event" a OBS via WebSocket. El panel escucha los
// CustomEvents y los mapea a las funciones dir* existentes.
let _obsWs=null, _obsWsConnected=false, _obsWsError='';
let _obsWsSettings=(()=>{try{return JSON.parse(localStorage.getItem('obs_ws_settings')||'')}catch(e){}return{host:'localhost',port:4455,password:'',autoConnect:false}})();
let _obsWsLog=[]; // últimos eventos recibidos para debug (max 10)
async function obsWsConnect(){
  if(!window.OBSWebSocket){_obsWsError='Librería obs-websocket-js no cargó (revisá conexión a internet)';if(DATA.phase==='director')R();return}
  if(_obsWs){try{await _obsWs.disconnect()}catch(e){}_obsWs=null}
  _obsWsError='';
  _obsWs=new window.OBSWebSocket();
  try{
    const url='ws://'+(_obsWsSettings.host||'localhost')+':'+(_obsWsSettings.port||4455);
    await _obsWs.connect(url,_obsWsSettings.password||'');
    _obsWsConnected=true;
    _obsWs.on('CustomEvent',(d)=>{
      _obsWsLog.unshift({ts:Date.now(),data:d});
      if(_obsWsLog.length>10)_obsWsLog.pop();
      handleObsCustomEvent(d);
      // competitionSync se rebota cada 5s desde nosotros mismos → no re-renderizar el panel
      if(DATA.phase==='director'&&d.action!=='competitionSync')R();
    });
    _obsWs.on('ConnectionClosed',()=>{
      _obsWsConnected=false;
      if(_obsWsSyncInterval){clearInterval(_obsWsSyncInterval);_obsWsSyncInterval=null;}
      if(DATA.phase==='director')R();
    });
    // Sync periódico: manda athletes+estado cada 5s para que el widget OBS siempre tenga datos
    if(_obsWsSyncInterval)clearInterval(_obsWsSyncInterval);
    _obsWsSyncInterval=setInterval(_obsWsBroadcastSync,5000);
    _obsWsBroadcastSync(); // sync inmediato al conectar
    if(DATA.phase==='director')R();
  }catch(e){
    _obsWsError=e.message||String(e);
    _obsWs=null;_obsWsConnected=false;
    if(DATA.phase==='director')R();
  }
}
async function obsWsDisconnect(){
  if(_obsWs){try{await _obsWs.disconnect()}catch(e){}_obsWs=null}
  _obsWsConnected=false;
  if(DATA.phase==='director')R();
}
function handleObsCustomEvent(data){
  if(!data)return;
  const action=data.action||'';
  if(action==='toggle'){
    if(data.component==='leaderboard')return window.dirToggleLb();
    if(data.component==='breakTimer')return window.dirToggleBreak();
    if(data.component)return window.dirToggle(data.component);
  }
  if(action==='slam'&&data.type)return window.dirShowSlam(data.type);
  if(action==='hideAll')return window.dirHideAll();
  if(action==='breakStart')return window.dirBreakStart();
  if(action==='breakStop')return window.dirBreakHide();
  if(action==='breakAdd'&&typeof data.seconds==='number')return window.dirBreakAdd(data.seconds);
  if(action==='showLb'&&data.cat)return window.dirShowLb(data.cat,0);
}

window.dirShow=async function(comp,seconds,opts){
  if(!_dirState)_dirState={};
  const until=seconds>0?Date.now()+seconds*1000:0;
  // Mutual exclusion entre componentes fullscreen (profile y leaderboard).
  // Si activo uno y el otro está prendido, lo apago automáticamente.
  const FULLSCREEN_EXCLUSIVE = ['profile','leaderboard'];
  if(FULLSCREEN_EXCLUSIVE.includes(comp)){
    FULLSCREEN_EXCLUSIVE.forEach(other=>{
      if(other!==comp){
        const o=_dirState[other];
        if(o && o.active){
          _dirState[other]=Object.assign({},o,{active:false,until:0});
        }
      }
    });
    // Al activar un fullscreen (perfil/leaderboard), apagar tambien la Tabla Actual.
    // Asi cuando se quite el fullscreen la tabla NO reaparece sola; debe re-activarse a mano.
    const ta=_dirState.tablaActual;
    if(ta && ta.active){
      _dirState.tablaActual=Object.assign({},ta,{active:false,until:0});
    }
  }
  _dirState[comp]=Object.assign({},_dirState[comp]||{},{active:true,until},opts||{});
  await _dirPush();R();
};

// Atajos de teclado para Stream Deck
window._dirKeyHandler=function(e){
  // Atajos del director (Stream Deck): funcionan desde CUALQUIER vista admin del
  // LiveCast (Control en Vivo, Control TX, etc.) — no solo en la vista Director.
  // Así podés prender/apagar la Tabla Actual del stream con el Stream Deck mientras
  // operás la competencia. Requiere ser admin y NO tener foco en un input.
  if(!isAdmin)return;
  // Ignorar si hay foco en un input/textarea/select (no pisar la edición de pesos)
  const tag=(document.activeElement?.tagName||'').toUpperCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  // Solo teclas simples sin modificadores (evita pisar atajos del navegador/SO)
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const k=(e.key||'').toLowerCase();
  const map={p:'profile',s:'scoreboard',t:'timer'};
  if(map[k]){e.preventDefault();window.dirToggle(map[k]);return}
  if(k==='l'){e.preventDefault();window.dirToggleLb();return}
  if(k==='a'){e.preventDefault();window.dirToggle('tablaActual');return}
  if(k==='m'){e.preventDefault();window.dirToggleMedals();return}
  if(k==='g'){e.preventDefault();window.dirShowSlam('g');return}
  if(k==='n'){e.preventDefault();window.dirShowSlam('n');return}
  if(k==='b'){e.preventDefault();window.dirToggleBreak();return}
  if(k==='0'||k==='escape'){e.preventDefault();window.dirHideAll();return}
};

window.dirBtDown=function(e,type){

window.dirBtMove=function(e){
  if(!_dirBtDrag)return;
  const cv=document.getElementById('dirBtCanvas');if(!cv)return;
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*100;
  const my=(e.clientY-r.top)/r.height*100;
  const dx=mx-_dirBtDrag.mx0,dy=my-_dirBtDrag.my0;
  const sv=_dirBtDrag.sv;
  if(!_dirState?.breakTimer)return;
  const s=(_dirState.breakTimer.style=(_dirState.breakTimer.style||{}));
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(_dirBtDrag.type==='vid'){s.videoX=clamp(sv.videoX+dx,0,80);s.videoY=clamp(sv.videoY+dy,0,80);}
  else if(_dirBtDrag.type==='vid-resize'){s.videoW=clamp(sv.videoW+dx,5,95);s.videoH=clamp(sv.videoH+dy,5,100);}
  else if(_dirBtDrag.type==='vid-w'){s.videoW=clamp(sv.videoW+dx,5,95);}
  else if(_dirBtDrag.type==='vid-h'){s.videoH=clamp(sv.videoH+dy,5,100);}
  else if(_dirBtDrag.type==='txt'){s.textX=clamp(sv.textX+dx,0,92);s.textY=clamp(sv.textY+dy,0,90);}
  // Actualizar preview en tiempo real
  const vid=document.getElementById('dirBtVid');
  const txt=document.getElementById('dirBtTxt');
  if(vid){vid.style.left=s.videoX+'%';vid.style.top=s.videoY+'%';vid.style.width=s.videoW+'%';vid.style.height=s.videoH+'%';}
  if(txt){txt.style.left=s.textX+'%';txt.style.top=s.textY+'%';txt.style.maxWidth=(100-s.textX-1)+'%';}
};

// Grilla de botones grandes que empujan los MISMOS comandos a Firestore
// (livecast_director) que el panel Control TX. Se abre en el teléfono con
// ?remote=1 y controla el overlay de OBS (browser source ?tx=director) sin
// puente, sin WebSocket, sin Stream Deck. Reusa las funciones dir* existentes.
// ═══════════════════════════════════════════════════════════════════
function renderRemote(){
  _dirEnsureListener();
  if(!_dirState){_dirState={profile:{active:false,until:0},scoreboard:{active:false,until:0},leaderboard:{active:false,until:0,cat:''},tablaActual:{active:false,until:0},timer:{active:false,until:0},slam:{active:false,until:0,type:'g'}};}
  const on=(k)=>{const c=_dirState[k]||{};return c.active&&(!c.until||c.until>Date.now());};
  const cur=liftQueue()[0];
  const evName=DATA.event?.short||DATA.event?.name||'—';
  // Botón grande touch. col: cuántas columnas ocupa (por defecto 1).
  const bigBtn=(label,sub,active,onClick,col)=>{
    const bg=active?'linear-gradient(180deg,rgba(34,197,94,.28),rgba(34,197,94,.12))':'rgba(10,22,40,.55)';
    const bd=active?'#22c55e':'var(--border)';
    const col2=active?'#4ade80':'var(--text)';
    return '<button onclick="'+onClick+'" style="grid-column:span '+(col||1)+';min-height:88px;border-radius:14px;border:2px solid '+bd+';background:'+bg+';color:'+col2+';font-family:Oswald;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;-webkit-tap-highlight-color:transparent;transition:transform .08s" ontouchstart="this.style.transform=\'scale(.96)\'" ontouchend="this.style.transform=\'scale(1)\'">'
      +'<span style="font-size:16px;font-weight:700;letter-spacing:1px;text-align:center;line-height:1.1">'+label+'</span>'
      +(sub?'<span style="font-size:10px;font-weight:600;letter-spacing:1px;color:'+(active?'#86efac':'var(--muted)')+'">'+sub+'</span>':'')
      +'</button>';
  };
  let h='<div class="fade" style="max-width:560px;margin:0 auto">';
  // Encabezado compacto
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap">';
  h+='<div><h2 class="os" style="font-size:20px;letter-spacing:1px;margin:0">📱 CONTROL REMOTO</h2>'
    +'<div style="font-size:11px;color:var(--muted)">'+evName+(cur?' · en tarima: <b style="color:var(--gold)">'+esc(cur.name)+'</b>':'')+'</div></div>';
  // Estado real: necesita Firebase listo Y el evento resuelto (si no, empujaría al
  // doc equivocado y el overlay de OBS no vería nada → "aprieto y no pasa nada").
  const _evtReady=!!fbDocId();
  const _connCol=(fbReady&&_evtReady)?'var(--green)':(fbReady?'var(--orange)':'var(--red)');
  const _connTxt=(fbReady&&_evtReady)?'CONECTADO':(fbReady?'CARGANDO EVENTO…':'CONECTANDO…');
  h+='<div style="display:flex;align-items:center;gap:6px">'
    +'<span style="width:9px;height:9px;border-radius:50%;background:'+_connCol+';display:inline-block"></span>'
    +'<span style="font-size:10px;color:var(--muted);font-family:Oswald;letter-spacing:1px">'+_connTxt+'</span></div>';
  h+='</div>';
  if(!(fbReady&&_evtReady)){
    h+='<div style="margin:0 0 12px;padding:10px 14px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.4);color:#f59e0b;font-size:12px;line-height:1.5">'
      +(fbReady?'Esperando que cargue el evento. Asegurate de abrir el link con <b>?evento=TU_EVENTO&remote=1</b> y estar logueado como admin.':'Conectando a Firebase… Si no conecta, revisá tu internet y que estés logueado como admin.')
      +'</div>';
    // Re-chequear en 1s hasta que esté listo (evita quedar en "conectando" para siempre).
    if(!window._remotePoll){window._remotePoll=setTimeout(()=>{window._remotePoll=null;if(DATA.phase==='remote'){_dirEnsureListener();R();}},1000);}
  }
  // Grilla principal — pensada para el pulgar
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  h+=bigBtn('PERFIL', on('profile')?'EN PANTALLA':'atleta actual', on('profile'), "dirToggle('profile')");
  h+=bigBtn('MARCADOR', on('scoreboard')?'EN PANTALLA':'lower-third', on('scoreboard'), "dirToggle('scoreboard')");
  h+=bigBtn('TABLA ACTUAL', on('tablaActual')?'EN PANTALLA':'ranking corner', on('tablaActual'), "dirToggle('tablaActual')");
  h+=bigBtn('CLASIFICACIÓN', on('leaderboard')?'EN PANTALLA':'ranking cat.', on('leaderboard'), "dirToggleLb()");
  h+=bigBtn('TIMER', on('timer')?'EN PANTALLA':'cronómetro', on('timer'), "dirToggle('timer')");
  h+=bigBtn('MEDALLERO', on('medals')?'EN PANTALLA':'top 3', on('medals'), "dirToggle('medals')");
  h+='</div>';
  // Slams (flash grande) — fila aparte, colores fuertes
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">';
  h+='<button onclick="dirShowSlam(\'g\')" style="min-height:76px;border-radius:14px;border:2px solid #22c55e;background:linear-gradient(180deg,rgba(34,197,94,.25),rgba(34,197,94,.08));color:#4ade80;font-family:Oswald;font-size:17px;font-weight:800;letter-spacing:1px;cursor:pointer;-webkit-tap-highlight-color:transparent">✓ GOOD LIFT</button>';
  h+='<button onclick="dirShowSlam(\'n\')" style="min-height:76px;border-radius:14px;border:2px solid #ef4444;background:linear-gradient(180deg,rgba(239,68,68,.25),rgba(239,68,68,.08));color:#f87171;font-family:Oswald;font-size:17px;font-weight:800;letter-spacing:1px;cursor:pointer;-webkit-tap-highlight-color:transparent">✗ NO LIFT</button>';
  h+='</div>';
  // Esconder todo — ancho completo
  h+='<button onclick="dirHideAll()" style="width:100%;margin-top:10px;min-height:64px;border-radius:14px;border:2px solid var(--red);background:rgba(239,68,68,.1);color:#f87171;font-family:Oswald;font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent">⨯ ESCONDER TODO</button>';
  // Ayuda / enlace del browser source para OBS
  const widgetUrl=location.origin+location.pathname.replace(/[^/]+$/,'')+'livecast.html?tx=director&evento='+encodeURIComponent(DATA.event?.id||DATA.event?.name||'')+(TARIMA?'&tarima='+TARIMA:'');
  h+='<div style="margin-top:18px;padding:12px 14px;background:rgba(10,22,40,.4);border:1px solid var(--border);border-radius:10px">'
    +'<div style="font-size:11px;color:var(--muted);line-height:1.6">En OBS agregá <b style="color:var(--text)">un solo Browser Source</b> con esta URL (cámara de fondo + este overlay encima). No hace falta OBS WebSocket ni Stream Deck — este control empuja todo por internet.</div>'
    +'<div style="display:flex;gap:6px;align-items:center;margin-top:8px"><input readonly value="'+esc(widgetUrl)+'" onclick="this.select()" style="flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0a1628;color:var(--text);font-family:monospace;font-size:11px"><button onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+widgetUrl.replace(/'/g,"\\'")+'\');showToastLC(\'URL del overlay copiada\')" style="padding:8px 12px;border-radius:8px;border:1px solid var(--gold);background:rgba(212,168,67,.12);color:var(--gold);font-family:Oswald;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">COPIAR</button></div>'
    +'</div>';
  h+='</div>';
  return h;
}

  // Escaper local (independiente del helper global por si el browser cachea la vieja versión)

  _dirEnsureListener();
  if(!_dirState){_dirState={profile:{active:false,until:0},scoreboard:{active:false,until:0},leaderboard:{active:false,until:0,cat:''},timer:{active:false,until:0},slam:{active:false,until:0,type:'g'}};}

    ?'&obsWs='+encodeURIComponent(_obsWsSettings.host+':'+(_obsWsSettings.port||4455))

    :'';

  h+='</div>'+scaleSlider('breakTimer');

  const colorGroups=[
    {title:'INTENTOS',items:[
      {key:'goodLift',   label:'✓ Good Lift',     desc:'Intento bueno y banner GOOD LIFT'},
      {key:'noLift',     label:'✗ No Lift',        desc:'Intento fallido, banner NO LIFT y DQ'},
      {key:'curAttempt', label:'Intento actual',   desc:'Fondo del intento en curso'},
    ]},
    {title:'NOMBRE / BARRA',items:[
      {key:'nameBg',     label:'Fondo nombre',     desc:'Color principal de la barra del nombre'},
      {key:'nameBg2',    label:'Fondo nombre 2',   desc:'Color derecho del gradiente de la barra'},
      {key:'nameText',   label:'Texto nombre',     desc:'Texto sobre la barra del nombre'},
    ]},
    {title:'POSICIÓN',items:[
      {key:'puesto',     label:'# Posición',       desc:'Texto del puesto en marcador (pos 4+)'},
      {key:'accent',     label:'Acento / Podio',   desc:'Bordes, total, pos 2-3, highlights'},
    ]},
    {title:'ESTRUCTURA',items:[
      {key:'headerBg',   label:'Header',           desc:'Fondo del encabezado del marcador/LB'},
      {key:'gridBg',     label:'Grid intentos',    desc:'Fondo de la fila de intentos'},

    {title:'LEADERBOARD',items:[

  h+='<div style="font-family:Oswald;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--gold);margin-bottom:12px">PALETA DE COLORES</div>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px">';
  Object.entries(_TX_COLOR_PALETTES).forEach(([key,pal])=>{
    const active=activePal===key;
    h+='<button onclick="dirApplyPalette(\''+key+'\')" style="'
      +'display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 14px;'
      +'border-radius:10px;border:2px solid '+(active?'#D4A843':'rgba(100,140,200,.25)')+';'
      +'background:'+(active?'rgba(212,168,67,.1)':'rgba(10,22,40,.5)')+';'
      +'cursor:pointer;transition:all .15s;min-width:110px">';
    // Swatches
    h+='<div style="display:flex;gap:3px">';
    pal.preview.forEach(c=>{h+='<div style="width:14px;height:14px;border-radius:3px;background:'+c+';box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>';});
    h+='</div>';
    h+='<div style="font-family:Oswald;font-size:12px;font-weight:700;letter-spacing:.5px;color:'+(active?'#D4A843':'var(--text)')+'">'+pal.label+'</div>';
    h+='<div style="font-size:9px;color:var(--muted);line-height:1.3">'+pal.desc+'</div>';
    h+='</button>';
  });
  h+='</div>';
  // ── Ajuste fino (individual) ─────────────────────────────────
  h+='<details style="margin-top:12px"><summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;font-family:Oswald;font-size:10px;letter-spacing:2px;color:var(--muted)">▸ AJUSTE FINO (colores individuales)</summary>';

    h+='<div style="margin-bottom:14px">';
    h+='<div style="font-family:Oswald;font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(212,168,67,.2)">'+title+'</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">';
    items.forEach(({key,label,desc})=>{
      const _raw=curColors[key]||_TX_COLOR_DEFAULTS[key]||'#ffffff';
      const val=/^#[0-9a-fA-F]{6}$/.test(_raw)?_raw:(_TX_COLOR_DEFAULTS[key]||'#ffffff');
      h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(10,22,40,.4);border:1px solid var(--border);border-radius:8px">';
      h+='<input type="color" value="'+val+'" onchange="dirSetColor(\''+key+'\',this.value)" style="width:36px;height:36px;border:none;border-radius:5px;cursor:pointer;background:transparent;flex-shrink:0">';

      h+='<div style="font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+desc+'</div>';
      h+='<div style="font-size:9px;color:var(--muted);font-family:monospace;margin-top:1px">'+val+'</div></div>';
      h+='</div>';
    });
    h+='</div></div>';
  });
  h+='<div style="margin-top:8px;display:flex;justify-content:flex-end"><button class="btn btn-o" onclick="dirResetColors()" style="padding:7px 16px;font-size:11px;font-family:Oswald;letter-spacing:1px">↺ RESTAURAR DEFAULTS</button></div>';
  h+='</div></details>';
  h+='</div>';

  h+='</div>';
  return h;
}

function renderManage(){
  // Filtrar por tarima si está activo (modo 2 tarimas)
  const ath=TARIMA?DATA.athletes.filter(a=>_inTarima(a.flight)):DATA.athletes;
  let h='<div class="fade"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px"><div><h2 class="os" style="font-size:22px;letter-spacing:1px">ATLETAS & PESAJE'+(TARIMA?' · TARIMA '+TARIMA:'')+'</h2><p style="color:var(--muted);font-size:12px">'+ath.filter(a=>a.bw>0).length+'/'+ath.length+' pesados'+(function(){const n=ath.filter(_isPlusBench).length;return n?' \u00b7 '+n+' compiten tambi\u00e9n en Only Bench':'';})()+'</p></div><div style="display:flex;gap:6px;flex-wrap:wrap">'+(DATA.lotsGenerated?'<button class="btn btn-o" onclick="generateLots()" title="Re-sortear todos los lotes al azar (reemplaza los actuales)">Re-sortear lotes</button>':'<button class="btn btn-r" onclick="generateLots()">Generar Lotes</button>')+'<button class="btn btn-o" onclick="resyncFromAdmin()" title="Re-sincronizar nómina con admin: trae cambios, borra eliminados sin datos y toma tanda, división, categoría y modalidad del Cronograma">Re-sincronizar con admin</button><button class="btn" onclick="openAddAthlete()" title="Agregar un atleta manualmente (ej. atletas internacionales)" style="background:rgba(34,197,94,.15);border-color:var(--green);color:var(--green)">Agregar atleta</button><button class="btn btn-o" onclick="sortByLot()">Ordenar por Lote ↑</button><button class="btn btn-o" onclick="sortByFlight()">Ordenar por Tanda ↑</button><button class="btn btn-o" onclick="sortByCat()">Ordenar por Categoría ↑</button><button id="btnHojaPesaje" class="btn" onclick="generateHojaPesaje()" style="background:rgba(59,130,246,.15);border-color:#3b82f6;color:#3b82f6">Hoja de Pesaje PDF</button><button id="btnHojaRack" class="btn" onclick="generateHojaRack()" style="background:rgba(16,185,129,.15);border-color:#10b981;color:#10b981">Altura de Rack PDF</button><button id="btnHojaEquipo" class="btn" onclick="generateHojaEquipo()" style="background:rgba(168,85,247,.15);border-color:#a855f7;color:#a855f7">Revisión Equipo PDF</button><button id="btnPapeletas" class="btn" onclick="generatePapeletas()" style="background:rgba(234,179,8,.15);border-color:#eab308;color:#ca8a04">Papeletas de Intentos PDF</button><button class="btn btn-g" onclick="go(\'compete\')">Iniciar Competencia →</button></div></div>';
  h+='<div class="card" style="padding:0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="border-bottom:2px solid var(--border)">';
  h+='<th class="os" style="padding:8px 4px;text-align:center;color:var(--muted);font-size:9px;width:28px">#</th><th style="padding:8px 4px;text-align:left;color:var(--muted);font-size:9px">ATLETA</th><th style="padding:8px 3px;text-align:center;color:var(--muted);font-size:9px;width:38px">VLO</th><th style="padding:8px 3px;text-align:center;color:var(--muted);font-size:9px;width:80px">BW + 1ros</th>';
  ['sq','bp','dl'].forEach(l=>{[1,2,3].forEach(r=>{h+='<th style="padding:8px 2px;text-align:center;color:'+LIFT_C[l]+';font-size:9px;width:62px">'+LIFT_S[l]+r+'</th>'})});
  h+='</tr></thead><tbody>';
  ath.forEach(a=>{
    h+='<tr style="border-bottom:1px solid rgba(30,58,95,.3);'+(a.bombed?'opacity:.4':'')+'">';
    h+='<td style="padding:3px 2px;text-align:center"><input type="number" min="1" value="'+a.lot+'" onchange="setLot('+a.id+',this.value)" title="Edita el número de lote — si ya existe se hace swap" style="width:42px;padding:3px 2px;font-family:Oswald;font-weight:700;color:var(--gold);background:transparent;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:13px"></td>';
    h+='<td style="padding:6px 4px"><div style="font-weight:600;font-size:12px;white-space:nowrap">'+_flagImg(_ctry(a),13)+a.name+'</div><div style="display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted)">'+(window.clubLogoImg?window.clubLogoImg(a.club,14,'background:rgba(10,22,40,.4);padding:1px;'):'')+'<span>'+_ctry(a)+' \u00b7 '+a.club+' \u00b7 '+a.div+' \u00b7 '+a.cat+'</span></div></td>';
    {
      // Opciones del dropdown de vuelo: si hay tarima, suffix con 1/2; si no, letras simples.
      const _flOpts = TARIMA ? FL_LETTERS.map(L=>L+TARIMA) : FL_LETTERS.slice();
      h+='<td style="padding:3px 2px"><select class="inp-sm" onchange="updA('+a.id+',\'flight\',this.value);R()" style="width:42px;padding:4px 1px;font-size:11px">'+_flOpts.map(f=>'<option value="'+f+'" '+(a.flight===f?'selected':'')+'>'+f+'</option>').join('')+'</select></td>';
    }
    h+='<td style="padding:3px 2px;text-align:center">';
    if(a.weighedIn){
      h+='<button onclick="openWeighIn('+a.id+')" style="padding:2px 6px;border-radius:4px;border:1px solid var(--green);background:rgba(34,197,94,.1);color:var(--green);font-family:Oswald;font-size:9px;cursor:pointer;white-space:nowrap">'+a.bw+'kg ✓</button>';
    }else{
      h+='<button onclick="openWeighIn('+a.id+')" style="padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:Oswald;font-size:9px;cursor:pointer">Pesar</button>';
    }
    {const _hasMedia=!!_lcMediaFor(a);h+='<button onclick="openAthleteMedia('+a.id+')" title="Subir foto/GIF del atleta" style="display:block;margin:3px auto 0;padding:2px 8px;border-radius:4px;border:1px solid '+(_hasMedia?'var(--gold)':'var(--border)')+';background:'+(_hasMedia?'rgba(212,168,67,.12)':'transparent')+';color:'+(_hasMedia?'var(--gold)':'var(--muted)')+';font-family:Oswald;font-size:9px;cursor:pointer;white-space:nowrap">'+(_hasMedia?'Foto ✓':'Foto')+'</button>';}
    h+='</td>';
    // La tabla de pesaje muestra siempre 3 intentos (el 4º extra se gestiona en
    // Control en Vivo). slice(0,3) evita filas con más columnas que el encabezado.
    ['sq','bp','dl'].forEach(l=>{a.att[l].slice(0,3).forEach((at,r)=>{
      const ctKey=a.id+'_'+l+'_'+r;const ct=DATA.changeTimers[ctKey];
      let cls='inp-sm',ph='\u2014';
      if(ct&&!ct.expired&&ct.remaining>0){cls='inp-sm countdown';ph=ct.remaining+'s'}
      else if(ct&&ct.expired&&!at.w){cls='inp-sm expired';ph='\u23F0'}
      const bc=at.r==='g'?'var(--green)':at.r==='n'?'var(--red)':at.w>0?LIFT_C[l]:'var(--border)';
      const gActive=at.r==='g';const nActive=at.r==='n';
      h+='<td style="padding:2px">'
        +'<input type="text" inputmode="decimal" class="'+cls+'" id="ct_'+ctKey+'" value="'+(at.w||'')+'" placeholder="'+ph+'" oninput="this.value=this.value.replace(\',\',\'.\')" onchange="setAtt('+a.id+',\''+l+'\','+r+',this.value)" style="border-color:'+bc+';'+(at.r==='n'?'text-decoration:line-through':'')+';width:100%;margin-bottom:2px">'
        +'<div style="display:flex;gap:2px">'
        +'<button onclick="overrideResult('+a.id+',\''+l+'\','+r+',\'g\')" title="Marcar v\u00e1lido" style="flex:1;padding:2px 0;border-radius:3px;border:1px solid '+(gActive?'var(--green)':'rgba(34,197,94,.3)')+';background:'+(gActive?'rgba(34,197,94,.2)':'transparent')+';color:'+(gActive?'var(--green)':'rgba(34,197,94,.5)')+';font-size:9px;font-weight:700;cursor:pointer;line-height:1">\u2713</button>'
        +'<button onclick="overrideResult('+a.id+',\''+l+'\','+r+',\'n\')" title="Marcar nulo" style="flex:1;padding:2px 0;border-radius:3px;border:1px solid '+(nActive?'var(--red)':'rgba(239,68,68,.3)')+';background:'+(nActive?'rgba(239,68,68,.2)':'transparent')+';color:'+(nActive?'var(--red)':'rgba(239,68,68,.5)')+';font-size:9px;font-weight:700;cursor:pointer;line-height:1">\u2717</button>'
        +'</div>'
        +'</td>';
    })});
    h+='</tr>';
    // ── Segunda línea del MISMO atleta: su Only Bench ────────────────────
    // El que compite en PL + Only Bench sube a tarima una sola vez. Su banca
    // cuenta para los dos rankings, así que acá no va como otro atleta: va como
    // una línea más abajo del suyo, bajo las columnas de banca, reflejando el
    // mismo intento. Se marca sola cuando arriba se da válido o nulo.
    if(_isPlusBench(a)){
      const eqB=String(a.mod)==='equipped_bench';
      h+='<tr style="border-bottom:1px solid rgba(30,58,95,.3);background:rgba(167,139,250,.06);'+(a.bombed?'opacity:.4':'')+'">';
      h+='<td style="padding:3px 2px;text-align:center;color:#a78bfa;font-size:13px">\u21B3</td>';
      h+='<td style="padding:4px 4px"><div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><span style="font-size:11px">'+a.name+'</span>'
        +'<span style="background:#a78bfa;color:#0A1628;padding:1px 6px;border-radius:4px;font-size:8px;font-family:Oswald;font-weight:700;letter-spacing:1px">ONLY BENCH'+(eqB?' EQ':'')+'</span>'
        +'<span style="font-size:9px;color:var(--muted)">mismo intento de banca \u2014 se marca solo</span></div></td>';
      h+='<td></td><td></td>';
      ['sq','bp','dl'].forEach(l=>{ for(let r=0;r<3;r++){
        if(l!=='bp'){h+='<td></td>';continue;}
        const at=a.att.bp[r]||{w:0,r:null};
        const bc=at.r==='g'?'var(--green)':at.r==='n'?'var(--red)':at.w>0?LIFT_C.bp:'var(--border)';
        h+='<td style="padding:2px"><div title="Reflejo del intento de banca (no se edita ac\u00e1)" style="border:1px solid '+bc+';border-radius:6px;padding:5px 2px;text-align:center;font-size:12px;font-weight:700;opacity:.9;'+(at.r==='n'?'text-decoration:line-through':'')+'">'+(at.w||'\u2014')+'</div></td>';
      }});
      h+='</tr>';
    }
  });

// Banca: altura de seguros y cantidad de palmetas. Lo ve quien monta la barra.

// (una sola banca en tarima que cuenta para los dos rankings)

function _rackSetup(a,lift){

  h+='<span style="flex:1"></span>';

      // la casilla se pinta igual que la de un intento de récord.
      {const srT=(tot>0&&!_srSoloBanca(a))?_srRompe(a,'total',tot):[];
       const cssT=srT.length?'background:#F2C230;color:#1a1200;':'color:var(--gold);';

         +(srT.length?'<span style="display:block;font-size:8.5px;font-weight:800;letter-spacing:.6px;line-height:1.1">★ RÉCORD</span>':'')+(tot||'—')+'</td>';}

      // que siempre haya de dónde borrarlo (ver _normExtraAtts).
      const extraLifts = LIFTS.filter(l=>(a.att[l]||[]).length>=4 && a.att[l][3]);
      if(extraLifts.length){
        const gr0=((a.att[extraLifts[0]][3]||{}).grantedRound)||0;

        // ¿va al final de la ronda o lo repite enseguida?

        let h0=h; h='';
        h+='<tr '+(curOnExtra?'id="ctCurrentLifter" ':'')+'style="border-bottom:1px solid rgba(30,58,95,.18);'+(curOnExtra?'background:linear-gradient(90deg,#60a5fa33,#60a5fa12);box-shadow:inset 3px 0 0 #60a5fa;':'background:rgba(96,165,250,.05)')+'">';
        h+='<td style="text-align:center;padding:6px 4px;color:'+(curOnExtra?'#fff':'#60a5fa')+';font-size:'+Math.round(13*rsc)+'px">↳</td>';
        h+='<td style="padding:6px 8px"><div style="font-size:'+Math.round(11*rsc)+'px;font-weight:'+(curOnExtra?800:500)+';color:'+(curOnExtra?'#fff':'var(--text)')+';display:flex;align-items:center;gap:5px;flex-wrap:wrap">'+(curOnExtra?'<span style="background:#60a5fa;color:#fff;padding:1px 6px;border-radius:4px;font-size:9px;font-family:Oswald;letter-spacing:1px">▶</span>':'')+'<span>'+a.name+'</span><span style="background:#60a5fa;color:#fff;padding:1px 6px;border-radius:4px;font-size:8px;font-family:Oswald;letter-spacing:1px">'+exLbl+'</span></div></td>';
        LIFTS.forEach(l=>{
          if((a.att[l]||[]).length>=4 && a.att[l][3]){
            const isCurrentCell = curOnExtra && l===DATA.lift;
            h+=_attCellCompete(a,l,3,isCurrentCell); // la casilla del extra
            h+='<td></td><td></td>'; // 2 vacías para mantener la grilla de 3 por lift
          }else{
            h+='<td></td><td></td><td></td>';
          }
        });
        h+='<td></td><td></td>';
        h+='</tr>';
        const _fila=h; h=h0;
        if(_alFinal)_filasAlFinal.push(_fila); else h+=_fila;
      }
      // ── Fila ESPEJO de Only Bench (estilo LiftingCast) ──────────────────
      // Si el atleta compite en PL + Only Bench, en BANCA sale una segunda vez
      // debajo con su MISMO intento: sube a tarima una sola vez y esa banca
      // cuenta para los dos rankings. Es un reflejo de solo lectura del mismo
      // dato — al marcar válido/nulo arriba, acá queda automático (imposible
      // que se desincronicen). Sentadilla y peso muerto son solo del PL.
      if(DATA.lift==='bp' && _isPlusBench(a)){
        const eqB=String(a.mod)==='equipped_bench';
        h+='<tr style="border-bottom:1px solid rgba(30,58,95,.18);background:rgba(167,139,250,.06)">';
        h+='<td style="text-align:center;padding:6px 4px;color:#a78bfa;font-size:'+Math.round(13*rsc)+'px">\u21B3</td>';
        h+='<td style="padding:6px 8px"><div style="font-size:'+Math.round(11*rsc)+'px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:5px;flex-wrap:wrap"><span>'+a.name+'</span>'
          +'<span style="background:#a78bfa;color:#0A1628;padding:1px 6px;border-radius:4px;font-size:8px;font-family:Oswald;font-weight:700;letter-spacing:1px">ONLY BENCH'+(eqB?' EQ':'')+'</span>'
          +'<span style="font-size:8px;color:var(--muted)">mismo intento \u2014 se marca solo</span></div></td>';
        LIFTS.forEach(l=>{
          for(let j=0;j<3;j++){
            if(l!=='bp'){h+='<td></td>';continue;}
            const at=a.att.bp[j]||{w:0,r:null};
            const cls=at.r==='g'?'att-g':at.r==='n'?'att-n':at.w>0?'att-p':'att-e';
            h+='<td style="padding:'+Math.round(3*rsc)+'px;vertical-align:top"><div class="'+cls+' att" title="Reflejo del intento de banca (no se edita ac\u00e1)" style="font-size:'+Math.round(12*rsc)+'px;font-weight:700;padding:'+Math.round(8*rsc)+'px 4px;opacity:.92;cursor:default">'+(at.w||'\u2014')+'</div></td>';
          }
        });
        h+='<td style="text-align:center;padding:6px 4px;font-weight:700;font-family:Oswald;color:#a78bfa;font-size:12px">'+(bestOf(a,'bp')||'\u2014')+'</td>';
        h+='<td></td>';
        h+='</tr>';
      }
    });
    h+=_filasAlFinal.join('');
    h+='</tbody></table></div></div>';
  });
  h+='</div>';
  h+='</div>';
  // Ranking GL \u2014 ahora abajo, a todo el ancho (antes era una barra lateral de 300px
  // que le quitaba ancho a "Todas las tandas").
  h+='<div class="card"><h3 class="os" style="font-size:12px;letter-spacing:1px;margin-bottom:8px;color:var(--gold)">RANKING GL</h3>';
  if(!rk.length)h+='<p style="color:var(--muted);font-size:11px;text-align:center;padding:14px">Sin totales</p>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px">';
  rk.forEach((a,i)=>{h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 5px;border-bottom:1px solid rgba(30,58,95,.2)"><div style="display:flex;align-items:center;gap:6px"><span class="os" style="color:'+(i<3?'var(--gold)':'var(--muted)')+';font-weight:700;font-size:15px;width:20px">'+(i+1)+'</span><div><div style="font-weight:600;font-size:11px">'+a.name+'</div><div style="font-size:9px;color:var(--muted)">SQ '+bestOf(a,'sq')+' \u00b7 BP '+bestOf(a,'bp')+' \u00b7 DL '+bestOf(a,'dl')+'</div></div></div><div style="text-align:right"><div class="os" style="font-size:16px;font-weight:700;color:var(--gold)">'+a.gl+'</div><div style="font-size:9px;color:var(--muted)">'+a.total+'kg</div></div></div>'});
  h+='</div></div>';
  h+='</div>';
  // ── Auto-scroll estilo LiftingCast ──────────────────────────────────────
  // Acomoda la tabla al atleta EN TARIMA. Solo se mueve cuando CAMBIA el
  // levantador/intento (no molesta mientras editás ni si scrolleás a mano), y
  // respeta el foco en un input. Se puede apagar con el botón "⤓ Auto-scroll".
  {const _ck=cur?(DATA.flight+'_'+DATA.lift+'_'+DATA.round+'_'+cur.id+'_'+curAtt(cur)):'';
   if(window._ctAutoScroll!==false && _ck && _ck!==window._ctScrollKey){
     setTimeout(()=>{
       const f=document.activeElement;
       if(f&&(f.tagName==='INPUT'||f.tagName==='SELECT'||f.tagName==='TEXTAREA'))return;
       const el=document.getElementById('ctCurrentLifter');
       if(el){window._ctScrollKey=_ck;el.scrollIntoView({behavior:'smooth',block:'center'});}
     },160);
   }}
  return h;
}

// Orden de divisiones (helper global)
const _DIV_ORDER=function(d){
  const x=(d||'').toLowerCase().replace(/[\s-]/g,'');
  if(x.includes('subjunior'))return 1;
  if(x.includes('junior'))return 2;
  if(x.includes('open'))return 3;
  if(x.includes('masteri')&&!x.includes('masterii')&&!x.includes('masteriii')&&!x.includes('masteriv'))return 4;
  if(x.includes('masterii')&&!x.includes('masteriii'))return 5;
  if(x.includes('masteriii'))return 6;
  if(x.includes('masteriv'))return 7;
  if(x.includes('universitario'))return 8;
  return 99;
};

// Renderiza UNA tabla de resultados filtrando por modalidad/vista
function _renderResultsTable(opts){
  const view=opts.view||'meet';
  const isBench=view==='bench';
  const all=opts.athletes.map(a=>({...a,total:totalOf(a,view),gl:calcGL(totalOf(a,view),a.bw,a.sex,_glMod(a),view)}));
  if(!all.length)return '';
  // Cuántas casillas de intento mostrar por lift: 3 normalmente, 4 si algún atleta
  // de la tabla tuvo un 4º intento en ese lift (solo esos lo ven). Header y filas
  // se ajustan a esto para no quedar descuadradas.
  const maxAtts={};(isBench?['bp']:['sq','bp','dl']).forEach(l=>{maxAtts[l]=Math.max(3,...all.map(a=>(a.att[l]||[]).length));});
  const SEP='|';
  const catGroups={};
  all.forEach(a=>{const k=_catGroupKey(a);if(!catGroups[k])catGroups[k]=[];catGroups[k].push(a);});
  // Orden dentro de cada cat+div+sex: primero los con total válido (mayor a menor),
  // luego los DQ (3 fails en algún lift), luego los sin total / no clasificados.
  Object.values(catGroups).forEach(arr=>arr.sort((a,b)=>{
    const aDQ = view==='meet' && isDQ(a);
    const bDQ = view==='meet' && isDQ(b);
    if(aDQ!==bDQ) return aDQ?1:-1;  // no-DQ primero
    return b.total-a.total;
  }));
  const catPos={};
  // Posición solo se asigna a atletas con total válido (excluye DQ)
  Object.values(catGroups).forEach(arr=>{
    let p=1;
    arr.forEach(a=>{
      const dq = view==='meet' && isDQ(a);
      if(a.total>0 && !dq){catPos[a.id]=p;p++;}
    });
  });
  const sorted=[];
  const catKeys=Object.keys(catGroups).sort((a,b)=>{
    const [sa,ca,da]=a.split(SEP);
    const [sb,cb,db]=b.split(SEP);
    const isMa=sa==='Hombre'||sa==='Masculino'||sa==='M'?1:0;
    const isMb=sb==='Hombre'||sb==='Masculino'||sb==='M'?1:0;
    if(isMa!==isMb)return isMa-isMb;
    const na=parseFloat(ca.replace(/[^0-9.]/g,''))||999;
    const nb=parseFloat(cb.replace(/[^0-9.]/g,''))||999;
    if(na!==nb)return na-nb;
    return _DIV_ORDER(da)-_DIV_ORDER(db);
  });
  catKeys.forEach(k=>catGroups[k].forEach(a=>sorted.push(a)));
  const withTotal=all.filter(a=>a.total>0).length;
  // Pos,Atleta,BW,Div,Cat (5) + intentos + subtotales + Total,GL (2).
  const colspanTotal=isBench
    ? 5+maxAtts.bp+1+2
    : 5+maxAtts.sq+maxAtts.bp+maxAtts.dl+3+2;
  let h='<div class="card" style="padding:0;overflow:hidden;margin-bottom:18px">';
  h+='<div style="padding:10px 16px;background:linear-gradient(90deg,'+opts.color+'22,transparent);border-bottom:2px solid '+opts.color+';display:flex;justify-content:space-between;align-items:center">';
  h+='<div class="os" style="font-size:15px;font-weight:700;letter-spacing:2px;color:'+opts.color+'">'+opts.icon+' '+opts.title+'</div>';
  h+='<div style="font-size:10px;color:var(--muted);letter-spacing:1px">'+withTotal+' / '+all.length+' clasificados</div>';
  h+='</div>';
  h+='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr style="border-bottom:2px solid var(--border)">';
  h+='<th class="os" style="padding:8px 4px;text-align:center;color:var(--muted);font-size:9px;width:28px">Pos</th>';
  h+='<th style="padding:8px 4px;text-align:left;color:var(--muted);font-size:9px">Atleta</th>';
  h+='<th style="padding:8px 3px;text-align:center;color:var(--muted);font-size:9px;width:44px">BW</th>';
  h+='<th style="padding:8px 3px;text-align:center;color:var(--muted);font-size:9px">Div</th>';
  h+='<th style="padding:8px 3px;text-align:center;color:var(--muted);font-size:9px">Cat</th>';
  if(isBench){
    for(let r=1;r<=maxAtts.bp;r++){const is4=r===4;h+='<th style="padding:8px 2px;text-align:center;color:'+(is4?'#60a5fa':LIFT_C['bp'])+';font-size:9px;width:60px"'+(is4?' title="4º intento"':'')+'>BP'+r+(is4?'*':'')+'</th>'}
    h+='<th style="padding:8px 2px;text-align:center;color:'+LIFT_C['bp']+';font-size:9px;width:60px;font-weight:800">Best BP</th>';
  } else {
    ['sq','bp','dl'].forEach(l=>{for(let r=1;r<=maxAtts[l];r++){const is4=r===4;h+='<th style="padding:8px 2px;text-align:center;color:'+(is4?'#60a5fa':LIFT_C[l])+';font-size:9px;width:46px"'+(is4?' title="4º intento"':'')+'>'+LIFT_S[l]+r+(is4?'*':'')+'</th>'}h+='<th style="padding:8px 2px;text-align:center;color:'+LIFT_C[l]+';font-size:9px;width:48px;font-weight:800">Sub</th>'});
  }
  h+='<th class="os" style="padding:8px 4px;text-align:center;color:var(--text);font-size:10px;width:46px">Total</th>';
  h+='<th class="os" style="padding:8px 4px;text-align:center;color:var(--gold);font-size:10px;width:48px">GL</th>';
  h+='</tr></thead><tbody>';
  let prevCat='';
  sorted.forEach(a=>{
    const catKey=_catGroupKey(a);
    if(catKey!==prevCat){
      const symb=(_normSex(a.sex)==='F'?'♀':'♂');
      h+='<tr><td colspan="'+colspanTotal+'" style="padding:7px 8px;background:rgba(196,30,58,.1);border-bottom:2px solid var(--accent);font-family:Oswald;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent)">'+symb+' '+_normCat(a.cat||'?')+' — '+_normDiv(a.div||'Sin Div')+'</td></tr>';
      prevCat=catKey;
    }
    const dq = view==='meet' && isDQ(a);
    const pos = dq ? 'DQ' : (catPos[a.id]||'—');
    h+='<tr style="border-bottom:1px solid rgba(30,58,95,.25);'+(a.bombed?'opacity:.4':dq?'opacity:.7':'')+'">';
    h+='<td class="os" style="padding:6px 4px;text-align:center;color:'+(dq?'var(--red)':typeof pos==="number"&&pos<=3?'var(--gold)':'var(--muted)')+';font-weight:700;font-size:14px">'+pos+'</td>';
    h+='<td style="padding:6px 4px"><div style="font-weight:600;font-size:12px;white-space:nowrap">'+a.name+'</div><div style="display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted)">'+(window.clubLogoImg?window.clubLogoImg(a.club,14,'background:rgba(10,22,40,.4);padding:1px;'):'')+'<span>'+a.club+'</span></div></td>';
    h+='<td style="padding:6px 3px;text-align:center;font-size:11px">'+(a.bw||'—')+'</td>';
    h+='<td style="padding:6px 3px;text-align:center;font-size:10px">'+(a.div||'—')+'</td>';
    h+='<td style="padding:6px 3px;text-align:center;font-size:10px">'+(a.cat||'—')+'</td>';
    const _attTd=(at)=>{
      if(!at)return '<td style="padding:4px 2px;text-align:center;color:var(--border);font-family:Oswald;font-size:11px">·</td>';
      let st='',tx=at.w||'—';
      if(at.r==='g')st='background:rgba(34,197,94,.12);color:var(--green);font-weight:700';
      else if(at.r==='n')st='background:rgba(239,68,68,.1);color:var(--red);text-decoration:line-through';
      else if(at.w>0)st='color:var(--text)';else st='color:var(--border)';
      return '<td style="padding:4px 2px;text-align:center;'+st+';font-family:Oswald;font-size:11px">'+tx+'</td>';
    };
    if(isBench){
      for(let j=0;j<maxAtts.bp;j++)h+=_attTd(a.att.bp[j]);
      const bestBP=bestOf(a,'bp');
      h+='<td style="padding:4px 2px;text-align:center;font-weight:700;font-family:Oswald;color:#d4a843;font-size:12px;background:rgba(212,168,67,.08)">'+(bestBP||'—')+'</td>';
    } else {
      ['sq','bp','dl'].forEach(l=>{
        for(let j=0;j<maxAtts[l];j++)h+=_attTd(a.att[l][j]);
        const sub=l==='sq'?bestOf(a,'sq'):l==='bp'?bestOf(a,'sq')+bestOf(a,'bp'):bestOf(a,'sq')+bestOf(a,'bp')+bestOf(a,'dl');
        h+='<td style="padding:4px 2px;text-align:center;font-weight:700;font-family:Oswald;color:#d4a843;font-size:12px;background:rgba(212,168,67,.08)">'+(sub||'—')+'</td>';
      });
    }
    if(dq){
      h+='<td class="os" style="padding:6px 4px;text-align:center;font-weight:700;font-size:13px;color:var(--red);background:rgba(239,68,68,.12)">DQ</td>';
      h+='<td class="os" style="padding:6px 4px;text-align:center;font-weight:700;font-size:13px;color:var(--red);background:rgba(239,68,68,.06)">DQ</td></tr>';
    } else {
      h+='<td class="os" style="padding:6px 4px;text-align:center;font-weight:700;font-size:14px">'+(a.total||'—')+'</td><td class="os" style="padding:6px 4px;text-align:center;font-weight:700;font-size:14px;color:var(--gold)">'+(a.gl||'—')+'</td></tr>';
    }
  });
  h+='</tbody></table></div></div>';
  return h;
}

  const classicAthletes=flightAth.filter(a=>isMeetClassic(a));
  const equippedAthletes=flightAth.filter(a=>isMeetEquipped(a));
  const benchAthletes=flightAth.filter(a=>inBenchRanking(a));
  const oeClassicAthletes=flightAth.filter(a=>isOEClassic(a));

  // Top 3 GL por división combinando todas las modalidades
  const allEntries=[
    ...classicAthletes.map(a=>({a,view:'meet'})),
    ...equippedAthletes.map(a=>({a,view:'meet'})),

    [equippedAthletes.length,'Equipado','var(--orange)'],
    [benchAthletes.length,'Only Bench','var(--gold)']
  ].forEach(([v,l,c])=>{h+='<div class="card" style="text-align:center;padding:12px"><div class="os" style="font-size:24px;font-weight:700;color:'+c+'">'+v+'</div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px">'+l+'</div></div>'});
  h+='</div>';

    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
    divKeys.forEach(d=>{

function subTotal(a,lift){
  const s=bestOf(a,'sq');
  if(lift==='sq')return s;
  const b=bestOf(a,'bp');
  if(lift==='bp')return s+b;
  return s+b+bestOf(a,'dl');
}
// Posición ACTUAL y posición si el intento en curso es válido (forecast), dentro
// del mismo sexo + categoría + división + modalidad. Es el mismo criterio que usa
// el widget de OBS, para que Control en Vivo, espectador y transmisión coincidan.
function _posForecast(a,lift,round){
  if(!a)return null;
  const ra=(typeof _realAth==='function')?_realAth(a):a;
  if(_esInvitado(ra))return null;   // fuera de competencia: no ocupa lugar
  const l=lift||DATA.lift;
  const at=(ra.att&&ra.att[l])?ra.att[l][(typeof curAtt==='function')?curAtt(a):round||0]:null;
  const w=(at&&at.w)||0;
  const peers=DATA.athletes.filter(x=>x.cat===ra.cat&&x.div===ra.div&&x.sex===ra.sex&&x.mod===ra.mod&&!x.bombed);
  const sub=x=>subTotal(x,l);
  // actual
  const cur=peers.map(x=>({id:x.id,s:sub(x)})).filter(x=>x.s>0).sort((p,q)=>q.s-p.s);
  const posNow=cur.findIndex(x=>x.id===ra.id)+1;
  // simulado: si este intento sale válido
  let posIf=0;
  if(w>0){
    const best=Math.max(bestOf(ra,l),w);
    const sim=peers.map(x=>{
      if(x.id===ra.id){
        const o=(l==='sq')?best:(l==='bp')?bestOf(ra,'sq')+best:bestOf(ra,'sq')+bestOf(ra,'bp')+best;
        return{id:x.id,s:o};
      }
      return{id:x.id,s:sub(x)};
    }).filter(x=>x.s>0).sort((p,q)=>q.s-p.s);
    posIf=sim.findIndex(x=>x.id===ra.id)+1;
  }
  return {now:posNow||0, ifOk:posIf||0, of:cur.length};
}
// Celda compacta "actual → si es válido" para las tablas.
function _posCellHtml(a,opts){
  opts=opts||{};
  const f=_posForecast(a);
  if(!f)return '<td></td>';
  const fs=opts.fs||11;
  const col=p=>p===1?'var(--gold)':p<=3?'#60a5fa':'var(--muted)';
  if(!f.now&&!f.ifOk)return '<td style="text-align:center;padding:4px 3px;color:var(--border);font-size:'+fs+'px">—</td>';
  let h='<td style="text-align:center;padding:4px 3px;white-space:nowrap;font-family:Oswald;font-size:'+fs+'px">';
  h+='<span title="Posición actual" style="font-weight:700;color:'+col(f.now)+'">'+(f.now?f.now+'°':'—')+'</span>';
  if(f.ifOk&&f.ifOk!==f.now)h+='<span style="color:var(--muted);margin:0 2px">→</span><span title="Posición si el intento es válido" style="font-weight:800;color:'+col(f.ifOk)+'">'+f.ifOk+'°</span>';
  h+='</td>';
  return h;
}
function catRankBySub(athlete){
  // Ranking dentro del mismo sexo + categoría + división (no mezcla divisiones de edad)
  if(_esInvitado(athlete))return{pos:0,of:0};
  const sameCat=DATA.athletes.filter(a=>a.cat===athlete.cat&&a.div===athlete.div&&a.sex===athlete.sex&&a.flight===DATA.flight&&!a.bombed&&!_esInvitado(a));
  const withSub=sameCat.map(a=>({id:a.id,sub:subTotal(a,DATA.lift)})).filter(x=>x.sub>0).sort((a,b)=>b.sub-a.sub);
  const idx=withSub.findIndex(x=>x.id===athlete.id);
  return{pos:idx>=0?idx+1:0,of:withSub.length};
}

function initTxWidgets(){
  const ids=['txLightsWidget','txMarcWidget'];

  // Default positions if first time
  const defaults={
    txLightsWidget:{x:20,y:null,bottom:80},
    txMarcWidget:{x:null,right:20,y:null,bottom:20}
  };
  ids.forEach((wId,i)=>{
    const el=document.getElementById(wId);
    if(!el)return;
    const pos=TX_POS[keys[i]];
    // Set initial position if not yet set
    if(pos.x===null){
      const def=defaults[wId];
      if(def.right!=null){
        el.style.right=def.right+'px';el.style.left='auto';
        pos.x=window.innerWidth-el.offsetWidth-def.right;
      }else{el.style.left=def.x+'px';pos.x=def.x;}
      if(def.bottom!=null){
        el.style.bottom=def.bottom+'px';el.style.top='auto';
        pos.y=window.innerHeight-el.offsetHeight-def.bottom;
      }else{el.style.top=def.y+'px';pos.y=def.y;}
    }else{
      el.style.left=pos.x+'px';el.style.top=pos.y+'px';
      el.style.right='auto';el.style.bottom='auto';
    }
    el.style.transform='scale('+pos.scale/100+')';
    el.style.transformOrigin='top left';
    // Attach drag to handle
    const handle=el.querySelector('.tx-handle');
    if(!handle)return;
    handle.addEventListener('mousedown',function(e){
      if(e.target.tagName==='BUTTON')return;
      e.preventDefault();
      const startX=e.clientX-pos.x,startY=e.clientY-pos.y;
      // Normalize to top/left
      const rect=el.getBoundingClientRect();
      const ox=rect.left,oy=rect.top;
      el.style.left=ox+'px';el.style.top=oy+'px';
      el.style.right='auto';el.style.bottom='auto';
      pos.x=ox;pos.y=oy;
      const sc=pos.scale/100;
      const mx=e.clientX,my=e.clientY;
      const bx=ox,by=oy;
      function onMove(ev){
        pos.x=bx+(ev.clientX-mx);
        pos.y=by+(ev.clientY-my);
        el.style.left=pos.x+'px';el.style.top=pos.y+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        handle.style.cursor='grab';
      }
      handle.style.cursor='grabbing';
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
    // Touch support
    handle.addEventListener('touchstart',function(e){
      if(e.target.tagName==='BUTTON')return;
      e.preventDefault();
      const t=e.touches[0];
      const rect=el.getBoundingClientRect();
      el.style.left=rect.left+'px';el.style.top=rect.top+'px';
      el.style.right='auto';el.style.bottom='auto';
      pos.x=rect.left;pos.y=rect.top;
      const mx=t.clientX,my=t.clientY,bx=pos.x,by=pos.y;
      function onTMove(ev){
        const tt=ev.touches[0];
        pos.x=bx+(tt.clientX-mx);pos.y=by+(tt.clientY-my);
        el.style.left=pos.x+'px';el.style.top=pos.y+'px';
      }
      function onTEnd(){
        el.removeEventListener('touchmove',onTMove);
        el.removeEventListener('touchend',onTEnd);
      }
      el.addEventListener('touchmove',onTMove,{passive:false});
      el.addEventListener('touchend',onTEnd);
    },{passive:false});
  });
}

function forecastTotal(a){
  const s=bestOf(a,'sq'),b=bestOf(a,'bp'),d=bestOf(a,'dl');
  // For current lift, add the attempt weight if not yet judged
  let fs=s,fb=b,fd=d;
  if(!s){const best=a.att.sq.reduce((m,x)=>x.w>m?x.w:m,0);fs=best}
  if(!b){const best=a.att.bp.reduce((m,x)=>x.w>m?x.w:m,0);fb=best}
  if(!d){const best=a.att.dl.reduce((m,x)=>x.w>m?x.w:m,0);fd=best}
  return fs+fb+fd;
}
