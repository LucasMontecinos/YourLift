// Tandas existentes (con atletas activos), orden alfabético — A, B, C...
function _allFlightsSorted(){return [...new Set(DATA.athletes.filter(a=>!a.bombed).map(a=>a.flight))].sort();}
// Orden de tandas ARRANCANDO POR LA ACTIVA y siguiendo en círculo: si están A B C D
// y en tarima está la C, se ven C D A B. Así la tanda que está levantando queda
// siempre arriba (y con ella sus récords), en vez de quedar enterrada abajo.
// Es el mismo círculo que usa advanceLift() para pasar de tanda al terminar un lift.
function _flightsFromCurrent(list){
  const fl=(list||[]).slice();
  const i=fl.indexOf(DATA.flight);
  return i>0?fl.slice(i).concat(fl.slice(0,i)):fl;
}
// ¿La tanda "fl" ya terminó todos sus intentos de "lift" (los 3, o los que haya declarado)?
// ── Sesiones (jornadas) ────────────────────────────────────────────
// La jornada sale del Cronograma (AM/PM, o "Día 1 · AM" en campeonatos de
// varios días) y define qué tandas van juntas. Sirve para que la competencia
// avance DENTRO de la sesión: sentadilla A, B y C; después banca A, B y C;
// después peso muerto A, B y C. Recién cuando la mañana termina entera se pasa
// a la tarde con la D y la E. Si el evento no tiene jornadas cargadas, todas las
// tandas son una sola sesión y el comportamiento es el de siempre.
function _jornadaDeFlight(fl){
  const a=DATA.athletes.find(x=>x.flight===fl&&!x.bombed&&String(x.jornada||'').trim());
  return a?String(a.jornada).trim():'';
}
function _flightsDeJornada(fl){
  const todas=_allFlightsSorted();
  const j=_jornadaDeFlight(fl);
  if(!j)return todas;
  const mismas=todas.filter(f=>_jornadaDeFlight(f)===j);
  return mismas.length?mismas:todas;
}
// Las sesiones en el orden en que van a competir (por la primera tanda de cada una).
function _jornadasEnOrden(){
  const out=[];
  _allFlightsSorted().forEach(f=>{const j=_jornadaDeFlight(f);if(out.indexOf(j)<0)out.push(j);});
  return out;
}
function _flightDoneWithLift(fl,lift){
  const athletes=DATA.athletes.filter(a=>a.flight===fl&&!a.bombed);
  if(!athletes.length)return true;
  return athletes.every(a=>[0,1,2].every(r=>{const at=a.att[lift][r];return at.r!==null||at.w===0;}));
}
// Avanza al siguiente intento/tanda/lift cuando la tanda activa termina su ronda actual.
// Flujo: dentro de la misma tanda, ronda 1→2→3 del lift activo. Al terminar la ronda 3,
// si QUEDAN otras tandas sin terminar ese lift, salta a la siguiente (alfabético, cíclico) —
// así primero se hace sentadilla en A, B y C antes de pasar a banca. Cuando TODAS las
// tandas terminan el lift activo, pasa al siguiente lift arrancando en la primera tanda
// con trabajo pendiente ahí (normalmente vuelve a la A). Con una sola tanda, este mismo
// código simplemente avanza de lift sin saltar de tanda (no hay a dónde saltar).
// Intentos extra de este lift, en esta tanda, que todavía no se levantaron.
// Incluye los que aún no tienen el peso declarado: son justamente los que se
// perdían: sin peso no entran en la cola, la ronda parecía terminada y al
// avanzar el intento quedaba colgado sin que nadie se diera cuenta.
function _extrasPendientes(l){
  l=l||DATA.lift;
  return DATA.athletes.filter(a=>a.flight===DATA.flight&&!a.bombed&&(()=>{
    const at=(a.att[l]||[])[3]; return at&&at.extra&&at.r===null;
  })());
}
function advanceLift(){
  // Solo las tandas de ESTA sesión: la mañana no salta a la tarde a mitad de un
  // movimiento. Con jornadas cargadas queda sentadilla A-B-C, banca A-B-C, peso
  // muerto A-B-C, y recién ahí empieza la tarde con la D y la E.
  const flights=_flightsDeJornada(DATA.flight);
  const li=LIFTS.indexOf(DATA.lift);
  // El extra "al final de la ronda" se toma al cerrar SU ronda: no se puede
  // pasar de largo sin avisar.
  {const pend=_extrasPendientes(DATA.lift);
   if(pend.length){
     const det=pend.map(a=>{const at=a.att[DATA.lift][3];
       return '• '+a.name+(at.w>0?(' — '+at.w+' kg'):' — sin peso declarado')
              +(at.mode==='self'?' (se sigue a sí mismo)':' (al final de la ronda)');}).join('\n');
     if(!confirm('Queda intento extra sin levantar en '+(LIFT_N[DATA.lift]||DATA.lift)+', tanda '+DATA.flight+':\n\n'+det
       +'\n\nSe toma al final de la ronda, antes de seguir.\n\n¿Avanzar igual?'))return;
   }}
  if(DATA.round<2){DATA.round++;saveNow();R();return;}
  const pending=flights.filter(fl=>fl!==DATA.flight&&!_flightDoneWithLift(fl,DATA.lift));
  if(pending.length){
    const idx=flights.indexOf(DATA.flight);
    const rotated=[...flights.slice(idx+1),...flights.slice(0,idx)];
    DATA.flight=rotated.find(fl=>pending.includes(fl))||pending[0];
    DATA.round=0;
    saveNow();R();
    return;
  }
  if(li<2){
    const nextLift=LIFTS[li+1];
    DATA.flight=flights.find(fl=>!_flightDoneWithLift(fl,nextLift))||flights[0]||DATA.flight;
    DATA.lift=nextLift;DATA.round=0;
    saveNow();R();
    return;
  }
  // Terminó el peso muerto de toda la sesión → arranca la sesión siguiente
  // (la tarde) por su primera tanda y de nuevo en sentadilla, intento 1.
  const js=_jornadasEnOrden(), jAct=_jornadaDeFlight(DATA.flight);
  const sig=js[js.indexOf(jAct)+1];
  if(sig!==undefined){
    const fs=_allFlightsSorted().filter(f=>_jornadaDeFlight(f)===sig)
      .filter(f=>LIFTS.some(l=>!_flightDoneWithLift(f,l)));
    if(fs.length){
      DATA.flight=fs[0];DATA.lift='sq';DATA.round=0;
      saveNow();R();
      showToastLC('Empieza la jornada '+(sig||'siguiente')+' — tanda '+fs[0]);
      return;
    }
  }
  go('results');
}
// Fuerza un intento específico como "el actual" en Control en Vivo, saltándose el orden
// automático de la cola — para corregir cuando se pasó por alto a un atleta. Cambia
// también DATA.flight/lift/round para que la tarjeta, Control TX y las luces de jueces
// sigan a este atleta. Se limpia solo apenas se marca GOOD/NO LIFT (ver overrideResult).
window.forceCurrentAttempt=function(id,l,r){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  DATA.flight=a.flight;DATA.lift=l;DATA.round=r;DATA.forcedCurrent=id;
  save();R();
  showToastLC('Marcado como actual: '+a.name+' — '+LIFT_S[l]+(r+1));
};
// Añade un 4º intento a un lift de un atleta (índice 3). Se concede cuando el
// jurado otorga un intento compensatorio por un error ajeno (carga, equipo,
// cronómetro, arbitraje) — reglamento IPF. Cuenta para el mejor levantamiento
// igual que los otros (bestOf recorre todos los válidos). Solo un 4º por lift.
//   mode 'self'     → se sigue a sí mismo: el atleta repite enseguida. Se le da
//                     un tiempo compensatorio (0-5 min) que corre a la vista
//                     (NO bloquea el válido/nulo). Queda como "actual" en INT 4.
//   mode 'endround' → el 4º se toma al final de la ronda (uso IPF habitual).
window.add4thAttempt=function(id,l,mode){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!a.att[l]){showToastLC('Lift inválido');return;}
  if(a.att[l].length>=4){showToastLC(a.name+' ya tiene un intento extra en '+LIFT_S[l]);window._attMenuOpen=null;R();return;}
  window._attMenuOpen=null;
  mode=(mode==='self')?'self':'endround';
  // Ventanita emergente para elegir el tiempo compensatorio a dar.
  _openCompModal(id,l,mode);
};

//   'self'     → default 4 min (intento de récord, peso muerto 3ª ronda,

//   'endround' → 4/3/2 min según posición (último/penúltimo/antepenúltimo),

window._openCompModal=function(id,l,mode){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;

  // Nombre según la ronda en que se concede: 3ª ronda = "4º intento"; 1ª/2ª = "intento extra".
  const grNow=(l===DATA.lift)?DATA.round:2;
  const nom=(grNow>=2)?'4º INTENTO':'INTENTO EXTRA';
  const title=mode==='self'?nom+' — SE SIGUE A SÍ MISMO':nom+' — AL FINAL DE LA RONDA';
  const desc=mode==='self'
    ?'Tiempo compensatorio de descanso completo (4 min por defecto).'

  const opts=(mode==='self')

    :[{min:4,label:'Último de la ronda · 4 min',def:true},{min:3,label:'Penúltimo · 3 min'},{min:2,label:'Antepenúltimo · 2 min'},{min:0,label:'Sigue la competencia · sin tiempo'}];
  let h='<div style="background:#0D1F38;border:2px solid var(--gold);border-radius:14px;padding:22px 24px;width:min(460px,95vw)">';

  h+='</div>';

window._confirmComp=function(id,l,mode,compMin){
  const m=document.getElementById('compModal');if(m)m.remove();
  _do4thAttempt(id,l,mode,compMin);
};
function _do4thAttempt(id,l,mode,compMin){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(a.att[l].length>=4)return;
  compMin=Math.max(0,Math.min(5,parseInt(compMin,10)||0));
  // El 4º pertenece a la RONDA ACTUAL (no crea una "INT 4"). Arranca con el mismo
  // peso del intento de esa ronda (se sigue a sí mismo = repite ese intento).
  const gr=(l===DATA.lift)?DATA.round:2; // si se agrega desde otro lift, asume 3ª ronda
  const prevW=(a.att[l][gr]&&a.att[l][gr].w)||(a.att[l][2]&&a.att[l][2].w)||0;
  a.att[l].push({w:prevW,r:null,extra:true,mode:mode,compMin:compMin,grantedRound:gr});
  _markAtt(id,'att_'+l+'_3');
  // El minuto para declarar el intento siguiente se cancela SIEMPRE, no solo con
  // "se sigue a sí mismo": mientras el extra no se levante, el atleta no sabe con
  // cuánto seguir. Vuelve a arrancar solo cuando el extra se da por válido o nulo
  // (ver _armarChangeTimer). Antes, con "al final de la ronda", el reloj le seguía
  // corriendo y le sonaba la alarma sin haber levantado todavía.
  {const nk=id+'_'+l+'_'+(gr+1);
   if(DATA.changeTimers[nk])delete DATA.changeTimers[nk];}
  // El reloj de 1:00 del "próximo intento" NO debe correr al conceder el extra: el
  // atleta primero espera / tiene su tiempo compensatorio. Se detiene y resetea a
  // 1:00; el operador lo inicia (botón ▶) cuando el extra se va a TIRAR.
  DATA.timer=60; DATA.timerOn=false; if(mainTI){clearInterval(mainTI);mainTI=null;}
  // Tiempo compensatorio a la vista (Control en Vivo + Pantalla de Tarima). No bloquea.
  DATA.compTimer=compMin>0?{id:id,lift:l,min:compMin,startedAt:Date.now()}:null;
  // Nos aseguramos de estar viendo la tanda/lift/ronda donde aparece el extra.
  DATA.flight=a.flight;DATA.lift=l;DATA.round=gr;DATA.forcedCurrent=null;
  saveNow();R();
  const nombreExtra=(gr>=2)?'4º intento':'Intento extra';
  showToastLC('➕ '+nombreExtra+' ('+(mode==='self'?'se sigue a sí mismo':'final de ronda')+'): '+a.name+' — repite su '+['1er','2do','3er'][gr]+' intento en '+LIFT_S[l]+(compMin?' · '+compMin+' min compensatorio':''));
}

  });

window._startManualComp=function(id,l,min){

// Elimina el 4º intento de un lift (por si se agregó por error o el jurado lo
// revoca). Solo saca el índice 3, nunca los 3 base. Pide confirmación porque
// borra datos. El 4º vive dentro de su ronda concedida (no hay "INT 4"), así
// que basta con quitarlo del array; la cola deja de mostrarlo automáticamente.
// ── Sacar atletas que no son de este campeonato ────────────────────
// Si por un cruce de pantallas entraron atletas de OTRO evento (pasó entre el
// Sudamericano de prueba y el Regional Centro Sur), acá se sacan sin tener que
// abrir la consola. La referencia es el CRONOGRAMA del evento, que es la lista
// oficial de quién compite. No toca nada de los que sí corresponden: pesos,
// intentos, pesaje y racks quedan igual. Se deshace con Ctrl+Z.
window.limpiarAtletasAjenos=async function(){
  const map=window._cronoFlightMap;
  if(!map||!Object.keys(map).length){
    alert('No hay Cronograma cargado para este campeonato, así que no tengo con qué comparar.\n\n'
      +'Cargalo en Admin → Cronograma y volvé a entrar.');
    return;
  }
  const fuera=DATA.athletes.filter(a=>!_cronoLookup(map,a.name));
  if(!fuera.length){ alert('Todo en orden: los '+DATA.athletes.length+' atletas cargados están en el Cronograma.'); return; }
  if(!window.IS_CONTROLLER){
    alert('Esta pantalla está en modo LECTURA, no puede guardar.\n\nCambiá a CONTROLADOR desde el menú y volvé a intentar.');
    return;
  }
  const det=fuera.slice(0,30).map(a=>'• '+a.name+'  ('+(a.div||'')+' '+(a.cat||'')+', tanda '+(a.flight||'')+')').join('\n')
    +(fuera.length>30?'\n… y '+(fuera.length-30)+' más':'');
  if(!confirm('Hay '+fuera.length+' atleta(s) que NO están en el Cronograma de "'+((DATA.event&&DATA.event.name)||'')+'":\n\n'+det
    +'\n\nSe eliminan y quedan '+(DATA.athletes.length-fuera.length)+'.\n¿Confirmás?'))return;
  const ids=new Set(fuera.map(a=>a.id));
  DATA.athletes=DATA.athletes.filter(a=>!ids.has(a.id));
  Object.keys(DATA.changeTimers||{}).forEach(k=>{ if(ids.has(parseInt(k,10)))delete DATA.changeTimers[k]; });
  if(DATA.forcedCurrent!=null&&ids.has(DATA.forcedCurrent))DATA.forcedCurrent=null;
  try{ window._recentAtt={}; if(window._pendingEdits)window._pendingEdits.clear(); }catch(e){}
  R();
  // Escritura AUTORITATIVA + verificación: un borrado tiene que reemplazar el
  // documento, si no el merge devuelve a los que saqué.
  let ok=false;
  for(let i=1;i<=3&&!ok;i++){
    window._forceFullWrite=true;
    try{ await syncToFB(); }catch(e){ console.warn('[limpiar] escritura',e); }
    await new Promise(r=>setTimeout(r,1200));
    try{
      const snap=await window._fb.getDoc(window._fb.doc(fbDB,'livecast_sync',fbDocId()));
      const rem=JSON.parse((snap.data()||{}).athletes||'[]');
      ok=rem.length===DATA.athletes.length&&rem.every(a=>!!_cronoLookup(map,a.name));
    }catch(e){ console.warn('[limpiar] verificación',e); break; }
  }
  alert((ok?'Listo y verificado en el servidor.':'Se aplicó en esta pantalla, pero el servidor no confirmó. Revisá la conexión y volvé a intentar.')
    +'\n\n'+fuera.length+' eliminado(s)\n'+DATA.athletes.length+' atletas quedan cargados.');
};
window.remove4thAttempt=function(id,l){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  if(!a.att[l]||a.att[l].length<4){window._attMenuOpen=null;R();return;}
  const at4=a.att[l][3];
  const detalle=at4&&(at4.w||at4.r)?' (tiene '+(at4.w||'—')+'kg'+(at4.r==='g'?' · VÁLIDO':at4.r==='n'?' · NULO':'')+')':'';
  window._attMenuOpen=null;
  if(!confirm('¿Eliminar el 4º intento de '+a.name+' en '+LIFT_S[l]+'?'+detalle+'\n\nSe borra ese intento extra.')){R();return;}
  a.att[l].pop();
  _markAtt(id,'att_'+l+'_3');
  // limpiar cualquier change timer colgado de ese índice
  const ck=id+'_'+l+'_3';if(DATA.changeTimers[ck])delete DATA.changeTimers[ck];
  // limpiar el tiempo compensatorio si era de este 4º
  if(DATA.compTimer&&DATA.compTimer.id===id&&DATA.compTimer.lift===l)DATA.compTimer=null;

};

function editAtt(id,l,r){
  const a=DATA.athletes.find(x=>x.id===id);if(!a)return;
  const v=prompt(a.name+' \u2014 '+LIFT_S[l]+' Int '+(r+1)+'\nPeso actual: '+(a.att[l][r].w||'\u2014')+'\nNuevo peso (kg):',a.att[l][r].w||'');
  if(v!==null){
    a.att[l][r].w=parseFloat(v)||0;
    _markAtt(id,'att_'+l+'_'+r);

    const key=id+'_'+l+'_'+r;
    if(DATA.changeTimers[key])delete DATA.changeTimers[key];
    // Dejar en blanco (o en 0) el 4\u00ba intento es borrarlo: la casilla sale del
    // atleta y la columna SQ4/BP4/DL4 deja de aparecer en resultados y en el acta.
    // Si ya fue juzgado se conserva \u2014 para eso est\u00e1 el \ud83d\uddd1 del men\u00fa \u22ee, que avisa.
    if(r===3&&a.att[l].length===4&&!a.att[l][3].w&&a.att[l][3].r===null){
      a.att[l].pop();
      if(DATA.compTimer&&DATA.compTimer.id===id&&DATA.compTimer.lift===l)DATA.compTimer=null;
      showToastLC('\ud83d\uddd1 4\u00ba intento eliminado: '+a.name+' \u2014 '+LIFT_S[l]);
    }
    saveNow();R();
  }
}

// ═══════════════════════════════════════════════════════════
async function generateHojaRack(){
  const btn=document.getElementById('btnHojaRack');
  if(btn){btn.disabled=true;btn.textContent='Generando...';}
  try{
    if(!window.jspdf){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    const {jsPDF}=window.jspdf;
    const strip=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x00-\x7F]/g,'?').trim();

    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const PW=210,PH=297;
    const C=CP;

    // Sort by flight then lot
    const athletes=[...DATA.athletes].sort((a,b)=>{
      if(a.flight!==b.flight)return a.flight.localeCompare(b.flight);
      return a.lot-b.lot;
    });

    // 5 cols — usable 194mm portrait
    // Tanda|Nombre|Rack SQ|Rack BP|Firma
    const cols=[
      {h:'Tanda',   w:18,  align:'center', writable:false},
      {h:'Nombre',  w:90,  align:'left',   writable:false},
      {h:'Rack SQ', w:28,  align:'center', writable:true},
      {h:'Rack BP', w:28,  align:'center', writable:true},
      {h:'Firma',   w:30,  align:'center', writable:true},
    ];
    // 18+90+28+28+30 = 194 ✓
    const totalW=cols.reduce((s,c)=>s+c.w,0);
    const startX=(PW-totalW)/2;

    const drawPageHeader=(cont=false)=>{
      doc.setFillColor(...C.bg);doc.rect(0,0,PW,PH,'F');
      doc.setFillColor(...C.hFill);doc.rect(0,0,PW,14,'F');
      doc.setTextColor(...C.hText);doc.setFont('helvetica','bold');doc.setFontSize(12);
      doc.text('FECHIPO',8,9.5);
      doc.setFont('helvetica','normal');doc.setFontSize(9);
      doc.text(strip(DATA.event?.name||'Campeonato').toUpperCase(),PW/2,9.5,{align:'center'});
      doc.setFontSize(8);doc.text(new Date().toLocaleDateString('es-CL'),PW-8,9.5,{align:'right'});
      doc.setFillColor(...C.sub);doc.rect(0,14,PW,8,'F');
      doc.setTextColor(...C.subTx);doc.setFont('helvetica','bold');doc.setFontSize(9);
      doc.text('ALTURA DE RACK'+(cont?' (cont.)':' — '+athletes.length+' atletas'),PW/2,19.5,{align:'center'});
    };

    const drawColHeaders=(y)=>{
      doc.setFillColor(...C.colH);doc.rect(startX,y,totalW,7,'F');
      doc.setTextColor(...C.colTx);doc.setFont('helvetica','bold');doc.setFontSize(7);
      let cx=startX;
      cols.forEach(col=>{
        doc.text(col.h,cx+(col.align==='center'?col.w/2:3),y+4.5,{align:col.align==='center'?'center':'left'});
        cx+=col.w;
      });
      doc.setDrawColor(...C.line);doc.setLineWidth(0.4);doc.line(startX,y+7,startX+totalW,y+7);
    };

    drawPageHeader(false);
    drawColHeaders(26);
    let curY=33;
    let rowIndex=0;
    let lastFlight='';

    athletes.forEach(a=>{
      const rowH=11;
      if(curY+rowH>PH-12){
        doc.addPage();
        drawPageHeader(true);
        drawColHeaders(26);
        curY=33;rowIndex=0;lastFlight='';
      }

      // Flight separator band
      if(a.flight!==lastFlight){
        if(lastFlight!==''){curY+=2;}
        doc.setFillColor(...C.sep);doc.rect(startX,curY,totalW,5,'F');
        doc.setTextColor(...C.sepTx);doc.setFont('helvetica','bold');doc.setFontSize(7);
        doc.text('TANDA '+a.flight,startX+4,curY+3.5);
        curY+=5;
        lastFlight=a.flight;
      }

      doc.setFillColor(...(rowIndex%2===0?C.row0:C.row1));
      doc.rect(startX,curY,totalW,rowH,'F');

      const vals=[
        {t:a.flight||'', bold:true},
        {t:strip(a.name||''), bold:false, align:'left'},
        {t:(function(){const ab={izq:'I',der:'D',ambos:'I+D'}[String(a.sqAbat||'')]||'';return (a.rackSQ?String(a.rackSQ):'')+(ab?' ab:'+ab:'');})(), bold:!!a.rackSQ},
        {t:(function(){const p=parseInt(a.bpPalm,10)||0;return (a.rackBP?String(a.rackBP):'')+(a.bpSeg?' s:'+a.bpSeg:'')+(p>0?' p:'+p:'');})(), bold:!!a.rackBP},
        {t:'', bold:false},
      ];

      let cx=startX;
      cols.forEach((col,ci)=>{
        const cell=vals[ci];
        const ty=curY+rowH/2+2.5;
        doc.setTextColor(...C.text);
        doc.setFont('helvetica',cell.bold?'bold':'normal');
        doc.setFontSize(cell.bold?9:8);
        if(cell.t){
          const al=(cell.align||col.align)==='center'?'center':'left';
          const px=al==='center'?cx+col.w/2:cx+3;
          let txt=cell.t;
          if(ci===1){const maxW=col.w-6;while(txt.length>1&&doc.getTextWidth(txt)>maxW)txt=txt.slice(0,-1);if(txt!==cell.t)txt+='.';}
          doc.text(txt,px,ty,{align:al});
        }
        if(col.writable&&!cell.t){
          doc.setDrawColor(...C.uline);doc.setLineWidth(0.5);
          doc.line(cx+4,curY+rowH-2.5,cx+col.w-4,curY+rowH-2.5);
        }
        doc.setDrawColor(...C.line);doc.setLineWidth(0.15);
        doc.line(cx+col.w,curY,cx+col.w,curY+rowH);
        cx+=col.w;
      });

      doc.setDrawColor(...C.line);doc.setLineWidth(0.2);
      doc.line(startX,curY+rowH,startX+totalW,curY+rowH);
      curY+=rowH;
      rowIndex++;
    });

    const total=doc.internal.getNumberOfPages();
    for(let i=1;i<=total;i++){
      doc.setPage(i);
      doc.setDrawColor(...C.line);doc.setLineWidth(0.3);doc.line(8,PH-8,PW-8,PH-8);
      doc.setTextColor(...C.muted);doc.setFont('helvetica','normal');doc.setFontSize(6);
      doc.text('FECHIPO — Federacion Chilena de Powerlifting',8,PH-3);
      doc.text('Pag. '+i+'/'+total,PW-8,PH-3,{align:'right'});
    }

    const evShort=strip(DATA.event?.short||DATA.event?.name||'campeonato').replace(/\s+/g,'_');
    doc.save('AlturaRack_'+evShort+'.pdf');
  }catch(err){
    console.error('HojaRack error',err);
    alert('Error al generar hoja de rack: '+err.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Altura de Rack PDF';}
  }
}

// ═══════════════════════════════════════════════════════════
// HOJA DE REVISIÓN DE EQUIPO PDF  (landscape A4)
// ═══════════════════════════════════════════════════════════
// Modalidad en la que se inscribió el atleta, en corto y sin acentos, para la
// hoja de revisión de equipo. 'equipped_bench' le toca tanto al combinado
// equipado como al Only Bench Equipado puro, así que los separa la bandera
// plusBench, igual que en el resto del livecast.
function _modHojaEquipo(a){
  const m=String(a&&a.mod||'');
  const plus=(typeof _isPlusBench==='function')?_isPlusBench(a):false;
  if(m==='invitado')    return 'INVITADO/A';
  if(m==='oe_classic')  return 'OE';
  if(m==='oe_bench')    return 'OE ONLY BENCH';
  if(m==='onlybench')   return 'ONLY BENCH';
  if(m==='equipped')    return 'EQUIPADO';
  if(m==='classic_bench')  return plus?'CLASSIC + ONLY BENCH':'CLASSIC';
  if(m==='equipped_bench') return plus?'EQUIPADO + ONLY BENCH':'ONLY BENCH EQUIPADO';
  return 'CLASSIC';
}
async function generateHojaEquipo(){
  const btn=document.getElementById('btnHojaEquipo');
  if(btn){btn.disabled=true;btn.textContent='Generando...';}
  try{
    if(!window.jspdf){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    const {jsPDF}=window.jspdf;
    const strip=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x00-\x7F]/g,'?').trim();

    // Landscape A4: 297 x 210mm — usable 281mm wide, 194mm tall
    const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const PW=297,PH=210;
    const C=CP;

    // Sort: by flight then by category weight then by name
    const athletes=[...DATA.athletes].sort((a,b)=>{
      if(a.flight!==b.flight)return a.flight.localeCompare(b.flight);
      const na=parseFloat((a.cat||'').replace(/[^0-9.]/g,''))||999;
      const nb=parseFloat((b.cat||'').replace(/[^0-9.]/g,''))||999;
      return na!==nb?na-nb:a.name.localeCompare(b.name);
    });

    // Cols: Tanda|Categoría|Nombre|Singlet|Polera|Cinturón|Rodilleras|Muñequeras|Calzado SQ|Calzado BP|Calzado DL|Calcetas
    // Total usable: 297 - 2*8 = 281mm
    // La columna Nombre se ensancha para que quepa la modalidad entre paréntesis:
    // en revisión de equipo importa saber de una si es classic o equipado, y quién
    // además hace Only Bench. Los milímetros salen de las casillas, que igual
    // quedan de sobra para una marca a mano.
    const cols=[
      {h:'Tanda',      w:14,  align:'center', check:false},
      {h:'Cat.',       w:17,  align:'center', check:false},
      {h:'Nombre (modalidad inscrita)', w:78, align:'left', check:false},
      {h:'Singlet',    w:18,  align:'center', check:true},
      {h:'Polera',     w:18,  align:'center', check:true},
      {h:'Cinturon',   w:18,  align:'center', check:true},
      {h:'Rodilleras', w:20,  align:'center', check:true},
      {h:'Munequeras', w:20,  align:'center', check:true},
      {h:'Calz. SQ',   w:20,  align:'center', check:true},
      {h:'Calz. BP',   w:20,  align:'center', check:true},
      {h:'Calz. DL',   w:20,  align:'center', check:true},
      {h:'Calcetas',   w:18,  align:'center', check:true},
    ];
    // total = 14+17+78+18+18+18+20+20+20+20+20+18 = 281 ✓
    const totalW=cols.reduce((s,c)=>s+c.w,0);
    const startX=(PW-totalW)/2;
    const BOX=11; // checkbox size mm — large enough to write/mark

    const drawPageHeader=(cont=false)=>{
      doc.setFillColor(...C.bg);doc.rect(0,0,PW,PH,'F');
      doc.setFillColor(...C.hFill);doc.rect(0,0,PW,12,'F');
      doc.setTextColor(...C.hText);doc.setFont('helvetica','bold');doc.setFontSize(11);
      doc.text('FECHIPO',8,8.5);
      doc.setFont('helvetica','normal');doc.setFontSize(9);
      doc.text(strip(DATA.event?.name||'Campeonato').toUpperCase(),PW/2,8.5,{align:'center'});
      doc.setFontSize(8);doc.text(new Date().toLocaleDateString('es-CL'),PW-8,8.5,{align:'right'});
      doc.setFillColor(...C.sub);doc.rect(0,12,PW,7,'F');
      doc.setTextColor(...C.subTx);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
      doc.text('REVISION DE EQUIPO'+(cont?' (cont.)':' — '+athletes.length+' atletas'),PW/2,17,{align:'center'});
    };

    const drawColHeaders=(y)=>{
      doc.setFillColor(...C.colH);doc.rect(startX,y,totalW,7,'F');
      doc.setTextColor(...C.colTx);doc.setFont('helvetica','bold');doc.setFontSize(6.5);
      let cx=startX;
      cols.forEach(col=>{
        doc.text(col.h,cx+(col.align==='center'?col.w/2:2),y+4.5,{align:col.align==='center'?'center':'left'});
        cx+=col.w;
      });
      doc.setDrawColor(...C.line);doc.setLineWidth(0.4);doc.line(startX,y+7,startX+totalW,y+7);
    };

    drawPageHeader(false);
    drawColHeaders(22);
    let curY=29;
    let rowIndex=0;

    athletes.forEach(a=>{
      const rowH=15;
      if(curY+rowH>PH-10){
        doc.addPage();
        drawPageHeader(true);
        drawColHeaders(22);
        curY=29;rowIndex=0;
      }

      doc.setFillColor(...(rowIndex%2===0?C.row0:C.row1));
      doc.rect(startX,curY,totalW,rowH,'F');

      const vals=[
        {t:a.flight||'', bold:true},
        {t:strip(a.cat||''), bold:false},
        {t:strip(a.name||''),bold:false,align:'left'},
        null,null,null,null,null,null,null,null,null,
      ];

      let cx=startX;
      cols.forEach((col,ci)=>{
        const ty=curY+rowH/2+1.5;
        if(col.check){
          // celda vacía — se escribe a mano, sin recuadro interior
        } else {
          const cell=vals[ci];
          if(cell&&cell.t){
            doc.setTextColor(...C.text);
            doc.setFont('helvetica',cell.bold?'bold':'normal');
            doc.setFontSize(cell.bold?8:7);
            const al=(cell.align||col.align)==='center'?'center':'left';
            const px=al==='center'?cx+col.w/2:cx+2;
            let txt=cell.t;
            if(ci===2){
              // Nombre + modalidad entre paréntesis. Si no entra todo, se recorta
              // el NOMBRE y nunca la modalidad, que es el dato que se viene a mirar.
              const lbl=' ('+_modHojaEquipo(a)+')';
              doc.setFontSize(5.6);const wLbl=doc.getTextWidth(lbl);
              doc.setFontSize(7);
              const maxW=col.w-4-wLbl;
              while(txt.length>1&&doc.getTextWidth(txt)>maxW)txt=txt.slice(0,-1);
              if(txt!==cell.t)txt+='.';
              doc.text(txt,px,ty,{align:al});
              const wNom=doc.getTextWidth(txt);
              doc.setFontSize(5.6);doc.setTextColor(...C.muted);
              doc.text(lbl,px+wNom,ty,{align:'left'});
              doc.setTextColor(...C.text);
              cx+=col.w;
              doc.setDrawColor(...C.line);doc.setLineWidth(0.15);
              doc.line(cx,curY,cx,curY+rowH);
              return;
            }
            doc.text(txt,px,ty,{align:al});
          }
        }
        doc.setDrawColor(...C.line);doc.setLineWidth(0.15);
        doc.line(cx+col.w,curY,cx+col.w,curY+rowH);
        cx+=col.w;
      });

      doc.setDrawColor(...C.line);doc.setLineWidth(0.2);
      doc.line(startX,curY+rowH,startX+totalW,curY+rowH);
      curY+=rowH;
      rowIndex++;
    });

    const total=doc.internal.getNumberOfPages();
    for(let i=1;i<=total;i++){
      doc.setPage(i);
      doc.setDrawColor(...C.line);doc.setLineWidth(0.3);doc.line(8,PH-7,PW-8,PH-7);
      doc.setTextColor(...C.muted);doc.setFont('helvetica','normal');doc.setFontSize(6);
      doc.text('FECHIPO — Federacion Chilena de Powerlifting',8,PH-2.5);
      doc.text('Pag. '+i+'/'+total,PW-8,PH-2.5,{align:'right'});
    }

    const evShort=strip(DATA.event?.short||DATA.event?.name||'campeonato').replace(/\s+/g,'_');
    doc.save('RevisionEquipo_'+evShort+'.pdf');
  }catch(err){
    console.error('HojaEquipo error',err);
    alert('Error al generar hoja de equipo: '+err.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Revisión Equipo PDF';}
  }
}

// PAPELETAS DE INTENTOS PDF
// ═══════════════════════════════════════════════════════════
async function generatePapeletas(){
  const btn=document.getElementById('btnPapeletas');
  if(btn){btn.disabled=true;btn.textContent='Generando...';}
  try{
    if(!window.jspdf){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    const {jsPDF}=window.jspdf;
    const strip=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x00-\x7F]/g,'?').trim();

    // Preload logos. Se prueban varias rutas para el logo FECHIPO (cuando exista
    // el archivo oficial, se toma automáticamente). YourLift usa la versión HD.
    const loadImg=src=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src+'?t='+Date.now();});
    const loadFirst=async(srcs)=>{for(const s of srcs){const img=await loadImg(s);if(img)return img;}return null;};
    const [fechipoImg,yourliftImg]=await Promise.all([
      loadFirst(['fechipo_logo.png','logo_fechipo.png','promo/assets/fechipo_logo.png']),
      loadFirst(['yourlift_logo_hd.png','YourLift_logo.png']),
    ]);

    // Sort athletes by lot
    const athletes=[...DATA.athletes].sort((a,b)=>(a.lot||0)-(b.lot||0));

    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const PW=210,PH=297;

    // Layout: 2 cols x 4 rows per A4 page
    const COLS=2,ROWS=4;
    const mX=8,mY=8,gX=6,gY=6;
    const cardW=(PW-2*mX-(COLS-1)*gX)/COLS;   // ~94 mm
    const cardH=(PH-2*mY-(ROWS-1)*gY)/ROWS;   // ~65.75 mm
    const pad=3.5;

    const drawCard=(ox,oy)=>{
      // ── background & border ──────────────────────────────
      doc.setFillColor(255,255,255);doc.rect(ox,oy,cardW,cardH,'F');
      doc.setDrawColor(150,150,150);doc.setLineWidth(0.35);
      doc.rect(ox,oy,cardW,cardH,'S');

      // ── Name row (solo línea, sin relleno) ────────────────
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(0,0,0);
      const nameLabel='Nombre y Apellido';
      doc.text(nameLabel,ox+pad,oy+8.5);
      const nlW=doc.getTextWidth(nameLabel);
      doc.setDrawColor(0,0,0);doc.setLineWidth(0.35);
      doc.line(ox+pad+nlW+1.5,oy+9,ox+cardW-pad,oy+9);

      // ── Divider ───────────────────────────────────────────
      doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);
      doc.line(ox+pad,oy+11,ox+cardW-pad,oy+11);

      // ── Logos izquierda: FECHIPO arriba, YourLift abajo ───
      const lX=ox+pad, lY=oy+12.5;
      // FECHIPO logo (~4:1). Si no hay archivo de logo, texto negro legible
      // (sobre blanco) en vez del rojo que quedaba flotando.
      const fW2=30, fH2=8;
      const fechipoText=()=>{doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(20,20,20);doc.text('FECHIPO',lX,lY+fH2/2+1.5);};
      if(fechipoImg){try{doc.addImage(fechipoImg,'PNG',lX,lY,fW2,fH2);}catch(e){fechipoText();}}else{fechipoText();}
      // YourLift: el logo tiene partes blancas que se pierden sobre el papel, así que
      // va dentro de un chip oscuro redondeado (como se ve en la web) para que se
      // lea bien. Se usa la versión HD para que imprima nítido.
      const ylW=24, ylH=8.4;
      const ylX=lX, ylY=lY+fH2+2.5;
      const chPad=1.4;
      doc.setFillColor(10,22,40); // #0A1628 (fondo azul oscuro de la marca)
      if(doc.roundedRect)doc.roundedRect(ylX-chPad,ylY-chPad,ylW+2*chPad,ylH+2*chPad,1.2,1.2,'F');
      else doc.rect(ylX-chPad,ylY-chPad,ylW+2*chPad,ylH+2*chPad,'F');
      if(yourliftImg){try{doc.addImage(yourliftImg,'PNG',ylX,ylY,ylW,ylH);}catch(e){
        doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(255,255,255);
        doc.text('YourLift',ylX+ylW/2,ylY+ylH/2+1.5,{align:'center'});
      }}else{
        doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(255,255,255);
        doc.text('YourLift',ylX+ylW/2,ylY+ylH/2+1.5,{align:'center'});
      }

      // ── Discipline checkboxes (centro) ────────────────────
      const logoZoneW=Math.max(fW2,ylW)+7;
      const cbX=ox+pad+logoZoneW;
      const discs=[{l:'Sentadilla',dy:0},{l:'Press de Banca',dy:7},{l:'Peso Muerto',dy:14}];
      discs.forEach(d=>{
        const bY=oy+13.5+d.dy;
        doc.setDrawColor(0,0,0);doc.setLineWidth(0.5);
        doc.rect(cbX,bY,5,5,'S');
        doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(0,0,0);
        doc.text(d.l,cbX+7,bY+4);
      });

      // ── Lot number box (derecha, sin relleno) ─────────────
      const lotW=20,lotH=16;
      const lotX=ox+cardW-pad-lotW,lotY=oy+13;
      doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(0,0,0);
      doc.text('N° Lote',lotX+lotW/2,oy+12,{align:'center'});
      doc.setDrawColor(0,0,0);doc.setLineWidth(0.7);
      doc.rect(lotX,lotY,lotW,lotH,'S');

      // ── Divider ───────────────────────────────────────────
      const divY=oy+33;
      doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);
      doc.line(ox+pad,divY,ox+cardW-pad,divY);

      // ── Attempt boxes ─────────────────────────────────────
      const boxes=[{l:'1'},{l:'2'},{l:'3'},{l:'3-1'},{l:'3-2'}];
      const bY=divY+2,bH=13;
      const totalBW=cardW-2*pad;
      const bW=(totalBW-4*1.5)/5;
      boxes.forEach((b,i)=>{
        const bX=ox+pad+i*(bW+1.5);
        doc.setDrawColor(0,0,0);doc.setLineWidth(0.5);
        doc.rect(bX,bY,bW,bH,'S');
        doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(80,80,80);
        doc.text(b.l,bX+bW/2,bY+bH+3.5,{align:'center'});
      });

      // ── Divider ───────────────────────────────────────────
      const div2Y=bY+bH+5.5;
      doc.setDrawColor(200,200,200);doc.setLineWidth(0.2);
      doc.line(ox+pad,div2Y,ox+cardW-pad,div2Y);

      // ── Cat. de Peso | Firma (solo líneas, sin relleno) ───
      const botY=div2Y+5;
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(0,0,0);
      doc.text('Cat. de Peso',ox+pad,botY);
      const cpW=doc.getTextWidth('Cat. de Peso');
      doc.setDrawColor(0,0,0);doc.setLineWidth(0.3);
      doc.line(ox+pad+cpW+1.5,botY+0.5,ox+cardW/2-3,botY+0.5);
      const firmaX=ox+cardW/2+1;
      doc.setFont('helvetica','bold');doc.setFontSize(7);
      doc.text('Firma',firmaX,botY);
      const firmW=doc.getTextWidth('Firma');
      doc.line(firmaX+firmW+1.5,botY+0.5,ox+cardW-pad,botY+0.5);
    };

    // ── Render cards (una por atleta, todas en blanco) ────
    const total_cards=athletes.length||1;
    for(let ai=0;ai<total_cards;ai++){
      const pos=ai%(COLS*ROWS);
      if(pos===0&&ai>0)doc.addPage();
      const col=pos%COLS;
      const row=Math.floor(pos/COLS);
      const ox=mX+col*(cardW+gX);
      const oy=mY+row*(cardH+gY);
      drawCard(ox,oy);
    }

    // ── Cut lines (dashed) on every page ─────────────────
    const totalPg=doc.internal.getNumberOfPages();
    for(let p=1;p<=totalPg;p++){
      doc.setPage(p);
      doc.setDrawColor(180,180,180);doc.setLineWidth(0.15);
      doc.setLineDashPattern([1.5,2],0);
      // vertical cut between columns
      const cutX=mX+cardW+gX/2;

      for(let r=1;r<ROWS;r++){

      }
      doc.setLineDashPattern([],0);
    }

    const evShort=strip(DATA.event?.short||DATA.event?.name||'campeonato').replace(/\s+/g,'_');
    doc.save('Papeletas_'+evShort+'.pdf');
  }catch(err){
    console.error('Papeletas error',err);
    alert('Error al generar papeletas: '+err.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Papeletas de Intentos PDF';}
  }
}

// ═══════════════════════════════════════════════════════════
// ACTA PDF — jsPDF + autoTable (lazy loaded)
// ═══════════════════════════════════════════════════════════
// Helper: limpia el texto para jsPDF (que solo soporta ASCII / WinAnsi).
// 1) Quita tildes/acentos por NFD
// 2) Reemplaza símbolos especiales (♀ ♂ — •) por equivalentes ASCII
// 3) Filtra cualquier char fuera de ASCII básico que pueda quedar
function _stripAccentsForPdf(s){
  if(!s)return '';
  let out = String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');  // quita combining marks
  // Reemplazos de símbolos comunes que rompen jsPDF
  const map = {
    '♀':'F', '♂':'M',
    '—':'-', '–':'-', '−':'-',
    '•':'*', '·':'-',
    '“':'"', '”':'"', '‘':"'", '’':"'",
    '…':'...',
    '°':'',
    '✓':'OK', '✗':'X',
    '🥇':'1', '🥈':'2', '🥉':'3',
    '🏋️':'', '⚙️':'', '💪':'', '🏆':'',
    ' ':' '  // non-breaking space → space normal
  };
  out = out.replace(/[♀♂——−•·“”‘’…°✓✗🥇🥈🥉🏋️⚙️💪🏆 ]/gu, c => map[c]||'');
  // Última pasada: cualquier char fuera de ASCII básico (>127) → reemplazar por '?'
  // Esto cubre emojis y símbolos no contemplados arriba
  out = out.replace(/[^\x20-\x7E\n\r\t]/g, '');
  return out;
}

// ACTA FESUPO — PDF de fondo blanco + Excel, como los que publica la
// Federación Sudamericana. Agrupa por modalidad → sexo → categoría, ordena por
// lugar y RESALTA EN AMARILLO todo intento (y el total) que sea récord
// sudamericano, igual que en las planillas oficiales.
// Los intentos nulos van con el peso en negativo, que es como se leen las actas
// de la IPF.
// ══════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
// ESCRITOR DE .xlsx PROPIO
// La versión libre de SheetJS guarda los datos pero TIRA A LA BASURA el formato:
// negritas, tachados y colores no llegan al archivo (se puede comprobar abriendo
// el .xlsx: styles.xml sale con una sola fuente). El acta los necesita, así que
// el archivo se arma acá. Un .xlsx es un ZIP con cuatro XML; se guarda sin
// comprimir (método "stored"), así no hace falta ninguna librería y se abre
// igual en Excel, LibreOffice y Google Sheets.
//
// Estilos disponibles (el número va en cada celda):
//   0 normal · 1 negrita · 2 nulo (gris + tachado) · 3 récord (amarillo, negrita)
//   4 encabezado (negrita, fondo gris) · 5 título de grupo (negrita, más grande)

const XL_NORMAL=0, XL_BOLD=1, XL_NULO=2, XL_REC=3, XL_HEAD=4, XL_TITULO=5;
function _crc32(buf){
  let c, tabla=_crc32._t;
  if(!tabla){
    tabla=_crc32._t=new Int32Array(256);
    for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); tabla[n]=c; }
  }
  let crc=-1;
  for(let i=0;i<buf.length;i++) crc=(crc>>>8)^tabla[(crc^buf[i])&0xFF];
  return (crc^-1)>>>0;
}
// ZIP sin compresión: cabecera local + datos por archivo, y el directorio central.
function _zipStore(files){
  const enc=new TextEncoder(), partes=[], dir=[];
  let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const nombre=enc.encode(f.name), data=(typeof f.data==='string')?enc.encode(f.data):f.data;
    const crc=_crc32(data);
    const local=[].concat([80,75,3,4],u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nombre.length),u16(0));
    partes.push(new Uint8Array(local),nombre,data);
    dir.push({nombre,crc,len:data.length,off});
    off+=local.length+nombre.length+data.length;
  });
  const centro=[];
  let clen=0;
  dir.forEach(d=>{
    const h=[].concat([80,75,1,2],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(d.crc),u32(d.len),u32(d.len),
      u16(d.nombre.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(d.off));
    centro.push(new Uint8Array(h),d.nombre);
    clen+=h.length+d.nombre.length;
  });
  const fin=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(dir.length),u16(dir.length),u32(clen),u32(off),u16(0)));
  const todo=partes.concat(centro,[fin]);
  const total=todo.reduce((n,p)=>n+p.length,0);
  const out=new Uint8Array(total);
  let i=0; todo.forEach(p=>{out.set(p,i);i+=p.length;});
  return out;
}

function _actaModKey(a){
  const m=String(a.mod||'');
  if(m==='invitado')return 'invitado';   // cuadro aparte, fuera de competencia
  if(m==='oe_classic'||m==='oe_bench')return 'oe';
  // Combinado (PL + Only Bench): su tabla base es la de powerlifting; la de Only
  // Bench se le agrega aparte en _actaGrupos().
  if(_isPlusBench(a))return m==='equipped_bench'?'equipped':'classic';
  if(m==='onlybench'||m==='classic_bench')return 'ob_classic';
  if(m==='equipped_bench')return 'ob_equipped';
  if(m==='equipped')return 'equipped';
  return 'classic';
}
const _ACTA_MOD_N={classic:'POWERLIFTING CLASSIC',equipped:'POWERLIFTING EQUIPADO',
  ob_classic:'ONLY BENCH CLASSIC',ob_equipped:'ONLY BENCH EQUIPADO',oe:'SPECIAL OLYMPICS',
  invitado:'INVITADOS/AS · FUERA DE COMPETENCIA'};
function _actaCatN(c){const s=String(c||'');const n=parseFloat(s.replace(/[^0-9.]/g,''))||999;return n+(s.indexOf('+')>=0?0.5:0);}
// Estructura del acta: [{mod, sexo, cat, filas:[…]}] ya ordenada y con lugares.
const _ACTA_DIVORD={'Sub-Junior':0,'Subjunior':0,'Junior':1,'Universitario':2,'Open':3,
  'Master I':4,'Master II':5,'Master III':6,'Master IV':7,'Special Olympics':8};
// El acta se arma como la de la IPF: una tabla por MODALIDAD + SEXO + DIVISIÓN +
// CATEGORÍA (ej. "Open -63 kg"), y adentro los atletas ordenados de mayor a menor
// por total. Antes se agrupaba solo por categoría y quedaban Open, Junior y Master
// mezclados en la misma tabla.
function _actaGrupos(){
  const g=new Map();
  DATA.athletes.filter(a=>!a.__is4).forEach(a=>{
    // El que compite en PL y en Only Bench sale DOS VECES en el acta: una en la
    // tabla de powerlifting con su total y otra en la de Only Bench con su banca.
    // Es la misma banca en los dos lados — subió a tarima una sola vez.
    const claves=[_actaModKey(a)];
    if(_isPlusBench(a))claves.push(String(a.mod)==='equipped_bench'?'ob_equipped':'ob_classic');
    claves.forEach(mk=>{
      const k=[mk,_srSexo(a),_normDiv(a.div||''),_srCat(a)].join('|');
      if(!g.has(k))g.set(k,[]);
      g.get(k).push(a);
    });
  });
  const out=[];
  g.forEach((arr,k)=>{
    const [mod,sexo,div,cat]=k.split('|');
    const view=(mod.indexOf('ob_')===0)?'bench':'meet';
    const filas=arr.map(a=>{
      const t=totalOf(a,view);
      return {a,total:t,gl:calcGL(t,a.bw,a.sex,_glMod(a),view),view};
    // A igual total gana el más liviano (criterio IPF).
    }).sort((x,y)=>(y.total-x.total)||(x.a.bw-y.a.bw));
    let lugar=0;
    filas.forEach(f=>{ f.lugar=f.total>0?++lugar:0; });
    // Puesto de cada atleta EN CADA MOVIMIENTO dentro de su grupo: es el [n] que
    // va al lado de la mejor marca. Sirve para premiar mejor sentadilla, mejor
    // banca y mejor peso muerto, como en las actas de la IPF.
    const lifts=(view==='bench')?['bp']:['sq','bp','dl'];
    const puesto={};
    lifts.forEach(l=>{
      puesto[l]={};
      filas.map(f=>({id:f.a.id,best:bestOf(f.a,l),bw:f.a.bw})).filter(x=>x.best>0)
        .sort((x,y)=>(y.best-x.best)||(x.bw-y.bw))
        .forEach((x,i)=>{puesto[l][x.id]=i+1;});
    });
    out.push({mod,sexo,div,cat,view,filas,puesto,lifts});
  });
  return out.sort((x,y)=>
    (x.mod===y.mod?0:x.mod<y.mod?-1:1)
    ||(x.sexo===y.sexo?0:x.sexo==='F'?-1:1)
    ||_actaCatN(x.cat)-_actaCatN(y.cat)
    ||((_ACTA_DIVORD[x.div]===undefined?9:_ACTA_DIVORD[x.div])-(_ACTA_DIVORD[y.div]===undefined?9:_ACTA_DIVORD[y.div])));
}
// Título de una tabla: "POWERLIFTING CLASSIC · DAMAS · Open -63 kg"
function _actaTitulo(gr){
  return _ACTA_MOD_N[gr.mod]+'  ·  '+(gr.sexo==='F'?'DAMAS':'CABALLEROS')+'  ·  '+(gr.div||'')+' '+gr.cat+' kg';
}
// Celdas de intentos de un atleta: [{txt, rec}] — rec = fue récord sudamericano
// Intentos de un atleta para el acta. Cada casilla dice el peso y CÓMO se lee:
// válido → en negrita; nulo → gris y tachado (igual que las actas de FESUPO);
// récord → resaltado en amarillo.
function _actaAtts(a,l){
  const out=[];
  const cel=at=>{
    if(!at||!at.w)return {w:'',ok:false,nulo:false,rec:false};
    const ok=at.r==='g';
    return {w:at.w, ok, nulo:at.r==='n', rec:ok&&_srRompe(a,l,at.w).length>0};
  };
  for(let j=0;j<3;j++)out.push(cel((a.att[l]||[])[j]));
  // 4º intento / intento extra: va como una columna más solo si alguien lo tiene
  out.push(Object.assign(cel((a.att[l]||[])[3]),{extra:true}));
  return out;
}
function _actaNombreArchivo(ext){
  const ev=_stripAccentsForPdf(DATA.event?.short||DATA.event?.name||'competencia').replace(/[^A-Za-z0-9]+/g,'_');
  return 'Acta_'+ev+'_'+new Date().toISOString().slice(0,10)+'.'+ext;
}

          {text:a.name||'',color:C.white,bold:pos<=3},

        PW/2,curY+8,{align:'center'});
      curY+=14;
      overalls.forEach(renderOverall);
    }

    // (Sin rankings de clubes ni universidades en el acta)

    // ── Footer on all pages ──────────────────────────────
    const totalPages=doc.internal.getNumberOfPages();
    for(let i=1;i<=totalPages;i++){
      doc.setPage(i);
      doc.setFillColor(...C.bg);

      doc.text('Pag. '+i+'/'+totalPages,PW-8,PH-3,{align:'right'});

    // ── Save ─────────────────────────────────────────────
    // El acta cubre TODO el campeonato, no la tanda que se esté mirando: el nombre
    // del archivo decía "VueloA" y confundía.
    doc.save(_actaNombreArchivo('pdf').replace(/^Acta_/,'Acta_YourLift_'));

// Exporta los resultados en el formato que usa data.json (competencias por atleta).
// El JSON descargado se puede mergear directo a data.json para que aparezca
// en los perfiles públicos de cada atleta (atleta.html).
// ═══════════════════════════════════════════════════════════════
// CERRAR COMPETENCIA — sube todos los resultados a Firestore.
// Los atletas los ven en sus perfiles y aparecen en el ranking
// global sin necesidad de re-deployar.
// ═══════════════════════════════════════════════════════════════
async function cerrarCompetenciaConfirm(){
  const evName = DATA.event?.name || '';
  const evId   = DATA.event?.id || (window.LIVE_EVENTS ? Object.keys(window.LIVE_EVENTS).find(k=>window.LIVE_EVENTS[k]===evName) : '') || evName.replace(/[^a-zA-Z0-9]+/g,'_').toLowerCase();
  if(!evName){ alert('No hay evento cargado.'); return; }
  const ath = DATA.athletes || [];
  const counts = {meet:0, bench:0, dq:0};
  ath.forEach(a=>{
    if(isMeetClassic(a)||isMeetEquipped(a)){
      if(isDQ(a)) counts.dq++;
      else if(totalOf(a,'meet')>0) counts.meet++;
    }
    if(inBenchRanking(a) && bestOf(a,'bp')>0) counts.bench++;
  });
  const msg = `CERRAR COMPETENCIA\n\nEvento: ${evName}\n\nSe publicarán los resultados en Firestore:\n  • ${counts.meet} con total válido\n  • ${counts.dq} marcados como DQ\n  • ${counts.bench} en ranking Only Bench\n\nApareceran inmediatamente en los perfiles de cada atleta y en el ranking general.\n\n¿Confirmar?`;
  if(!confirm(msg)) return;
  await cerrarCompetencia(evId, evName);
}

async function cerrarCompetencia(evId, evName){
  const fb = window._fb;
  if(!fb || !fbDB){ alert('Firebase no está listo. Volvé a intentar en 5s.'); return; }
  const today = new Date().toISOString().slice(0,10);
  const ath = DATA.athletes || [];

  // Toast de progreso
  showToastLC('Publicando resultados...');
  let written = 0;
  let errors = 0;

  for(const a of ath){
    // Generar entradas por vista (meet/bench si compite en combinada)
    const views = [];
    if(isMeetClassic(a)||isMeetEquipped(a)||isOEClassic(a)) views.push('meet');
    if(inBenchRanking(a) && bestOf(a,'bp')>0) views.push('bench');

    for(const view of views){
      const dq = view==='meet' && isDQ(a);
      const t = totalOf(a, view);
      // Saltar si no hay total ni DQ ni intentos
      if(t<=0 && !dq) continue;
      const gl = dq ? 0 : calcGL(t, a.bw, a.sex, _glMod(a), view);
      const isEq = isMeetEquipped(a);
      const isOE = isOEClassic(a);
      let modLabel;
      if(isOE) modLabel = 'Powerlifting Classic Special Olympics';
      else if(view==='bench') modLabel = isEq ? 'Only Bench Equipado' : 'Only Bench Classic';
      else modLabel = isEq ? 'Powerlifting Equipado' : 'Powerlifting Classic';

      // Doc ID determinístico: {eventoId}_{codigo o rut}_{view}
      const codeKey = (a.codigo || a.rut || a.id || 'unknown').toString().replace(/[^a-zA-Z0-9_-]/g,'_');
      const docId = `${evId}_${codeKey}_${view}`;

      const payload = {
        evento: evName,
        evento_id: evId,
        fecha: today,
        codigo: a.codigo || '',
        rut: a.rut || '',
        nombre: a.name || '',
        club: a.club || '',
        sexo: a.sex || '',
        division: a.div || '',
        categoria: a.cat || '',
        modalidad: modLabel,
        view: view,
        resultado: {
          bw: a.bw || 0,
          sq: view==='bench' ? 0 : bestOf(a,'sq'),
          bp: bestOf(a,'bp'),
          dl: view==='bench' ? 0 : bestOf(a,'dl'),
          total: dq ? 0 : t,
          glp: dq ? 0 : gl,
          status: dq ? 'DQ' : 'OK'
        },
        published_at: fb.serverTimestamp(),
        source: 'yourlift_livecast'
      };
      try{
        await fb.setDoc(fb.doc(fbDB, 'competition_results', docId), payload);
        written++;
      } catch(e){
        console.error('[cerrar] error:', a.name, view, e);
        errors++;
      }
    }
  }

  if(errors===0){
    showToastLC(`Competencia cerrada: ${written} resultados publicados`);
    alert(`Competencia "${evName}" cerrada.\n\n${written} resultados publicados.\n\nYa son visibles en yourlift.cl/atleta y en el ranking.`);
  } else {
    showToastLC(`Publicados ${written}, errores ${errors}`);
    alert(`Se publicaron ${written} resultados.\n${errors} fallaron — revisá la consola (F12).`);
  }
}

function exportCompetenciasParaPerfiles(){
  const evName=DATA.event?.name||'Campeonato sin nombre';
  const today=new Date().toISOString().slice(0,10);
  // Incluimos también atletas DQ (3 fallos en algún lift) y los que tienen
  // al menos un intento registrado (aunque su total sea 0).
  const flightAth=DATA.athletes.filter(a=>{
    if(a.bombed && totalOf(a)<=0 && bestOf(a,'bp')<=0)return false;
    // Incluir si tiene al menos un peso registrado o intento marcado
    const hasAnyAttempt=['sq','bp','dl'].some(l=>(a.att?.[l]||[]).some(at=>at.w>0||at.r));
    return hasAnyAttempt;
  });
  const out=[];
  flightAth.forEach(a=>{
    // Para cada vista en la que participa, generar una entrada de competencia
    const views=[];
    if(isMeetClassic(a)||isMeetEquipped(a))views.push('meet');
    if(inBenchRanking(a))views.push('bench');
    views.forEach(view=>{
      const dq=view==='meet'&&isDQ(a);
      const t=totalOf(a,view);
      // Excluir solo si NO hay total Y NO está DQ (i.e. no compitió ese movimiento)
      if(t<=0 && !dq)return;
      const gl=dq?0:calcGL(t,a.bw,a.sex,_glMod(a),view);
      const isEq=isMeetEquipped(a);
      let modLabel;
      if(view==='bench')modLabel=isEq?'Only Bench Equipado':'Only Bench Classic';
      else modLabel=isEq?'Powerlifting Equipado':'Powerlifting Classic';
      const entry={
        rut:a.rut||'',
        nombre:a.name||'',
        evento:evName,
        fecha:today,
        sexo:a.sex||'',
        division:a.div||'',
        categoria:a.cat||'',
        modalidad:modLabel,
        club:a.club||'',
        resultado:{
          bw:a.bw||0,
          sq:view==='bench'?0:bestOf(a,'sq'),
          bp:bestOf(a,'bp'),
          dl:view==='bench'?0:bestOf(a,'dl'),
          total:dq?0:t,
          glp:dq?0:gl,
          status:dq?'DQ':'OK'
        },
        source:'yourlift_livecast'
      };
      out.push(entry);
    });
  });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);
  const l=document.createElement('a');
  const evShort=(DATA.event?.short||evName).replace(/[^a-zA-Z0-9]+/g,'_');
  l.href=u;l.download='competencias_'+evShort+'_'+today+'.json';l.click();
  alert('Exportadas '+out.length+' competencias listas para mergear a data.json');
}

function txLookupFull(a){
  if(!a||!DB_FULL?.length)return null;
  const r=(a.rut||'').replace(/[.\s]/g,'');
  if(r)return DB_FULL.find(x=>(x.rut||'').replace(/[.\s]/g,'')===r)||null;
  const nrm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const n=nrm(a.name);
  return DB_FULL.find(x=>nrm(x.nombre)===n)||null;
}
function txAge(dob){
  if(!dob)return null;
  let y,m,d;
  if(/^\d{4}-\d{2}-\d{2}/.test(dob)){[y,m,d]=dob.slice(0,10).split('-').map(Number)}
  else if(/^\d{2}\/\d{2}\/\d{4}/.test(dob)){const p=dob.split('/');d=+p[0];m=+p[1];y=+p[2]}
  else return null;
  const now=new Date();let age=now.getFullYear()-y;
  if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d))age--;
  return age>0&&age<100?age:null;
}
function txYearsCompeting(full){
  if(!full?.competencias?.length)return null;
  const years=full.competencias.map(c=>{
    const f=c.fecha||c.evento||'';
    const m=f.match(/20\d{2}/);return m?+m[0]:null;
  }).filter(Boolean);
  if(!years.length&&full.debut){const m=(full.debut+'').match(/20\d{2}/);if(m)years.push(+m[0])}
  if(!years.length)return null;
  const min=Math.min(...years);const cur=new Date().getFullYear();
  return Math.max(1,cur-min+1);
}
function txPB(full,lift){
  if(!full?.competencias?.length)return null;
  const key=lift==='sq'?'sq':lift==='bp'?'bp':lift==='dl'?'dl':'total';
  let best=0;
  full.competencias.forEach(c=>{const v=+(c.resultado?.[key]||0);if(v>best)best=v});
  return best||null;
}
function txDivShort(div){return(div||'').replace('Sub Junior','SJR').replace('Sub-Junior','SJR').replace('Subjunior','SJR').replace('Junior','JR').replace('Open','OPN').replace('Master I','M1').replace('Master II','M2').replace('Master III','M3').replace('Master IV','M4')}
function txCatNum(cat){const m=(cat||'').match(/([+\-]?\d+\.?\d*)/);return m?m[1]:''}
// Etiqueta de categoría con el signo CORRECTO: '-120kg' para el límite, '+120kg'
// para superpesados (acepta '+120 kg', '120+ kg' o '-120 kg' como entrada).
function txCatLabel(cat){const n=_normCat(cat);if(!n||!/\d/.test(n))return '';return n.endsWith('+')?('+'+n.slice(0,-1)+'kg'):('-'+n+'kg');}

let _txLastLifter=null;
function renderTxWidget(){
  if(!TX_MODE)return false;
  const c=document.getElementById('txWidget');if(!c)return true;
  // Widgets que NO dependen de DATA.athletes
  if(TX_MODE==='timer'){c.innerHTML=renderTxTimer();return true}
  if(TX_MODE==='lights'){c.innerHTML=renderTxLights();return true}
  // Director: no necesita athletes — funciona solo con _txDirState (no requiere Firestore)
  if(TX_MODE==='director'){renderTxDirector(c);return true}
  // Boot gate: el resto de widgets necesitan que llegue el snapshot de Firestore.
  // Hasta entonces, transparente — evita el "pestañeo" (render vacío → render con datos).
  if(!DATA.athletes||DATA.athletes.length===0){c.innerHTML='';return true}
  // Widgets que NO dependen del lifter actual (pero sí de athletes)
  if(TX_MODE==='slam'){c.innerHTML=renderTxSlam();return true}
  if(TX_MODE==='lbauto'){c.innerHTML=renderTxLbAuto();return true}
  if(TX_MODE==='ceremony'){renderTxCeremony(c);return true}
  if(TX_MODE==='jornada'){c.innerHTML=renderTxJornada();return true}
  if(TX_MODE==='screen'){renderTxScreen(c);return true}
  // Widgets que dependen del lifter actual
  const cur=liftQueue()[0];
  if(!cur&&TX_MODE!=='leaderboard'&&TX_MODE!=='tablaactual'){
    c.innerHTML='';
    return true;
  }
  const lifterChanged=(cur?.id||null)!==_txLastLifter;
  _txLastLifter=cur?.id||null;
  let html='';
  if(TX_MODE==='profile')html=renderTxProfile(cur);
  else if(TX_MODE==='scoreboard')html=renderTxScoreboard(cur,lifterChanged);
  else if(TX_MODE==='leaderboard')html=renderTxLeaderboard(cur,lifterChanged);
  else if(TX_MODE==='barbell')html=renderTxBarbell(cur,lifterChanged);
  else if(TX_MODE==='tablaactual'){
    const inner=renderTxTablaActual(cur);
    // En modo standalone, animar el slide-in cada vez que cambia el lifter
    const anim=lifterChanged?'animation:txSlideInBottom .75s cubic-bezier(.2,.85,.3,1.05) both':'';
    html=anim?'<div style="'+anim+'">'+inner+'</div>':inner;
  }
  else html='<div style="color:#fff;padding:40px;font-family:Oswald">Widget desconocido: '+TX_MODE+'. Valores: profile | scoreboard | leaderboard | lbauto | slam | timer | lights | barbell | tablaactual</div>';
  c.innerHTML=html;
  // Setup GIF trim loop after DOM insertion
  const _gifVid=c.querySelector('video[data-gif-trim]');
  if(_gifVid){
    const _gs=parseFloat(_gifVid.dataset.gifStart)||0;
    const _ge=_gifVid.dataset.gifEnd!==''?parseFloat(_gifVid.dataset.gifEnd):Infinity;
    _gifVid.currentTime=_gs;
    _gifVid.ontimeupdate=function(){if(this.currentTime>=_ge)this.currentTime=_gs;};
  }
  return true;
}

function renderTxLbAuto(){

// ─── CEREMONY (widget orquestador todo-en-uno) ─────────────────
// Flujo:
//   1) Detecta nuevo levantador → PROFILE fullscreen (profileMs)
//   2) → SCOREBOARD bottom-left + TIMER top-right (scoreboardMs)
//      • SLAM top-left por slamMs cuando llega resultado (no cambia de estado)
//   3) → IDLE (transparente) hasta el próximo levantador
//
// PARA MODIFICAR LOS TIEMPOS, edita la línea de abajo (en milisegundos):
//    profileMs:     duración del perfil fullscreen
//    scoreboardMs:  duración del scoreboard bottom-left ← acá lo subís
//    slamMs:        duración del flash GOOD/NO LIFT en la esquina
const TX_CEREMONY={profileMs:5000,scoreboardMs:30000,slamMs:2000,recordMs:7000};
let _txCerState='idle';            // idle | profile | scoreboard
let _txCerStateAt=0;
let _txCerLastLifter=null;
let _txCerSeenResults=null;
let _txCerSlamUntil=0;
let _txCerSlamType=null;
let _txCerRecordUntil=0;
let _txCerRecordData=null;
let _txCerRecordUnsub=null;
let _txCerRecordSeenTs=0;
let _txCerLastSig=null;            // signature p/ saltarse re-renders innecesarios
function _txCerStartRecordListener(){
  if(_txCerRecordUnsub||!fbReady||!window._fb)return;
  try{
    _txCerRecordUnsub=window._fb.onSnapshot(window._fb.doc(fbDB,'livecast_record',evStateDocId('current')),(snap)=>{
      if(!snap.exists())return;
      const d=snap.data();if(!d||!d.ts)return;
      if(d.ts===_txCerRecordSeenTs)return;
      _txCerRecordSeenTs=d.ts;
      _txCerRecordUntil=Date.now()+TX_CEREMONY.recordMs;
      _txCerRecordData=d;
      _txCerLastSig=null;
      if(typeof renderTxWidget==='function')renderTxWidget();
      setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},TX_CEREMONY.recordMs+200);
    });
  }catch(e){console.warn('[TX] record listener',e)}
}
function _txCerSetState(s){
  _txCerStateAt=Date.now();_txCerState=s;
  const opaque=(s==='profile');
  document.body.classList.toggle('tx-opaque',opaque);
  _txCerLastSig=null; // forzar re-render al cambiar de estado
}
function _txCerUpdateTimer(){
  const tm=document.getElementById('cerTimer');
  if(!tm)return;
  const t=Math.max(0,DATA.timer||0);
  tm.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  tm.style.color=DATA.timerOn&&t<=10?'#ef4444':DATA.timerOn&&t<=30?'#f59e0b':'#fff';
}
function renderTxCeremony(container){
  const c=container||document.getElementById('txWidget');
  if(!c)return;
  _txCerStartRecordListener();
  const cur=liftQueue()[0];

  // ── Detectar nuevo levantador → PROFILE ───────────────────
  if(cur && cur.id!==_txCerLastLifter){
    _txCerLastLifter=cur.id;
    _txCerSetState('profile');
    setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},TX_CEREMONY.profileMs+200);
  }

  // ── Detectar resultado nuevo (transición null → g/n) → SLAM corner ─
  if(_txCerSeenResults===null){
    _txCerSeenResults={};
    DATA.athletes.forEach(a=>LIFTS.forEach(l=>(a.att&&a.att[l]||[]).forEach((att,i)=>{_txCerSeenResults[a.id+'-'+l+'-'+i]=att.r||null;})));
  } else {
    DATA.athletes.forEach(a=>LIFTS.forEach(l=>(a.att&&a.att[l]||[]).forEach((att,i)=>{
      const k=a.id+'-'+l+'-'+i;
      const prev=_txCerSeenResults[k];
      const now=att.r||null;
      if((prev==null)&&(now==='g'||now==='n')){
        _txCerSlamUntil=Date.now()+TX_CEREMONY.slamMs;
        _txCerSlamType=now;
        setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},TX_CEREMONY.slamMs+100);
      }
      _txCerSeenResults[k]=now;
    })));
  }

  // ── Transiciones por tiempo ───────────────────────────────
  const elapsed=Date.now()-_txCerStateAt;
  if(_txCerState==='profile'&&elapsed>TX_CEREMONY.profileMs){
    _txCerSetState('scoreboard');
    setTimeout(()=>{if(typeof renderTxWidget==='function')renderTxWidget()},TX_CEREMONY.scoreboardMs+200);
  } else if(_txCerState==='scoreboard'&&elapsed>TX_CEREMONY.scoreboardMs){
    _txCerSetState('idle');
  }

  // ── Signature para evitar re-render por timer (anti-flicker) ─
  // El timer se actualiza in-place via #cerTimer, NO disparar re-render por DATA.timer.
  const slamActive=Date.now()<_txCerSlamUntil;
  const recordActive=Date.now()<_txCerRecordUntil&&_txCerRecordData;
  const sig=_txCerState+'|'+(cur?cur.id+'|'+cur.cat+'|'+(cur.att?.[DATA.lift]||[]).map(a=>a.w+'-'+(a.r||'')).join(','):'')
    +'|'+DATA.lift+'|'+DATA.round+'|'+DATA.flight
    +'|'+(slamActive?_txCerSlamType+'-'+_txCerSlamUntil:'_')
    +'|'+(recordActive?'rec-'+_txCerRecordUntil:'_');
  if(sig===_txCerLastSig){
    _txCerUpdateTimer(); // solo actualizar el timer si no cambió nada estructural
    return;
  }
  _txCerLastSig=sig;

  // ── Build HTML según estado ───────────────────────────────
  let html='';
  if(_txCerState==='profile'&&cur){
    html+='<div style="position:fixed;inset:0">'+renderTxProfile(cur)+'</div>';
  } else if(_txCerState==='scoreboard'&&cur){
    html+=_renderTxCerScoreboardBL(cur);
    html+=_renderTxCerTimerCorner();
  }
  // SLAM top-left (overlay encima de todo)
  if(slamActive&&_txCerSlamType){
    html+=_renderTxCerSlamCorner(_txCerSlamType);
  }
  // RECORD NACIONAL badge — top-left, gira mientras dura
  if(recordActive){
    html+=_renderTxCerRecordBadge(_txCerRecordData);
  }
  c.innerHTML=html;
  _txCerUpdateTimer();
}

// rows: 0=header, 1=name, 2=attempts
// Nombre del atleta como se escribe de verdad: "Lucas Andres Montecinos Alarcon".
// Antes el apellido salía en MAYÚSCULAS y quedaba más marcado que el nombre; se pidió
// todo del mismo tamaño y solo la inicial en mayúscula. Las partículas ("de", "la",
// "del", "van") van en minúscula, salvo que abran el nombre, y los apellidos con
// guion o apóstrofo llevan mayúscula en cada parte.
function _nombrePropio(s){
  const chicas=new Set(['de','del','la','las','los','y','da','das','do','dos','van','von','di','della','du','el']);
  return String(s||'').trim().toLowerCase().split(/\s+/).map((p,i)=>{
    if(i>0&&chicas.has(p))return p;
    return p.replace(/(^|[-'\u2019])(\p{Ll})/gu,(m,a,b)=>a+b.toUpperCase());
  }).join(' ');
}

// ─── DIRECTOR direct OBS WS (widget independiente) ─────────────
// Cuando el widget se abre con ?tx=director, escucha eventos de OBS de dos formas:
// 1. obsCustomEvent (API nativa de OBS Browser Source) — sin WebSocket, sin mixed-content.
//    BroadcastCustomEvent → OBS inyecta 'obsCustomEvent' en todos los browser sources.
// 2. WebSocket directo (fallback para pruebas en browser normal con ?obsWs=host:port).
let _widgetObsWs=null;
let _widgetObsNativeListening=false;
function _widgetStartDirectObsListener(){
  if(TX_MODE!=='director')return;
  // Método 1: API nativa OBS (funciona siempre dentro de OBS Browser Source)
  if(!_widgetObsNativeListening){
    _widgetObsNativeListening=true;
    window.addEventListener('obsCustomEvent',e=>{
      _widgetHandleDirectObsEvent(e.detail);
    });
    console.log('[Widget] obsCustomEvent listener activo');
  }
  // Método 2: WebSocket directo (solo si se pasa ?obsWs= y aún no conectado)
  if(_widgetObsWs)return;
  if(!window.OBSWebSocket)return;
  const obsWsParam=TX_URL.get('obsWs');
  if(!obsWsParam)return;
  const obsPwd=TX_URL.get('obsPwd')||'';
  const url='ws://'+obsWsParam;
  _widgetObsWs=new window.OBSWebSocket();
  _widgetObsWs.connect(url,obsPwd).then(()=>{
    console.log('[Widget] OBS WS connected directly:',url);
  }).catch(e=>{
    console.warn('[Widget] OBS WS fallback failed (normal en OBS Browser Source):',e.message||e);
    _widgetObsWs=null;
  });
  _widgetObsWs.on('CustomEvent',d=>{
    _widgetHandleDirectObsEvent(d);
  });
  _widgetObsWs.on('ConnectionClosed',()=>{
    _widgetObsWs=null;
    setTimeout(_widgetStartDirectObsListener,5000);
  });
}
function _widgetHandleDirectObsEvent(d){
  if(!d)return;
  if(!_txDirState)_txDirState={...TX_DIR_DEFAULT};
  const action=d.action;
  // Sync de datos de competencia desde el admin panel (no necesita Firestore)
  if(action==='competitionSync'){
    if(d.lift)DATA.lift=d.lift;
    if(typeof d.round==='number')DATA.round=d.round;
    if(d.flight)DATA.flight=d.flight;
    if(Array.isArray(d.athletes)&&d.athletes.length)DATA.athletes=_normExtraAtts(d.athletes);
    if(d.event)DATA.event=d.event;
    // No forzar re-render si hay un barrido activo — evita que se reinicie la animación
    const fsAnimRunning=Object.values(_txDirAnims).some(a=>a&&Date.now()-a.startedAt<(a.dur||TX_ANIM_MS.fullscreen));
    const fsShowing=_txDirState&&(_txDirActive('profile')||_txDirActive('leaderboard')||_txDirActive('breakTimer'));
    if(!fsAnimRunning&&!fsShowing){_txDirLastSig=null;if(typeof renderTxWidget==='function')renderTxWidget();}
    return;
  }
  const mark=()=>{ _txDirLastSig=null; if(typeof renderTxWidget==='function')renderTxWidget(); };
  if(action==='toggle'&&d.component){
    const c=_txDirState[d.component]||{};
    const isOn=c.active&&(!c.until||c.until>Date.now());
    const willActivate=!isOn;
    // Mutual exclusion: profile y leaderboard no pueden estar prendidos juntos
    const FULLSCREEN_EXCLUSIVE=['profile','leaderboard'];
    if(willActivate && FULLSCREEN_EXCLUSIVE.includes(d.component)){
      FULLSCREEN_EXCLUSIVE.forEach(other=>{
        if(other!==d.component){
          const o=_txDirState[other];
          if(o && o.active){
            _txDirState[other]=Object.assign({},o,{active:false,until:0});
          }
        }
      });
      // Apagar tambien Tabla Actual al activar fullscreen — no reaparece sola
      const ta=_txDirState.tablaActual;
      if(ta && ta.active){
        _txDirState.tablaActual=Object.assign({},ta,{active:false,until:0});
      }
    }
    _txDirState[d.component]=Object.assign({},c,{active:willActivate,until:0});
    mark();return;
  }
  if(action==='slam'&&d.type){
    _txDirState.slam={active:true,until:Date.now()+2000,type:d.type};
    mark();return;
  }
  if(action==='hideAll'){
    ['profile','scoreboard','leaderboard','timer','slam'].forEach(k=>{
      _txDirState[k]=Object.assign({},_txDirState[k]||{},{active:false,until:0});
    });
    if(_txDirState.breakTimer)_txDirState.breakTimer={active:false,startedAt:0,durationSec:0,label:'',pausedAt:0,videos:[]};
    mark();return;
  }
  if(action==='showLb'&&d.cat){
    // Apagar profile (mutual exclusion fullscreen)
    if(_txDirState.profile && _txDirState.profile.active){
      _txDirState.profile=Object.assign({},_txDirState.profile,{active:false,until:0});
    }
    _txDirState.leaderboard={active:true,until:0,cat:d.cat};
    mark();return;
  }
  if(action==='breakStart'){
    const m=d.minutes||10, s=d.seconds||0;
    const durationSec=m*60+s;
    if(durationSec<=0)return;
    _txDirState.breakTimer={active:true,startedAt:Date.now(),durationSec,label:d.label||'',pausedAt:0,videos:d.videos||[],movement:d.movement||'',style:d.style||_txDirState.breakTimer?.style||{}};
    mark();return;
  }
  if(action==='breakStop'){
    _txDirState.breakTimer={active:false,startedAt:0,durationSec:0,label:'',pausedAt:0,videos:[],movement:''};
    mark();return;
  }
  if(action==='breakAdd'&&typeof d.seconds==='number'){
    const bt=_txDirState.breakTimer;
    if(!bt||!bt.active)return;
    bt.durationSec=Math.max(1,(bt.durationSec||0)+d.seconds);
    mark();return;
  }
}

// Animaciones de transición — detecta on→off / off→on por componente.
// Cuando hay un cambio, se guarda timestamp y dirección para reproducir
// la animación CSS correcta. Después de la duración, se limpia.
const TX_ANIM_MS={fullscreen:1200,corner:850};
let _txDirAnims={};
let _txDirPrevActive={};
// Overlay del barrido — vive en document.body, independiente del innerHTML del widget.
// Así los re-renders del widget (sync cada 5s) no lo reinician.
let _txBarridoEl=null;
// Video de fondo del break timer — también persiste fuera del innerHTML para no reiniciar.
// ── Break timer video — dos capas: fondo difuminado + clip nítido izq ──
let _btVideoBgEl=null;   // fondo: full screen, blur
let _btVideoFgEl=null;   // primer plano: izquierda, aspect ratio natural
let _btVideoIdx=0;
let _btVideoSrcsKey='';
let _btVideoInterval=null;
const BT_CLIP_DURATION=4000; // ms por clip

function _btVideoSetup(videos){
  if(!videos||!videos.length){_btVideoTeardown();return;}
  const key=JSON.stringify(videos);
  if(!_btVideoBgEl){
    _btVideoBgEl=document.createElement('video');
    _btVideoBgEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;filter:blur(24px) brightness(.28);transform:scale(1.12)';
    _btVideoBgEl.muted=true;_btVideoBgEl.playsInline=true;
    document.body.appendChild(_btVideoBgEl);
  }
  if(!_btVideoFgEl){
    _btVideoFgEl=document.createElement('video');
    _btVideoFgEl.style.cssText='position:fixed;left:0;top:5%;width:40%;height:80%;object-fit:cover;z-index:3;pointer-events:none;-webkit-mask-image:linear-gradient(to right,#000 56%,transparent 93%),linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,#000 56%,transparent 93%),linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);mask-composite:intersect';
    _btVideoFgEl.muted=true;_btVideoFgEl.playsInline=true;
    document.body.appendChild(_btVideoFgEl);
  }
  if(_btVideoSrcsKey!==key){
    _btVideoSrcsKey=key;_btVideoIdx=0;
    if(_btVideoInterval){clearInterval(_btVideoInterval);_btVideoInterval=null;}
    _btPlayVideos(videos,0);
  }
}
function _btPlayVideos(videos,idx){
  const src=videos[idx%videos.length];
  const single=videos.length===1;
  [_btVideoBgEl,_btVideoFgEl].forEach(el=>{
    if(!el)return;
    el.loop=single;
    el.onended=null;
    el.src=src;
    el.load();
    el.play().catch(()=>{});
  });
  // Si hay varios videos, encadenar con el evento ended del bg
  if(!single&&_btVideoBgEl){
    _btVideoBgEl.onended=()=>{
      _btVideoIdx=(_btVideoIdx+1)%videos.length;
      _btPlayVideos(videos,_btVideoIdx);
    };
  }
}
function _btVideoTeardown(){
  if(_btVideoInterval){clearInterval(_btVideoInterval);_btVideoInterval=null;}
  [_btVideoBgEl,_btVideoFgEl].forEach(el=>{
    if(el){el.pause();el.src='';if(el.parentNode)el.parentNode.removeChild(el);}
  });
  _btVideoBgEl=null;_btVideoFgEl=null;
  _btVideoIdx=0;_btVideoSrcsKey='';
}
