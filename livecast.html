*{margin:0;padding:0;box-sizing:border-box}

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,button{font-family:inherit;outline:none}
.os{font-family:'Oswald',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Intento de récord sudamericano: el cartel entra y sale, como en las pantallas
   de la IPF. Se ve casi dos segundos y desaparece uno, para que el público lo
   note sin que tape el peso — la carga de la barra tiene que leerse siempre. */
@keyframes srParpadeo{0%,58%{opacity:1;transform:scale(1)}68%,90%{opacity:0;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
.sr-parpadea{animation:srParpadeo 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sr-parpadea{animation:none}}
/* Intento que rompe récord, en la planilla y en la tabla del público.
   El recuadro conserva SU color —el del intento, como cualquier otro— porque lo
   que el planillero tiene que leer sin dudar es el peso. Encima lleva un borde
   rojo que late, y la palabra RÉCORD va ARRIBA del recuadro, no adentro: adentro
   competía con el número.
   El rojo acá no significa nulo. Es el rojo de la IPF para un intento de récord,
   y por eso está SOLO en el borde y en la palabra de arriba: el fondo rojo sigue
   queriendo decir una sola cosa en toda la pantalla, NO LIFT. */
@keyframes recBorde{0%,100%{border-color:#F2C230;box-shadow:0 0 6px rgba(242,194,48,.55)}
                    50%{border-color:#FFE884;box-shadow:0 0 18px 3px rgba(242,194,48,.95)}}
.rec-borde{border:3px solid #F2C230!important;animation:recBorde 1s ease-in-out infinite}
@keyframes recTag{0%,100%{opacity:1}55%{opacity:.35}}
.rec-tag{animation:recTag 1s ease-in-out infinite}
/* La palabra y el recuadro van en la misma caja para que queden centrados uno
   sobre otro. Sueltos dentro de la celda, la palabra se centraba respecto de la
   celda entera —con su relleno— y el recuadro no, así que se veían corridos. */
.rec-caja{display:inline-block;text-align:center}
@media (prefers-reduced-motion:reduce){.rec-borde,.rec-tag{animation:none}}
.fade{animation:fadeIn .3s ease}
/* Al entrar, la pantalla se redibuja varias veces seguidas mientras llegan
   los datos —la nómina, los campeonatos, el estado en vivo, los récords— y
   cada reescritura hacía arrancar de nuevo la animación de aparecer: la
   pantalla saltaba tres o cuatro veces en menos de un segundo. La animación
   tiene sentido al CAMBIAR de pantalla, no cada vez que llega un dato, así
   que mientras se sigue en la misma se apaga. */
.sin-anim .fade{animation:none}
.shell{min-height:100vh}
/* Botón hamburguesa: siempre visible arriba a la izquierda */
.hamb{position:fixed;top:12px;left:12px;z-index:1001;width:46px;height:46px;border-radius:10px;border:1px solid rgba(212,168,67,.45);background:#0C1A2E;color:#D4A843;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.hamb:hover{border-color:#D4A843;background:#12233f}
body.nav-open .hamb{opacity:0;pointer-events:none}
.nav-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
.nav-close:hover{color:#fff;border-color:var(--accent)}
/* Sidebar como cajón deslizante (off-canvas) */
.side{background:var(--side);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;width:248px;overflow-y:auto;z-index:1000;transform:translateX(-106%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
body.nav-open .side{transform:translateX(0);box-shadow:0 0 44px rgba(0,0,0,.6)}
.nav-backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(2,8,20,.55);opacity:0;pointer-events:none;transition:opacity .24s;z-index:999}
body.nav-open .nav-backdrop{opacity:1;pointer-events:auto}
.main{padding:20px;padding-top:70px;min-height:100vh;overflow-y:auto}
/* ── La transmisión en vivo (público) ──────────────────────────────────
   Vive FUERA de #R a propósito. #R se reescribe entero cada vez que cambia
   algo de la competencia, y reescribirlo se lleva puesto el <iframe>: el
   video volvería a empezar de cero en cada intento, cada pocos segundos.
   Acá nadie lo toca — se monta una vez y se queda corriendo, incluso
   cuando el espectador se va a Resultados y vuelve. */
#ytLive{display:none}
#ytLive.on{display:block;padding:64px 20px 0}
#ytBox{width:100%;max-width:1180px;margin:0 auto;aspect-ratio:16/9;background:#000;
  border-radius:12px;overflow:hidden;box-shadow:0 10px 38px rgba(0,0,0,.55)}
#ytBox iframe{display:block;width:100%;height:100%;border:0}
#ytLive.oculto #ytBox{display:none}
#ytBar{max-width:1180px;margin:10px auto 0;text-align:center}
#ytBar button{padding:8px 20px;border-radius:8px;border:1px solid var(--accent);
  background:rgba(196,30,58,.15);color:var(--accent);font-family:'Oswald';font-size:12px;
  font-weight:700;letter-spacing:1px;cursor:pointer}
#ytBar button.off{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}
#ytBar .pista{font-size:11px;color:var(--muted);margin-top:6px}
/* Con la transmisión puesta, el espacio para el botón de menú ya lo dejó ella. */
body.yt-on .main{padding-top:14px}
@media(max-width:900px){ #ytLive.on{padding:62px 10px 0} }
.logo{font-family:'Oswald';font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
.logo span{color:var(--accent)}
.side-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 8px;font-family:'Oswald'}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-align:left;transition:all .15s;font-family:'DM Sans';margin-bottom:2px}
.side-btn:hover{background:rgba(196,30,58,.08);color:var(--text)}
.side-btn.active{background:var(--accent);color:#fff}
.side-btn .icon{font-size:16px;width:22px;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.inp{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.inp:focus{border-color:var(--accent)}
.inp-sm{padding:6px 4px;font-size:12px;text-align:center;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text);width:100%}
.inp-sm:focus{border-color:var(--accent)}
.inp-sm.expired{border-color:var(--red)!important;background:rgba(239,68,68,.1)!important}
.inp-sm.countdown{border-color:var(--orange)!important;background:rgba(245,158,11,.08)!important}
.btn{padding:10px 20px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer;font-family:'Oswald';letter-spacing:1px;text-transform:uppercase;transition:all .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-r{background:var(--accent);color:#fff}.btn-g{background:var(--green);color:#fff}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-o:hover{border-color:var(--accent);color:var(--text)}
.flight-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:'Oswald';color:#fff}
.att{text-align:center;padding:5px 3px;border-radius:5px;font-weight:700;font-family:'Oswald';font-size:12px;min-width:46px;cursor:pointer;display:inline-block}
.att-g{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.att-n{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3);text-decoration:line-through}
.att-p{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.att-e{background:transparent;color:var(--muted);border:1px solid rgba(29,49,80,.3)}
/* Competencia en Vivo del público: los intentos como en la pantalla de tarima */
/* La casilla completa se pinta (no una cajita adentro), en Oswald y con decimal. */
.lv-solido td.lv-att{padding:0!important;border-left:1px solid rgba(10,22,40,.55)}
.lv-solido td.lv-g{background:rgba(34,197,94,.88)!important}
.lv-solido td.lv-n{background:rgba(220,38,38,.85)!important}
.lv-solido td.lv-att .att{border:none;border-radius:0;background:transparent;font-family:Oswald,sans-serif;letter-spacing:.3px}
.lv-solido td.lv-g .att{color:#06210f}
.lv-solido td.lv-n .att{color:#fff;text-decoration:line-through;text-decoration-thickness:2px}
.lv-solido td.lv-e .att{color:rgba(150,170,200,.35)}
.lv-solido td.lv-sub-sq{background:rgba(30,111,208,.16)}
.lv-solido td.lv-sub-bp{background:rgba(212,168,67,.12)}
.lv-solido tbody tr:nth-child(even){background-color:rgba(255,255,255,.025)}
/* Récord: el borde amarillo rodea la casilla entera y el cartel va adentro */
.lv-solido td.lv-rec{box-shadow:inset 0 0 0 3px #F2C230;animation:recCasilla 1s ease-in-out infinite}
.lv-solido td.lv-rec .rec-caja{display:block;padding-top:4px}
.lv-solido td.lv-rec .rec-borde{border:none!important;animation:none}
.lv-solido td.lv-rec .rec-caja>div:first-child{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@keyframes recCasilla{0%,100%{box-shadow:inset 0 0 0 3px #F2C230}50%{box-shadow:inset 0 0 0 3px rgba(242,194,48,.35)}}
@media (prefers-reduced-motion:reduce){.lv-solido td.lv-rec{animation:none}}
.plate{display:inline-flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;border-radius:3px;margin:0 1px;color:#fff}
.sb-wrap{background:var(--bg);min-height:100vh}
.sb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 30px;background:linear-gradient(90deg,var(--accent),#8B1525);color:#fff}
.sb-body{display:grid;grid-template-columns:1fr 380px;min-height:calc(100vh - 56px)}
@media(max-width:900px){
  .side{width:84vw;max-width:300px}
  .main{padding:14px;padding-top:68px}
  .sb-body{grid-template-columns:1fr}
}
</style>

<div id="R"></div>
