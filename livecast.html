const PRACTICE_EVENT_NAME='🎓 PRÁCTICA — Jueces (datos ficticios, no oficial)';
function _genPracticeRoster(){
  const firstM=['Bruno','Diego','Franco','Hugo','Jorge','Lucas','Nico','Pablo','Simón','Tomás','Iván','Mateo','Andrés','Felipe','Gonzalo','Rodrigo','Sergio','Vicente'];
  const firstF=['Ana','Carla','Elena','Gabriela','Iris','Karen','Marta','Olivia','Renata','Rocío','Sofía','Valentina','Antonia','Josefa','Camila','Fernanda','Paula','Trinidad'];
  const last=['Pérez','Soto','Muñoz','Rojas','Vidal','Contreras','Silva','Reyes','Torres','Bravo','Fuentes','Araya','Cortés','Navarro','Herrera','Castro','Vega','Pizarro'];
  // Categorías oficiales IPF (2 atletas por cada una, hombres y mujeres).
  const catsM=[53,59,66,74,83,93,105,120,'120+'];
  const catsF=[43,47,52,57,63,69,76,84,'84+'];
  const rnd25=v=>Math.round(v/2.5)*2.5;
  const athletes=[];
  let id=0, mi=0, fi=0;
  const push=(sex,catStr)=>{
    const catNum=parseFloat(String(catStr))||120;
    const plus=String(catStr).includes('+');
    const pool=sex==='Hombre'?firstM:firstF;
    const idx=sex==='Hombre'?mi++:fi++;
    const name=pool[idx%pool.length]+' '+last[(id*3+idx)%last.length]+' (Práctica)';
    // Peso corporal dentro de la categoría (para "+", un poco por encima del límite).
    const bw=plus?Math.round((catNum+(3+Math.random()*10))*10)/10:Math.round((catNum-(0.3+Math.random()*2.2))*10)/10;
    const factor=sex==='Hombre'?1:0.62; // mujeres levantan proporcionalmente menos
    const sqOpen=rnd25(catNum*0.85*factor*(0.9+Math.random()*0.3));
    const bpOpen=rnd25(catNum*0.55*factor*(0.9+Math.random()*0.3));
    const dlOpen=rnd25(catNum*1.0*factor*(0.9+Math.random()*0.3));
    athletes.push({
      id,lot:id+1,name,rut:'',sex,cat:String(catStr),div:'Open',
      club:'Club Práctica FECHIPO',uni:'',mod:'classic',country:'CHI',
      bw,flight:'A',jornada:'',rackSQ:String(3+Math.floor(Math.random()*8)),rackBP:String(2+Math.floor(Math.random()*6)),
      bombed:false,weighedIn:true,
      att:{
        sq:[{w:sqOpen,r:null},{w:0,r:null},{w:0,r:null}],
        bp:[{w:bpOpen,r:null},{w:0,r:null},{w:0,r:null}],
        dl:[{w:dlOpen,r:null},{w:0,r:null},{w:0,r:null}]
      }
    });
    id++;
  };
  // Mujeres primero, luego hombres; 2 por categoría.
  catsF.forEach(c=>{push('Mujer',c);push('Mujer',c);});
  catsM.forEach(c=>{push('Hombre',c);push('Hombre',c);});
  // Repartir en tandas de a 10 para no tener una sola tanda gigante (A, B, C, D…).
  athletes.forEach((a,k)=>{a.flight=String.fromCharCode(65+Math.floor(k/10));});
  return athletes;
}
// Rellena los 3 intentos de cada atleta con pesos declarados (sin resultado), para
// practicar en la Pantalla de Tarima / Control en Vivo. Ejecutable desde la consola:
//   fillPracticeWeights()            → 3 intentos por levantamiento
//   fillPracticeWeights({results:true}) → además marca válidos/nulos realistas
window.fillPracticeWeights=function(opts){
  opts=opts||{};
  if(!DATA.athletes||!DATA.athletes.length){showToastLC('No hay atletas cargados');return;}
  const rnd25=v=>Math.round(v/2.5)*2.5;
  const isM=a=>(a.sex==='Hombre'||a.sex==='Masculino'||a.sex==='M');
  DATA.athletes.forEach(a=>{
    // Solo los dígitos de la categoría: con el formato real '-59 kg (Hombre)'
    // parseFloat daba -59 (negativo) y los pesos generados quedaban negativos
    // → la cola de tarima salía vacía.
    const catNum=parseFloat((String(a.cat).match(/\d+(\.\d+)?/)||[])[0])||100;
    const factor=isM(a)?1:0.62;
    const base={
      sq:rnd25((a.att.sq&&a.att.sq[0]&&a.att.sq[0].w)||catNum*0.85*factor),
      bp:rnd25((a.att.bp&&a.att.bp[0]&&a.att.bp[0].w)||catNum*0.55*factor),
      dl:rnd25((a.att.dl&&a.att.dl[0]&&a.att.dl[0].w)||catNum*1.0*factor)
    };
    ['sq','bp','dl'].forEach(l=>{
      const o=base[l], step=(l==='bp')?2.5:5;
      const ws=[o,o+step,o+2*step];
      a.att[l]=ws.map((w,i)=>{
        let r=null;
        if(opts.results){ r=(i<2)?'g':(Math.random()<0.5?'g':'n'); } // 1º y 2º válidos, 3º al azar
        return {w,r};
      });
    });
  });
  DATA.lift='sq';DATA.round=0;
  saveNow();R();
  showToastLC('✓ Pesos de práctica cargados en '+DATA.athletes.length+' atletas'+(opts.results?' (con resultados)':''));
  return 'OK — '+DATA.athletes.length+' atletas con pesos';
};

// Sincronización entre pestañas en modo práctica (sin Firebase). El evento
// 'storage' se dispara en las OTRAS pestañas del mismo navegador cuando el
// Control en Vivo guarda: recargamos la data (o el estado de pantalla) y
// re-renderizamos, así la Pantalla de Tarima sigue al control en vivo.
function _initPracticeSync(){
  window.addEventListener('storage',(e)=>{
    if(!e)return;
    if(e.key===SAVE_KEY && e.newValue){
      try{const d=JSON.parse(e.newValue);if(d&&d.phase){
        d.timerOn=false;
        // El espectador / pantalla NO debe cambiar de vista por lo que hace el
        // control (ej. que el admin pase a "manage" o "compete"): conserva su fase.
        const keepPhase=(PRACTICE_VIEWER||TX_MODE)?DATA.phase:null;
        Object.assign(DATA,d);
        if(keepPhase)DATA.phase=keepPhase;
      }}catch(_){}
    } else if(e.key===PRACTICE_SCREEN_KEY && e.newValue){
      try{const d=JSON.parse(e.newValue);
        window._SCREEN_STATE={mode:d.mode||'jornada',flights:Array.isArray(d.flights)?d.flights:null,nameScale:typeof d.nameScale==='number'?d.nameScale:1};
        window._JORNADA_FLIGHTS=window._SCREEN_STATE.flights;
        window._JORNADA_NAMESCALE=window._SCREEN_STATE.nameScale;
        if(window._SCREEN_LOCAL){window._SCREEN_LOCAL.mode=window._SCREEN_STATE.mode;if(Array.isArray(d.flights))window._SCREEN_LOCAL.flights=d.flights;window._SCREEN_LOCAL.nameScale=window._SCREEN_STATE.nameScale;}
      }catch(_){}
    } else return;
    if(TX_MODE){if(typeof _txLastLifter!=='undefined')_txLastLifter=null;}
    R();
  });
}

// ── Accept ?evento=<id|name> URL param ──
// If the URL asks for a specific event and it differs from the saved session,
// force phase back to 'setup' so the user picks again (or auto-pick if match).
let _applyEvtRetries=0;
// Nombre lindo del campeonato padre: el que tenga Firestore, si no el nombre de
// los días sin el " — Día N".
function _evParentName(id,hijos){
  const m=(window.LIVE_EVENT_META||{})[id];
  if(m&&m.name)return m.name;
  const n=String((hijos[0]||{}).name||id);
  return n.replace(/\s*[—-]\s*D[íi]a\s*\d+.*$/i,'').trim()||id;
}
function applyEventURLParam(){
  try{
    const p=new URLSearchParams(location.search).get('evento');
    if(!p)return;
    const want=decodeURIComponent(p);
    // NOTA: acá ANTES había un atajo que, para widgets TX, armaba DATA.event usando
    // el slug crudo de la URL (ej. "regionalcentrosur") como name, sin buscar el
    // nombre real del evento en Firestore. El problema: fbDocId() arma el id del doc
    // de livecast_sync a partir de DATA.event.name — así que ese atajo hacía que el
    // widget (Control TX, Pantalla de Tarima, etc.) leyera/escribiera un documento
    // DISTINTO al que usa el resto de la app (que sí resuelve el nombre real más
    // abajo), y quedaba pegado en un estado viejo para siempre — ni un hard refresh
    // lo arregla, porque no es un problema de caché, es que apunta a otro documento.
    // Ahora los widgets TX pasan por la misma resolución de nombre real que el resto
    // (pasos 1-2 de abajo) antes de arrancar.
    // 0) ¿Es un CAMPEONATO de varios días? Los días traen parent=<id del campeonato>
    // en nominas.json, así que esto se resuelve sin depender de Firestore: se muestra
    // el selector con sus jornadas en vez de meter a la gente en un día cualquiera.
    if(!TX_MODE){
      const hijos0=(DATA.events||[]).filter(e=>e.parent===want);
      if(hijos0.length){
        const yaAdentro=DATA.event&&DATA.event.parent===want;
        if(!yaAdentro&&!(DATA.phase!=='setup'&&DATA.athletes&&DATA.athletes.length)){
          window._EV_FILTER={parent:want,name:(hijos0[0].parentName||_evParentName(want,hijos0))};
          _applyEvtRetries=0; DATA.phase='setup'; DATA.event=null; R(); return;
        }
      }
    }
    // 1) Buscar en DATA.events (ya populado desde Firestore via LIVE_EVENT_META)
    let i=(DATA.events||[]).findIndex(e=>e.id===want||e.name===want);
    let wanted=i>=0?DATA.events[i]:null;
    // 2) Si no está aún (Firestore todavía cargando), buscar directamente en LIVE_EVENT_META.
    if(!wanted&&window.LIVE_EVENT_META){
      const fbEntry=Object.entries(window.LIVE_EVENT_META).find(function(e){return e[0]===want||e[1].name===want});
      if(fbEntry){
        const id=fbEntry[0],meta=fbEntry[1];
        wanted={id:id,name:meta.name,organizer:meta.org||'',location:meta.location||'',athletes:[],_fromFirestore:true};
        if(!DATA.events)DATA.events=[];
        DATA.events.push(wanted);
        i=DATA.events.length-1;
        console.log('[LC] Evento resuelto desde Firestore: id='+id+' name='+meta.name);
      }
    }
    // 2.5) Resolver por SLUG: los links viejos de OBS traen el nombre "aplastado"
    // (ej. ?evento=regionalcentrosur). Sin esto, el widget no encontraba el evento
    // y caía al fallback de abajo usando el slug como NOMBRE → fbDocId() apuntaba a
    // otro documento (uno viejo) y la Pantalla de Tarima / Control TX mostraban
    // datos que no coincidían con lo que cargaba el control. Comparando sin
    // acentos/espacios/símbolos, el slug resuelve al evento real.
    if(!wanted){
      const _slg=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
      const ws=_slg(want);
      if(ws){
        const cands=[];
        (DATA.events||[]).forEach((e,idx)=>cands.push({e:e,i:idx,s:_slg(e.name),id:_slg(e.id)}));
        if(window.LIVE_EVENT_META)Object.entries(window.LIVE_EVENT_META).forEach(function(en){
          if(!(DATA.events||[]).some(e=>e.name===en[1].name))
            cands.push({e:{id:en[0],name:en[1].name,organizer:en[1].org||'',location:en[1].location||'',athletes:[],_fromFirestore:true},i:-1,s:_slg(en[1].name),id:_slg(en[0])});
        });
        // El match por "contiene" solo vale si es ÚNICO. Si no, agarraba cualquiera:
        // ?evento=Sudamericano_2026 entraba derecho al Día 1 porque su nombre
        // contiene el del campeonato. Con varios candidatos se espera al paso 3,
        // que resuelve el id exacto contra Firestore.
        const parciales=cands.filter(c=>c.s.includes(ws)&&ws.length>=8);
        let hit=cands.find(c=>c.s===ws||c.id===ws) || (parciales.length===1?parciales[0]:null);
        if(hit){
          wanted=hit.e;
          if(hit.i>=0)i=hit.i;
          else{if(!DATA.events)DATA.events=[];DATA.events.push(wanted);i=DATA.events.length-1;}
          console.log('[LC] Evento resuelto por slug "'+want+'" → '+wanted.name);
        }
      }
    }
    // 3) Si todavía no se encontró, retry hasta 10 veces (espera a que Firestore listener cargue)
    if(!wanted){
      _applyEvtRetries++;
      if(_applyEvtRetries<=20){ // hasta 10s: nominas.json puede tardar en conexiones lentas
        setTimeout(applyEventURLParam,500);
        if(_applyEvtRetries===1)console.log('[LC] Esperando que Firestore cargue el evento "'+want+'"...');
        return;
      }
      console.warn('[LC] No pude encontrar evento "'+want+'" después de 5s. Verificá nombre/id.');
      if(!TX_MODE)return;
      // Último recurso, SOLO para widgets TX de un evento que realmente no está en la
      // lista (ej. una sub-tarima generada sin doc propio en "eventos"): usar el slug
      // crudo como nombre, para no dejar el widget sin mostrar nada. Si el evento SÍ
      // existe con nombre real, el paso 1/2 de arriba ya lo habrá encontrado antes de
      // llegar hasta acá.
      wanted={id:want,name:want,athletes:[],_fromUrl:true};
    }
    _applyEvtRetries=0;
    // TX widget mode: read-only. Just set DATA.event y suscribir a livecast_sync.
    if(TX_MODE){
      DATA.event=wanted;
      // Los eventos que viven en nominas.json (los días del Sudamericano, los
      // ensayos) traen su nómina en el archivo. Si el widget arranca antes de que
      // algún control haya escrito en Firestore, se siembra desde ahí para que
      // Control TX y la Pantalla de Tarima muestren algo en vez de quedar en
      // blanco. Cuando llega el estado real por sync, lo reemplaza.
      if(!(DATA.athletes||[]).length&&Array.isArray(wanted.athletes)&&wanted.athletes.length){
        try{ DATA.athletes=wanted.athletes.map(_evAthlete);
             DATA.flight=[...new Set(DATA.athletes.map(a=>a.flight))].filter(_inTarima).sort()[0]||DATA.flight;
             if(wanted.startLift==='bp'||wanted.startLift==='dl')DATA.lift=wanted.startLift;
             if([0,1,2].includes(+wanted.startRound))DATA.round=+wanted.startRound;
        }catch(e){console.warn('[TX] no pude sembrar la nómina',e);}
      }
      const tryStart=()=>{if(!fbReady){setTimeout(tryStart,300);return}startFBSync();
        // jornada/screen necesitan fechaNac (año nac) y el canal de control de pantalla
        if(TX_MODE==='jornada'||TX_MODE==='screen'){loadBirthYears();}
        if(TX_MODE==='screen'||TX_MODE==='jornada'){subscribeScreenChannel();}
        R();};
      tryStart();
      return;
    }
    // If already on this event with an active session, keep it.
    if(DATA.event&&(DATA.event.id===wanted.id||DATA.event.name===wanted.name)){_ensayoGrant();R();return}
    // If there is an active session for a different event, do NOT auto-wipe it.
    if(DATA.phase!=='setup'&&DATA.athletes?.length){
      DATA.phase='setup';DATA.event=null;DATA.athletes=[];DATA.changeTimers={};
      try{localStorage.removeItem(SAVE_KEY)}catch(e){}
      R();return;
    }
    // Un campeonato que se corre en varios días (ej. el Sudamericano) no tiene
    // atletas propios: sus nueve días son eventos aparte con parent=<id>. Entrar
    // ahí no significa nada, así que se muestra el SELECTOR con esos días.
    const hijos=(DATA.events||[]).filter(e=>e.parent&&(e.parent===wanted.id||e.parent===wanted.name));
    if(hijos.length&&!(wanted.athletes||[]).length){
      window._EV_FILTER={parent:wanted.id||wanted.name,name:wanted.name||wanted.id};
      DATA.phase='setup';DATA.event=null;R();return;
    }
    // Fresh state: pick requested event directly.
    pickEvent(i);
  }catch(e){console.warn('[LC] preselect err',e)}
}

  // ── Indicadores de levantamiento ─────────────────────────────
  h += '<div style="display:flex;gap:6px;margin-bottom:14px">';
  LIFTS.forEach(l=>{
    const isCur = l===DATA.lift;
    h += '<div style="flex:1;padding:9px 0;border-radius:6px;text-align:center;border:2px solid '+(isCur?LIFT_C[l]:'var(--border)')+';background:'+(isCur?LIFT_C[l]+'25':'transparent')+';color:'+(isCur?LIFT_C[l]:'var(--muted)')+';font-family:Oswald;font-size:12px;font-weight:700;letter-spacing:2px">'+LIFT_N[l]+(isCur?' · INT '+(DATA.round+1):'')+'</div>';
  });
  h += '</div>';

  // ── Orden de levantamiento ────────────────────────────────────
  const flQueue = liftQueue();
  const queueIds = new Set(flQueue.map(a=>a.id));
  const curFlightAll  = DATA.athletes.filter(a=>a.flight===currentFlight);
  const otherAthletes = DATA.athletes.filter(a=>a.flight!==currentFlight);

  const sortedAthletes = [
    // Primero los que todavía deben el intento de la ronda: esos ya vienen de
    // menor a mayor peso (y a igual peso, por lote) desde liftQueue().
    ...flQueue,
    // Y detrás los que ya levantaron. Antes iban por lote, así que un 2º intento
    // recién declarado quedaba al final y la lista solo se acomodaba al terminar
    // la ronda. Ahora se ordenan entre ellos por el peso que acaban de declarar,
    // de menor a mayor, con el lote como desempate.
    ...curFlightAll.filter(a=>!queueIds.has(a.id)&&!a.bombed).sort(_cmpProx),
    ...curFlightAll.filter(a=>a.bombed),
    // Las tandas que no están en tarima siguen el mismo círculo que el control:
    // después de la actual va la siguiente, y al llegar al final vuelve a la primera.
    ...(function(){
      const orden=_flightsFromCurrent([...new Set(DATA.athletes.map(a=>a.flight))].sort());
      const pos=f=>{const i=orden.indexOf(f);return i<0?999:i;};
      return otherAthletes.sort((a,b)=>pos(a.flight)-pos(b.flight)||a.lot-b.lot);
    })(),
  ];
  // Cuántas casillas por lift: 3, o 4 si algún atleta tuvo un intento extra/4º en
  // ese lift. Se calcula sobre los atletas REALES (el clon del 4º redirige su
  // att, así que para la tabla usamos siempre _realAth).
  const _liveReal=sortedAthletes.map(_realAth);
  // La columna EXTRA aparece solo si alguien tiene un 4º intento DE VERDAD (con
  // peso declarado o ya juzgado). Antes bastaba con que quedara la casilla vacía
  // —de un extra borrado, o de datos viejos— para que la columna le saliera a
  // todos, que es lo que se veía en la pantalla del público.
  const _tieneExtra=(a,l)=>{const x=(a.att[l]||[])[3];return !!(x&&(x.w>0||x.r));};
  const maxAtts={};['sq','bp','dl'].forEach(l=>{maxAtts[l]=_liveReal.some(a=>_tieneExtra(a,l))?4:3;});
  const totalCols=2+(maxAtts.sq+1)+(maxAtts.bp+1)+(maxAtts.dl+1)+1+1; // +1 = columna POSICIÓN

  // ── Tabla completa de resultados ─────────────────────────────
  h += '<div class="card" style="padding:0;overflow-x:auto">';
  h += '<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:780px">';

  // Fila de grupos (SQ / BP / DL)
  h += '<thead>';
  h += '<tr style="border-bottom:1px solid rgba(30,58,95,.4)">';
  h += '<th colspan="2" style="padding:6px 8px;border-right:1px solid var(--border)"></th>';

    const isCur = l===DATA.lift;

    h += '<th colspan="'+(maxAtts[l]+1)+'" style="padding:6px 4px;text-align:center;font-family:Oswald;font-size:12px;letter-spacing:2px;color:'+c+';border-right:1px solid var(--border);background:'+(isCur?c+'18':'transparent')+'">'+LIFT_N[l]+(isCur?' ▶':'')+'</th>';
  });
  h += '<th style="padding:6px 4px;text-align:center;font-family:Oswald;font-size:10px;color:var(--gold)">GLP</th>';
  h += '</tr>';

  // Fila de columnas
  h += '<tr style="background:rgba(30,58,95,.35);border-bottom:2px solid var(--border)">';
  h += '<th style="padding:5px 3px;text-align:center;color:var(--muted);font-size:9px;width:28px">#</th>';
  h += '<th style="padding:5px 8px;text-align:left;color:var(--muted);font-size:9px;border-right:1px solid var(--border)">ATLETA</th>';
  ['sq','bp','dl'].forEach(l=>{
    const isCur = l===DATA.lift;
    const bg = isCur ? LIFT_C[l]+'12' : 'transparent';
    for(let r=1;r<=maxAtts[l];r++){
      const is4=r===4;
      h += '<th style="padding:5px 2px;text-align:center;color:'+(is4?'#60a5fa':LIFT_C[l])+';font-size:9px;width:56px;background:'+bg+'"'+(is4?' title="Intento extra / 4º"':'')+'>'+(is4?'EXTRA':'INT '+r)+'</th>';
    }
    const subLabel = l==='dl'?'TOTAL':'SUB-TOTAL';
    h += '<th style="padding:5px 3px;text-align:center;color:var(--gold);font-size:8px;width:54px;border-right:1px solid var(--border)">'+subLabel+'</th>';
  });
  h += '<th style="padding:5px 4px;text-align:center;color:var(--gold);font-size:9px;width:52px">GL PTS</th>';
  h += '<th style="padding:5px 4px;text-align:center;color:#60a5fa;font-size:9px;width:74px" title="Posición actual → posición si el intento es válido">POSICIÓN</th>';
  h += '</tr></thead><tbody>';

  // Quién acaba de salir a tarima, para marcarlo bajo su intento.
  const ultimo = _ultimoEnTarima();

  let lastFlight = currentFlight;
  sortedAthletes.forEach(a=>{
    // Separador de tanda
    if(a.flight !== lastFlight){
      lastFlight = a.flight;
      const flC = FL_C[a.flight]||'#666';

      h += '<span style="background:'+flC+';color:#fff;padding:2px 10px;border-radius:4px;font-family:Oswald;font-size:10px;letter-spacing:2px">TANDA '+(a.flight||'—')+'</span>';
      h += '</td></tr>';
    }

    const inQueue     = queueIds.has(a.id);
    const queuePos    = inQueue ? flQueue.findIndex(q=>q.id===a.id) : -1;
    const isOnPlatform = inQueue && queuePos===0;

    let rowStyle = 'border-bottom:1px solid rgba(30,58,95,.2);';
    if(isOnPlatform)         rowStyle += 'background:linear-gradient(90deg,'+liftColor+'35,'+liftColor+'12);box-shadow:inset 4px 0 0 '+liftColor+';';
    else if(inQueue&&queuePos<=2) rowStyle += 'background:'+liftColor+'09;';
    else if(a.bombed)         rowStyle += 'opacity:.4;';

    const rowId = isOnPlatform ? 'id="liveCurrentLifter"' : '';
    h += '<tr '+rowId+' style="'+rowStyle+'">';

    // # / posición cola + lote
    h += '<td style="padding:6px 3px;text-align:center">';
    if(isOnPlatform){
      h += '<span style="color:'+liftColor+';font-family:Oswald;font-weight:700;font-size:14px">▶</span>';
      h += '<div style="color:var(--muted);font-size:8px;margin-top:1px">'+a.lot+'</div>';
    } else if(inQueue){
      h += '<span style="color:var(--gold);font-family:Oswald;font-weight:700;font-size:11px">'+(queuePos+1)+'°</span>';

      h += '<span style="color:var(--muted);font-size:9px;font-family:Oswald">'+a.lot+'</span>';

        if(ultimo && !a.__is4 && ra.id===ultimo.id && l===ultimo.lift && j===ultimo.round)
          h += '<div style="font-family:Oswald;font-size:7px;letter-spacing:.5px;color:var(--muted);text-align:center;line-height:1.2;margin-top:1px">RECIÉN SALIÓ</div>';
        h += '</td>';
      }
      // Subtotal / Total
      let sub = null;
      const bSQ=bestOf(ra,'sq')||0, bBP=bestOf(ra,'bp')||0, bDL=bestOf(ra,'dl')||0;
      if(l==='sq')      sub = bSQ||null;
      else if(l==='bp') sub = (bSQ||bBP) ? (bSQ+bBP)||null : null;
      else              sub = (bSQ&&bBP&&bDL) ? bSQ+bBP+bDL : null;
      const subColor = l==='dl'?'var(--gold)':'var(--muted)';
      h += '<td style="text-align:center;padding:3px;border-right:1px solid var(--border)">';
      h += '<span style="font-family:Oswald;font-size:'+(sub?13:10)+'px;font-weight:700;color:'+(sub?(l==='dl'?'var(--gold)':'#ccc'):'rgba(100,120,150,.5)')+';">'+(sub||'—')+'</span>';
      h += '</td>';
    });

    // GLP
    const tot = totalOf(ra);
    const glp = tot ? calcGL(tot,ra.bw,ra.sex,_glMod(ra)) : null;
    h += '<td style="text-align:center;padding:3px 5px">';
    h += '<span style="font-family:Oswald;font-size:'+(glp?12:9)+'px;font-weight:700;color:'+(glp?'var(--gold)':'rgba(100,120,150,.5)')+';">'+(glp||'—')+'</span>';
    h += '</td>';
    h += _posCellHtml(a,{fs:11});
    h += '</tr>';
  });

  h += '</tbody></table></div>';
  h += '</div>';

  // Auto-scroll al atleta actual solo cuando cambia
  setTimeout(()=>{
    const el = document.getElementById('liveCurrentLifter');
    if(!el) return;
    const flQ = liftQueue();
    const curId = flQ[0]?.id;
    const key = currentFlight+'_'+DATA.lift+'_'+DATA.round+'_'+(curId||'');
    if(window._liveLastKey !== key){
      window._liveLastKey = key;
      el.scrollIntoView({behavior:'smooth',block:'center'});
    }
  }, 200);
  return h;
}

    if(prSq||prBp||prDl){
      h+='<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--muted);font-family:Oswald;letter-spacing:1px;margin-bottom:4px">MEJORES MARCAS (CARRERA)</div>';
      h+='<div style="display:flex;gap:6px">';
      if(prSq)h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:6px"><div style="font-size:8px;color:#3b82f6;font-family:Oswald">SQ</div><div class="os" style="font-size:15px;font-weight:700">'+prSq+'</div></div>';
      if(prBp)h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:6px"><div style="font-size:8px;color:#f59e0b;font-family:Oswald">BP</div><div class="os" style="font-size:15px;font-weight:700">'+prBp+'</div></div>';
      if(prDl)h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:6px"><div style="font-size:8px;color:#ef4444;font-family:Oswald">DL</div><div class="os" style="font-size:15px;font-weight:700">'+prDl+'</div></div>';
      if(prTotal)h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);border-radius:6px"><div style="font-size:8px;color:var(--gold);font-family:Oswald">TOTAL</div><div class="os" style="font-size:15px;font-weight:700">'+prTotal+'</div></div>';
      h+='</div></div>';
    }
    
    // Current competition lifts
    if(curSq||curBp||curDl){
      h+='<div style="margin-bottom:8px"><div style="font-size:9px;color:var(--muted);font-family:Oswald;letter-spacing:1px;margin-bottom:4px">HOY</div>';
      h+='<div style="display:flex;gap:6px">';
      if(curSq){const isPR=prSq&&curSq>=prSq;h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);border-radius:6px"><div style="font-size:8px;color:#3b82f6;font-family:Oswald">SQ'+(isPR?' PR':'')+'</div><div class="os" style="font-size:15px;font-weight:700">'+curSq+'</div></div>';}
      if(curBp){const isPR=prBp&&curBp>=prBp;h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:6px"><div style="font-size:8px;color:#f59e0b;font-family:Oswald">BP'+(isPR?' PR':'')+'</div><div class="os" style="font-size:15px;font-weight:700">'+curBp+'</div></div>';}
      if(curDl){const isPR=prDl&&curDl>=prDl;h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:6px"><div style="font-size:8px;color:#ef4444;font-family:Oswald">DL'+(isPR?' PR':'')+'</div><div class="os" style="font-size:15px;font-weight:700">'+curDl+'</div></div>';}
      if(curTotal)h+='<div style="flex:1;text-align:center;padding:5px 4px;background:rgba(212,168,67,.15);border:1px solid rgba(212,168,67,.4);border-radius:6px"><div style="font-size:8px;color:var(--gold);font-family:Oswald">TOTAL</div><div class="os" style="font-size:15px;font-weight:700">'+curTotal+'</div></div>';
      h+='</div></div>';
    }
    
    // Competition history from DB
    if(compCount>0){
      h+='<div style="border-top:1px solid var(--border);padding-top:8px;margin-top:4px">';
      h+='<div style="font-size:9px;color:var(--muted);font-family:Oswald;letter-spacing:1px;margin-bottom:4px">HISTORIAL · '+compCount+' competencias</div>';
      const recent=comps.filter(c=>c.resultado).slice(-4).reverse();
      recent.forEach(c=>{
        const r=c.resultado||{};
        h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:10px">';
        h+='<span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+(c.internacional?'[INT] ':'')+c.evento+'</span>';
        h+='<span class="os" style="color:var(--gold);font-weight:700;margin-left:8px;flex-shrink:0">'+(r.total?r.total+'kg':'—')+'</span>';
        h+='</div>';
      });
      if(compWithResults>4)h+='<div style="font-size:9px;color:var(--muted);text-align:center;margin-top:2px">+'+(compWithResults-4)+' más</div>';
      h+='</div>';
    }else if(!matched){
      h+='<div style="text-align:center;padding:8px;color:var(--muted);font-size:10px;font-style:italic;border-top:1px solid var(--border);margin-top:4px">Atleta nuevo — sin historial</div>';
    }
    
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}
</script>
</body>
</html>
